# Dependency update PRs for flux-apps, flux-cluster and flux-app-media -
# against FORGEJO
# (git.h4xx.io), the primary git host. GitHub is a force-synced push mirror:
# PRs/merges made on GitHub get clobbered by the next mirror sync, so
# Renovate MUST write to Forgejo. The workflow still RUNS on GitHub Actions.
# Token: Forgejo PAT (write:repository,write:issue) as RENOVATE_FORGEJO_TOKEN;
# canonical copy in nix-secrets .../forgejo/ci-token.yaml.
# (Re-applied 2026-09-21: the original switch commit was lost to a mirror
# force-sync race on 2026-09-19.)
name: renovate
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    # Run ONLY on GitHub Actions. This repo is also mirrored to Forgejo
    # (git.h4xx.io), whose in-cluster runner picks up every workflow — but it
    # resolves bare `uses:` against data.forgejo.org, which has no
    # renovatebot/github-action, so it failed this job every night with
    # "repository not found". GitHub Actions is where Renovate actually runs
    # (it writes PRs back to Forgejo via RENOVATE_FORGEJO_TOKEN regardless of
    # where it executes). Gating on server_url makes the Forgejo runner skip.
    if: ${{ github.server_url == 'https://github.com' }}
    steps:
      - uses: renovatebot/github-action@v46.3.11
        with:
          token: ${{ secrets.RENOVATE_FORGEJO_TOKEN }}
        env:
          # flux-app-media has no workflow of its own (it is a private split-out
          # of the media stack); it is covered from here, like flux-cluster.
          RENOVATE_REPOSITORIES: "lukasf/flux-apps,lukasf/flux-cluster,lukasf/flux-app-media"
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://git.h4xx.io/api/v1
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@h4xx.io>"
          # Datasource lookups (github-releases etc.) need a github.com token
          # separate from the platform token since the platform moved to
          # Forgejo - without it the lookups rate-limit to zero updates.
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          # Allow the postUpgradeTask that reconciles the Nextcloud app pins
          # (filename + desired_version + recomputed sha256). Self-hosted Renovate
          # blocks post-upgrade commands unless they match this allow-list.
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/renovate/fix-nextcloud-app-pins\\.mjs$"]'
