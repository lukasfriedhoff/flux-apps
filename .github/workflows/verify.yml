name: verify

# scripts/verify-static.sh already existed but nothing ran it, so its checks
# only fired when someone remembered. That is how the status dashboard drifted
# to 17 missing services. Run the suite on every push and PR instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite needs all three: yq for the manifest assertions, kustomize
      # to render apps, and flux to run envsubst over the ${...} variables.
      - name: Install yq, kustomize and flux
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          curl -fsSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          install -m 0755 kustomize /usr/local/bin/kustomize
          curl -fsSL https://fluxcd.io/install.sh | bash
          yq --version && kustomize version && flux --version

      - name: Run static verification suite
        run: ./scripts/verify-static.sh
