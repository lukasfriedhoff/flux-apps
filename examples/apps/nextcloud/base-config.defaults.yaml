apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  cloudflare_tunnel_hostname: "03ed4283-aa2e-4781-8236-fd69a38e130a.cfargotunnel.com"
  default_cluster_issuer: "letsencrypt-prod"
  default_sts_storage_class_name: "ssd-rbd-2r"
  delegating_domain: "h4xx.io"
  nextcloud_app_size: "20Gi"
  nextcloud_app_claim_name: "nextcloud-app"
  nextcloud_app_storage_class_name: "ssd-cephfs-2r"
  nextcloud_data_size: "500Gi"
  nextcloud_data_claim_name: "nextcloud-nextcloud-data"
  nextcloud_data_storage_class_name: "ssd-cephfs-2r"
  nextcloud_hpa_enabled: "false"
  nextcloud_hpa_cpu_threshold: "60"
  nextcloud_hpa_max_pods: "3"
  nextcloud_hpa_min_pods: "1"
  nextcloud_resources_limits_memory: "2Gi"
  nextcloud_resources_requests_cpu: "200m"
  nextcloud_resources_requests_memory: "512Mi"
  nextcloud_external_photos_enabled: "disabled"
  nextcloud_external_photos_url: "https://photos.h4xx.io"
  nextcloud_external_photos_label: "Photos"
  trusted_proxies_cidr: "10.42.0.0/16"
  valkey_auth_secret_name: "nextcloud-valkey"
  # CNPG backup — external S3 endpoint URL with scheme (e.g. https://s3.provider.com)
  # Set in the cluster overlay; leave empty to disable backup.
  nextcloud_postgres_backup_endpoint_url: ""
  nextcloud_postgres_backup_bucket: "nextcloud-postgres-backup"
  # Secret must exist in the nextcloud namespace with keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  # (same key names as the longhorn-backup-target secret)
  nextcloud_postgres_backup_credential_secret_name: "nextcloud-postgres-backup-credentials"
