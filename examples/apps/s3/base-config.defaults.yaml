apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  s3_namespace: "object-storage"
  s3_service_name: "s3"
  s3_storage_class_name: "longhorn-rwo-2r"
  s3_data_size: "100Gi"
  s3_root_secret_name: "s3-root"
  s3_monitoring_credentials_secret_name: "s3-monitoring-credentials"
  s3_requests_cpu: "100m"
  s3_requests_memory: "256Mi"
  s3_limits_cpu: "1000m"
  s3_limits_memory: "1Gi"
  object_storage_endpoint: "s3.object-storage.svc.cluster.local:9000"
  object_storage_region: "us-east-1"
  object_storage_insecure: "true"
  object_storage_force_path_style: "true"
  monitoring_s3_values_secret_name: "monitoring-s3-values"
  # MinIO client. Built from nixpkgs and hosted in Harbor because MinIO
  # withdrew public distribution of mc in 2025 (quay/dockerhub 401,
  # dl.min.io 410). See containers/mc/Dockerfile.
  mc_image: "harbor.h4xx.io/library/mc:RELEASE.2025-08-13T08-35-41Z"
  # MinIO server. Same 2025 withdrawal hit the server image: quay.io/minio/minio
  # and docker.io/minio/minio now return 401 for anonymous pulls repo-wide
  # (every tag, not just :latest), so Harbor's proxy-quay cache cannot fetch it
  # either. A known-good release is mirrored into Harbor's library project.
  minio_image: "harbor.h4xx.io/library/minio:RELEASE.2025-09-07T16-13-09Z"
