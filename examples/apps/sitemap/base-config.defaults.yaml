apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  # Friendly landing page listing the user-facing services, served at
  # start.<domain> behind Authelia. Plain nginx over a ConfigMap - the page
  # is static HTML in apps/sitemap/configmap.yaml, edited in git.
  sitemap_namespace: "sitemap"
  sitemap_image: "docker.io/library/nginx:1.29-alpine"
  # Two replicas with soft anti-affinity; single-node clusters set this to 1.
  sitemap_replicas: "2"
  sitemap_suspend: "true"
