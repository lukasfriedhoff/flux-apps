# Template for flux-cluster/base/kustomizations/infra/mktxp.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mktxp-app
  namespace: flux-system
spec:
  suspend: ${mktxp_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: secrets
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/mktxp
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=10m0s}
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
