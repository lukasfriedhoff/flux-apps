apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-authentication-service-app
  namespace: flux-system
spec:
  suspend: ${matrix_mas_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: cnpg-app
    - name: cert-manager-app
    - name: traefik-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/matrix-authentication-service
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=10m0s}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-authentication-service-preflight-app
  namespace: flux-system
spec:
  suspend: ${matrix_mas_preflight_suspend:=true}
  dependsOn:
    - name: matrix-authentication-service-app
    - name: matrix-app
  sourceRef:
    kind: GitRepository
    name: flux-apps
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  path: ./apps/matrix-authentication-service/migrations/preflight
  prune: true
  wait: true
  timeout: ${flux_kustomization_default_timeout:=10m0s}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-authentication-service-cutover-app
  namespace: flux-system
spec:
  suspend: ${matrix_mas_cutover_suspend:=true}
  dependsOn:
    - name: matrix-authentication-service-app
    - name: matrix-app
  sourceRef:
    kind: GitRepository
    name: flux-apps
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  path: ./apps/matrix-authentication-service/migrations/cutover
  prune: true
  wait: true
  timeout: ${flux_kustomization_default_timeout:=10m0s}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
