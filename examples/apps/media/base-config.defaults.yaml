apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  arr_config_size: "5Gi"
  arr_config_storage_class_name: "ssd-cephfs-1r"
  arr_downloads_size: "200Gi"
  arr_downloads_storage_class_name: "ssd-cephfs-1r"
  arr_media_size: "1Ti"
  arr_media_storage_class_name: "ssd-cephfs-1r"
  cloudflare_tunnel_hostname: "03ed4283-aa2e-4781-8236-fd69a38e130a.cfargotunnel.com"
  default_cluster_issuer: "letsencrypt-prod"
  delegating_domain: "h4xx.io"
  k8s_pod_cidr: "10.42.0.0/16"
  k8s_service_cidr: "10.43.0.0/16"
  media_pgid: "1000"
  media_puid: "1000"
  media_timezone: "Europe/Berlin"
  arr_api_keys_secret_name: "arr-api-keys"
  jellyfin_e2e_auth_secret_name: "jellyfin-e2e-auth"
  jellyfin_external_hostname: "jellyfin${public_host_suffix}.${delegating_domain}"
  jellyfin_forgot_password_url: "https://jellyfin${public_host_suffix}.${delegating_domain}/web/index.html#!/forgotpassword.html"
  jellyfin_internal_base_url: "http://jellyfin:8096"
  jellyfin_server_name: "Jellyfin"
  jellyseerr_app_url: "https://jellyseerr${public_host_suffix}.${delegating_domain}"
  media_auth_issuer_url: "https://auth${public_host_suffix}.${delegating_domain}"
  radarr_external_url: "https://radarr${public_host_suffix}.${delegating_domain}"
  sonarr_external_url: "https://sonarr${public_host_suffix}.${delegating_domain}"
  media_download_promotion_enabled: "disabled"
  media_download_promotion_dry_run: "enabled"
  media_download_promotion_cron: "30 */6 * * *"
  media_download_promotion_min_age_hours: "72h"
  media_download_promotion_category_regex: "^(radarr|sonarr|lidarr|readarr)-imported$"
  media_download_promotion_target_base: "/media/staged"
  protonvpn_server_countries: "Switzerland"
