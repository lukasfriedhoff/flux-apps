apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  # LLDAP — lightweight LDAP with a web UI, backing Authelia's LDAP backend.
  lldap_suspend: "true"
  # renovate: datasource=docker depName=docker.io/lldap/lldap
  lldap_image_tag: "stable"
  lldap_base_dn: "dc=example,dc=com"
  lldap_admin_email: "admin@example.com"
  lldap_secret_name: "lldap-secrets"

  lldap_requests_cpu: "25m"
  lldap_requests_memory: "64Mi"
  lldap_limits_cpu: "500m"
  lldap_limits_memory: "256Mi"

  # CNPG store for LLDAP (HA at the Postgres layer).
  lldap_postgres_instances: "3"
  lldap_postgres_storage_class_name: "longhorn-disk-rwo-1r"
  lldap_postgres_size: "2Gi"
  lldap_postgres_requests_cpu: "50m"
  lldap_postgres_requests_memory: "128Mi"
  lldap_postgres_limits_cpu: "500m"
  lldap_postgres_limits_memory: "512Mi"
