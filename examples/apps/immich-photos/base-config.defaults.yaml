apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  immich_photos_suspend: "true"
  immich_photos_secret_name: "immich-photos-secrets"
  immich_photos_image_tag: "release"
  immich_photos_timezone: "Europe/Berlin"
  immich_photos_oidc: "none"
  immich_photos_oidc_client_id: "immich-photos"

  immich_photos_server_replicas: "1"
  immich_photos_server_requests_cpu: "250m"
  immich_photos_server_requests_memory: "512Mi"
  immich_photos_server_limits_cpu: "2000m"
  immich_photos_server_limits_memory: "2Gi"

  immich_photos_ml_replicas: "1"
  immich_photos_ml_requests_cpu: "250m"
  immich_photos_ml_requests_memory: "512Mi"
  immich_photos_ml_limits_cpu: "2000m"
  immich_photos_ml_limits_memory: "2Gi"
  immich_photos_ml_cache_storage_class_name: "longhorn-rwo-1r"
  immich_photos_ml_cache_size: "20Gi"

  immich_photos_uploads_storage_class_name: "longhorn-rwo-1r"
  immich_photos_uploads_size: "200Gi"

  immich_photos_postgres_storage_class_name: "longhorn-rwo-1r"
  immich_photos_postgres_size: "50Gi"
  immich_photos_postgres_requests_cpu: "150m"
  immich_photos_postgres_requests_memory: "512Mi"
  immich_photos_postgres_limits_cpu: "1000m"
  immich_photos_postgres_limits_memory: "1Gi"
  # Used only for one-time CNPG import from a legacy StatefulSet-backed PostgreSQL.
  immich_photos_postgres_source_user: "immich"
  immich_photos_postgres_source_dbname: "immich"

  immich_photos_redis_storage_class_name: "longhorn-rwo-1r"
  immich_photos_redis_size: "5Gi"
  immich_photos_redis_requests_cpu: "50m"
  immich_photos_redis_requests_memory: "128Mi"
  immich_photos_redis_limits_cpu: "500m"
  immich_photos_redis_limits_memory: "512Mi"

  # CNPG backup — endpoint URL and credentials all come from the secret (same key names as longhorn-backup-target).
  immich_photos_postgres_backup_bucket: "immich-postgres-backup"
  immich_photos_postgres_backup_cron: "0 0 2 * * *"
  # Secret in the immich-photos namespace with keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINTS.
  immich_photos_postgres_backup_credential_secret_name: "immich-photos-postgres-backup-credentials"
