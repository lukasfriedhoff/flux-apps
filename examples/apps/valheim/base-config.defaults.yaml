# All ${...} keys apps/valheim consumes, with sane defaults.
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
data:
  valheim_suspend: "true"
  valheim_namespace: "valheim"
  # Longhorn replica locality only — the game is published via a MetalLB VIP.
  valheim_node: ""
  # Upstream image via the Harbor ghcr proxy-cache; immutable sha-* tag.
  valheim_image: "harbor.h4xx.io/proxy-ghcr/lloesche/valheim-server:sha-e36cbfb0ddc8"
  valheim_replicas: "1"
  valheim_server_name: "Valheim Dedicated"
  valheim_world_name: "Dedicated"
  valheim_server_public: "true"
  valheim_adminlist_ids: ""
  valheim_game_port: "2456"
  valheim_query_port: "2457"
  valheim_status_port: "9110"
  valheim_vip: "10.1.20.43"
  # Update checks: frequent, but only while the server is empty. An outdated
  # server is invisible in the client's server browser.
  valheim_update_cron: "*/15 * * * *"
  valheim_update_if_idle: "true"
  # In-container world zips; restic owns long-term history.
  valheim_internal_backups: "true"
  valheim_internal_backups_cron: "0 */6 * * *"
  valheim_internal_backups_max_age: "3"
  valheim_puid: "1000"
  valheim_pgid: "1000"
  valheim_timezone: "Europe/Berlin"
  valheim_requests_cpu: "1"
  valheim_requests_memory: "3Gi"
  valheim_limits_memory: "6Gi"
  valheim_config_size: "10Gi"
  valheim_config_storage_class_name: "longhorn-ssd-rwo-1r"
  valheim_server_size: "20Gi"
  valheim_server_storage_class_name: "longhorn-ssd-rwo-1r"
  valheim_credentials_secret_name: "valheim-credentials"
  valheim_backup_secret_name: "valheim-backup-credentials"
  valheim_backup_cron: "15 4 * * *"
  valheim_backup_keep_daily: "14"
  valheim_backup_keep_weekly: "8"
  valheim_restic_image: "restic/restic:0.19.1"
  valheim_olivetin_image: "ghcr.io/olivetin/olivetin:2024.05.27"
  valheim_filebrowser_image: "docker.io/filebrowser/filebrowser:v2.44.0"
  valheim_kubectl_image: "docker.io/alpine/k8s:1.34.1"
