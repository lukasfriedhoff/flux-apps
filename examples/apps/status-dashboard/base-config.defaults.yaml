apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  default_cluster_issuer: "letsencrypt-prod"
  flux_kustomization_default_interval: "1h0m0s"
  flux_kustomization_default_retry_interval: "10m0s"
  flux_kustomization_default_timeout: "5m0s"
  status_dashboard_suspend: "true"
  status_dashboard_namespace: "status-dashboard"
  status_dashboard_host: "status.h4xx.io"
  status_dashboard_title: "Homelab Status"
  status_dashboard_description: "Public service uptime overview"
  # Gatus is stateless (history lives in CNPG), so this can exceed 1.
  # Leave at 1 on a fresh database until the schema migration has run.
  status_dashboard_replicas: "1"
  status_dashboard_postgres_instances: "3"
  status_dashboard_postgres_storage_class_name: "longhorn-disk-rwo-1r"
  status_dashboard_postgres_size: "2Gi"
  status_dashboard_postgres_requests_cpu: "50m"
  status_dashboard_postgres_requests_memory: "128Mi"
  status_dashboard_postgres_limits_cpu: "500m"
  status_dashboard_postgres_limits_memory: "512Mi"
