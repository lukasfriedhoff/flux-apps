# The flux-cluster Kustomization that reconciles apps/phone-broker
# (base/kustomizations/infra/phone-broker.yaml). The emulator it fronts and the
# Secret it authenticates with come from android-emulator-app and the `secrets`
# Kustomization, hence the dependsOn.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phone-broker-app
  namespace: flux-system
spec:
  suspend: ${phone_broker_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: android-emulator-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/phone-broker
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=5m0s}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
