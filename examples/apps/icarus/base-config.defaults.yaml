apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  icarus_namespace: "icarus"
  # Node holding the node-locally imported image (see apps/icarus/deployment.yaml).
  icarus_node: ""
  icarus_image: "localhost/icarus-server:v1"
  icarus_replicas: "1"
  icarus_server_name: "Icarus Dedicated"
  icarus_game_port: "17777"
  icarus_query_port: "27015"
  icarus_max_players: "8"
  icarus_branch: "public"
  icarus_update_on_start: "false"
  icarus_resume_prospect: "True"
  icarus_shutdown_not_joined_for: "-1"
  icarus_shutdown_empty_for: "-1"
  icarus_game_size: "40Gi"
  icarus_data_size: "5Gi"
  icarus_game_storage_class_name: "longhorn-ssd-rwo-1r"
  icarus_data_storage_class_name: "longhorn-ssd-rwo-1r"
  icarus_requests_cpu: "1"
  icarus_requests_memory: "6Gi"
  icarus_limits_memory: "12Gi"
  icarus_credentials_secret_name: "icarus-credentials"
  # restic to S3: RESTIC_REPOSITORY / RESTIC_PASSWORD / AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY all live in the backup credentials secret.
  icarus_backup_secret_name: "icarus-backup-credentials"
  icarus_backup_cron: "45 3 * * *"
  icarus_backup_keep_daily: "14"
  icarus_backup_keep_weekly: "8"
  icarus_olivetin_image: "ghcr.io/olivetin/olivetin:2025.11.13"
  icarus_filebrowser_image: "docker.io/filebrowser/filebrowser:v2.44.0"
  icarus_kubectl_image: "docker.io/alpine/k8s:1.34.1"
