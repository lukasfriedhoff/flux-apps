apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  matrix_suspend: "true"
  matrix_auth_mode: "legacy"

  matrix_synapse_image_tag: "latest"
  matrix_element_image_tag: "latest"
  matrix_whatsapp_image_tag: "latest"
  matrix_telegram_image_tag: "latest"
  matrix_signal_image_tag: "latest"
  matrix_signald_image_tag: "latest"

  matrix_synapse_replicas: "1"
  matrix_synapse_requests_cpu: "250m"
  matrix_synapse_requests_memory: "512Mi"
  matrix_synapse_limits_cpu: "2000m"
  matrix_synapse_limits_memory: "2Gi"

  matrix_bridge_requests_cpu: "100m"
  matrix_bridge_requests_memory: "256Mi"
  matrix_bridge_limits_cpu: "1000m"
  matrix_bridge_limits_memory: "1Gi"

  matrix_signald_requests_cpu: "100m"
  matrix_signald_requests_memory: "256Mi"
  matrix_signald_limits_cpu: "1000m"
  matrix_signald_limits_memory: "1Gi"

  matrix_postgres_requests_cpu: "100m"
  matrix_postgres_requests_memory: "256Mi"
  matrix_postgres_limits_cpu: "1000m"
  matrix_postgres_limits_memory: "1Gi"
  matrix_postgres_storage_class_name: "longhorn-rwo-1r"
  matrix_postgres_size: "20Gi"
  # Used only for one-time CNPG import from the legacy per-service StatefulSets.
  matrix_synapse_postgres_source_user: "synapse"
  matrix_synapse_postgres_source_dbname: "synapse"
  matrix_whatsapp_postgres_source_user: "mautrixwhatsapp"
  matrix_whatsapp_postgres_source_dbname: "mautrixwhatsapp"
  matrix_wa_postgres_source_user: "mautrixwhatsapp"
  matrix_wa_postgres_source_dbname: "mautrixwhatsapp"
  matrix_telegram_postgres_source_user: "mautrixtelegram"
  matrix_telegram_postgres_source_dbname: "mautrixtelegram"
  matrix_signal_postgres_source_user: "mautrixsignal"
  matrix_signal_postgres_source_dbname: "mautrixsignal"

  matrix_synapse_data_storage_class_name: "longhorn-rwo-1r"
  matrix_synapse_data_size: "20Gi"
  matrix_synapse_media_storage_class_name: "longhorn-rwo-1r"
  matrix_synapse_media_size: "100Gi"

  matrix_bridge_storage_class_name: "longhorn-rwo-1r"
  matrix_bridge_data_size: "20Gi"
  matrix_signald_data_size: "20Gi"

  # pg_dump backup — endpoint URL and credentials all come from the secret (same key names as longhorn-backup-target)
  matrix_postgres_backup_bucket: "matrix-postgres-backup"
  matrix_synapsedb_backup_generation: ""
  matrix_synapsedb_backup_server_name: "synapsedb"
  matrix_whatsappdb_backup_generation: ""
  matrix_whatsappdb_backup_server_name: "whatsappdb"
  matrix_wadb_backup_generation: ""
  matrix_wadb_backup_server_name: "wadb"
  matrix_telegramdb_backup_generation: ""
  matrix_telegramdb_backup_server_name: "telegramdb"
  matrix_signaldbprivate_backup_generation: ""
  matrix_signaldbprivate_backup_server_name: "signaldbprivate"
  # Secret in the matrix namespace with keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINTS
  matrix_postgres_backup_credential_secret_name: "matrix-postgres-backup-credentials"
