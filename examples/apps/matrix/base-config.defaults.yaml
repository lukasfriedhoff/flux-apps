apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  matrix_suspend: "true"

  matrix_synapse_image_tag: "latest"
  matrix_element_image_tag: "latest"
  matrix_whatsapp_image_tag: "latest"
  matrix_telegram_image_tag: "latest"
  matrix_signal_image_tag: "latest"
  matrix_signald_image_tag: "latest"

  matrix_synapse_replicas: "1"
  matrix_synapse_requests_cpu: "250m"
  matrix_synapse_requests_memory: "512Mi"
  matrix_synapse_limits_cpu: "2000m"
  matrix_synapse_limits_memory: "2Gi"

  matrix_bridge_requests_cpu: "100m"
  matrix_bridge_requests_memory: "256Mi"
  matrix_bridge_limits_cpu: "1000m"
  matrix_bridge_limits_memory: "1Gi"

  matrix_signald_requests_cpu: "100m"
  matrix_signald_requests_memory: "256Mi"
  matrix_signald_limits_cpu: "1000m"
  matrix_signald_limits_memory: "1Gi"

  matrix_postgres_requests_cpu: "100m"
  matrix_postgres_requests_memory: "256Mi"
  matrix_postgres_limits_cpu: "1000m"
  matrix_postgres_limits_memory: "1Gi"
  matrix_postgres_storage_class_name: "longhorn-rwo-1r"
  matrix_postgres_size: "20Gi"

  matrix_synapse_data_storage_class_name: "longhorn-rwo-1r"
  matrix_synapse_data_size: "20Gi"
  matrix_synapse_media_storage_class_name: "longhorn-rwo-1r"
  matrix_synapse_media_size: "100Gi"

  matrix_bridge_storage_class_name: "longhorn-rwo-1r"
  matrix_bridge_data_size: "20Gi"
  matrix_signald_data_size: "20Gi"
