apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  # Ships suspended: privileged workload holding a logged-in account.
  android_emulator_suspend: "true"
  # budtmo/docker-android, Android 11 (API 30) with Google Play Store: the x86_64
  # Play image that carries ARM translation. The Android 13 Play image has no
  # native bridge at all, and arm-only apps (Bumble ships arm64-v8a/armeabi-v7a
  # only) cannot install there. 14–17 Play images exist only in the paid "pro"
  # repo. Pinned by digest.
  android_emulator_image: "budtmo/docker-android:emulator_playstore_11.0_v3.9.1-p2@sha256:93531721c87fbc39c90ebde7da13ca27656df004ecbec4fa42bc386f382025d8"
  # Device profile from the image's skin set (Nexus 4/5/7/One/S, Galaxy S6–S10,
  # Pixel C, Pixel 8, Pixel 9). Pixel 8 = 1080x2400 @ 420, the closest to the
  # 1080x2340 @ 420 geometry the automation was tuned on; its UI-tree parsing is
  # proportional anyway.
  android_emulator_device: "Pixel 8"
  # Must match the image tag; used to register the AVD (~/.android/avd/<name>.ini).
  android_emulator_android_version: "11.0"
  android_emulator_api_level: "30"
  android_emulator_host: "android"
  android_emulator_node: "srv1"
  # Any small image with coreutils `install`; only copies the adb identity.
  android_emulator_initcontainer_image: "alpine:3.23"
  # Secret (ns android) with keys adbkey + adbkey.pub: the device identity shared
  # with the node adb server / phone-broker. Lives in the cluster repo (sops).
  android_emulator_adbkey_secret: "android-emulator-adbkey"
  # Guest sizing. The AVD ships with 3 vCPUs / 2 GB, which leaves an Android 11
  # Play image swapping; -cores/-memory override it at runtime. Container limits
  # must cover the guest RAM plus qemu and the software renderer (~2-3 GB).
  android_emulator_additional_args: "-cores 4 -memory 4096"
  android_emulator_requests_cpu: "2000m"
  android_emulator_requests_memory: "6Gi"
  android_emulator_limits_cpu: "6000m"
  android_emulator_limits_memory: "10Gi"
  # adb for interactive scrcpy clients: MetalLB VIP (services pool) reachable
  # only from this CIDR (WireGuard clients); adbd key auth applies on top.
  android_emulator_adb_vip: "10.3.20.44"
  android_emulator_adb_client_cidr: "10.1.90.0/24"
  # Node subnet the kubelet probes arrive from.
  android_emulator_node_cidr: "10.3.30.0/24"
  android_emulator_storage_class_name: "longhorn-ssd-rwo-2r"
  android_emulator_data_size: "32Gi"
