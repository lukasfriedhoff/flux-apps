apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  immich_suspend: "true"
  immich_secret_name: "immich-secrets"
  immich_image_tag: "release"
  immich_timezone: "Europe/Berlin"
  immich_oidc: "none"
  immich_oidc_client_id: "immich"

  immich_server_replicas: "1"
  immich_server_requests_cpu: "250m"
  immich_server_requests_memory: "512Mi"
  immich_server_limits_cpu: "2000m"
  immich_server_limits_memory: "2Gi"

  immich_ml_replicas: "1"
  immich_ml_requests_cpu: "250m"
  immich_ml_requests_memory: "512Mi"
  immich_ml_limits_cpu: "2000m"
  immich_ml_limits_memory: "2Gi"
  immich_ml_cache_storage_class_name: "longhorn-rwo-1r"
  immich_ml_cache_size: "20Gi"

  immich_uploads_storage_class_name: "longhorn-rwo-1r"
  immich_uploads_size: "200Gi"

  immich_postgres_storage_class_name: "longhorn-rwo-1r"
  immich_postgres_size: "50Gi"
  immich_postgres_requests_cpu: "150m"
  immich_postgres_requests_memory: "512Mi"
  immich_postgres_limits_cpu: "1000m"
  immich_postgres_limits_memory: "1Gi"
  # Used only for one-time CNPG import from a legacy StatefulSet-backed PostgreSQL.
  immich_postgres_source_user: "immich"
  immich_postgres_source_dbname: "immich"

  immich_redis_storage_class_name: "longhorn-rwo-1r"
  immich_redis_size: "5Gi"
  immich_redis_requests_cpu: "50m"
  immich_redis_requests_memory: "128Mi"
  immich_redis_limits_cpu: "500m"
  immich_redis_limits_memory: "512Mi"

  # pg_dump backup — endpoint URL and credentials all come from the secret (same key names as longhorn-backup-target)
  immich_postgres_backup_bucket: "immich-postgres-backup"
  immich_postgres_backup_generation: ""
  immich_postgres_backup_server_name: "immich-postgres"
  # Secret in the immich namespace with keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINTS
  immich_postgres_backup_credential_secret_name: "immich-postgres-backup-credentials"
