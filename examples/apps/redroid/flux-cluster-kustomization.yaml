apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redroid-app
  namespace: flux-system
spec:
  suspend: ${redroid_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: longhorn-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/redroid
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=5m0s}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
