# Template for flux-cluster/base/kustomizations/infra/uptime-kuma.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma-app
  namespace: flux-system
spec:
  suspend: ${uptime_kuma_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: longhorn-app
    - name: traefik-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/uptime-kuma
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=10m0s}
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
