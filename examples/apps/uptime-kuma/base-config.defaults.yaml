# All ${...} keys apps/uptime-kuma consumes, with sane defaults.
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
data:
  uptime_kuma_suspend: "true"
  uptime_kuma_namespace: "uptime-kuma"
  uptime_kuma_host: "status-alt.h4xx.io"
  uptime_kuma_image: "docker.io/louislam/uptime-kuma:2.5.5"
  uptime_kuma_timezone: "Europe/Berlin"
  uptime_kuma_data_size: "5Gi"
  uptime_kuma_storage_class_name: "longhorn-ssd-rwo-1r"
  uptime_kuma_requests_cpu: "50m"
  uptime_kuma_requests_memory: "256Mi"
  uptime_kuma_limits_memory: "1Gi"
