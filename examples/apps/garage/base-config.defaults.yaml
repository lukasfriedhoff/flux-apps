# Defaults for every ${...} key the garage app consumes. Garage is a 3-node,
# replication_factor=3 S3 cluster that replaces the single-node MinIO (s3) app.
# Each node runs as its own node-pinned Deployment on node-local hostPath.
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
data:
  garage_namespace: "object-storage"
  garage_replication_factor: "3"
  garage_s3_region: "us-east-1"
  garage_secrets_name: "garage-secrets"
  garage_image: "harbor.h4xx.io/proxy-docker/dxflrs/garage:v2.3.0"
  garage_init_image: "harbor.h4xx.io/proxy-docker/library/busybox:1.37.0"
  garage_requests_cpu: "100m"
  garage_requests_memory: "256Mi"
  garage_limits_memory: "1536Mi"

  # One entry per node: the k8s node name (nodeSelector + rpc_public_addr) and
  # the node-local path for metadata + data. rf=3 over 3 nodes means every node
  # stores a full copy, so each path needs headroom for the whole dataset.
  garage_node1_name: "node1"
  garage_node1_path: "/var/lib/garage"
  garage_node2_name: "node2"
  garage_node2_path: "/var/lib/garage"
  garage_node3_name: "node3"
  garage_node3_path: "/var/lib/garage"

  # Consumed by the S3 consumers (Loki/Mimir/Tempo/Stalwart) at cutover: flip a
  # consumer's endpoint from ${object_storage_endpoint} (MinIO) to this.
  garage_s3_endpoint: "garage.object-storage.svc.cluster.local:3900"
