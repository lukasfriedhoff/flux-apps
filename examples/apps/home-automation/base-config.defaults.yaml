apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  home_automation_suspend: "true"
  ha_node: "srv9"
  ha_storage_class: "longhorn-ssd-rwo-1r"
  ha_image: "docker.io/homeassistant/home-assistant:stable"
  ha_mosquitto_image: "docker.io/library/eclipse-mosquitto:2.1.2-alpine"
  ha_zigbee2mqtt_image: "docker.io/koenkk/zigbee2mqtt:2.13.0"
  ha_zigbee2mqtt_replicas: "0"
  ha_config_size: "10Gi"
  # Stable serial path of the Zigbee coordinator once attached to ha_node,
  # e.g. /dev/serial/by-id/usb-Silicon_Labs_CP2102N...-if00-port0
  ha_zigbee_serial: "/dev/null"
  # OTBR upstream only publishes a rolling :latest tag, hence the digest pin.
  ha_otbr_image: "docker.io/openthread/otbr@sha256:35c6e6520080116572fea50bbf271eff337992dd34e0cb095f4289f7853311e9"
  ha_matter_image: "ghcr.io/matter-js/python-matter-server:8.1.2"
  ha_otbr_replicas: "0"
  ha_matter_replicas: "0"
  # Host interface otbr-agent uses as Thread backbone (IoT VLAN bridge).
  ha_otbr_backbone_if: "brvlan12"
  # Stable serial path of the Thread RCP stick once attached to ha_node,
  # e.g. /dev/serial/by-id/usb-Silicon_Labs_CP2102N...-if00-port0
  ha_thread_serial: "/dev/null"
  ha_thread_baud: "460800"
