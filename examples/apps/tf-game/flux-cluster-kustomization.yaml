# Template for the Kustomization in flux-cluster (base/kustomizations/).
# Requires a game-tf2026 GitRepository in flux-system (see
# base-config.defaults.yaml for the repo variables) because the HelmRelease
# pulls the chart from the game repo itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tf-game-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: longhorn-app
    - name: cert-manager-app
    - name: traefik-app
  interval: 1h0m0s
  path: ./apps/tf-game
  prune: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: ${tf_game_suspend:=true}
  timeout: 15m0s
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
