apiVersion: v1
kind: ServiceAccount
metadata:
  name: jellyseerr-admin-sync
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jellyseerr-admin-sync-read-authelia-users
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authelia-users"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jellyseerr-admin-sync-read-authelia-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jellyseerr-admin-sync-read-authelia-users
subjects:
  - kind: ServiceAccount
    name: jellyseerr-admin-sync
    namespace: media
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyseerr-admin-sync
  namespace: media
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: jellyseerr-admin-sync
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:a14a9c326881fdce70b00df3fc095f5b5b128f5552677f677cd3788e757fb4e6
              env:
                - name: JELLYSEERR_ADMIN_GROUP
                  value: jellyseerr-admins
                - name: AUTHELIA_USERS_SECRET_NAMESPACE
                  value: authelia
                - name: AUTHELIA_USERS_SECRET_NAME
                  value: authelia-users
              command:
                - node
                - -e
                - |
                  const fs = require("fs");
                  const https = require("https");
                  const datasource = require("/app/dist/datasource").default;
                  const { User } = require("/app/dist/entity/User");
                  const { Permission } = require("/app/dist/lib/permissions");

                  const adminGroup = process.env.JELLYSEERR_ADMIN_GROUP || "jellyseerr-admins";
                  const secretNamespace = process.env.AUTHELIA_USERS_SECRET_NAMESPACE || "authelia";
                  const secretName = process.env.AUTHELIA_USERS_SECRET_NAME || "authelia-users";

                  const token = fs
                    .readFileSync("/var/run/secrets/kubernetes.io/serviceaccount/token", "utf8")
                    .trim();
                  const ca = fs.readFileSync("/var/run/secrets/kubernetes.io/serviceaccount/ca.crt");

                  function unquote(value) {
                    return String(value || "").replace(/^['"]|['"]$/g, "");
                  }

                  function parseAutheliaUsersYaml(yamlText, groupName) {
                    const adminUsernames = new Set();
                    const adminEmails = new Set();
                    const usersSplit = yamlText.split(/^users:\s*$/m);

                    if (usersSplit.length < 2) {
                      return { adminUsernames, adminEmails };
                    }

                    const usersSection = usersSplit.slice(1).join("\n");
                    const userBlockRegex = /^  ([^:\n]+):\n((?:    .*(?:\n|$))*)/gm;
                    let match;
                    while ((match = userBlockRegex.exec(usersSection)) !== null) {
                      const username = unquote(match[1]).trim().toLowerCase();
                      const block = match[2];
                      const emailMatch = block.match(/^    email:\s*(.+?)\s*$/m);
                      const groups = Array.from(block.matchAll(/^    -\s*(.+?)\s*$/gm)).map((m) =>
                        unquote(m[1]).trim()
                      );

                      if (!groups.includes(groupName)) {
                        continue;
                      }

                      if (username) {
                        adminUsernames.add(username);
                      }
                      if (emailMatch) {
                        const email = unquote(emailMatch[1]).trim().toLowerCase();
                        if (email) {
                          adminEmails.add(email);
                        }
                      }
                    }

                    return { adminUsernames, adminEmails };
                  }

                  function fetchSecret() {
                    const path = `/api/v1/namespaces/${secretNamespace}/secrets/${secretName}`;
                    const options = {
                      host: process.env.KUBERNETES_SERVICE_HOST,
                      port: Number(process.env.KUBERNETES_SERVICE_PORT_HTTPS || "443"),
                      method: "GET",
                      path,
                      headers: {
                        Authorization: `Bearer ${token}`,
                      },
                      ca,
                    };

                    return new Promise((resolve, reject) => {
                      const req = https.request(options, (res) => {
                        let body = "";
                        res.on("data", (chunk) => {
                          body += chunk;
                        });
                        res.on("end", () => {
                          if (res.statusCode && res.statusCode >= 200 && res.statusCode < 300) {
                            try {
                              resolve(JSON.parse(body));
                            } catch (err) {
                              reject(err);
                            }
                            return;
                          }
                          reject(new Error(`Secret fetch failed with HTTP ${res.statusCode}: ${body}`));
                        });
                      });
                      req.on("error", reject);
                      req.end();
                    });
                  }

                  (async () => {
                    const secretJson = await fetchSecret();
                    const encodedUsersDb = secretJson?.data?.["users_database.yml"];
                    if (!encodedUsersDb) {
                      throw new Error("authelia-users secret missing users_database.yml");
                    }
                    const usersYaml = Buffer.from(encodedUsersDb, "base64").toString("utf8");
                    const { adminUsernames, adminEmails } = parseAutheliaUsersYaml(usersYaml, adminGroup);

                    await datasource.initialize();
                    const repo = datasource.getRepository(User);
                    const users = await repo.find();

                    let updates = 0;
                    let grants = 0;
                    let revokes = 0;
                    const adminBit = Permission.ADMIN;

                    for (const user of users) {
                      const username = (user.username || "").trim().toLowerCase();
                      const email = (user.email || "").trim().toLowerCase();
                      const permissions = user.permissions || 0;
                      const shouldAdmin = adminUsernames.has(username) || (email && adminEmails.has(email));
                      const isAdmin = (permissions & adminBit) === adminBit;

                      if (shouldAdmin && !isAdmin) {
                        user.permissions = permissions | adminBit;
                        await repo.save(user);
                        updates += 1;
                        grants += 1;
                      } else if (!shouldAdmin && isAdmin) {
                        user.permissions = permissions & ~adminBit;
                        await repo.save(user);
                        updates += 1;
                        revokes += 1;
                      }
                    }

                    await datasource.destroy();
                    console.log(
                      `[jellyseerr-admin-sync] group=${adminGroup} admin_users=${adminUsernames.size} db_users=${users.length} updates=${updates} grants=${grants} revokes=${revokes}`
                    );
                  })().catch((err) => {
                    console.error(err?.stack || err?.message || String(err));
                    process.exit(1);
                  });
              volumeMounts:
                - name: jellyseerr-config
                  mountPath: /app/config
          volumes:
            - name: jellyseerr-config
              persistentVolumeClaim:
                claimName: jellyseerr
