apiVersion: v1
kind: ServiceAccount
metadata:
  name: jellyseerr-admin-sync
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jellyseerr-admin-sync-read-authelia-users
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authelia-users"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jellyseerr-admin-sync-read-authelia-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jellyseerr-admin-sync-read-authelia-users
subjects:
  - kind: ServiceAccount
    name: jellyseerr-admin-sync
    namespace: media
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyseerr-admin-sync
  namespace: media
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 300
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - jellyseerr
                  topologyKey: kubernetes.io/hostname
          serviceAccountName: jellyseerr-admin-sync
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:a14a9c326881fdce70b00df3fc095f5b5b128f5552677f677cd3788e757fb4e6
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              env:
                - name: JELLYSEERR_ADMIN_GROUPS
                  value: jellyseerr-admins,admins
                - name: AUTHELIA_USERS_SECRET_NAMESPACE
                  value: authelia
                - name: AUTHELIA_USERS_SECRET_NAME
                  value: authelia-users
              command:
                - node
                - -e
                - |
                  const fs = require("fs");
                  const https = require("https");
                  const datasource = require("/app/dist/datasource").default;
                  const { User } = require("/app/dist/entity/User");
                  const { Permission } = require("/app/dist/lib/permissions");

                  const adminGroups = new Set(
                    (process.env.JELLYSEERR_ADMIN_GROUPS || "jellyseerr-admins,admins")
                      .split(",")
                      .map((group) => group.trim())
                      .filter(Boolean)
                  );
                  const secretNamespace = process.env.AUTHELIA_USERS_SECRET_NAMESPACE || "authelia";
                  const secretName = process.env.AUTHELIA_USERS_SECRET_NAME || "authelia-users";

                  const token = fs
                    .readFileSync("/var/run/secrets/kubernetes.io/serviceaccount/token", "utf8")
                    .trim();
                  const ca = fs.readFileSync("/var/run/secrets/kubernetes.io/serviceaccount/ca.crt");

                  function unquote(value) {
                    return String(value || "").replace(/^['"]|['"]$/g, "");
                  }

                  function parseAutheliaUsersYaml(yamlText, groupNames) {
                    const adminUsernames = new Set();
                    const adminEmails = new Set();

                    let inUsers = false;
                    let current = null;
                    let currentField = "";

                    function finishCurrent() {
                      if (!current || !current.username) {
                        return;
                      }

                      const hasAdminGroup = current.groups.some((group) => groupNames.has(group));
                      if (!hasAdminGroup) {
                        return;
                      }

                      adminUsernames.add(current.username);
                      if (current.email) {
                        adminEmails.add(current.email);
                      }
                    }

                    for (const rawLine of yamlText.split(/\r?\n/)) {
                      if (/^users:\s*$/.test(rawLine)) {
                        inUsers = true;
                        continue;
                      }
                      if (!inUsers) {
                        continue;
                      }

                      const userMatch = rawLine.match(/^  ([^\s:\n][^:\n]*):\s*$/);
                      if (userMatch) {
                        finishCurrent();
                        current = {
                          username: unquote(userMatch[1]).trim().toLowerCase(),
                          email: "",
                          groups: [],
                        };
                        currentField = "";
                        continue;
                      }

                      if (!current) {
                        continue;
                      }

                      const fieldMatch = rawLine.match(/^    ([^:\n]+):(?:\s*(.*?))?\s*$/);
                      if (fieldMatch) {
                        currentField = fieldMatch[1].trim();
                        if (currentField === "email") {
                          current.email = unquote(fieldMatch[2] || "").trim().toLowerCase();
                        }
                        continue;
                      }

                      const listMatch = rawLine.match(/^      -\s*(.+?)\s*$/);
                      if (listMatch && currentField === "groups") {
                        current.groups.push(unquote(listMatch[1]).trim());
                      }
                    }
                    finishCurrent();

                    return { adminUsernames, adminEmails };
                  }

                  function fetchSecret() {
                    const path = `/api/v1/namespaces/$${secretNamespace}/secrets/$${secretName}`;
                    const options = {
                      host: process.env.KUBERNETES_SERVICE_HOST,
                      port: Number(process.env.KUBERNETES_SERVICE_PORT_HTTPS || "443"),
                      method: "GET",
                      path,
                      headers: {
                        Authorization: `Bearer $${token}`,
                      },
                      ca,
                    };

                    return new Promise((resolve, reject) => {
                      const req = https.request(options, (res) => {
                        let body = "";
                        res.on("data", (chunk) => {
                          body += chunk;
                        });
                        res.on("end", () => {
                          if (res.statusCode && res.statusCode >= 200 && res.statusCode < 300) {
                            try {
                              resolve(JSON.parse(body));
                            } catch (err) {
                              reject(err);
                            }
                            return;
                          }
                          reject(new Error(`Secret fetch failed with HTTP $${res.statusCode}: $${body}`));
                        });
                      });
                      req.on("error", reject);
                      req.end();
                    });
                  }

                  (async () => {
                    const secretJson = await fetchSecret();
                    const encodedUsersDb = secretJson?.data?.["users_database.yml"];
                    if (!encodedUsersDb) {
                      throw new Error("authelia-users secret missing users_database.yml");
                    }
                    const usersYaml = Buffer.from(encodedUsersDb, "base64").toString("utf8");
                    const { adminUsernames, adminEmails } = parseAutheliaUsersYaml(usersYaml, adminGroups);

                    await datasource.initialize();
                    const repo = datasource.getRepository(User);
                    const users = await repo.find();

                    let updates = 0;
                    let grants = 0;
                    let revokes = 0;
                    const adminBit = Permission.ADMIN;

                    for (const user of users) {
                      const username = (user.username || "").trim().toLowerCase();
                      const email = (user.email || "").trim().toLowerCase();
                      const permissions = user.permissions || 0;
                      const shouldAdmin = adminUsernames.has(username) || (email && adminEmails.has(email));
                      const isAdmin = (permissions & adminBit) === adminBit;

                      if (shouldAdmin && !isAdmin) {
                        user.permissions = permissions | adminBit;
                        await repo.save(user);
                        updates += 1;
                        grants += 1;
                      } else if (!shouldAdmin && isAdmin) {
                        user.permissions = permissions & ~adminBit;
                        await repo.save(user);
                        updates += 1;
                        revokes += 1;
                      }
                    }

                    await datasource.destroy();
                    console.log(
                      `[jellyseerr-admin-sync] groups=$${Array.from(adminGroups).join(",")} admin_users=$${adminUsernames.size} db_users=$${users.length} updates=$${updates} grants=$${grants} revokes=$${revokes}`
                    );
                  })().catch((err) => {
                    console.error(err?.stack || err?.message || String(err));
                    process.exit(1);
                  });
              volumeMounts:
                - name: jellyseerr-config
                  mountPath: /app/config
          volumes:
            - name: jellyseerr-config
              persistentVolumeClaim:
                claimName: jellyseerr
