apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        initContainers:
          git-bootstrap:
            image:
              repository: alpine/git
              tag: "2.49.1"
            command:
              - /bin/sh
              - -c
              - |
                set -eu

                repo_dir=/config/db
                origin_dir=/config/repo-origin.git

                mkdir -p "$repo_dir"

                if [ ! -d "$origin_dir" ]; then
                  git init --bare "$origin_dir"
                fi

                if [ ! -d "$repo_dir/.git" ]; then
                  git init "$repo_dir"
                  mkdir -p "$repo_dir/regex_patterns" "$repo_dir/custom_formats" "$repo_dir/profiles" "$repo_dir/media_management"
                  if [ ! -f "$repo_dir/README.md" ]; then
                    printf "# Profilarr Data Repository\n" > "$repo_dir/README.md"
                  fi
                fi

                # The init container runs as root while the repo is owned by PUID/PGID.
                # Mark it as safe to avoid "detected dubious ownership" errors.
                git config --global --add safe.directory "$repo_dir"

                git -C "$repo_dir" config user.name "${GIT_USER_NAME:-Profilarr}"
                git -C "$repo_dir" config user.email "${GIT_USER_EMAIL:-profilarr@local}"

                if ! git -C "$repo_dir" remote get-url origin >/dev/null 2>&1; then
                  git -C "$repo_dir" remote add origin "$origin_dir"
                fi

                if ! git -C "$repo_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
                  git -C "$repo_dir" add -A
                  git -C "$repo_dir" commit -m "Initialize Profilarr local repository"
                  git -C "$repo_dir" branch -M main
                  git -C "$repo_dir" push -u origin main
                else
                  git -C "$repo_dir" fetch origin >/dev/null 2>&1 || true
                fi

                chown -R 1000:1000 "$repo_dir" "$origin_dir" || true
        containers:
          main:
            image:
              repository: santiagosayshey/profilarr
              tag: latest
            env:
              TZ: ${media_timezone}
              PUID: ${media_puid}
              PGID: ${media_pgid}
              AUTH: "off"
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                cpu: 250m
                memory: 256Mi
    service:
      main:
        ports:
          http:
            port: 6868
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${default_cluster_issuer}
          external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
        hosts:
          - host: profilarr${public_host_suffix}.${delegating_domain}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: profilarr-tls
            hosts:
              - profilarr${public_host_suffix}.${delegating_domain}
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: ${arr_config_storage_class_name}
        size: ${arr_config_size}
        globalMounts:
          - path: /config
