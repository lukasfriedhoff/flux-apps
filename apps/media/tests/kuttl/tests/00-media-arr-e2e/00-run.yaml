apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      #!/usr/bin/env bash
      set -euo pipefail

      ns="${NAMESPACE:-media}"

      log() {
        printf '[media-arr-e2e] %s\n' "$*"
      }

      fail() {
        log "FAIL: $*"
        exit 1
      }

      command -v jq >/dev/null 2>&1 || fail "jq is required for this test step"
      command -v kubectl >/dev/null 2>&1 || fail "kubectl is required for this test step"

      read_api_key() {
        app="$1"
        kubectl -n "$ns" exec "deploy/$app" -- sh -lc \
          "sed -n 's:.*<ApiKey>\\(.*\\)</ApiKey>.*:\\1:p' /config/config.xml | head -n1"
      }

      arr_get() {
        app="$1"
        port="$2"
        api_key="$3"
        path="$4"
        kubectl -n "$ns" exec "deploy/$app" -- sh -lc \
          "curl -fsS -H 'X-Api-Key: $api_key' 'http://localhost:$port$path'"
      }

      arr_post() {
        app="$1"
        port="$2"
        api_key="$3"
        path="$4"
        kubectl -n "$ns" exec "deploy/$app" -- sh -lc \
          "curl -fsS -H 'X-Api-Key: $api_key' -H 'Content-Type: application/json' -X POST 'http://localhost:$port$path'"
      }

      arr_post_with_status() {
        app="$1"
        port="$2"
        api_key="$3"
        path="$4"
        kubectl -n "$ns" exec "deploy/$app" -- sh -lc '
          status="$(
            curl -sS -o /tmp/arr-post-response.json -w "%{http_code}" \
              -H "X-Api-Key: '"$api_key"'" \
              -H "Content-Type: application/json" \
              -X POST \
              "http://localhost:'"$port$path"'"
          )"
          printf "%s\n" "$status"
          cat /tmp/arr-post-response.json
        '
      }

      prowlarr_get() {
        api_key="$1"
        path="$2"
        kubectl -n "$ns" exec deploy/prowlarr -- sh -lc \
          "curl -fsS -H 'X-Api-Key: $api_key' 'http://localhost:9696$path'"
      }

      run_arr_checks() {
        app="$1"
        port="$2"
        api_version="$3"

        log "$app: resolving API key"
        api_key="$(read_api_key "$app")"
        [ -n "$api_key" ] || fail "$app API key is empty"

        log "$app: checking system status"
        arr_get "$app" "$port" "$api_key" "/api/$api_version/system/status" >/dev/null

        log "$app: checking root folders"
        roots_json="$(arr_get "$app" "$port" "$api_key" "/api/$api_version/rootfolder")"
        printf '%s' "$roots_json" | jq -e 'length > 0' >/dev/null || fail "$app has no root folders configured"

        log "$app: checking indexers"
        indexers_json="$(arr_get "$app" "$port" "$api_key" "/api/$api_version/indexer")"
        printf '%s' "$indexers_json" | jq -e 'length > 0' >/dev/null || fail "$app has no indexers configured"

        log "$app: testing all indexers"
        indexer_test_result="$(arr_post_with_status "$app" "$port" "$api_key" "/api/$api_version/indexer/testall")"
        indexer_test_http_code="$(printf '%s\n' "$indexer_test_result" | head -n1)"
        indexer_test_json="$(printf '%s\n' "$indexer_test_result" | tail -n +2)"
        case "$indexer_test_http_code" in
          2*|400) ;;
          *) fail "$app indexer testall returned HTTP $indexer_test_http_code: $indexer_test_json" ;;
        esac
      # Some public trackers are intermittently rate-limited, unavailable, or return
      # category mismatches for a specific ARR app. Keep the test strict on overall
      # health by requiring at least one valid indexer and only allowing known
      # transient messages.
        printf '%s' "$indexer_test_json" | jq -e '
          (length > 0)
          and (map(select(.isValid == true)) | length > 0)
          and (
            all(
              .[];
              (.isValid == true)
              or (
                (.validationFailures // [])
                | all(
                    (.errorMessage // "")
                    | test("no results in the configured categories|TooManyRequests|429|server is unavailable|timed out|timeout"; "i")
                  )
              )
            )
          )
        ' >/dev/null || fail "$app indexer testall reported unexpected failures (HTTP $indexer_test_http_code): $indexer_test_json"

        log "$app: checking download clients"
        dls_json="$(arr_get "$app" "$port" "$api_key" "/api/$api_version/downloadclient")"
        printf '%s' "$dls_json" | jq -e 'length > 0' >/dev/null || fail "$app has no download clients configured"

        log "$app: testing all download clients"
        dl_test_json="$(arr_post "$app" "$port" "$api_key" "/api/$api_version/downloadclient/testall")"
        printf '%s' "$dl_test_json" | jq -e 'length > 0 and all(.[]; .isValid == true)' >/dev/null \
          || fail "$app downloadclient testall reported invalid clients: $dl_test_json"

        log "$app: checking queue status"
        queue_json="$(arr_get "$app" "$port" "$api_key" "/api/$api_version/queue/status")"
        printf '%s' "$queue_json" | jq -e '.errors == false' >/dev/null || fail "$app queue reports errors: $queue_json"

        log "$app: PASS"
      }

      run_arr_checks sonarr 8989 v3
      run_arr_checks radarr 7878 v3
      run_arr_checks lidarr 8686 v1
      run_arr_checks readarr 8787 v1

      log "prowlarr: validating indexer set"
      prowlarr_api_key="$(read_api_key prowlarr)"
      [ -n "$prowlarr_api_key" ] || fail "prowlarr API key is empty"
      prowlarr_indexers_json="$(prowlarr_get "$prowlarr_api_key" "/api/v1/indexer")"

      if kubectl -n "$ns" get secret prowlarr-private-trackers >/dev/null 2>&1; then
        secret_json="$(kubectl -n "$ns" get secret prowlarr-private-trackers -o json)"

        secret_value() {
          key="$1"
          printf '%s' "$secret_json" | jq -r --arg key "$key" '.data[$key] // ""' | base64 -d 2>/dev/null || true
        }

        require_indexer_enabled_if_secret() {
          indexer_name="$1"
          shift
          for key in "$@"; do
            [ -n "$(secret_value "$key")" ] || return 0
          done
          printf '%s' "$prowlarr_indexers_json" | jq -e --arg name "$indexer_name" 'any(.[]?; .name == $name and .enable == true)' >/dev/null \
            || fail "$indexer_name indexer not configured/enabled in Prowlarr"
        }

        require_indexer_enabled_if_secret "TorrentSyndikat" torrentsyndikat_api_key
        require_indexer_enabled_if_secret "Flood.st" flood_api_key
        require_indexer_enabled_if_secret "Immortuos" immortuos_username immortuos_password
        require_indexer_enabled_if_secret "Speedmaster HD" speedmasterhd_username speedmasterhd_password
        require_indexer_enabled_if_secret "World-of-Tomorrow" world_of_tomorrow_username world_of_tomorrow_password
        require_indexer_enabled_if_secret "Explosiv-World" explosiv_world_username explosiv_world_password
        require_indexer_enabled_if_secret "TorrentLeech" torrentleech_username torrentleech_password
        require_indexer_enabled_if_secret "IPTorrents" iptorrents_cookie
        require_indexer_enabled_if_secret "FileList.io" filelist_username filelist_passkey
        require_indexer_enabled_if_secret "BeyondHD" beyondhd_api_key beyondhd_rss_key
        require_indexer_enabled_if_secret "PassThePopcorn" passthepopcorn_api_user passthepopcorn_api_key
        require_indexer_enabled_if_secret "Aither" aither_api_key
        require_indexer_enabled_if_secret "Blutopia" blutopia_api_key
        require_indexer_enabled_if_secret "DigitalCore" digitalcore_api_key
        require_indexer_enabled_if_secret "HDTorrents.it" hdtorrentsit_api_key
        require_indexer_enabled_if_secret "RocketHD" rockethd_api_key
      fi

      log "all media ARR checks passed"
