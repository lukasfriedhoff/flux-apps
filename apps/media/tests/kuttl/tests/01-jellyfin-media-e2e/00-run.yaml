apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      #!/usr/bin/env bash
      set -euo pipefail

      ns="${NAMESPACE:-media}"
      jellyfin_secret_name="${JELLYFIN_E2E_SECRET_NAME:-jellyfin-e2e-auth}"
      local_port="${JELLYFIN_E2E_LOCAL_PORT:-18096}"

      log() {
        printf '[jellyfin-e2e] %s\n' "$*"
      }

      fail() {
        log "FAIL: $*"
        exit 1
      }

      command -v jq >/dev/null 2>&1 || fail "jq is required for this test step"
      command -v kubectl >/dev/null 2>&1 || fail "kubectl is required for this test step"
      command -v curl >/dev/null 2>&1 || fail "curl is required for this test step"

      kubectl -n "$ns" get deploy jellyfin >/dev/null 2>&1 || fail "jellyfin deployment not found in namespace '$ns'"

      log "Seeding example movie/tv/music files on arr-media (/media/e2e-test)"
      kubectl -n "$ns" exec deploy/jellyfin -- sh -lc '
        set -eu

        fetch_if_missing() {
          url="$1"
          dest="$2"
          if [ -s "$dest" ]; then
            return 0
          fi
          mkdir -p "$(dirname "$dest")"
          tmp="${dest}.tmp.$$"
          rm -f "$tmp"
          curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 20 "$url" -o "$tmp"
          mv "$tmp" "$dest"
        }

        mkdir -p \
          "/media/e2e-test/movies/E2E Movie (2024)" \
          "/media/e2e-test/tv/E2E Test Show (2024)/Season 01" \
          "/media/e2e-test/music/E2E Artist/E2E Album (2024)"

        fetch_if_missing \
          "https://samplelib.com/lib/preview/mp4/sample-5s.mp4" \
          "/media/e2e-test/movies/E2E Movie (2024)/E2E Movie (2024).mp4"

        fetch_if_missing \
          "https://samplelib.com/lib/preview/mp4/sample-5s.mp4" \
          "/media/e2e-test/tv/E2E Test Show (2024)/Season 01/E2E Test Show (2024) - S01E01 - Pilot.mp4"

        fetch_if_missing \
          "https://samplelib.com/lib/preview/mp3/sample-3s.mp3" \
          "/media/e2e-test/music/E2E Artist/E2E Album (2024)/01 - E2E Track.mp3"
      '

      pf_log="$(mktemp)"
      kubectl -n "$ns" port-forward svc/jellyfin "${local_port}:8096" >"$pf_log" 2>&1 &
      pf_pid="$!"

      cleanup() {
        kill "$pf_pid" >/dev/null 2>&1 || true
        wait "$pf_pid" >/dev/null 2>&1 || true
        rm -f "$pf_log"
      }
      trap cleanup EXIT

      base_url="http://127.0.0.1:${local_port}"
      for _ in $(seq 1 30); do
        if curl -fsS "${base_url}/System/Info/Public" >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      curl -fsS "${base_url}/System/Info/Public" >/dev/null 2>&1 || fail "jellyfin API not reachable via port-forward"

      read_secret_key() {
        secret_name="$1"
        key="$2"
        if ! kubectl -n "$ns" get secret "$secret_name" >/dev/null 2>&1; then
          return 1
        fi
        kubectl -n "$ns" get secret "$secret_name" -o "jsonpath={.data.${key}}" 2>/dev/null | base64 -d 2>/dev/null || true
      }

      api_token="${JELLYFIN_API_KEY:-}"
      username="${JELLYFIN_USERNAME:-}"
      password="${JELLYFIN_PASSWORD:-}"

      if [ -z "$api_token" ]; then
        api_token="$(read_secret_key "$jellyfin_secret_name" api_key || true)"
      fi
      if [ -z "$username" ]; then
        username="$(read_secret_key "$jellyfin_secret_name" username || true)"
      fi
      if [ -z "$password" ]; then
        password="$(read_secret_key "$jellyfin_secret_name" password || true)"
      fi

      emby_auth='X-Emby-Authorization: MediaBrowser Client="media-e2e", Device="media-e2e", DeviceId="media-e2e", Version="1.0.0"'
      user_id=""

      if [ -z "$api_token" ]; then
        if [ -z "$username" ] || [ -z "$password" ]; then
          if [ "${REQUIRE_JELLYFIN_AUTH:-false}" = "true" ]; then
            fail "No Jellyfin auth available. Set JELLYFIN_API_KEY or create secret ${jellyfin_secret_name} with username/password."
          fi
          log "No Jellyfin auth available; skipping authenticated Jellyfin checks."
          exit 0
        fi

        log "Authenticating to Jellyfin with username/password"
        auth_payload="$(jq -cn --arg user "$username" --arg pass "$password" '{Username:$user,Pw:$pass}')"
        auth_json="$(curl -fsS -H "$emby_auth" -H 'Content-Type: application/json' -X POST "${base_url}/Users/AuthenticateByName" --data "$auth_payload")"
        api_token="$(printf '%s' "$auth_json" | jq -r '.AccessToken // empty')"
        user_id="$(printf '%s' "$auth_json" | jq -r '.User.Id // empty')"
        [ -n "$api_token" ] || fail "Jellyfin authentication succeeded without token"
        [ -n "$user_id" ] || fail "Jellyfin authentication succeeded without user id"
      fi

      auth_header="X-MediaBrowser-Token: ${api_token}"

      if [ -z "$user_id" ]; then
        me_json="$(curl -fsS -H "$auth_header" "${base_url}/Users/Me" 2>/dev/null || true)"
        user_id="$(printf '%s' "$me_json" | jq -r '.Id // empty' 2>/dev/null || true)"
      fi
      if [ -z "$user_id" ]; then
        users_json="$(curl -fsS -H "$auth_header" "${base_url}/Users" 2>/dev/null || true)"
        user_id="$(printf '%s' "$users_json" | jq -r '.[0].Id // empty' 2>/dev/null || true)"
      fi
      [ -n "$user_id" ] || fail "Could not resolve Jellyfin user id from token"

      uri() {
        jq -nr --arg v "$1" '$v|@uri'
      }

      ensure_library() {
        collection_type="$1"
        name="$2"
        path="$3"

        folders_json="$(curl -fsS -H "$auth_header" "${base_url}/Library/VirtualFolders")"
        if printf '%s' "$folders_json" | jq -e --arg p "$path" 'any(.[]?; ((.Locations // []) | index($p)) != null)' >/dev/null; then
          log "Library path already present: $path"
          return 0
        fi

        name_enc="$(uri "$name")"
        path_enc="$(uri "$path")"
        curl -fsS -X POST -H "$auth_header" \
          "${base_url}/Library/VirtualFolders?name=${name_enc}&collectionType=${collection_type}&paths=${path_enc}&refreshLibrary=true" >/dev/null

        folders_json="$(curl -fsS -H "$auth_header" "${base_url}/Library/VirtualFolders")"
        printf '%s' "$folders_json" | jq -e --arg p "$path" 'any(.[]?; ((.Locations // []) | index($p)) != null)' >/dev/null \
          || fail "Failed to create Jellyfin library for path $path"
      }

      ensure_library "movies" "E2E Movies" "/media/e2e-test/movies"
      ensure_library "tvshows" "E2E TV" "/media/e2e-test/tv"
      ensure_library "music" "E2E Music" "/media/e2e-test/music"

      log "Refreshing Jellyfin library"
      curl -fsS -X POST -H "$auth_header" \
        "${base_url}/Library/Refresh?metadataRefreshMode=FullRefresh&imageRefreshMode=None&replaceAllMetadata=false&replaceAllImages=false" >/dev/null

      movie_item_id=""
      episode_item_id=""
      audio_item_id=""

      for _ in $(seq 1 30); do
        movies_json="$(curl -fsS -H "$auth_header" "${base_url}/Users/${user_id}/Items?Recursive=true&IncludeItemTypes=Movie&SearchTerm=$(uri "E2E Movie")")"
        tv_json="$(curl -fsS -H "$auth_header" "${base_url}/Users/${user_id}/Items?Recursive=true&IncludeItemTypes=Episode&SearchTerm=$(uri "E2E Test Show")")"
        audio_json="$(curl -fsS -H "$auth_header" "${base_url}/Users/${user_id}/Items?Recursive=true&IncludeItemTypes=Audio&SearchTerm=$(uri "E2E Track")")"

        movie_item_id="$(printf '%s' "$movies_json" | jq -r '.Items[0].Id // empty')"
        episode_item_id="$(printf '%s' "$tv_json" | jq -r '.Items[0].Id // empty')"
        audio_item_id="$(printf '%s' "$audio_json" | jq -r '.Items[0].Id // empty')"

        if [ -n "$movie_item_id" ] && [ -n "$episode_item_id" ] && [ -n "$audio_item_id" ]; then
          break
        fi
        sleep 5
      done

      [ -n "$movie_item_id" ] || fail "Movie sample was not indexed by Jellyfin"
      [ -n "$episode_item_id" ] || fail "TV sample was not indexed by Jellyfin"
      [ -n "$audio_item_id" ] || fail "Music sample was not indexed by Jellyfin"

      probe_stream() {
        item_id="$1"
        route_prefix="$2"
        label="$3"

        playback_json="$(curl -fsS -H "$auth_header" -H 'Content-Type: application/json' -X POST "${base_url}/Items/${item_id}/PlaybackInfo?UserId=${user_id}" --data '{}')"
        media_source_id="$(printf '%s' "$playback_json" | jq -r '.MediaSources[0].Id // empty')"

        stream_url="${base_url}/${route_prefix}/${item_id}/stream?static=true"
        if [ -n "$media_source_id" ]; then
          stream_url="${stream_url}&MediaSourceId=$(uri "$media_source_id")"
        fi

        out_file="$(mktemp)"
        http_code="$(curl -sS -H "$auth_header" -H 'Range: bytes=0-8191' -o "$out_file" -w '%{http_code}' "$stream_url" || true)"
        bytes="$(wc -c <"$out_file")"
        rm -f "$out_file"

        case "$http_code" in
          200|206) ;;
          *) fail "$label stream failed with HTTP $http_code" ;;
        esac

        [ "$bytes" -gt 0 ] || fail "$label stream endpoint returned 0 bytes"
        log "$label stream probe passed (http=$http_code bytes=$bytes)"
      }

      probe_stream "$movie_item_id" "Videos" "movie"
      probe_stream "$episode_item_id" "Videos" "episode"
      probe_stream "$audio_item_id" "Audio" "audio"

      log "Jellyfin sample media scan and stream checks passed"
