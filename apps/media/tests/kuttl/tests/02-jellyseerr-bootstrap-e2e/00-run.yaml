apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      #!/usr/bin/env bash
      set -euo pipefail

      ns="${NAMESPACE:-media}"
      local_port="${JELLYSEERR_E2E_LOCAL_PORT:-15055}"

      log() {
        printf '[jellyseerr-e2e] %s\n' "$*"
      }

      fail() {
        log "FAIL: $*"
        exit 1
      }

      command -v jq >/dev/null 2>&1 || fail "jq is required for this test step"
      command -v kubectl >/dev/null 2>&1 || fail "kubectl is required for this test step"
      command -v curl >/dev/null 2>&1 || fail "curl is required for this test step"

      kubectl -n "$ns" get deploy jellyseerr >/dev/null 2>&1 || fail "jellyseerr deployment not found in namespace '$ns'"

      log "Validating on-disk Jellyseerr bootstrap settings"
      settings_json="$(kubectl -n "$ns" exec deploy/jellyseerr -- sh -lc 'cat /app/config/settings.json')"
      printf '%s' "$settings_json" | jq -e '.public.initialized == true' >/dev/null || fail "settings.json still reports initialized=false"
      printf '%s' "$settings_json" | jq -e '.main.mediaServerType == 4' >/dev/null || fail "settings.json main.mediaServerType is not Jellyfin (4)"
      printf '%s' "$settings_json" | jq -e '(.radarr | type) == "array" and (.radarr | length) > 0' >/dev/null || fail "settings.json radarr config missing"
      printf '%s' "$settings_json" | jq -e '(.sonarr | type) == "array" and (.sonarr | length) > 0' >/dev/null || fail "settings.json sonarr config missing"

      pf_log="$(mktemp)"
      kubectl -n "$ns" port-forward svc/jellyseerr "${local_port}:5055" >"$pf_log" 2>&1 &
      pf_pid="$!"

      cleanup() {
        kill "$pf_pid" >/dev/null 2>&1 || true
        wait "$pf_pid" >/dev/null 2>&1 || true
        rm -f "$pf_log"
      }
      trap cleanup EXIT

      base_url="http://127.0.0.1:${local_port}"
      for _ in $(seq 1 30); do
        if curl -fsS "${base_url}/api/v1/settings/public" >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done

      public_json="$(curl -fsS "${base_url}/api/v1/settings/public")" || fail "jellyseerr public settings endpoint not reachable"
      printf '%s' "$public_json" | jq -e '.initialized == true' >/dev/null || fail "live API still reports initialized=false"

      log "Jellyseerr bootstrap checks passed"
