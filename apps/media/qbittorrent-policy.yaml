apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-policy
  namespace: media
data:
  sync.py: |-
    import json
    import os
    import time
    import urllib.parse
    import urllib.request

    QBITTORRENT_URL = os.getenv("QBITTORRENT_URL", "http://qbittorrent:8080").rstrip("/")
    QBITTORRENT_MAX_ACTIVE_DOWNLOADS = int(os.getenv("QBITTORRENT_MAX_ACTIVE_DOWNLOADS", "30"))
    QBITTORRENT_MAX_ACTIVE_UPLOADS = int(os.getenv("QBITTORRENT_MAX_ACTIVE_UPLOADS", "300"))
    QBITTORRENT_MAX_ACTIVE_TORRENTS = int(os.getenv("QBITTORRENT_MAX_ACTIVE_TORRENTS", "500"))
    QBITTORRENT_ALLOWED_TRACKER_MARKERS = tuple(
      marker.strip().lower()
      for marker in os.getenv("QBITTORRENT_ALLOWED_TRACKER_MARKERS", "rocket-hd.cc,flood.st").split(",")
      if marker.strip()
    )

    def log(message):
      print(f"[qbittorrent-policy] {message}", flush=True)

    def request_json(method, url, body=None, headers=None, timeout=30):
      data = body.encode() if body is not None else None
      req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
      with urllib.request.urlopen(req, timeout=timeout) as resp:
        raw = resp.read()
      if not raw:
        return None
      return json.loads(raw.decode())

    def request_form(method, url, form, timeout=30):
      data = urllib.parse.urlencode(form).encode()
      req = urllib.request.Request(url, data=data, method=method)
      with urllib.request.urlopen(req, timeout=timeout) as resp:
        resp.read()

    def qbt_get(path):
      return request_json("GET", f"{QBITTORRENT_URL}{path}")

    def qbt_post(path, form):
      return request_form("POST", f"{QBITTORRENT_URL}{path}", form)

    def wait_for_qbittorrent():
      for attempt in range(1, 21):
        try:
          qbt_get("/api/v2/app/preferences")
          return
        except Exception as err:
          log(f"qBittorrent not ready yet ({attempt}/20): {err}")
          time.sleep(3)
      raise RuntimeError("qBittorrent API unavailable")

    def enforce_qbittorrent_defaults():
      prefs = {
        "max_ratio_enabled": False,
        "max_ratio": -1,
        "max_ratio_act": 0,
        "max_seeding_time_enabled": False,
        "max_seeding_time": -1,
        "max_inactive_seeding_time_enabled": False,
        "max_inactive_seeding_time": -1,
        "queueing_enabled": True,
        "max_active_downloads": QBITTORRENT_MAX_ACTIVE_DOWNLOADS,
        "max_active_uploads": QBITTORRENT_MAX_ACTIVE_UPLOADS,
        "max_active_torrents": QBITTORRENT_MAX_ACTIVE_TORRENTS,
        "add_trackers_from_url_enabled": False,
        "add_trackers_url": "",
        "current_network_interface": "tun0",
        "current_interface_address": "",
        "random_port": False,
        "upnp": False,
        "save_path": "/downloads/other",
        "temp_path": "/downloads/incomplete",
        "temp_path_enabled": True,
      }
      qbt_post("/api/v2/app/setPreferences", {"json": json.dumps(prefs)})
      log(
        "qBittorrent defaults enforced: "
        "seed_limits=disabled "
        f"active_downloads={QBITTORRENT_MAX_ACTIVE_DOWNLOADS} "
        f"active_uploads={QBITTORRENT_MAX_ACTIVE_UPLOADS} "
        f"active_torrents={QBITTORRENT_MAX_ACTIVE_TORRENTS} "
        "append_trackers_from_url=false "
        "interface=tun0 random_port=false upnp=false"
      )

    def tracker_is_allowed(url):
      normalized = str(url or "").strip().lower()
      if not normalized.startswith(("http://", "https://", "udp://")):
        return True
      return any(marker in normalized for marker in QBITTORRENT_ALLOWED_TRACKER_MARKERS)

    def prune_public_trackers():
      torrents = qbt_get("/api/v2/torrents/info?filter=all") or []
      touched_torrents = 0
      removed_trackers = 0

      for torrent in torrents:
        torrent_hash = torrent.get("hash")
        if not torrent_hash:
          continue
        try:
          trackers = qbt_get(f"/api/v2/torrents/trackers?hash={urllib.parse.quote(torrent_hash)}") or []
        except Exception as err:
          log(f"failed to read trackers for {torrent_hash}: {err}")
          continue

        remove_urls = sorted(
          {
            str(tracker.get("url", "")).strip()
            for tracker in trackers
            if str(tracker.get("url", "")).strip()
            and not tracker_is_allowed(tracker.get("url", ""))
          }
        )
        if not remove_urls:
          continue

        try:
          qbt_post(
            "/api/v2/torrents/removeTrackers",
            {
              "hash": torrent_hash,
              "urls": "|".join(remove_urls),
            },
          )
          touched_torrents += 1
          removed_trackers += len(remove_urls)
        except Exception as err:
          log(f"failed to remove public trackers for {torrent_hash}: {err}")

      log(
        "qBittorrent tracker policy enforced: "
        f"allowed_markers={','.join(QBITTORRENT_ALLOWED_TRACKER_MARKERS)} "
        f"touched_torrents={touched_torrents} removed_trackers={removed_trackers}"
      )

    def start_completed_torrents():
      torrents = qbt_get("/api/v2/torrents/info?filter=all") or []
      stopped_hashes = [
        torrent["hash"]
        for torrent in torrents
        if torrent.get("hash")
        and torrent.get("progress", 0) >= 1
        and str(torrent.get("state", "")).lower() in ("stoppedup", "pausedup")
      ]
      if not stopped_hashes:
        log("qBittorrent completed torrent policy enforced: started=0")
        return

      try:
        qbt_post("/api/v2/torrents/start", {"hashes": "|".join(stopped_hashes)})
      except Exception:
        qbt_post("/api/v2/torrents/resume", {"hashes": "|".join(stopped_hashes)})
      log(f"qBittorrent completed torrent policy enforced: started={len(stopped_hashes)}")

    def main():
      wait_for_qbittorrent()
      enforce_qbittorrent_defaults()
      prune_public_trackers()
      start_completed_torrents()

    if __name__ == "__main__":
      main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-policy
  namespace: media
spec:
  schedule: "*/5 * * * *"
  suspend: ${qbittorrent_policy_suspended:=false}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: policy
              image: python:3.12-alpine
              command:
                - python3
                - /scripts/sync.py
              env:
                - name: QBITTORRENT_URL
                  value: http://qbittorrent:8080
                - name: QBITTORRENT_MAX_ACTIVE_DOWNLOADS
                  value: "${qbittorrent_max_active_downloads:=30} "
                - name: QBITTORRENT_MAX_ACTIVE_UPLOADS
                  value: "${qbittorrent_max_active_uploads:=300} "
                - name: QBITTORRENT_MAX_ACTIVE_TORRENTS
                  value: "${qbittorrent_max_active_torrents:=500} "
                - name: QBITTORRENT_ALLOWED_TRACKER_MARKERS
                  value: "${qbittorrent_allowed_tracker_markers:=rocket-hd.cc,flood.st}"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: qbittorrent-policy
                defaultMode: 0555
