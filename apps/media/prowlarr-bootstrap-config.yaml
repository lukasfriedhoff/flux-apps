    rocket_hd_json="$(prowlarr_get /api/v1/indexer | jq -c 'map(select(.implementation == "Cardigann" and (((.fields // []) | map(select(.name == "definitionFile" and .value == "rockethd"))) | length > 0)))[0]')"
