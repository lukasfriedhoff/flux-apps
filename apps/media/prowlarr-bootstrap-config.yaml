apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-bootstrap-config
  namespace: media
data:
  bootstrap.sh: |-
    #!/bin/sh
    set -eu

    PROWLARR_URL="$${PROWLARR_URL:-http://prowlarr:9696}"
    PROWLARR_APP_URL="$${PROWLARR_APP_URL:-http://prowlarr:9696}"
    PROWLARR_DEFAULT_SEED_RATIO="$${PROWLARR_DEFAULT_SEED_RATIO:-}"
    SONARR_URL="$${SONARR_URL:-http://sonarr:8989}"
    RADARR_URL="$${RADARR_URL:-http://radarr:7878}"
    LIDARR_URL="$${LIDARR_URL:-http://lidarr:8686}"
    READARR_URL="$${READARR_URL:-http://readarr:8787}"
    MEDIA_PUID="$${MEDIA_PUID:-1000}"
    MEDIA_PGID="$${MEDIA_PGID:-1000}"
    ENABLE_DUAL_AUDIO_POLICY="$${ENABLE_DUAL_AUDIO_POLICY:-false}"
    ARR_QUALITY_PROFILE_NAME="$${ARR_QUALITY_PROFILE_NAME:-HD/4K - German+English}"

    log() {
      printf '[prowlarr-bootstrap] %s\n' "$*"
    }

    read_api_key() {
      file="$1"
      if [ ! -f "$file" ]; then
        return 1
      fi
      sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' "$file" | head -n1
    }

    read_secret_file() {
      file="$1"
      if [ ! -f "$file" ]; then
        return 1
      fi
      tr -d '\r\n' < "$file"
    }

    read_tracker_secret() {
      key="$1"
      read_secret_file "/run/secrets/prowlarr-private-trackers/$key" || true
    }

    PROWLARR_API_KEY="$${PROWLARR_API_KEY:-$$(read_api_key /mnt/prowlarr/config.xml || true)}"
    SONARR_API_KEY="$${SONARR_API_KEY:-$$(read_api_key /mnt/sonarr/config.xml || true)}"
    RADARR_API_KEY="$${RADARR_API_KEY:-$$(read_api_key /mnt/radarr/config.xml || true)}"
    LIDARR_API_KEY="$${LIDARR_API_KEY:-$$(read_api_key /mnt/lidarr/config.xml || true)}"
    READARR_API_KEY="$${READARR_API_KEY:-$$(read_api_key /mnt/readarr/config.xml || true)}"
    TORRENTSYNDIKAT_API_KEY="$${TORRENTSYNDIKAT_API_KEY:-$$(read_tracker_secret torrentsyndikat_api_key)}"
    FLOOD_API_KEY="$${FLOOD_API_KEY:-$$(read_tracker_secret flood_api_key)}"

    if [ -z "$PROWLARR_API_KEY" ]; then
      log "Prowlarr API key missing; skipping."
      exit 0
    fi

    discover_prowlarr_url() {
      # Different container images on this cluster resolve short names/FQDNs differently.
      # Probe both variants and keep retrying until Prowlarr becomes reachable.
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$PROWLARR_URL" "http://prowlarr:9696" "http://prowlarr.media.svc.cluster.local:9696"; do
          if curl -sS -m 5 -H "X-Api-Key: $PROWLARR_API_KEY" "$candidate/api/v1/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    PROWLARR_URL="$(discover_prowlarr_url || true)"
    if [ -z "$PROWLARR_URL" ]; then
      log "Unable to reach Prowlarr API; deferring bootstrap to next run."
      exit 0
    fi

    prowlarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_URL$path"
    }

    prowlarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $PROWLARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$PROWLARR_URL$path"
    }

    prowlarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $PROWLARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$PROWLARR_URL$path"
    }

    prowlarr_delete() {
      path="$1"
      curl -fsS -m 30 -X DELETE \
        -H "X-Api-Key: $PROWLARR_API_KEY" \
        "$PROWLARR_URL$path"
    }

    APP_PROFILE_ID="$(
      prowlarr_get /api/v1/appprofile 2>/dev/null \
      | jq -r 'map(select(.name == "Standard"))[0].id // .[0].id // empty' 2>/dev/null \
      || true
    )"
    case "$APP_PROFILE_ID" in
      ''|*[!0-9]*)
        APP_PROFILE_ID=1
        ;;
    esac

    ensure_app() {
      impl="$1"
      name="$2"
      base_url="$3"
      app_key="$4"

      if [ -z "$app_key" ]; then
        log "Skipping app $name ($impl): API key missing."
        return 0
      fi

      apps_json="$(prowlarr_get /api/v1/applications)"
      app_json="$(printf '%s' "$apps_json" | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"

      if [ "$app_json" = "null" ]; then
        app_json="$(prowlarr_get /api/v1/applications/schema | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"
        if [ "$app_json" = "null" ]; then
          log "No schema found for app implementation $impl; skipping."
          return 0
        fi
        app_json="$(printf '%s' "$app_json" | jq -c \
          --arg name "$name" \
          --arg prowlarrUrl "$PROWLARR_APP_URL" \
          --arg baseUrl "$base_url" \
          --arg apiKey "$app_key" '
            .name = $name
            | .enable = true
            | .syncLevel = "fullSync"
            | (.fields[]? | select(.name == "prowlarrUrl")).value = $prowlarrUrl
            | (.fields[]? | select(.name == "baseUrl")).value = $baseUrl
            | (.fields[]? | select(.name == "apiKey")).value = $apiKey
          ')"
        if prowlarr_post /api/v1/applications "$app_json" >/dev/null; then
          log "Created app $name ($impl)."
        else
          log "Failed to create app $name ($impl)."
        fi
      else
        app_id="$(printf '%s' "$app_json" | jq -r '.id')"
        app_json="$(printf '%s' "$app_json" | jq -c \
          --arg name "$name" \
          --arg prowlarrUrl "$PROWLARR_APP_URL" \
          --arg baseUrl "$base_url" \
          --arg apiKey "$app_key" '
            .name = $name
            | .enable = true
            | .syncLevel = "fullSync"
            | (.fields[]? | select(.name == "prowlarrUrl")).value = $prowlarrUrl
            | (.fields[]? | select(.name == "baseUrl")).value = $baseUrl
            | (.fields[]? | select(.name == "apiKey")).value = $apiKey
          ')"
        if prowlarr_put "/api/v1/applications/$app_id" "$app_json" >/dev/null; then
          log "Updated app $name ($impl)."
        else
          log "Failed to update app $name ($impl)."
        fi
      fi
    }

    ensure_indexer() {
      impl="$1"
      name="$2"
      enabled="$3"
      api_key="$4"

      idx_json="$(prowlarr_get /api/v1/indexer | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(prowlarr_get /api/v1/indexer/schema | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for indexer implementation $impl; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c --arg name "$name" --arg enabled "$enabled" --arg appProfileId "$APP_PROFILE_ID" '
          .name = $name
          | .enable = ($enabled == "true")
          | .appProfileId = ($appProfileId | tonumber)
        ')"
        if [ -n "$api_key" ]; then
          idx_json="$(printf '%s' "$idx_json" | jq -c --arg apiKey "$api_key" '(.fields[]? | select(.name == "apiKey")).value = $apiKey')"
        fi
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created indexer $name ($impl)."
        else
          log "Failed to create indexer $name ($impl)."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        idx_json="$(printf '%s' "$idx_json" | jq -c --arg name "$name" --arg enabled "$enabled" --arg appProfileId "$APP_PROFILE_ID" '
          .name = $name
          | .enable = ($enabled == "true")
          | .appProfileId = ($appProfileId | tonumber)
        ')"
        if [ -n "$api_key" ]; then
          idx_json="$(printf '%s' "$idx_json" | jq -c --arg apiKey "$api_key" '(.fields[]? | select(.name == "apiKey")).value = $apiKey')"
        fi
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated indexer $name ($impl)."
        else
          log "Failed to update indexer $name ($impl)."
        fi
      fi
    }

    apply_indexer_fields() {
      idx_json="$1"
      field_values_json="$2"

      printf '%s' "$idx_json" | jq -c --argjson fieldValues "$field_values_json" '
        .fields = ((.fields // []) | map(
          if ($fieldValues[.name] // null) != null then
            .value = $fieldValues[.name]
          else
            .
          end
        ))
      '
    }

    ensure_indexer_with_fields() {
      impl="$1"
      name="$2"
      enabled="$3"
      field_values_json="$4"

      idx_json="$(prowlarr_get /api/v1/indexer | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(prowlarr_get /api/v1/indexer/schema | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for indexer implementation $impl; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c --arg name "$name" --arg enabled "$enabled" --arg appProfileId "$APP_PROFILE_ID" '
          .name = $name
          | .enable = ($enabled == "true")
          | .appProfileId = ($appProfileId | tonumber)
        ')"
        idx_json="$(apply_indexer_fields "$idx_json" "$field_values_json")"
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created indexer $name ($impl)."
        else
          log "Failed to create indexer $name ($impl)."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        current_idx_json="$(printf '%s' "$idx_json" | jq -c '.')"
        idx_json="$(printf '%s' "$idx_json" | jq -c --arg name "$name" --arg enabled "$enabled" --arg appProfileId "$APP_PROFILE_ID" '
          .name = $name
          | .enable = ($enabled == "true")
          | .appProfileId = ($appProfileId | tonumber)
        ')"
        idx_json="$(apply_indexer_fields "$idx_json" "$field_values_json")"
        if [ "$current_idx_json" = "$idx_json" ]; then
          log "Indexer $name ($impl) already current."
          return 0
        fi
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated indexer $name ($impl)."
        else
          log "Failed to update indexer $name ($impl)."
        fi
      fi
    }

    ensure_cardigann_indexer_with_fields() {
      schema_name="$1"
      name="$2"
      enabled="$3"
      field_values_json="$4"

      idx_json="$(
        prowlarr_get /api/v1/indexer \
          | jq -c --arg name "$name" --arg schemaName "$schema_name" 'map(select(.implementation == "Cardigann" and (.name == $name or (((.fields // []) | map(select(.name == "definitionFile" and .value == $schemaName))) | length > 0))))[0]'
      )"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(
          prowlarr_get /api/v1/indexer/schema \
            | jq -c --arg schemaName "$schema_name" 'map(select(.implementation == "Cardigann" and .name == $schemaName))[0]'
        )"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for Cardigann indexer $schema_name; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
          ')"
        idx_json="$(apply_indexer_fields "$idx_json" "$field_values_json")"
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created Cardigann indexer $name."
        else
          log "Failed to create Cardigann indexer $name."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        current_idx_json="$(printf '%s' "$idx_json" | jq -c '.')"
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
          ')"
        idx_json="$(apply_indexer_fields "$idx_json" "$field_values_json")"
        if [ "$current_idx_json" = "$idx_json" ]; then
          log "Cardigann indexer $name already current."
          return 0
        fi
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated Cardigann indexer $name."
        else
          log "Failed to update Cardigann indexer $name."
        fi
      fi
    }

    ensure_private_api_indexer() {
      impl="$1"
      name="$2"
      secret_key="$3"
      field_name="$4"
      api_key="$(read_tracker_secret "$secret_key")"

      if [ -n "$api_key" ]; then
        field_values_json="$(jq -cn --arg field "$field_name" --arg value "$api_key" '{($field): $value}')"
        ensure_indexer_with_fields "$impl" "$name" true "$field_values_json" || return 1
      else
        ensure_indexer_with_fields "$impl" "$name" false '{}' || return 1
      fi
    }

    ensure_private_cardigann_api_indexer() {
      schema_name="$1"
      name="$2"
      secret_key="$3"
      field_name="$4"
      api_key="$(read_tracker_secret "$secret_key")"

      if [ -n "$api_key" ]; then
        field_values_json="$(jq -cn --arg field "$field_name" --arg value "$api_key" '{($field): $value}')"
        ensure_cardigann_indexer_with_fields "$schema_name" "$name" true "$field_values_json" || return 1
      else
        ensure_cardigann_indexer_with_fields "$schema_name" "$name" false '{}' || return 1
      fi
    }

    ensure_private_cardigann_login_indexer() {
      schema_name="$1"
      name="$2"
      username_key="$3"
      password_key="$4"
      username="$(read_tracker_secret "$username_key")"
      password="$(read_tracker_secret "$password_key")"

      if [ -n "$username" ] && [ -n "$password" ]; then
        field_values_json="$(jq -cn --arg username "$username" --arg password "$password" '{username: $username, password: $password}')"
        ensure_cardigann_indexer_with_fields "$schema_name" "$name" true "$field_values_json" || return 1
      else
        ensure_cardigann_indexer_with_fields "$schema_name" "$name" false '{}' || return 1
      fi
    }

    ensure_private_world_of_tomorrow_indexer() {
      username="$(read_tracker_secret world_of_tomorrow_username)"
      password="$(read_tracker_secret world_of_tomorrow_password)"
      pin="$(read_tracker_secret world_of_tomorrow_pin)"

      if [ -n "$username" ] && [ -n "$password" ]; then
        field_values_json="$(jq -cn --arg username "$username" --arg password "$password" --arg pin "$pin" '{username: $username, password: $password} + (if $pin == "" then {} else {pin: $pin} end)')"
        ensure_cardigann_indexer_with_fields "World-of-Tomorrow" "World-of-Tomorrow" true "$field_values_json" || return 1
      else
        ensure_cardigann_indexer_with_fields "World-of-Tomorrow" "World-of-Tomorrow" false '{}' || return 1
      fi
    }

    ensure_private_torrentleech_indexer() {
      username="$(read_tracker_secret torrentleech_username)"
      password="$(read_tracker_secret torrentleech_password)"
      alt_2fa_token="$(read_tracker_secret torrentleech_alt_2fa_token)"

      if [ -n "$username" ] && [ -n "$password" ]; then
        field_values_json="$(jq -cn --arg username "$username" --arg password "$password" --arg alt2fa "$alt_2fa_token" '{username: $username, password: $password} + (if $alt2fa == "" then {} else {alt2fatoken: $alt2fa} end)')"
        ensure_cardigann_indexer_with_fields "TorrentLeech" "TorrentLeech" true "$field_values_json" || return 1
      else
        ensure_cardigann_indexer_with_fields "TorrentLeech" "TorrentLeech" false '{}' || return 1
      fi
    }

    ensure_private_iptorrents_indexer() {
      cookie="$(read_tracker_secret iptorrents_cookie)"
      user_agent="$(read_tracker_secret iptorrents_user_agent)"

      if [ -n "$cookie" ]; then
        field_values_json="$(jq -cn --arg cookie "$cookie" --arg userAgent "$user_agent" '{cookie: $cookie} + (if $userAgent == "" then {} else {userAgent: $userAgent} end)')"
        ensure_indexer_with_fields "IPTorrents" "IPTorrents" true "$field_values_json" || return 1
      else
        ensure_indexer_with_fields "IPTorrents" "IPTorrents" false '{}' || return 1
      fi
    }

    ensure_private_filelist_indexer() {
      username="$(read_tracker_secret filelist_username)"
      passkey="$(read_tracker_secret filelist_passkey)"

      if [ -n "$username" ] && [ -n "$passkey" ]; then
        field_values_json="$(jq -cn --arg username "$username" --arg passkey "$passkey" '{username: $username, passkey: $passkey}')"
        ensure_indexer_with_fields "FileList" "FileList.io" true "$field_values_json" || return 1
      else
        ensure_indexer_with_fields "FileList" "FileList.io" false '{}' || return 1
      fi
    }

    ensure_private_beyondhd_indexer() {
      api_key="$(read_tracker_secret beyondhd_api_key)"
      rss_key="$(read_tracker_secret beyondhd_rss_key)"

      if [ -n "$api_key" ] && [ -n "$rss_key" ]; then
        field_values_json="$(jq -cn --arg apiKey "$api_key" --arg rssKey "$rss_key" '{apiKey: $apiKey, rssKey: $rssKey}')"
        ensure_indexer_with_fields "BeyondHD" "BeyondHD" true "$field_values_json" || return 1
      else
        ensure_indexer_with_fields "BeyondHD" "BeyondHD" false '{}' || return 1
      fi
    }

    ensure_private_passthepopcorn_indexer() {
      api_user="$(read_tracker_secret passthepopcorn_api_user)"
      api_key="$(read_tracker_secret passthepopcorn_api_key)"

      if [ -n "$api_user" ] && [ -n "$api_key" ]; then
        field_values_json="$(jq -cn --arg apiUser "$api_user" --arg apiKey "$api_key" '{aPIUser: $apiUser, aPIKey: $apiKey}')"
        ensure_indexer_with_fields "PassThePopcorn" "PassThePopcorn" true "$field_values_json" || return 1
      else
        ensure_indexer_with_fields "PassThePopcorn" "PassThePopcorn" false '{}' || return 1
      fi
    }

    ensure_flood_indexer() {
      name="$1"
      enabled="$2"
      api_key="$3"

      idx_json="$(
        prowlarr_get /api/v1/indexer \
          | jq -c 'map(select(.implementation == "Cardigann" and ((.fields // []) | map(select(.name == "definitionFile" and ((.value // "") | test("(?i)^flood$")))) | length > 0)))[0]'
      )"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(prowlarr_get /api/v1/indexer/schema | jq -c 'map(select(.implementation == "Cardigann" and (((.name // "") | test("(?i)^flood$")) or ((.implementationName // "") | test("(?i)^flood$")))))[0]')"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for Flood Cardigann indexer; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" \
          --arg apiKey "$api_key" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
            | (.fields[]? | select(.name == "baseUrl")).value = "https://flood.st/"
            | (.fields[]? | select(.name == "apikey")).value = $apiKey
          ')"
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created Flood indexer $name."
        else
          log "Failed to create Flood indexer $name."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" \
          --arg apiKey "$api_key" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
            | (.fields[]? | select(.name == "baseUrl")).value = "https://flood.st/"
            | (.fields[]? | select(.name == "apikey")).value = $apiKey
          ')"
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated Flood indexer $name."
        else
          log "Failed to update Flood indexer $name."
        fi
      fi
    }

    ensure_cardigann_indexer() {
      schema_name="$1"
      name="$2"
      enabled="$3"

      idx_json="$(
        prowlarr_get /api/v1/indexer \
          | jq -c --arg name "$name" 'map(select(.implementation == "Cardigann" and .name == $name))[0]'
      )"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(
          prowlarr_get /api/v1/indexer/schema \
            | jq -c --arg schemaName "$schema_name" 'map(select(.implementation == "Cardigann" and .name == $schemaName))[0]'
        )"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for Cardigann indexer $schema_name; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
          ')"
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created Cardigann indexer $name."
        else
          log "Failed to create Cardigann indexer $name."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
          ')"
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated Cardigann indexer $name."
        else
          log "Failed to update Cardigann indexer $name."
        fi
      fi
    }

    prune_indexer() {
      impl="$1"
      name="$2"

      prowlarr_get /api/v1/indexer \
        | jq -r --arg impl "$impl" --arg name "$name" '
            .[]?
            | select(.implementation == $impl and .name == $name)
            | .id
          ' \
        | while IFS= read -r idx_id; do
            [ -n "$idx_id" ] || continue
            if prowlarr_delete "/api/v1/indexer/$idx_id" >/dev/null; then
              log "Deleted public indexer $name ($impl)."
            else
              log "Failed to delete public indexer $name ($impl); will retry."
            fi
          done
    }

    prune_cardigann_indexer() {
      schema_name="$1"
      name="$2"

      prowlarr_get /api/v1/indexer \
        | jq -r --arg schemaName "$schema_name" --arg name "$name" '
            .[]?
            | select(
                .implementation == "Cardigann"
                and (
                  .name == $name
                  or (((.fields // []) | map(select(.name == "definitionFile" and .value == $schemaName))) | length > 0)
                )
              )
            | .id
          ' \
        | while IFS= read -r idx_id; do
            [ -n "$idx_id" ] || continue
            if prowlarr_delete "/api/v1/indexer/$idx_id" >/dev/null; then
              log "Deleted public Cardigann indexer $name."
            else
              log "Failed to delete public Cardigann indexer $name; will retry."
            fi
          done
    }

