apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-bootstrap-config
  namespace: media
data:
  bootstrap.sh: |-
    #!/bin/sh
    set -eu

    PROWLARR_URL="$${PROWLARR_URL:-http://prowlarr:9696}"
    PROWLARR_APP_URL="$${PROWLARR_APP_URL:-http://prowlarr:9696}"
    SONARR_URL="$${SONARR_URL:-http://sonarr:8989}"
    RADARR_URL="$${RADARR_URL:-http://radarr:7878}"
    LIDARR_URL="$${LIDARR_URL:-http://lidarr:8686}"
    READARR_URL="$${READARR_URL:-http://readarr:8787}"
    MEDIA_PUID="$${MEDIA_PUID:-1000}"
    MEDIA_PGID="$${MEDIA_PGID:-1000}"
    ENABLE_DUAL_AUDIO_POLICY="$${ENABLE_DUAL_AUDIO_POLICY:-false}"

    log() {
      printf '[prowlarr-bootstrap] %s\n' "$*"
    }

    read_api_key() {
      file="$1"
      if [ ! -f "$file" ]; then
        return 1
      fi
      sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' "$file" | head -n1
    }

    read_secret_file() {
      file="$1"
      if [ ! -f "$file" ]; then
        return 1
      fi
      tr -d '\r\n' < "$file"
    }

    PROWLARR_API_KEY="$${PROWLARR_API_KEY:-$$(read_api_key /mnt/prowlarr/config.xml || true)}"
    SONARR_API_KEY="$${SONARR_API_KEY:-$$(read_api_key /mnt/sonarr/config.xml || true)}"
    RADARR_API_KEY="$${RADARR_API_KEY:-$$(read_api_key /mnt/radarr/config.xml || true)}"
    LIDARR_API_KEY="$${LIDARR_API_KEY:-$$(read_api_key /mnt/lidarr/config.xml || true)}"
    READARR_API_KEY="$${READARR_API_KEY:-$$(read_api_key /mnt/readarr/config.xml || true)}"
    TORRENTSYNDIKAT_API_KEY="$${TORRENTSYNDIKAT_API_KEY:-$$(read_secret_file /run/secrets/prowlarr-private-trackers/torrentsyndikat_api_key || true)}"
    FLOOD_API_KEY="$${FLOOD_API_KEY:-$$(read_secret_file /run/secrets/prowlarr-private-trackers/flood_api_key || true)}"

    if [ -z "$PROWLARR_API_KEY" ]; then
      log "Prowlarr API key missing; skipping."
      exit 0
    fi

    discover_prowlarr_url() {
      # Different container images on this cluster resolve short names/FQDNs differently.
      # Probe both variants and keep retrying until Prowlarr becomes reachable.
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$PROWLARR_URL" "http://prowlarr:9696" "http://prowlarr.media.svc.cluster.local:9696"; do
          if curl -sS -m 5 -H "X-Api-Key: $PROWLARR_API_KEY" "$candidate/api/v1/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    PROWLARR_URL="$(discover_prowlarr_url || true)"
    if [ -z "$PROWLARR_URL" ]; then
      log "Unable to reach Prowlarr API; deferring bootstrap to next run."
      exit 0
    fi

    prowlarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_URL$path"
    }

    prowlarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $PROWLARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$PROWLARR_URL$path"
    }

    prowlarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $PROWLARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$PROWLARR_URL$path"
    }

    APP_PROFILE_ID="$(
      prowlarr_get /api/v1/appprofile 2>/dev/null \
      | jq -r 'map(select(.name == "Standard"))[0].id // .[0].id // empty' 2>/dev/null \
      || true
    )"
    case "$APP_PROFILE_ID" in
      ''|*[!0-9]*)
        APP_PROFILE_ID=1
        ;;
    esac

    ensure_app() {
      impl="$1"
      name="$2"
      base_url="$3"
      app_key="$4"

      if [ -z "$app_key" ]; then
        log "Skipping app $name ($impl): API key missing."
        return 0
      fi

      apps_json="$(prowlarr_get /api/v1/applications)"
      app_json="$(printf '%s' "$apps_json" | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"

      if [ "$app_json" = "null" ]; then
        app_json="$(prowlarr_get /api/v1/applications/schema | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"
        if [ "$app_json" = "null" ]; then
          log "No schema found for app implementation $impl; skipping."
          return 0
        fi
        app_json="$(printf '%s' "$app_json" | jq -c \
          --arg name "$name" \
          --arg prowlarrUrl "$PROWLARR_APP_URL" \
          --arg baseUrl "$base_url" \
          --arg apiKey "$app_key" '
            .name = $name
            | .enable = true
            | .syncLevel = "fullSync"
            | (.fields[]? | select(.name == "prowlarrUrl")).value = $prowlarrUrl
            | (.fields[]? | select(.name == "baseUrl")).value = $baseUrl
            | (.fields[]? | select(.name == "apiKey")).value = $apiKey
          ')"
        if prowlarr_post /api/v1/applications "$app_json" >/dev/null; then
          log "Created app $name ($impl)."
        else
          log "Failed to create app $name ($impl)."
        fi
      else
        app_id="$(printf '%s' "$app_json" | jq -r '.id')"
        app_json="$(printf '%s' "$app_json" | jq -c \
          --arg name "$name" \
          --arg prowlarrUrl "$PROWLARR_APP_URL" \
          --arg baseUrl "$base_url" \
          --arg apiKey "$app_key" '
            .name = $name
            | .enable = true
            | .syncLevel = "fullSync"
            | (.fields[]? | select(.name == "prowlarrUrl")).value = $prowlarrUrl
            | (.fields[]? | select(.name == "baseUrl")).value = $baseUrl
            | (.fields[]? | select(.name == "apiKey")).value = $apiKey
          ')"
        if prowlarr_put "/api/v1/applications/$app_id" "$app_json" >/dev/null; then
          log "Updated app $name ($impl)."
        else
          log "Failed to update app $name ($impl)."
        fi
      fi
    }

    ensure_indexer() {
      impl="$1"
      name="$2"
      enabled="$3"
      api_key="$4"

      idx_json="$(prowlarr_get /api/v1/indexer | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(prowlarr_get /api/v1/indexer/schema | jq -c --arg impl "$impl" 'map(select(.implementation == $impl))[0]')"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for indexer implementation $impl; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c --arg name "$name" --arg enabled "$enabled" --arg appProfileId "$APP_PROFILE_ID" '
          .name = $name
          | .enable = ($enabled == "true")
          | .appProfileId = ($appProfileId | tonumber)
        ')"
        if [ -n "$api_key" ]; then
          idx_json="$(printf '%s' "$idx_json" | jq -c --arg apiKey "$api_key" '(.fields[]? | select(.name == "apiKey")).value = $apiKey')"
        fi
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created indexer $name ($impl)."
        else
          log "Failed to create indexer $name ($impl)."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        idx_json="$(printf '%s' "$idx_json" | jq -c --arg name "$name" --arg enabled "$enabled" --arg appProfileId "$APP_PROFILE_ID" '
          .name = $name
          | .enable = ($enabled == "true")
          | .appProfileId = ($appProfileId | tonumber)
        ')"
        if [ -n "$api_key" ]; then
          idx_json="$(printf '%s' "$idx_json" | jq -c --arg apiKey "$api_key" '(.fields[]? | select(.name == "apiKey")).value = $apiKey')"
        fi
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated indexer $name ($impl)."
        else
          log "Failed to update indexer $name ($impl)."
        fi
      fi
    }

    ensure_flood_indexer() {
      name="$1"
      enabled="$2"
      api_key="$3"

      idx_json="$(
        prowlarr_get /api/v1/indexer \
          | jq -c 'map(select(.implementation == "Cardigann" and ((.fields // []) | map(select(.name == "definitionFile" and ((.value // "") | test("(?i)^flood$")))) | length > 0)))[0]'
      )"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(prowlarr_get /api/v1/indexer/schema | jq -c 'map(select(.implementation == "Cardigann" and (((.name // "") | test("(?i)^flood$")) or ((.implementationName // "") | test("(?i)^flood$")))))[0]')"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for Flood Cardigann indexer; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" \
          --arg apiKey "$api_key" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
            | (.fields[]? | select(.name == "baseUrl")).value = "https://flood.st/"
            | (.fields[]? | select(.name == "apikey")).value = $apiKey
          ')"
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created Flood indexer $name."
        else
          log "Failed to create Flood indexer $name."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" \
          --arg apiKey "$api_key" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
            | (.fields[]? | select(.name == "baseUrl")).value = "https://flood.st/"
            | (.fields[]? | select(.name == "apikey")).value = $apiKey
          ')"
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated Flood indexer $name."
        else
          log "Failed to update Flood indexer $name."
        fi
      fi
    }

    ensure_cardigann_indexer() {
      schema_name="$1"
      name="$2"
      enabled="$3"

      idx_json="$(
        prowlarr_get /api/v1/indexer \
          | jq -c --arg name "$name" 'map(select(.implementation == "Cardigann" and .name == $name))[0]'
      )"

      if [ "$idx_json" = "null" ]; then
        idx_json="$(
          prowlarr_get /api/v1/indexer/schema \
            | jq -c --arg schemaName "$schema_name" 'map(select(.implementation == "Cardigann" and .name == $schemaName))[0]'
        )"
        if [ "$idx_json" = "null" ]; then
          log "No schema found for Cardigann indexer $schema_name; skipping."
          return 0
        fi
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
          ')"
        if prowlarr_post /api/v1/indexer "$idx_json" >/dev/null; then
          log "Created Cardigann indexer $name."
        else
          log "Failed to create Cardigann indexer $name."
        fi
      else
        idx_id="$(printf '%s' "$idx_json" | jq -r '.id')"
        idx_json="$(printf '%s' "$idx_json" | jq -c \
          --arg name "$name" \
          --arg enabled "$enabled" \
          --arg appProfileId "$APP_PROFILE_ID" '
            .name = $name
            | .enable = ($enabled == "true")
            | .appProfileId = ($appProfileId | tonumber)
          ')"
        if prowlarr_put "/api/v1/indexer/$idx_id" "$idx_json" >/dev/null; then
          log "Updated Cardigann indexer $name."
        else
          log "Failed to update Cardigann indexer $name."
        fi
      fi
    }

    ensure_app "Sonarr" "sonarr" "http://sonarr:8989" "$SONARR_API_KEY" || log "Failed to sync Sonarr app; will retry."
    ensure_app "Radarr" "radarr" "http://radarr:7878" "$RADARR_API_KEY" || log "Failed to sync Radarr app; will retry."
    ensure_app "Lidarr" "lidarr" "http://lidarr:8686" "$LIDARR_API_KEY" || log "Failed to sync Lidarr app; will retry."
    ensure_app "Readarr" "readarr" "http://readarr:8787" "$READARR_API_KEY" || log "Failed to sync Readarr app; will retry."

    # Public indexers.
    ensure_indexer "Knaben" "Knaben" true "" || log "Failed to sync Knaben indexer; will retry."
    ensure_indexer "TorrentsCSV" "TorrentsCSV" true "" || log "Failed to sync TorrentsCSV indexer; will retry."
    ensure_cardigann_indexer "1337x" "1337x" true || log "Failed to sync 1337x indexer; will retry."
    ensure_cardigann_indexer "LimeTorrents" "LimeTorrents" true || log "Failed to sync LimeTorrents indexer; will retry."
    ensure_cardigann_indexer "TorrentDownload" "TorrentDownload" true || log "Failed to sync TorrentDownload indexer; will retry."
    ensure_cardigann_indexer "TorrentGalaxyClone" "TorrentGalaxy" true || log "Failed to sync TorrentGalaxy indexer; will retry."
    ensure_cardigann_indexer "kickasstorrents.to" "KickassTorrents" true || log "Failed to sync KickassTorrents indexer; will retry."
    # SubsPlease is TV/anime-only and causes repeated Radarr category mapping errors.
    ensure_indexer "SubsPlease" "SubsPlease" false "" || log "Failed to sync SubsPlease indexer; will retry."
    ensure_cardigann_indexer "The Pirate Bay" "The Pirate Bay" true || log "Failed to sync The Pirate Bay indexer; will retry."
    ensure_cardigann_indexer "YTS" "YTS" true || log "Failed to sync YTS indexer; will retry."
    ensure_cardigann_indexer "Nyaa.si" "Nyaa.si" true || log "Failed to sync Nyaa.si indexer; will retry."
    ensure_cardigann_indexer "Internet Archive" "Internet Archive" true || log "Failed to sync Internet Archive indexer; will retry."

    # Private tracker (optional).
    if [ -n "$${TORRENTSYNDIKAT_API_KEY:-}" ]; then
      ensure_indexer "TorrentSyndikat" "TorrentSyndikat" true "$TORRENTSYNDIKAT_API_KEY" || log "Failed to sync TorrentSyndikat indexer; will retry."
    else
      ensure_indexer "TorrentSyndikat" "TorrentSyndikat" false "" || log "Failed to disable TorrentSyndikat indexer; will retry."
    fi

    if [ -n "$${FLOOD_API_KEY:-}" ]; then
      ensure_flood_indexer "Flood.st" true "$FLOOD_API_KEY" || log "Failed to sync Flood.st indexer; will retry."
    else
      ensure_flood_indexer "Flood.st" false "" || log "Failed to disable Flood.st indexer; will retry."
    fi

    # Push current indexer set into downstream Arr apps.
    prowlarr_post /api/v1/command '{"name":"ApplicationIndexerSync"}' >/dev/null || log "ApplicationIndexerSync command failed; will retry."

    discover_lidarr_url() {
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$LIDARR_URL" "http://lidarr:8686" "http://lidarr.media.svc.cluster.local:8686"; do
          if curl -fsS -m 5 -H "X-Api-Key: $LIDARR_API_KEY" "$candidate/api/v1/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    lidarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $LIDARR_API_KEY" "$LIDARR_URL$path"
    }

    lidarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $LIDARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$LIDARR_URL$path"
    }

    lidarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $LIDARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$LIDARR_URL$path"
    }

    ensure_media_library_path() {
      subpath="$1"
      path="/mnt/arr-media/$subpath"

      if [ ! -d /mnt/arr-media ]; then
        log "arr-media PVC mount missing in bootstrap pod; skipping media path preparation."
        return 0
      fi

      mkdir -p "$path"
      chmod 0775 "$path" || true
      chown "$MEDIA_PUID:$MEDIA_PGID" "$path" || true
    }

    ensure_media_library_layout() {
      ensure_media_library_path music
      ensure_media_library_path tv
      ensure_media_library_path movies
      ensure_media_library_path books
    }

    ensure_lidarr_rootfolder() {
      root_json="$(lidarr_get /api/v1/rootfolder | jq -c 'map(select(.path == "/media/music"))[0]')"
      if [ "$root_json" = "null" ]; then
        if lidarr_post /api/v1/rootfolder '{"path":"/media/music"}' >/dev/null; then
          log "Created Lidarr root folder /media/music."
        else
          log "Failed to create Lidarr root folder /media/music."
          return 1
        fi
      else
        log "Lidarr root folder /media/music already present."
      fi
    }

    ensure_lidarr_qbittorrent() {
      dl_json="$(lidarr_get /api/v1/downloadclient | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
      if [ "$dl_json" = "null" ]; then
        dl_json="$(lidarr_get /api/v1/downloadclient/schema | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
        if [ "$dl_json" = "null" ]; then
          log "Lidarr qBittorrent schema missing; skipping download client bootstrap."
          return 0
        fi
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "musicCategory")).value = "lidarr"
          | (.fields[]? | select(.name == "musicImportedCategory")).value = "lidarr-imported"
        ')"
        lidarr_post /api/v1/downloadclient "$dl_json" >/dev/null
        log "Created Lidarr download client qBittorrent."
      else
        dl_id="$(printf '%s' "$dl_json" | jq -r '.id')"
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "musicCategory")).value = "lidarr"
          | (.fields[]? | select(.name == "musicImportedCategory")).value = "lidarr-imported"
        ')"
        lidarr_put "/api/v1/downloadclient/$dl_id" "$dl_json" >/dev/null
        log "Updated Lidarr download client qBittorrent."
      fi
    }

    ensure_media_library_layout

    if [ -n "$LIDARR_API_KEY" ]; then
      LIDARR_URL="$(discover_lidarr_url || true)"
      if [ -z "$LIDARR_URL" ]; then
        log "Unable to reach Lidarr API; deferring Lidarr bootstrap."
      else
        ensure_lidarr_rootfolder || log "Failed to ensure Lidarr root folder; will retry."
        ensure_lidarr_qbittorrent || log "Failed to ensure Lidarr qBittorrent client; will retry."
      fi
    else
      log "Lidarr API key missing; skipping Lidarr bootstrap."
    fi

    discover_sonarr_url() {
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$SONARR_URL" "http://sonarr:8989" "http://sonarr.media.svc.cluster.local:8989"; do
          if curl -fsS -m 5 -H "X-Api-Key: $SONARR_API_KEY" "$candidate/api/v3/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    sonarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $SONARR_API_KEY" "$SONARR_URL$path"
    }

    sonarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $SONARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$SONARR_URL$path"
    }

    sonarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $SONARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$SONARR_URL$path"
    }

    ensure_sonarr_rootfolder() {
      root_json="$(sonarr_get /api/v3/rootfolder | jq -c 'map(select(.path == "/media/tv"))[0]')"
      if [ "$root_json" = "null" ]; then
        if sonarr_post /api/v3/rootfolder '{"path":"/media/tv"}' >/dev/null; then
          log "Created Sonarr root folder /media/tv."
        else
          log "Failed to create Sonarr root folder /media/tv."
          return 1
        fi
      else
        log "Sonarr root folder /media/tv already present."
      fi
    }

    ensure_sonarr_qbittorrent() {
      dl_json="$(sonarr_get /api/v3/downloadclient | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
      if [ "$dl_json" = "null" ]; then
        dl_json="$(sonarr_get /api/v3/downloadclient/schema | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
        if [ "$dl_json" = "null" ]; then
          log "Sonarr qBittorrent schema missing; skipping download client bootstrap."
          return 0
        fi
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "tvCategory")).value = "sonarr"
          | (.fields[]? | select(.name == "tvImportedCategory")).value = "sonarr-imported"
        ')"
        sonarr_post /api/v3/downloadclient "$dl_json" >/dev/null
        log "Created Sonarr download client qBittorrent."
      else
        dl_id="$(printf '%s' "$dl_json" | jq -r '.id')"
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "tvCategory")).value = "sonarr"
          | (.fields[]? | select(.name == "tvImportedCategory")).value = "sonarr-imported"
        ')"
        sonarr_put "/api/v3/downloadclient/$dl_id" "$dl_json" >/dev/null
        log "Updated Sonarr download client qBittorrent."
      fi
    }

    ensure_sonarr_dual_audio_policy() {
      dual_cf_name="German + English Dual Audio"

      lang_schema="$(sonarr_get /api/v3/customformat/schema | jq -c 'map(select(.implementation == "LanguageSpecification"))[0]')"
      title_schema="$(sonarr_get /api/v3/customformat/schema | jq -c 'map(select(.implementation == "ReleaseTitleSpecification"))[0]')"
      if [ "$lang_schema" = "null" ] || [ "$title_schema" = "null" ]; then
        log "Sonarr custom format schema missing; skipping dual-audio policy."
        return 0
      fi

      cf_payload="$(jq -n -c \
        --arg name "$dual_cf_name" \
        --arg lang "$lang_schema" \
        --arg title "$title_schema" '
          {
            name: $name,
            includeCustomFormatWhenRenaming: false,
            specifications: [
              (($lang | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "Language German"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = 4
                | (.fields[]? | select(.name == "exceptLanguage")).value = false
              ),
              (($lang | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "Language English"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = 1
                | (.fields[]? | select(.name == "exceptLanguage")).value = false
              ),
              (($title | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "Dual Title Token"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = "\\b(DL|DUAL|MULTI)\\b"
              )
            ]
          }
        '
      )"

      cf_json="$(sonarr_get /api/v3/customformat | jq -c --arg name "$dual_cf_name" 'map(select(.name == $name))[0]')"
      if [ "$cf_json" = "null" ]; then
        cf_id="$(sonarr_post /api/v3/customformat "$cf_payload" | jq -r '.id // empty')"
        if [ -z "$cf_id" ]; then
          log "Failed to create Sonarr custom format $dual_cf_name."
          return 1
        fi
        log "Created Sonarr custom format $dual_cf_name."
      else
        cf_id="$(printf '%s' "$cf_json" | jq -r '.id')"
        cf_payload="$(printf '%s' "$cf_payload" | jq -c --arg id "$cf_id" '.id = ($id | tonumber)')"
        sonarr_put "/api/v3/customformat/$cf_id" "$cf_payload" >/dev/null
        log "Updated Sonarr custom format $dual_cf_name."
      fi

      qp_json="$(sonarr_get /api/v3/qualityprofile | jq -c 'map(select(.name == "HD - 720p/1080p"))[0] // .[0]')"
      if [ "$qp_json" = "null" ]; then
        log "Sonarr quality profile not found; skipping dual-audio quality gate."
        return 0
      fi
      qp_id="$(printf '%s' "$qp_json" | jq -r '.id')"
      qp_payload="$(printf '%s' "$qp_json" | jq -c --arg cfId "$cf_id" --arg cfName "$dual_cf_name" '
        .minFormatScore = 100
        | .minUpgradeFormatScore = 100
        | .formatItems = (((.formatItems // []) | map(select(.format != ($cfId | tonumber)))) + [{format: ($cfId | tonumber), name: $cfName, score: 100}])
      ')"
      sonarr_put "/api/v3/qualityprofile/$qp_id" "$qp_payload" >/dev/null
      log "Applied Sonarr dual-audio gate to quality profile $(printf '%s' "$qp_json" | jq -r '.name')."

      lp_name="German + English"
      lp_json="$(sonarr_get /api/v3/languageprofile | jq -c --arg name "$lp_name" 'map(select(.name == $name))[0]')"
      if [ "$lp_json" = "null" ]; then
        base_lp="$(sonarr_get /api/v3/languageprofile | jq -c '.[0]')"
        if [ "$base_lp" = "null" ]; then
          log "Sonarr language profile list empty; skipping language default."
          return 0
        fi
        lp_payload="$(printf '%s' "$base_lp" | jq -c '
          del(.id)
          | .name = "German + English"
          | .upgradeAllowed = true
          | .cutoff = {id: 4, name: "German"}
          | .languages = [
              {language: {id: 4, name: "German"}, allowed: true},
              {language: {id: 1, name: "English"}, allowed: true}
            ]
        ')"
        sonarr_post /api/v3/languageprofile "$lp_payload" >/dev/null
        log "Created Sonarr language profile $lp_name."
      else
        lp_id="$(printf '%s' "$lp_json" | jq -r '.id')"
        lp_payload="$(printf '%s' "$lp_json" | jq -c '
          .name = "German + English"
          | .upgradeAllowed = true
          | .cutoff = {id: 4, name: "German"}
          | .languages = [
              {language: {id: 4, name: "German"}, allowed: true},
              {language: {id: 1, name: "English"}, allowed: true}
            ]
        ')"
        sonarr_put "/api/v3/languageprofile/$lp_id" "$lp_payload" >/dev/null
        log "Updated Sonarr language profile $lp_name."
      fi
    }

    if [ -n "$SONARR_API_KEY" ]; then
      SONARR_URL="$(discover_sonarr_url || true)"
      if [ -z "$SONARR_URL" ]; then
        log "Unable to reach Sonarr API; deferring Sonarr bootstrap."
      else
        ensure_sonarr_rootfolder || log "Failed to ensure Sonarr root folder; will retry."
        ensure_sonarr_qbittorrent || log "Failed to ensure Sonarr qBittorrent client; will retry."
        if [ "$ENABLE_DUAL_AUDIO_POLICY" = "true" ]; then
          ensure_sonarr_dual_audio_policy || log "Failed to apply Sonarr dual-audio policy; will retry."
        fi
      fi
    else
      log "Sonarr API key missing; skipping Sonarr bootstrap."
    fi

    discover_radarr_url() {
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$RADARR_URL" "http://radarr:7878" "http://radarr.media.svc.cluster.local:7878"; do
          if curl -fsS -m 5 -H "X-Api-Key: $RADARR_API_KEY" "$candidate/api/v3/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    radarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $RADARR_API_KEY" "$RADARR_URL$path"
    }

    radarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $RADARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$RADARR_URL$path"
    }

    radarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $RADARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$RADARR_URL$path"
    }

    ensure_radarr_rootfolder() {
      root_json="$(radarr_get /api/v3/rootfolder | jq -c 'map(select(.path == "/media/movies"))[0]')"
      if [ "$root_json" = "null" ]; then
        if radarr_post /api/v3/rootfolder '{"path":"/media/movies"}' >/dev/null; then
          log "Created Radarr root folder /media/movies."
        else
          log "Failed to create Radarr root folder /media/movies."
          return 1
        fi
      else
        log "Radarr root folder /media/movies already present."
      fi
