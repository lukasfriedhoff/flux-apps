        radarr_put "/api/v3/customformat/$cf_id" "$cf_payload" >/dev/null
        log "Updated Radarr custom format $dual_cf_name."
      fi

      qp_json="$(radarr_get /api/v3/qualityprofile | jq -c 'map(select(.name == "HD - 720p/1080p"))[0] // .[0]')"
      if [ "$qp_json" = "null" ]; then
        log "Radarr quality profile not found; skipping dual-audio quality gate."
        return 0
      fi
      qp_id="$(printf '%s' "$qp_json" | jq -r '.id')"
      qp_payload="$(printf '%s' "$qp_json" | jq -c --arg cfId "$cf_id" --arg cfName "$dual_cf_name" '
        .language = {id: 4, name: "German"}
        | .minFormatScore = 100
        | .minUpgradeFormatScore = 100
        | .formatItems = (((.formatItems // []) | map(select(.format != ($cfId | tonumber)))) + [{format: ($cfId | tonumber), name: $cfName, score: 100}])
      ')"
      radarr_put "/api/v3/qualityprofile/$qp_id" "$qp_payload" >/dev/null
