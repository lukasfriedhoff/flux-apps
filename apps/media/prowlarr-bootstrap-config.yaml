    ensure_sonarr_dual_audio_policy() {
      dual_cf_name="German + English Dual Audio"

      title_schema="$(sonarr_get /api/v3/customformat/schema | jq -c 'map(select(.implementation == "ReleaseTitleSpecification"))[0]')"
      if [ "$title_schema" = "null" ]; then
        log "Sonarr custom format schema missing; skipping dual-audio policy."
        return 0
      fi

      cf_payload="$(jq -n -c \
        --arg name "$dual_cf_name" \
        --arg title "$title_schema" '
          {
            name: $name,
            includeCustomFormatWhenRenaming: false,
            specifications: [
              (($title | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "German Title Token"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = "\\b(German|Deutsch|GER|DEU)\\b"
              ),
              (($title | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "Dual Audio Title Token"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = "\\b(DL|DUAL|DUAL[-_. ]?AUDIO|MULTI|MULTI[-_. ]?AUDIO|MULTIAUDIO|Dubbed|EN|ENG|English)\\b"
              )
            ]
          }
        '
      )"

      cf_json="$(sonarr_get /api/v3/customformat | jq -c --arg name "$dual_cf_name" 'map(select(.name == $name))[0]')"
      if [ "$cf_json" = "null" ]; then
        cf_id="$(sonarr_post /api/v3/customformat "$cf_payload" | jq -r '.id // empty')"
        if [ -z "$cf_id" ]; then
          log "Failed to create Sonarr custom format $dual_cf_name."
          return 1
        fi
        log "Created Sonarr custom format $dual_cf_name."
      else
        cf_id="$(printf '%s' "$cf_json" | jq -r '.id')"
        cf_payload="$(printf '%s' "$cf_payload" | jq -c --arg id "$cf_id" '.id = ($id | tonumber)')"
        sonarr_put "/api/v3/customformat/$cf_id" "$cf_payload" >/dev/null
        log "Updated Sonarr custom format $dual_cf_name."
      fi

      profiles_json="$(sonarr_get /api/v3/qualityprofile)"
      existing_qp_json="$(printf '%s' "$profiles_json" | jq -c --arg name "$ARR_QUALITY_PROFILE_NAME" 'map(select(.name == $name))[0]')"
      if [ "$existing_qp_json" = "null" ]; then
        qp_json="$(printf '%s' "$profiles_json" | jq -c 'map(select(.name == "HD - 720p/1080p"))[0] // .[0]')"
      else
        qp_json="$existing_qp_json"
      fi
      if [ "$qp_json" = "null" ]; then
        log "Sonarr quality profile not found; skipping dual-audio quality gate."
        return 0
      fi
      qp_payload="$(printf '%s' "$qp_json" | jq -c --arg profileName "$ARR_QUALITY_PROFILE_NAME" --arg cfId "$cf_id" --arg cfName "$dual_cf_name" '
        def item_text:
          [
            (.name? // empty),
            (.quality.name? // empty),
            (.items[]?.name? // empty),
            (.items[]?.quality.name? // empty)
          ] | join(" ");
        def wanted_hd_4k:
          item_text | test("(720p|1080p|2160p|4k|uhd|ultra[-_. ]?hd)"; "i");
        def rank:
          (item_text | ascii_downcase) as $t
          | if ($t | test("remux.*2160|2160.*remux")) then 900
            elif ($t | test("bluray.*2160|2160.*blu")) then 850
            elif ($t | test("web.*2160|2160.*web")) then 820
            elif ($t | test("hdtv.*2160|2160.*hdtv|2160|4k|uhd|ultra[-_. ]?hd")) then 800
            elif ($t | test("remux.*1080|1080.*remux")) then 700
            elif ($t | test("bluray.*1080|1080.*blu")) then 650
            elif ($t | test("web.*1080|1080.*web")) then 620
            elif ($t | test("hdtv.*1080|1080.*hdtv|1080p")) then 600
            elif ($t | test("bluray.*720|720.*blu")) then 450
            elif ($t | test("web.*720|720.*web")) then 420
            elif ($t | test("hdtv.*720|720.*hdtv|720p")) then 400
            else 0 end;
        def cutoff_id:
          ([ .items[]? | select(wanted_hd_4k) | {id: (.id // .quality.id // null), rank: rank} | select(.id != null) ]
            | max_by(.rank).id) // .cutoff;
        .name = $profileName
        | .upgradeAllowed = true
        | .cutoff = cutoff_id
        | .items = ((.items // []) | map(
            if wanted_hd_4k then
              .allowed = true
              | if has("items") then .items = (.items | map(if wanted_hd_4k then .allowed = true else .allowed = false end)) else . end
            else
              .allowed = false
              | if has("items") then .items = (.items | map(.allowed = false)) else . end
            end
          ))
        | .cutoffFormatScore = 100
        | .minFormatScore = 100
        | .minUpgradeFormatScore = 100
        | .formatItems = (((.formatItems // []) | map(select(.format != ($cfId | tonumber)))) + [{format: ($cfId | tonumber), name: $cfName, score: 100}])
      ')"
      if [ "$existing_qp_json" = "null" ]; then
        qp_payload="$(printf '%s' "$qp_payload" | jq -c 'del(.id)')"
        qp_id="$(sonarr_post /api/v3/qualityprofile "$qp_payload" | jq -r '.id // empty')"
        if [ -z "$qp_id" ]; then
          log "Failed to create Sonarr quality profile $ARR_QUALITY_PROFILE_NAME."
          return 1
        fi
        log "Created Sonarr quality profile $ARR_QUALITY_PROFILE_NAME."
      else
        qp_id="$(printf '%s' "$existing_qp_json" | jq -r '.id')"
        sonarr_put "/api/v3/qualityprofile/$qp_id" "$qp_payload" >/dev/null
        log "Updated Sonarr quality profile $ARR_QUALITY_PROFILE_NAME."
      fi

      lp_name="German + English"
      lp_json="$(sonarr_get /api/v3/languageprofile | jq -c --arg name "$lp_name" 'map(select(.name == $name))[0]')"
      if [ "$lp_json" = "null" ]; then
        base_lp="$(sonarr_get /api/v3/languageprofile | jq -c '.[0]')"
        if [ "$base_lp" = "null" ]; then
          log "Sonarr language profile list empty; skipping language default."
          return 0
        fi
        lp_payload="$(printf '%s' "$base_lp" | jq -c '
          del(.id)
          | .name = "German + English"
          | .upgradeAllowed = true
          | .cutoff = {id: 4, name: "German"}
          | .languages = [
              {language: {id: 4, name: "German"}, allowed: true},
              {language: {id: 1, name: "English"}, allowed: true}
            ]
        ')"
        sonarr_post /api/v3/languageprofile "$lp_payload" >/dev/null
        log "Created Sonarr language profile $lp_name."
      else
        lp_id="$(printf '%s' "$lp_json" | jq -r '.id')"
        lp_payload="$(printf '%s' "$lp_json" | jq -c '
          .name = "German + English"
          | .upgradeAllowed = true
          | .cutoff = {id: 4, name: "German"}
          | .languages = [
              {language: {id: 4, name: "German"}, allowed: true},
              {language: {id: 1, name: "English"}, allowed: true}
            ]
        ')"
        sonarr_put "/api/v3/languageprofile/$lp_id" "$lp_payload" >/dev/null
        log "Updated Sonarr language profile $lp_name."
      fi
    }

    if [ -n "$SONARR_API_KEY" ]; then
      SONARR_URL="$(discover_sonarr_url || true)"
      if [ -z "$SONARR_URL" ]; then
        log "Unable to reach Sonarr API; deferring Sonarr bootstrap."
      else
        ensure_sonarr_rootfolder || log "Failed to ensure Sonarr root folder; will retry."
        ensure_sonarr_qbittorrent || log "Failed to ensure Sonarr qBittorrent client; will retry."
        ensure_sonarr_download_path_mapping || log "Failed to ensure Sonarr remote path mapping; will retry."
        if [ "$ENABLE_DUAL_AUDIO_POLICY" = "true" ]; then
          ensure_sonarr_dual_audio_policy || log "Failed to apply Sonarr dual-audio policy; will retry."
        fi
      fi
    else
      log "Sonarr API key missing; skipping Sonarr bootstrap."
    fi

    discover_radarr_url() {
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$RADARR_URL" "http://radarr:7878" "http://radarr.media.svc.cluster.local:7878"; do
          if curl -fsS -m 5 -H "X-Api-Key: $RADARR_API_KEY" "$candidate/api/v3/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    radarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $RADARR_API_KEY" "$RADARR_URL$path"
    }

    radarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $RADARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$RADARR_URL$path"
    }

    radarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $RADARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$RADARR_URL$path"
    }

    radarr_delete() {
      path="$1"
      curl -fsS -m 30 -X DELETE \
        -H "X-Api-Key: $RADARR_API_KEY" \
        "$RADARR_URL$path"
    }

    ensure_radarr_rootfolder() {
      root_json="$(radarr_get /api/v3/rootfolder | jq -c 'map(select(.path == "/media/movies"))[0]')"
      if [ "$root_json" = "null" ]; then
        if radarr_post /api/v3/rootfolder '{"path":"/media/movies"}' >/dev/null; then
          log "Created Radarr root folder /media/movies."
        else
          log "Failed to create Radarr root folder /media/movies."
          return 1
        fi
      else
        log "Radarr root folder /media/movies already present."
      fi
    }

    ensure_radarr_media_management() {
      media_management_json="$(radarr_get /api/v3/config/mediamanagement)"
      if [ -z "$media_management_json" ] || [ "$media_management_json" = "null" ]; then
        log "Radarr media management config missing; skipping."
        return 0
      fi

      media_management_id="$(printf '%s' "$media_management_json" | jq -r '.id // empty')"
      if [ -z "$media_management_id" ]; then
        log "Radarr media management config has no id; skipping."
        return 0
      fi

      media_management_payload="$(printf '%s' "$media_management_json" | jq -c '
        .recycleBin = "/media/.RecycleBin/radarr"
        | .recycleBinCleanupDays = 30
        | .copyUsingHardlinks = true
        | .enableMediaInfo = true
        | .skipFreeSpaceCheckWhenImporting = false
        | .minimumFreeSpaceWhenImporting = 100
      ')"

      radarr_put "/api/v3/config/mediamanagement/$media_management_id" "$media_management_payload" >/dev/null
      log "Configured Radarr media management recycle bin and import safety."
    }

    ensure_radarr_qbittorrent() {
      dl_json="$(radarr_get /api/v3/downloadclient | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
      if [ "$dl_json" = "null" ]; then
        dl_json="$(radarr_get /api/v3/downloadclient/schema | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
        if [ "$dl_json" = "null" ]; then
          log "Radarr qBittorrent schema missing; skipping download client bootstrap."
          return 0
        fi
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "movieCategory")).value = "radarr"
          | (.fields[]? | select(.name == "movieImportedCategory")).value = "radarr-imported"
        ')"
        radarr_post /api/v3/downloadclient "$dl_json" >/dev/null
        log "Created Radarr download client qBittorrent."
      else
        dl_id="$(printf '%s' "$dl_json" | jq -r '.id')"
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "movieCategory")).value = "radarr"
          | (.fields[]? | select(.name == "movieImportedCategory")).value = "radarr-imported"
        ')"
        radarr_put "/api/v3/downloadclient/$dl_id" "$dl_json" >/dev/null
        log "Updated Radarr download client qBittorrent."
      fi
    }

    ensure_radarr_download_path_mapping() {
      mapping_ids="$(radarr_get /api/v3/remotepathmapping | jq -r '.[] | select(.host == "qbittorrent" and (.remotePath == "/downloads" or .remotePath == "/downloads/")) | .id')"
      if [ -z "$mapping_ids" ]; then
        log "Radarr stale /downloads remote path mapping absent."
        return 0
      fi

      printf '%s\n' "$mapping_ids" | while IFS= read -r mapping_id; do
        [ -n "$mapping_id" ] || continue
        radarr_delete "/api/v3/remotepathmapping/$mapping_id" >/dev/null
        log "Deleted Radarr stale /downloads remote path mapping $mapping_id."
      done
    }

    ensure_radarr_dual_audio_policy() {
      dual_cf_name="German + English Dual Audio"

      title_schema="$(radarr_get /api/v3/customformat/schema | jq -c 'map(select(.implementation == "ReleaseTitleSpecification"))[0]')"
      if [ "$title_schema" = "null" ]; then
        log "Radarr custom format schema missing; skipping dual-audio policy."
        return 0
      fi

      cf_payload="$(jq -n -c \
        --arg name "$dual_cf_name" \
        --arg title "$title_schema" '
          {
            name: $name,
            includeCustomFormatWhenRenaming: false,
            specifications: [
              (($title | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "German Title Token"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = "\\b(German|Deutsch|GER|DEU)\\b"
              ),
              (($title | fromjson) | {implementation, implementationName, infoLink, negate, required, fields}
                | .name = "Dual Audio Title Token"
                | .required = true
                | (.fields[]? | select(.name == "value")).value = "\\b(DL|DUAL|DUAL[-_. ]?AUDIO|MULTI|MULTI[-_. ]?AUDIO|MULTIAUDIO|Dubbed|EN|ENG|English)\\b"
              )
            ]
          }
        '
      )"

      cf_json="$(radarr_get /api/v3/customformat | jq -c --arg name "$dual_cf_name" 'map(select(.name == $name))[0]')"
      if [ "$cf_json" = "null" ]; then
        cf_id="$(radarr_post /api/v3/customformat "$cf_payload" | jq -r '.id // empty')"
        if [ -z "$cf_id" ]; then
          log "Failed to create Radarr custom format $dual_cf_name."
          return 1
        fi
        log "Created Radarr custom format $dual_cf_name."
      else
        cf_id="$(printf '%s' "$cf_json" | jq -r '.id')"
        cf_payload="$(printf '%s' "$cf_payload" | jq -c --arg id "$cf_id" '.id = ($id | tonumber)')"
        radarr_put "/api/v3/customformat/$cf_id" "$cf_payload" >/dev/null
        log "Updated Radarr custom format $dual_cf_name."
      fi

      profiles_json="$(radarr_get /api/v3/qualityprofile)"
      existing_qp_json="$(printf '%s' "$profiles_json" | jq -c --arg name "$ARR_QUALITY_PROFILE_NAME" 'map(select(.name == $name))[0]')"
      if [ "$existing_qp_json" = "null" ]; then
        qp_json="$(printf '%s' "$profiles_json" | jq -c 'map(select(.name == "HD - 720p/1080p"))[0] // .[0]')"
      else
        qp_json="$existing_qp_json"
      fi
      if [ "$qp_json" = "null" ]; then
        log "Radarr quality profile not found; skipping dual-audio quality gate."
        return 0
      fi
      qp_payload="$(printf '%s' "$qp_json" | jq -c --arg profileName "$ARR_QUALITY_PROFILE_NAME" --arg cfId "$cf_id" --arg cfName "$dual_cf_name" '
        def item_text:
          [
            (.name? // empty),
            (.quality.name? // empty),
            (.items[]?.name? // empty),
            (.items[]?.quality.name? // empty)
          ] | join(" ");
        def wanted_hd_4k:
          item_text | test("(720p|1080p|2160p|4k|uhd|ultra[-_. ]?hd)"; "i");
        def rank:
          (item_text | ascii_downcase) as $t
          | if ($t | test("remux.*2160|2160.*remux")) then 900
            elif ($t | test("bluray.*2160|2160.*blu")) then 850
            elif ($t | test("web.*2160|2160.*web")) then 820
            elif ($t | test("hdtv.*2160|2160.*hdtv|2160|4k|uhd|ultra[-_. ]?hd")) then 800
            elif ($t | test("remux.*1080|1080.*remux")) then 700
            elif ($t | test("bluray.*1080|1080.*blu")) then 650
            elif ($t | test("web.*1080|1080.*web")) then 620
            elif ($t | test("hdtv.*1080|1080.*hdtv|1080p")) then 600
            elif ($t | test("bluray.*720|720.*blu")) then 450
            elif ($t | test("web.*720|720.*web")) then 420
            elif ($t | test("hdtv.*720|720.*hdtv|720p")) then 400
            else 0 end;
        def cutoff_id:
          ([ .items[]? | select(wanted_hd_4k) | {id: (.id // .quality.id // null), rank: rank} | select(.id != null) ]
            | max_by(.rank).id) // .cutoff;
        .name = $profileName
        | .language = {id: 4, name: "German"}
        | .upgradeAllowed = true
        | .cutoff = cutoff_id
        | .items = ((.items // []) | map(
            if wanted_hd_4k then
              .allowed = true
              | if has("items") then .items = (.items | map(if wanted_hd_4k then .allowed = true else .allowed = false end)) else . end
            else
              .allowed = false
              | if has("items") then .items = (.items | map(.allowed = false)) else . end
            end
          ))
        | .cutoffFormatScore = 100
        | .minFormatScore = 100
        | .minUpgradeFormatScore = 100
        | .formatItems = (((.formatItems // []) | map(select(.format != ($cfId | tonumber)))) + [{format: ($cfId | tonumber), name: $cfName, score: 100}])
      ')"
      if [ "$existing_qp_json" = "null" ]; then
        qp_payload="$(printf '%s' "$qp_payload" | jq -c 'del(.id)')"
        qp_id="$(radarr_post /api/v3/qualityprofile "$qp_payload" | jq -r '.id // empty')"
        if [ -z "$qp_id" ]; then
          log "Failed to create Radarr quality profile $ARR_QUALITY_PROFILE_NAME."
          return 1
        fi
        log "Created Radarr quality profile $ARR_QUALITY_PROFILE_NAME."
      else
        qp_id="$(printf '%s' "$existing_qp_json" | jq -r '.id')"
        radarr_put "/api/v3/qualityprofile/$qp_id" "$qp_payload" >/dev/null
        log "Updated Radarr quality profile $ARR_QUALITY_PROFILE_NAME."
      fi
    }

    if [ -n "$RADARR_API_KEY" ]; then
      RADARR_URL="$(discover_radarr_url || true)"
      if [ -z "$RADARR_URL" ]; then
        log "Unable to reach Radarr API; deferring Radarr bootstrap."
      else
        ensure_radarr_rootfolder || log "Failed to ensure Radarr root folder; will retry."
        ensure_radarr_media_management || log "Failed to configure Radarr media management; will retry."
        ensure_radarr_qbittorrent || log "Failed to ensure Radarr qBittorrent client; will retry."
        ensure_radarr_download_path_mapping || log "Failed to ensure Radarr remote path mapping; will retry."
        if [ "$ENABLE_DUAL_AUDIO_POLICY" = "true" ]; then
          ensure_radarr_dual_audio_policy || log "Failed to apply Radarr dual-audio policy; will retry."
        fi
      fi
    else
      log "Radarr API key missing; skipping Radarr bootstrap."
    fi

    discover_readarr_url() {
      attempt=0
      while [ "$attempt" -lt 20 ]; do
        for candidate in "$READARR_URL" "http://readarr:8787" "http://readarr.media.svc.cluster.local:8787"; do
          if curl -fsS -m 5 -H "X-Api-Key: $READARR_API_KEY" "$candidate/api/v1/system/status" >/dev/null 2>&1; then
            printf '%s' "$candidate"
            return 0
          fi
        done
        attempt=$((attempt + 1))
        sleep 3
      done
      return 1
    }

    readarr_get() {
      path="$1"
      curl -fsS -m 20 -H "X-Api-Key: $READARR_API_KEY" "$READARR_URL$path"
    }

    readarr_post() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X POST \
        -H "X-Api-Key: $READARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$READARR_URL$path"
    }

    readarr_put() {
      path="$1"
      payload="$2"
      curl -fsS -m 30 -X PUT \
        -H "X-Api-Key: $READARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$READARR_URL$path"
    }

    readarr_delete() {
      path="$1"
      curl -fsS -m 30 -X DELETE \
        -H "X-Api-Key: $READARR_API_KEY" \
        "$READARR_URL$path"
    }

    ensure_readarr_rootfolder() {
      root_json="$(readarr_get /api/v1/rootfolder | jq -c 'map(select(.path == "/media/books"))[0]')"
      if [ "$root_json" = "null" ]; then
        quality_profile_id="$(readarr_get /api/v1/qualityprofile | jq -r '.[0].id // empty')"
        metadata_profile_id="$(readarr_get /api/v1/metadataprofile | jq -r '.[0].id // empty')"

        if [ -z "$quality_profile_id" ] || [ -z "$metadata_profile_id" ]; then
          log "Readarr quality/metadata profile discovery failed; cannot create root folder."
          return 1
        fi

        payload="$(jq -n -c \
          --arg path "/media/books" \
          --arg qualityProfileId "$quality_profile_id" \
          --arg metadataProfileId "$metadata_profile_id" \
          '{
            name: "Books",
            path: $path,
            defaultQualityProfileId: ($qualityProfileId | tonumber),
            defaultMetadataProfileId: ($metadataProfileId | tonumber)
          }'
        )"

        if readarr_post /api/v1/rootfolder "$payload" >/dev/null; then
          log "Created Readarr root folder /media/books."
        else
          log "Failed to create Readarr root folder /media/books."
          return 1
        fi
      else
        log "Readarr root folder /media/books already present."
      fi
    }

    ensure_readarr_qbittorrent() {
      dl_json="$(readarr_get /api/v1/downloadclient | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
      if [ "$dl_json" = "null" ]; then
        dl_json="$(readarr_get /api/v1/downloadclient/schema | jq -c 'map(select(.implementation == "QBittorrent"))[0]')"
        if [ "$dl_json" = "null" ]; then
          log "Readarr qBittorrent schema missing; skipping download client bootstrap."
          return 0
        fi
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "bookCategory")).value = "readarr"
          | (.fields[]? | select(.name == "bookImportedCategory")).value = "readarr-imported"
          | (.fields[]? | select(.name == "musicCategory")).value = "readarr"
          | (.fields[]? | select(.name == "musicImportedCategory")).value = "readarr-imported"
        ')"
        readarr_post /api/v1/downloadclient "$dl_json" >/dev/null
        log "Created Readarr download client qBittorrent."
      else
        dl_id="$(printf '%s' "$dl_json" | jq -r '.id')"
        dl_json="$(printf '%s' "$dl_json" | jq -c '
          .name = "qBittorrent"
          | .enable = true
          | .priority = 1
          | (.fields[]? | select(.name == "host")).value = "qbittorrent"
          | (.fields[]? | select(.name == "port")).value = 8080
          | (.fields[]? | select(.name == "useSsl")).value = false
          | (.fields[]? | select(.name == "bookCategory")).value = "readarr"
          | (.fields[]? | select(.name == "bookImportedCategory")).value = "readarr-imported"
          | (.fields[]? | select(.name == "musicCategory")).value = "readarr"
          | (.fields[]? | select(.name == "musicImportedCategory")).value = "readarr-imported"
        ')"
        readarr_put "/api/v1/downloadclient/$dl_id" "$dl_json" >/dev/null
        log "Updated Readarr download client qBittorrent."
      fi
    }

    ensure_readarr_download_path_mapping() {
      mapping_ids="$(readarr_get /api/v1/remotepathmapping | jq -r '.[] | select(.host == "qbittorrent" and (.remotePath == "/downloads" or .remotePath == "/downloads/")) | .id')"
      if [ -z "$mapping_ids" ]; then
        log "Readarr stale /downloads remote path mapping absent."
        return 0
      fi

      printf '%s\n' "$mapping_ids" | while IFS= read -r mapping_id; do
        [ -n "$mapping_id" ] || continue
        readarr_delete "/api/v1/remotepathmapping/$mapping_id" >/dev/null
        log "Deleted Readarr stale /downloads remote path mapping $mapping_id."
      done
    }

    if [ -n "$READARR_API_KEY" ]; then
      READARR_URL="$(discover_readarr_url || true)"
      if [ -z "$READARR_URL" ]; then
        log "Unable to reach Readarr API; deferring Readarr bootstrap."
      else
        ensure_readarr_rootfolder || log "Failed to ensure Readarr root folder; will retry."
        ensure_readarr_qbittorrent || log "Failed to ensure Readarr qBittorrent client; will retry."
        ensure_readarr_download_path_mapping || log "Failed to ensure Readarr remote path mapping; will retry."
      fi
    else
      log "Readarr API key missing; skipping Readarr bootstrap."
    fi

    log "Bootstrap run complete."
