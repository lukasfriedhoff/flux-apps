        -H "X-Api-Key: $READARR_API_KEY" \
        -H 'Content-Type: application/json' \
        --data "$payload" \
        "$READARR_URL$path"
    }

    ensure_readarr_rootfolder() {
      root_json="$(readarr_get /api/v1/rootfolder | jq -c 'map(select(.path == "/media/books"))[0]')"
      if [ "$root_json" = "null" ]; then
        quality_profile_id="$(readarr_get /api/v1/qualityprofile | jq -r '.[0].id // empty')"
        metadata_profile_id="$(readarr_get /api/v1/metadataprofile | jq -r '.[0].id // empty')"

        if [ -z "$quality_profile_id" ] || [ -z "$metadata_profile_id" ]; then
          log "Readarr quality/metadata profile discovery failed; cannot create root folder."
          return 1
        fi

        payload="$(jq -n -c \
          --arg path "/media/books" \
          --arg qualityProfileId "$quality_profile_id" \
          --arg metadataProfileId "$metadata_profile_id" \
          '{
            name: "Books",
            path: $path,
            defaultQualityProfileId: ($qualityProfileId | tonumber),
            defaultMetadataProfileId: ($metadataProfileId | tonumber)
          }'
        )"

        if readarr_post /api/v1/rootfolder "$payload" >/dev/null; then
          log "Created Readarr root folder /media/books."
        else
          log "Failed to create Readarr root folder /media/books."
          return 1
        fi
      else
        log "Readarr root folder /media/books already present."
      fi
