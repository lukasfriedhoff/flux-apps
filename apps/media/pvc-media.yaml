apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    recurring-job-group.longhorn.io/default: disabled
  annotations:
    # Overrides the storage class replica count for this volume only, honored by
    # the longhorn-replica-policy CronJob. Needed while the volume is being
    # moved onto its dedicated disks: the replica count has to be raised to
    # schedule a replica on the target node, then dropped once the old
    # off-target replicas are gone. Empty defers to the storage class.
    longhorn.h4xx.io/replica-count: "${arr_media_replica_count:=}"
  name: arr-media-v2
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: ${arr_media_size}
  storageClassName: ${arr_media_storage_class_name}
