apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-bootstrap
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        type: cronjob
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - jellyfin
                  topologyKey: kubernetes.io/hostname
        cronjob:
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 240
          ttlSecondsAfterFinished: 300
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          main:
            image:
              repository: python
              tag: 3.12.11-alpine
            env:
              JELLYFIN_BASE_URL: ${jellyfin_internal_base_url}
              JELLYFIN_SERVER_NAME: ${jellyfin_server_name}
            command:
              - /bin/sh
              - -c
            args:
              - python /scripts/bootstrap.py || { echo '[jellyfin-bootstrap] bootstrap failed; will retry next run.'; exit 0; }
            resources:
              requests:
                cpu: 10m
                memory: 48Mi
              limits:
                cpu: 200m
                memory: 128Mi
    persistence:
      script:
        enabled: true
        type: configMap
        name: jellyfin-bootstrap-config
        defaultMode: 0555
        globalMounts:
          - path: /scripts/bootstrap.py
            subPath: bootstrap.py
            readOnly: true
      jellyfin-config:
        enabled: true
        existingClaim: jellyfin
        globalMounts:
          - path: /mnt
      auth-secret:
        enabled: true
        type: secret
        name: ${jellyfin_e2e_auth_secret_name}
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets/jellyfin-e2e-auth
            readOnly: true
