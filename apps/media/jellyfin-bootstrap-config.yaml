apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-bootstrap-config
  namespace: media
data:
  bootstrap.py: |-
    import datetime
    import json
    import os
    import pathlib
    import sqlite3
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import xml.etree.ElementTree as ET

    DB_PATH = pathlib.Path("/mnt/data/data/jellyfin.db")
    SYSTEM_XML_PATH = pathlib.Path("/mnt/system.xml")
    SECRET_PATH = pathlib.Path("/run/secrets/jellyfin-e2e-auth/api_key")
    KEY_NAME = "gitops-jellyfin-e2e"
    MAX_RETRIES = 20
    JELLYFIN_BASE_URL = os.getenv("JELLYFIN_BASE_URL", "http://jellyfin:8096")
    JELLYFIN_ENABLE_GPU = os.getenv("JELLYFIN_ENABLE_GPU", "false").lower() in ("1", "true", "yes", "on")
    JELLYFIN_SERVER_NAME = os.getenv("JELLYFIN_SERVER_NAME", "Jellyfin")


    def split_csv(value: str) -> list[str]:
      return [item.strip() for item in (value or "").split(",") if item.strip()]


    JELLYFIN_KNOWN_PROXIES = split_csv(os.getenv("JELLYFIN_KNOWN_PROXIES", ""))
    JELLYFIN_LOCAL_NETWORK_ADDRESSES = split_csv(os.getenv("JELLYFIN_LOCAL_NETWORK_ADDRESSES", ""))
    JELLYFIN_LOCAL_NETWORK_SUBNETS = split_csv(os.getenv("JELLYFIN_LOCAL_NETWORK_SUBNETS", ""))
    LIBRARIES = [
      ("movies", "Movies", "/media/movies"),
      ("tvshows", "TV Shows", "/media/tv"),
      ("music", "Music", "/media/music"),
      ("youtubevideos", "YouTube Videos", "/media/youtube/videos"),
      ("books", "Books", "/media/books"),
      ("homevideos", "Other Downloads", "/media/downloads/other"),
    ]
    STALE_LIBRARY_PATHS = {
      "/downloads/other",
    }
    LIBRARY_DISPLAY_ORDER = [
      "Movies",
      "TV Shows",
      "Music",
      "YouTube Videos",
      "Other Downloads",
      "Books",
      "E2E Movies",
      "E2E TV",
      "E2E Music",
    ]


    def read_api_key() -> str:
      if not SECRET_PATH.exists():
        return ""
      return SECRET_PATH.read_text(encoding="utf-8").strip()


    def now_utc() -> str:
      return datetime.datetime.now(datetime.UTC).isoformat()


    def _request_json(
      method: str,
      path: str,
      api_key: str = "",
      query: dict[str, str] | None = None,
      body: dict | None = None,
    ) -> object:
      url = f"{JELLYFIN_BASE_URL}{path}"
      if query:
        url = f"{url}?{urllib.parse.urlencode(query, doseq=True)}"

      payload = None
      headers = {}
      if api_key:
        headers["X-MediaBrowser-Token"] = api_key
      if body is not None:
        payload = json.dumps(body).encode("utf-8")
        headers["Content-Type"] = "application/json"

      req = urllib.request.Request(url=url, method=method, data=payload, headers=headers)
      with urllib.request.urlopen(req, timeout=10) as response:
        raw = response.read()
        if not raw:
          return None
        return json.loads(raw.decode("utf-8"))



    def _post_startup(path: str, body: dict | None = None) -> bool:
      try:
        _request_json("POST", path, body=body)
        return True
      except urllib.error.HTTPError as err:
        if err.code in (401, 403):
          print(f"[jellyfin-bootstrap] startup endpoint {path} requires auth; assuming startup already completed.")
          return False
        raise


    def _public_info() -> dict | None:
      info = _request_json("GET", "/System/Info/Public")
      if isinstance(info, dict):
        return info
      return None


    def ensure_runtime_startup_wizard_completed() -> None:
      for attempt in range(1, MAX_RETRIES + 1):
        try:
          info = _public_info()
          if info and info.get("StartupWizardCompleted") is True:
            print("[jellyfin-bootstrap] startup wizard already completed in runtime.")
            return

          print("[jellyfin-bootstrap] completing startup wizard via Jellyfin API.")
          config = _request_json("GET", "/Startup/Configuration")
          if not isinstance(config, dict):
            config = {}
          config["ServerName"] = JELLYFIN_SERVER_NAME
          config.setdefault("UICulture", "en-US")
          config.setdefault("MetadataCountryCode", "US")
          config.setdefault("PreferredMetadataLanguage", "en")
          _request_json("POST", "/Startup/Configuration", body=config)
          _post_startup("/Startup/RemoteAccess", {})
          _post_startup("/Startup/Complete", {})

          info = _public_info()
          if info and info.get("StartupWizardCompleted") is True:
            print("[jellyfin-bootstrap] startup wizard completed in runtime.")
            return

          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] startup wizard still pending (attempt {attempt}/{MAX_RETRIES}); retrying.")
            time.sleep(3)
            continue
        except urllib.error.HTTPError as err:
          if err.code in (401, 403):
            print("[jellyfin-bootstrap] startup API requires auth; runtime likely already initialized.")
            return
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] startup API not ready (attempt {attempt}/{MAX_RETRIES}): HTTP {err.code}")
            time.sleep(3)
            continue
          raise
        except (urllib.error.URLError, TimeoutError) as err:
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] startup API unavailable (attempt {attempt}/{MAX_RETRIES}): {err}")
            time.sleep(3)
            continue
          raise

      print("[jellyfin-bootstrap] startup wizard runtime completion retry budget exhausted.")


    def ensure_startup_wizard_completed() -> None:
      if not SYSTEM_XML_PATH.exists():
        print(f"[jellyfin-bootstrap] system.xml missing at {SYSTEM_XML_PATH}; skipping startup flag update.")
        return

      tree = ET.parse(SYSTEM_XML_PATH)
      root = tree.getroot()

      changed = False
      startup_node = root.find("IsStartupWizardCompleted")
      if startup_node is None:
        startup_node = ET.SubElement(root, "IsStartupWizardCompleted")
      if (startup_node.text or "").strip().lower() != "true":
        startup_node.text = "true"
        changed = True

      server_name_node = root.find("ServerName")
      if server_name_node is None:
        server_name_node = ET.SubElement(root, "ServerName")
      if not (server_name_node.text or "").strip():
        server_name_node.text = JELLYFIN_SERVER_NAME
        changed = True

      if changed:
        tree.write(SYSTEM_XML_PATH, encoding="utf-8", xml_declaration=True)
        print("[jellyfin-bootstrap] startup wizard marked completed in system.xml.")
      else:
        print("[jellyfin-bootstrap] startup wizard already completed in system.xml.")


    def ensure_libraries(api_key: str) -> None:
      if not api_key:
        print("[jellyfin-bootstrap] no api key available for library bootstrap; skipping.")
        return

      for _, _, path in LIBRARIES:
        pathlib.Path(path).mkdir(parents=True, exist_ok=True)

      desired_by_path = {path: display_name for _, display_name, path in LIBRARIES}

      for attempt in range(1, MAX_RETRIES + 1):
        try:
          folders = _request_json("GET", "/Library/VirtualFolders", api_key)
          if not isinstance(folders, list):
            print("[jellyfin-bootstrap] unexpected VirtualFolders payload; skipping library bootstrap.")
            return

          removed = False
          for entry in folders:
            if not isinstance(entry, dict):
              continue
            name = entry.get("Name")
            locations = entry.get("Locations") or []
            if not name or not isinstance(locations, list):
              continue

            has_stale_path = any(path in STALE_LIBRARY_PATHS for path in locations)
            desired_names = {desired_by_path[path] for path in locations if path in desired_by_path}
            has_wrong_name = bool(desired_names) and name not in desired_names
            if not has_stale_path and not has_wrong_name:
              continue

            _request_json(
              "DELETE",
              "/Library/VirtualFolders",
              api_key,
              query={
                "name": name,
                "refreshLibrary": "true",
              },
            )
            removed = True
            if has_stale_path:
              print(f"[jellyfin-bootstrap] stale library removed: {name} -> {locations}")
            else:
              print(f"[jellyfin-bootstrap] wrongly named library removed: {name} -> {locations}")

          if removed:
            folders = _request_json("GET", "/Library/VirtualFolders", api_key)
            if not isinstance(folders, list):
              folders = []

          for collection_type, display_name, path in LIBRARIES:
            exists = any(path in (entry.get("Locations") or []) for entry in folders if isinstance(entry, dict))
            if exists:
              print(f"[jellyfin-bootstrap] library path exists: {path}")
              continue

            _request_json(
              "POST",
              "/Library/VirtualFolders",
              api_key,
              query={
                "name": display_name,
                "collectionType": collection_type,
                "paths": path,
                "refreshLibrary": "true",
              },
            )
            print(f"[jellyfin-bootstrap] library path created: {path}")

            # Refresh cache after create to avoid duplicate creates in the same run.
            folders = _request_json("GET", "/Library/VirtualFolders", api_key)
            if not isinstance(folders, list):
              folders = []
          return
        except urllib.error.HTTPError as err:
          if err.code == 401:
            print("[jellyfin-bootstrap] api key unauthorized for library bootstrap; skipping.")
            return
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] jellyfin API not ready (attempt {attempt}/{MAX_RETRIES}): HTTP {err.code}")
            time.sleep(3)
            continue
          raise
        except (urllib.error.URLError, TimeoutError) as err:
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] jellyfin API unavailable (attempt {attempt}/{MAX_RETRIES}): {err}")
            time.sleep(3)
            continue
          raise


    def ensure_user_library_display_order(api_key: str) -> None:
      if not api_key:
        print("[jellyfin-bootstrap] no api key available for user library order; skipping.")
        return

      for attempt in range(1, MAX_RETRIES + 1):
        try:
          users = _request_json("GET", "/Users", api_key)
          if not isinstance(users, list):
            print("[jellyfin-bootstrap] unexpected Users payload; skipping library display order.")
            return

          for user in users:
            if not isinstance(user, dict):
              continue
            user_id = user.get("Id")
            user_name = user.get("Name") or user_id
            if not user_id:
              continue

            views = _request_json("GET", f"/Users/{user_id}/Views", api_key)
            if not isinstance(views, dict) or not isinstance(views.get("Items"), list):
              print(f"[jellyfin-bootstrap] unexpected Views payload for {user_name}; skipping user.")
              continue

            views_by_name = {
              view.get("Name"): view.get("Id")
              for view in views["Items"]
              if isinstance(view, dict) and view.get("Name") and view.get("Id")
            }
            ordered_view_ids = [
              views_by_name[name]
              for name in LIBRARY_DISPLAY_ORDER
              if name in views_by_name
            ]
            ordered_view_ids.extend(
              views_by_name[name]
              for name in sorted(views_by_name)
              if name not in LIBRARY_DISPLAY_ORDER
            )

            config = user.get("Configuration")
            if not isinstance(config, dict):
              print(f"[jellyfin-bootstrap] user {user_name} has no Configuration payload; skipping user.")
              continue
            if config.get("OrderedViews") == ordered_view_ids:
              print(f"[jellyfin-bootstrap] user library display order already up to date: {user_name}")
              continue

            config["OrderedViews"] = ordered_view_ids
            _request_json("POST", f"/Users/{user_id}/Configuration", api_key, body=config)
            print(f"[jellyfin-bootstrap] user library display order updated: {user_name}")
          return
        except urllib.error.HTTPError as err:
          if err.code == 401:
            print("[jellyfin-bootstrap] api key unauthorized for user library order; skipping.")
            return
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] user library order API not ready (attempt {attempt}/{MAX_RETRIES}): HTTP {err.code}")
            time.sleep(3)
            continue
          raise
        except (urllib.error.URLError, TimeoutError) as err:
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] user library order API unavailable (attempt {attempt}/{MAX_RETRIES}): {err}")
            time.sleep(3)
            continue
          raise


    def ensure_network_configuration(api_key: str) -> None:
      if not api_key:
        print("[jellyfin-bootstrap] no api key available for network configuration; skipping.")
        return

      for attempt in range(1, MAX_RETRIES + 1):
        try:
          config = _request_json("GET", "/System/Configuration/Network", api_key)
          if not isinstance(config, dict):
            print("[jellyfin-bootstrap] unexpected Network configuration payload; skipping.")
            return

          changed = False
          desired = {
            "KnownProxies": JELLYFIN_KNOWN_PROXIES,
            "LocalNetworkAddresses": JELLYFIN_LOCAL_NETWORK_ADDRESSES,
            "LocalNetworkSubnets": JELLYFIN_LOCAL_NETWORK_SUBNETS,
          }

          for key, value in desired.items():
            if config.get(key) != value:
              config[key] = value
              changed = True

          if not changed:
            print("[jellyfin-bootstrap] network configuration already up to date.")
            return

          _request_json("POST", "/System/Configuration/Network", api_key, body=config)
          print("[jellyfin-bootstrap] network configuration updated.")
          return
        except urllib.error.HTTPError as err:
          if err.code == 401:
            print("[jellyfin-bootstrap] api key unauthorized for network configuration; skipping.")
            return
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] network configuration API not ready (attempt {attempt}/{MAX_RETRIES}): HTTP {err.code}")
            time.sleep(3)
            continue
          raise
        except (urllib.error.URLError, TimeoutError) as err:
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] network configuration API unavailable (attempt {attempt}/{MAX_RETRIES}): {err}")
            time.sleep(3)
            continue
          raise


    def ensure_system_configuration(api_key: str) -> None:
      if not api_key:
        print("[jellyfin-bootstrap] no api key available for system configuration; skipping.")
        return

      for attempt in range(1, MAX_RETRIES + 1):
        try:
          config = _request_json("GET", "/System/Configuration", api_key)
          if not isinstance(config, dict):
            print("[jellyfin-bootstrap] unexpected System/Configuration payload; skipping.")
            return

          changed = False
          if config.get("ServerName") != JELLYFIN_SERVER_NAME:
            config["ServerName"] = JELLYFIN_SERVER_NAME
            changed = True
          if not config.get("MetadataCountryCode"):
            config["MetadataCountryCode"] = "US"
            changed = True
          if not config.get("PreferredMetadataLanguage"):
            config["PreferredMetadataLanguage"] = "en"
            changed = True

          if not changed:
            print("[jellyfin-bootstrap] system configuration already up to date.")
            return

          _request_json("POST", "/System/Configuration", api_key, body=config)
          print("[jellyfin-bootstrap] system configuration updated.")
          return
        except urllib.error.HTTPError as err:
          if err.code == 401:
            print("[jellyfin-bootstrap] api key unauthorized for system configuration; skipping.")
            return
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] system configuration API not ready (attempt {attempt}/{MAX_RETRIES}): HTTP {err.code}")
            time.sleep(3)
            continue
          raise
        except (urllib.error.URLError, TimeoutError) as err:
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] system configuration API unavailable (attempt {attempt}/{MAX_RETRIES}): {err}")
            time.sleep(3)
            continue
          raise


    def ensure_encoding_configuration(api_key: str) -> None:
      if not api_key:
        print("[jellyfin-bootstrap] no api key available for encoding configuration; skipping.")
        return
      if not JELLYFIN_ENABLE_GPU:
        print("[jellyfin-bootstrap] gpu encoding disabled by config; skipping.")
        return

      for attempt in range(1, MAX_RETRIES + 1):
        try:
          config = _request_json("GET", "/System/Configuration/Encoding", api_key)
          if not isinstance(config, dict):
            print("[jellyfin-bootstrap] unexpected Encoding configuration payload; skipping.")
            return

          changed = False
          desired = {
            "HardwareAccelerationType": "vaapi",
            "VaapiDevice": "/dev/dri/renderD128",
            "EnableHardwareEncoding": True,
          }
          for key, value in desired.items():
            if config.get(key) != value:
              config[key] = value
              changed = True

          codecs = config.get("HardwareDecodingCodecs")
          if not isinstance(codecs, list):
            codecs = []
          wanted_codecs = ["h264", "hevc", "mpeg2video", "vc1", "vp9"]
          merged_codecs = list(dict.fromkeys([*codecs, *wanted_codecs]))
          if merged_codecs != codecs:
            config["HardwareDecodingCodecs"] = merged_codecs
            changed = True

          if not changed:
            print("[jellyfin-bootstrap] encoding configuration already up to date.")
            return

          _request_json("POST", "/System/Configuration/Encoding", api_key, body=config)
          print("[jellyfin-bootstrap] encoding configuration updated for VAAPI.")
          return
        except urllib.error.HTTPError as err:
          if err.code == 401:
            print("[jellyfin-bootstrap] api key unauthorized for encoding configuration; skipping.")
            return
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] encoding configuration API not ready (attempt {attempt}/{MAX_RETRIES}): HTTP {err.code}")
            time.sleep(3)
            continue
          raise
        except (urllib.error.URLError, TimeoutError) as err:
          if attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] encoding configuration API unavailable (attempt {attempt}/{MAX_RETRIES}): {err}")
            time.sleep(3)
            continue
          raise


    def bootstrap() -> int:
      ensure_startup_wizard_completed()
      ensure_runtime_startup_wizard_completed()

      api_key = read_api_key()
      if not api_key:
        print("[jellyfin-bootstrap] api_key missing; skipping.")
        return 0

      if not DB_PATH.exists():
        print(f"[jellyfin-bootstrap] db missing at {DB_PATH}; skipping.")
        return 0

      for attempt in range(1, MAX_RETRIES + 1):
        try:
          conn = sqlite3.connect(DB_PATH)
          conn.execute("PRAGMA busy_timeout = 5000;")
          cur = conn.cursor()

          cur.execute("SELECT AccessToken FROM ApiKeys WHERE Name = ?", (KEY_NAME,))
          row = cur.fetchone()
          if row and row[0] == api_key:
            print("[jellyfin-bootstrap] api key already up to date.")
            conn.close()
            ensure_network_configuration(api_key)
            ensure_system_configuration(api_key)
            ensure_encoding_configuration(api_key)
            ensure_libraries(api_key)
            ensure_user_library_display_order(api_key)
            return 0

          timestamp = now_utc()
          cur.execute("DELETE FROM ApiKeys WHERE Name = ?", (KEY_NAME,))
          cur.execute(
            """
            INSERT INTO ApiKeys (DateCreated, DateLastActivity, Name, AccessToken)
            VALUES (?, ?, ?, ?)
            """,
            (timestamp, timestamp, KEY_NAME, api_key),
          )
          conn.commit()
          conn.close()
          print("[jellyfin-bootstrap] api key upserted.")
          ensure_network_configuration(api_key)
          ensure_system_configuration(api_key)
          ensure_encoding_configuration(api_key)
          ensure_libraries(api_key)
          ensure_user_library_display_order(api_key)
          return 0
        except sqlite3.OperationalError as err:
          if "locked" in str(err).lower() and attempt < MAX_RETRIES:
            print(f"[jellyfin-bootstrap] db locked (attempt {attempt}/{MAX_RETRIES}); retrying.")
            time.sleep(3)
            continue
          print(f"[jellyfin-bootstrap] sqlite error: {err}", file=sys.stderr)
          return 1
        except Exception as err:  # noqa: BLE001
          print(f"[jellyfin-bootstrap] unexpected error: {err}", file=sys.stderr)
          return 1
      print("[jellyfin-bootstrap] retry budget exhausted.", file=sys.stderr)
      return 1


    if __name__ == "__main__":
      raise SystemExit(bootstrap())
