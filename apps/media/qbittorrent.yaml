apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  suspend: ${qbittorrent_suspended:=false}
  interval: 10m0s
  timeout: 10m0s
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    controllers:
      main:
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        replicas: ${qbittorrent_replicas:=1}
        initContainers:
          prepare-downloads:
            image:
              repository: alpine
              tag: "3.20"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                mkdir -p \
                  /media/downloads/incomplete \
                  /media/downloads/movies \
                  /media/downloads/tv \
                  /media/downloads/music \
                  /media/downloads/books \
                  /media/downloads/other \
                  /media/downloads/metube \
                  /media/downloads/metube-incomplete \
                  /media/movies \
                  /media/tv \
                  /media/music \
                  /media/books

                link_empty_dir() {
                  old="$1"
                  target="$2"
                  mkdir -p "$target"
                  if [ -L "$old" ]; then
                    current_target="$(readlink "$old")"
                    if [ "$current_target" != "$target" ]; then
                      rm "$old"
                      ln -s "$target" "$old"
                    fi
                    return 0
                  fi
                  if [ -d "$old" ] && [ -z "$(ls -A "$old" 2>/dev/null)" ]; then
                    rmdir "$old"
                    ln -s "$target" "$old"
                    return 0
                  fi
                  if [ ! -e "$old" ]; then
                    ln -s "$target" "$old"
                  fi
                }

                link_empty_dir /media/downloads/radarr /media/downloads/movies
                link_empty_dir /media/downloads/sonarr /media/downloads/tv
                link_empty_dir /media/downloads/lidarr /media/downloads/music
                link_empty_dir /media/downloads/readarr /media/downloads/books
                link_empty_dir /media/downloads/radarr-imported /media/downloads/movies
                link_empty_dir /media/downloads/sonarr-imported /media/downloads/tv
                link_empty_dir /media/downloads/lidarr-imported /media/downloads/music
                link_empty_dir /media/downloads/readarr-imported /media/downloads/books

                chown "$PUID:$PGID" \
                  /media/downloads \
                  /media/downloads/incomplete \
                  /media/downloads/movies \
                  /media/downloads/tv \
                  /media/downloads/music \
                  /media/downloads/books \
                  /media/downloads/other \
                  /media/downloads/metube \
                  /media/downloads/metube-incomplete
                chmod 0775 \
                  /media/downloads \
                  /media/downloads/incomplete \
                  /media/downloads/movies \
                  /media/downloads/tv \
                  /media/downloads/music \
                  /media/downloads/books \
                  /media/downloads/other \
                  /media/downloads/metube \
                  /media/downloads/metube-incomplete

                find /media/downloads/incomplete -mindepth 1 -maxdepth 1 -exec chown -R "$PUID:$PGID" {} \;
            env:
              PUID: ${media_puid}
              PGID: ${media_pgid}
          seed-config:
            image:
              repository: alpine
              tag: "3.20"
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /config/qBittorrent
                if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
                  cp /config-template/qBittorrent.conf /config/qBittorrent/qBittorrent.conf
                fi

                config=/config/qBittorrent/qBittorrent.conf
                ensure_pref() {
                  key="$1"
                  value="$2"
                  if grep -q "^$key=" "$config"; then
                    sed -i "s|^$key=.*|$key=$value|" "$config"
                  else
                    echo "$key=$value" >> "$config"
                  fi
                }

                ensure_section_pref() {
                  section="$1"
                  key="$2"
                  value="$3"
                  if ! grep -qx "\\[$section\\]" "$config"; then
                    printf '\n[%s]\n' "$section" >> "$config"
                  fi
                  if grep -q "^$key=" "$config"; then
                    sed -i "s|^$key=.*|$key=$value|" "$config"
                  else
                    sed -i "/^\\[$section\\]$/a$key=$value" "$config"
                  fi
                }

                ensure_section_pref 'BitTorrent' 'Session\\AddTrackersFromURLEnabled' 'false'
                ensure_section_pref 'BitTorrent' 'Session\\AdditionalTrackersURL' ''
                ensure_section_pref 'BitTorrent' 'Session\\GlobalMaxRatio' '-1'
                ensure_section_pref 'BitTorrent' 'Session\\GlobalMaxSeedingMinutes' '-1'
                ensure_section_pref 'BitTorrent' 'Session\\GlobalMaxInactiveSeedingMinutes' '-1'
                ensure_section_pref 'BitTorrent' 'Session\\Interface' 'tun0'
                ensure_section_pref 'BitTorrent' 'Session\\InterfaceName' 'tun0'
                ensure_section_pref 'BitTorrent' 'Session\\InterfaceAddress' ''
                ensure_section_pref 'BitTorrent' 'Session\\LSDEnabled' 'false'
                ensure_section_pref 'BitTorrent' 'Session\\Port' '6881'
                ensure_section_pref 'BitTorrent' 'Session\\MaxActiveDownloads' '${qbittorrent_max_active_downloads:=30}'
                ensure_section_pref 'BitTorrent' 'Session\\MaxActiveTorrents' '${qbittorrent_max_active_torrents:=500}'
                ensure_section_pref 'BitTorrent' 'Session\\MaxActiveUploads' '${qbittorrent_max_active_uploads:=300}'
                ensure_section_pref 'BitTorrent' 'Session\\MaxUploads' '200'
                ensure_section_pref 'BitTorrent' 'Session\\QueueingSystemEnabled' 'true'
                ensure_section_pref 'BitTorrent' 'Session\\ShareLimitAction' 'Stop'

                ensure_pref 'Connection\\Interface' 'tun0'
                ensure_pref 'Connection\\InterfaceAddress' ''
                ensure_pref 'WebUI\\Authentication\\Enabled' 'false'
                ensure_pref 'WebUI\\AuthSubnetWhitelistEnabled' 'true'
                ensure_pref 'WebUI\\AuthSubnetWhitelist' '${k8s_pod_cidr},${k8s_service_cidr}'
                ensure_pref 'Downloads\\SavePath' '/media/downloads/other'
                ensure_pref 'Downloads\\TempPath' '/media/downloads/incomplete'
                ensure_pref 'Downloads\\TempPathEnabled' 'true'

                sed -i '/^=$/d' "$config"
        containers:
          gluetun:
            image:
              repository: qmcgaw/gluetun
              tag: v3.40.0
            env:
              TZ: ${media_timezone}
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              IPV6: "on"
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_private_key
              WIREGUARD_ADDRESSES:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_addresses
              WIREGUARD_PUBLIC_KEY:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_public_key
              WIREGUARD_ENDPOINT_IP:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_endpoint_ip
              WIREGUARD_ENDPOINT_PORT:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_endpoint_port
              WIREGUARD_ALLOWED_IPS:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_allowed_ips
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              WIREGUARD_MTU: "1280"
              DNS_ADDRESS:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_dns
              DOT: "off"
              VPN_PORT_FORWARDING: "on"
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              VPN_PORT_FORWARDING_STATUS_FILE: /tmp/gluetun/forwarded_port
              VPN_PORT_FORWARDING_UP_COMMAND:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_pf_up_command
              VPN_PORT_FORWARDING_DOWN_COMMAND:
                valueFrom:
                  secretKeyRef:
                    name: media-protonvpn
                    key: wireguard_pf_down_command
              HEALTH_TARGET_ADDRESS: "10.2.0.1:53"
              HEALTH_ICMP_TARGET_IPS: "10.2.0.1"
              HEALTH_RESTART_VPN: "on"
              HEALTH_VPN_DURATION_INITIAL: "20m"
              HEALTH_VPN_DURATION_ADDITION: "5m"
              HEALTH_SUCCESS_WAIT_DURATION: "60s"
              HEALTH_READ_TIMEOUT: "5s"
              HEALTH_READ_HEADER_TIMEOUT: "2s"
              PUBLICIP_ENABLED: "off"
              FIREWALL_INPUT_PORTS: "8080,6881"
              FIREWALL_OUTBOUND_SUBNETS: "${k8s_pod_cidr},${k8s_service_cidr}"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 384Mi
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              privileged: true
          main:
            image:
              repository: lscr.io/linuxserver/qbittorrent
              tag: 5.1.4
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      if [ ! -e /downloads ]; then
                        ln -s /media/downloads /downloads
                      fi
            env:
              TZ: ${media_timezone}
              PUID: ${media_puid}
              PGID: ${media_pgid}
              WEBUI_PORT: "8080"
              TORRENTING_PORT: "6881"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 4Gi
          port-sync:
            image:
              repository: python
              tag: "3.12-alpine"
            command:
              - /usr/local/bin/python
              - -c
              - |
                import json
                import sys
                import time
                import urllib.parse
                import urllib.request
                from urllib.error import HTTPError, URLError

                last_port = None
                prefs_url = "http://127.0.0.1:8080/api/v2/app/preferences"
                set_url = "http://127.0.0.1:8080/api/v2/app/setPreferences"
                port_file = "/tmp/gluetun/forwarded_port"

                def read_forwarded_port():
                    try:
                        with open(port_file, "r", encoding="utf-8") as handle:
                            port = handle.read().strip()
                    except FileNotFoundError:
                        return None
                    if not port.isdigit():
                        return None
                    return int(port)

                def get_preferences():
                    with urllib.request.urlopen(prefs_url, timeout=10) as response:
                        return json.loads(response.read().decode("utf-8"))

                def set_preferences(payload):
                    data = urllib.parse.urlencode({"json": json.dumps(payload)}).encode("utf-8")
                    request = urllib.request.Request(url=set_url, data=data, method="POST")
                    with urllib.request.urlopen(request, timeout=10):
                        return

                while True:
                    port = read_forwarded_port()
                    if port is None:
                        time.sleep(30)
                        continue

                    try:
                        prefs = get_preferences()
                        desired = {
                            "listen_port": port,
                            "current_interface_name": "tun0",
                            "current_network_interface": "tun0",
                            "current_interface_address": "",
                            "random_port": False,
                            "upnp": False,
                        }
                        needs_update = any(prefs.get(key) != value for key, value in desired.items())
                        if needs_update:
                            set_preferences(desired)
                            print(f"[port-sync] set qBittorrent listen_port={port} interface=tun0", flush=True)
                        elif port != last_port:
                            print(f"[port-sync] qBittorrent already synced listen_port={port}", flush=True)
                        last_port = port
                    except (HTTPError, URLError, TimeoutError, ConnectionError, json.JSONDecodeError) as exc:
                        print(f"[port-sync] waiting for qBittorrent API: {exc}", file=sys.stderr, flush=True)

                    time.sleep(30)
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 64Mi
    service:
      main:
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${default_cluster_issuer}
          external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
        hosts:
          - host: qbittorrent${public_host_suffix}.${delegating_domain}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: qbittorrent-tls
            hosts:
              - qbittorrent${public_host_suffix}.${delegating_domain}
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: ${arr_config_storage_class_name}
        size: ${arr_config_size}
        globalMounts:
          - path: /config
      media:
        enabled: true
        existingClaim: arr-media-v2
        globalMounts:
          - path: /media
      config-template:
        enabled: true
        type: configMap
        name: qbittorrent-config
        globalMounts:
          - path: /config-template/qBittorrent.conf
            subPath: qBittorrent.conf
      tun:
        enabled: true
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/net/tun
      gluetun-tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp/gluetun
