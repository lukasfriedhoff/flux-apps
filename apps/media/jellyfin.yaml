apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        initContainers:
          install-sso-plugin:
            image:
              repository: alpine
              tag: 3.20.3
              pullPolicy: Always
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                apk add --no-cache \
                  --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/main \
                  --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/community \
                  ca-certificates curl unzip
                update-ca-certificates
                plugin_dir=/config/data/plugins/sso
                version_file=$plugin_dir/.version
                config_seed=/config-seed/SSO-Auth.xml
                config_target=/config/data/plugins/configurations/SSO-Auth.xml
                plugin_version=4.0.0.3
                plugin_url=https://github.com/9p4/jellyfin-plugin-sso/releases/download/v4.0.0.3/sso-authentication_4.0.0.3.zip
                plugin_sha256=de0951255bec4ed646037641e7e0aa1210b3a00a141406548087bed994cb9bdd

                if [ -f "$version_file" ] && [ "$(cat "$version_file")" = "$plugin_version" ]; then
                  echo "SSO plugin $plugin_version already installed"
                else
                  tmp_dir=$(mktemp -d)
                  curl -fsSL --retry 3 --retry-delay 2 -o "$tmp_dir/sso.zip" "$plugin_url"
                  echo "$plugin_sha256  $tmp_dir/sso.zip" | sha256sum -c -
                  mkdir -p "$plugin_dir"
                  unzip -o "$tmp_dir/sso.zip" -d "$tmp_dir/unpacked"
                  cp -f "$tmp_dir"/unpacked/*.dll "$plugin_dir/"
                  echo "$plugin_version" > "$version_file"
                  chown -R "$PUID:$PGID" "$plugin_dir"
                fi

                if [ -f "$config_seed" ] && [ ! -s "$config_target" ]; then
                  mkdir -p "$(dirname "$config_target")"
                  cp -f "$config_seed" "$config_target"
                  chown "$PUID:$PGID" "$config_target"
                fi
            env:
              PUID: ${media_puid}
              PGID: ${media_pgid}
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/jellyfin
              tag: 10.11.6
            env:
              TZ: ${media_timezone}
              PUID: ${media_puid}
              PGID: ${media_pgid}
    service:
      main:
        ports:
          http:
            port: 8096
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${default_cluster_issuer}
          external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: jellyfin${public_host_suffix}.${delegating_domain}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: jellyfin-tls
            hosts:
              - jellyfin${public_host_suffix}.${delegating_domain}
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: ${arr_config_storage_class_name}
        size: ${arr_config_size}
        globalMounts:
          - path: /config
      branding:
        enabled: true
        type: configMap
        name: jellyfin-branding
        globalMounts:
          - path: /config/branding.xml
            subPath: branding.xml
      sso-seed:
        enabled: true
        type: secret
        name: jellyfin-sso
        globalMounts:
          - path: /config-seed/SSO-Auth.xml
            subPath: SSO-Auth.xml
      media:
        enabled: true
        existingClaim: arr-media
        globalMounts:
          - path: /media
      transcode:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcode
