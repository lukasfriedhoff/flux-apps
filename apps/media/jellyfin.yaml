apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        replicas: 1
        pod:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: h4xx.io/gpu.vendor
                        operator: In
                        values:
                          - amd
                - weight: 50
                  preference:
                    matchExpressions:
                      - key: h4xx.io/gpu.vendor
                        operator: In
                        values:
                          - intel
        initContainers:
          install-sso-plugin:
            image:
              repository: python
              tag: 3.12.11-slim
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                plugin_dir=/config/data/plugins/sso
                version_file=$plugin_dir/.version
                config_seed=/config-seed/SSO-Auth.xml
                config_target=/config/data/plugins/configurations/SSO-Auth.xml
                plugin_version=4.0.0.3
                plugin_url=https://github.com/9p4/jellyfin-plugin-sso/releases/download/v4.0.0.3/sso-authentication_4.0.0.3.zip
                plugin_sha256=de0951255bec4ed646037641e7e0aa1210b3a00a141406548087bed994cb9bdd

                if [ -f "$version_file" ] && [ "$(cat "$version_file")" = "$plugin_version" ]; then
                  echo "SSO plugin $plugin_version already installed"
                else
                  tmp_dir=$(mktemp -d)
                  python3 -c 'import hashlib,sys,urllib.request;u,s,o=sys.argv[1:4];d=urllib.request.urlopen(u,timeout=60).read();h=hashlib.sha256(d).hexdigest();assert h==s,f"checksum mismatch: {h} != {s}";open(o,"wb").write(d)' "$plugin_url" "$plugin_sha256" "$tmp_dir/sso.zip"
                  mkdir -p "$plugin_dir"
                  python3 -c 'import sys,zipfile;z,o=sys.argv[1:3];zipfile.ZipFile(z).extractall(o)' "$tmp_dir/sso.zip" "$tmp_dir/unpacked"
                  cp -f "$tmp_dir"/unpacked/*.dll "$plugin_dir/"
                  echo "$plugin_version" > "$version_file"
                  chown -R "$PUID:$PGID" "$plugin_dir"
                  rm -rf "$tmp_dir"
                fi

                if [ -f "$config_seed" ]; then
                  mkdir -p "$(dirname "$config_target")"
                  if [ ! -s "$config_target" ] || ! cmp -s "$config_seed" "$config_target"; then
                    cp -f "$config_seed" "$config_target"
                    chown "$PUID:$PGID" "$config_target"
                    echo "SSO seed config synchronized"
                  fi
                fi

                if [ -s "$config_target" ] && [ -n "$${OIDC_ISSUER_URL:-}" ]; then
                  escaped_issuer=$(printf '%s' "$${OIDC_ISSUER_URL}" | sed 's/[\/&]/\\&/g')
                  sed -i -E "s#<OidEndpoint>[^<]+</OidEndpoint>#<OidEndpoint>$${escaped_issuer}</OidEndpoint>#" "$config_target"
                fi
            env:
              PUID: ${media_puid}
              PGID: ${media_pgid}
              OIDC_ISSUER_URL: https://auth${public_host_suffix}.${delegating_domain}
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/jellyfin
              tag: 10.11.6
            securityContext:
              privileged: ${jellyfin_gpu_privileged:=false}
            env:
              TZ: ${media_timezone}
              PUID: ${media_puid}
              PGID: ${media_pgid}
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 4000m
                memory: 4Gi
    service:
      main:
        ports:
          http:
            port: 8096
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${default_cluster_issuer}
          external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: jellyfin${public_host_suffix}.${delegating_domain}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: jellyfin-tls
            hosts:
              - jellyfin${public_host_suffix}.${delegating_domain}
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: ${arr_config_storage_class_name}
        size: ${jellyfin_config_size:=${arr_config_size}}
        globalMounts:
          - path: /config
      branding:
        enabled: true
        type: configMap
        name: jellyfin-branding
        globalMounts:
          - path: /config/branding.xml
            subPath: branding.xml
      sso-seed:
        enabled: true
        type: secret
        name: jellyfin-sso
        globalMounts:
          - path: /config-seed/SSO-Auth.xml
            subPath: SSO-Auth.xml
      media:
        enabled: true
        existingClaim: arr-media-v2
        globalMounts:
          - path: /media
      transcode:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcode
      gpu:
        enabled: ${jellyfin_gpu_enabled:=false}
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        globalMounts:
          - path: /dev/dri
