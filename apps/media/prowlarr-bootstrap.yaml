apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr-bootstrap
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        type: cronjob
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - prowlarr
                  topologyKey: kubernetes.io/hostname
        cronjob:
          schedule: "*/30 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 600
          ttlSecondsAfterFinished: 300
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/qbittorrent
              tag: 5.1.4
            command:
              - /bin/sh
              - -c
            args:
              - /scripts/bootstrap.sh || { echo '[prowlarr-bootstrap] bootstrap failed; will retry next run.'; exit 0; }
            env:
              PROWLARR_URL: http://prowlarr:9696
              LIDARR_URL: http://lidarr:8686
              MEDIA_PUID: ${media_puid}
              MEDIA_PGID: ${media_pgid}
              ENABLE_DUAL_AUDIO_POLICY: ${media_enable_dual_audio_policy:=false}
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${arr_api_keys_secret_name}
                    key: sonarr_api_key
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${arr_api_keys_secret_name}
                    key: radarr_api_key
              LIDARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${arr_api_keys_secret_name}
                    key: lidarr_api_key
              READARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${arr_api_keys_secret_name}
                    key: readarr_api_key
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
    persistence:
      script:
        enabled: true
        type: configMap
        name: prowlarr-bootstrap-config
        defaultMode: 0555
        globalMounts:
          - path: /scripts/bootstrap.sh
            subPath: bootstrap.sh
            readOnly: true
      prowlarr:
        enabled: true
        existingClaim: prowlarr
        globalMounts:
          - path: /mnt/prowlarr
            readOnly: true
      media-library:
        enabled: true
        existingClaim: arr-media
        globalMounts:
          - path: /mnt/arr-media
      private-trackers:
        enabled: ${media_private_trackers_secret_enabled}
        type: secret
        name: prowlarr-private-trackers
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets/prowlarr-private-trackers
            readOnly: true
