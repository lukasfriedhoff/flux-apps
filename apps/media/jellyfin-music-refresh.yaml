apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-music-refresh
  namespace: media
spec:
  schedule: "${jellyfin_music_refresh_cron:=0/10 * * * *}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 420
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: refresh
              image: curlimages/curl:8.16.0
              env:
                - name: JELLYFIN_BASE_URL
                  value: ${jellyfin_internal_base_url}
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${jellyfin_e2e_auth_secret_name}
                      key: api_key
                - name: JELLYFIN_WAIT_TIMEOUT_SECONDS
                  value: "${jellyfin_sync_wait_timeout_seconds:=300}"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  deadline=$(( $(date +%s) + JELLYFIN_WAIT_TIMEOUT_SECONDS ))
                  until curl -fsS -m 10 "$JELLYFIN_BASE_URL/health" >/dev/null; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "[jellyfin-music-refresh] Jellyfin did not become ready within ${JELLYFIN_WAIT_TIMEOUT_SECONDS}s" >&2
                      exit 1
                    fi
                    sleep 5
                  done
                  curl -fsS -m 30 \
                    -H "X-MediaBrowser-Token: $JELLYFIN_API_KEY" \
                    -X POST \
                    "$JELLYFIN_BASE_URL/Library/Refresh?metadataRefreshMode=Default&imageRefreshMode=None&replaceAllMetadata=false&replaceAllImages=false" >/dev/null
                  echo "[jellyfin-music-refresh] triggered library refresh"
