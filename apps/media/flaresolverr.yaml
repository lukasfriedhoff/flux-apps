apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.4.6
            env:
              TZ: ${media_timezone}
              LOG_LEVEL: info
              BROWSER_TIMEOUT: "240000"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1500m
                memory: 1Gi
    persistence:
      shm:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /dev/shm
    service:
      main:
        ports:
          http:
            port: 8191
