apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    controllers:
      main:
        initContainers:
          bootstrap-config:
            image:
              repository: alpine
              tag: "3.20.0"
            env:
              JELLYSEERR_APP_TITLE: Jellyseerr
              JELLYSEERR_APP_URL: https://jellyseerr${public_host_suffix}.${delegating_domain}
              JELLYFIN_SERVER_NAME: Jellyfin
              JELLYFIN_SERVER_HOST: jellyfin
              JELLYFIN_SERVER_PORT: "8096"
              JELLYFIN_SERVER_USE_SSL: "false"
              JELLYFIN_HOSTNAME: http://jellyfin:8096
              JELLYFIN_EXTERNAL_HOSTNAME: jellyfin${public_host_suffix}.${delegating_domain}
              JELLYFIN_FORGOT_PASSWORD_URL: https://jellyfin${public_host_suffix}.${delegating_domain}/web/index.html#!/forgotpassword.html
              OIDC_PROVIDER_NAME: Authelia
              OIDC_PROVIDER_SLUG: authelia
              OIDC_ISSUER_URL: https://auth${public_host_suffix}.${delegating_domain}
              OIDC_CLIENT_ID: jellyseerr
              OIDC_SCOPES: openid profile email groups
              RADARR_EXTERNAL_URL: https://radarr${public_host_suffix}.${delegating_domain}
              SONARR_EXTERNAL_URL: https://sonarr${public_host_suffix}.${delegating_domain}
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${arr_api_keys_secret_name}
                    key: radarr_api_key
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${arr_api_keys_secret_name}
                    key: sonarr_api_key
            command:
              - /bin/sh
              - -c
              - |
                set -eu

                apk add --no-cache curl jq >/dev/null

                # seerr preview images run as uid/gid 1000; normalize existing PVC ownership.
                if [ -d /app/config ]; then
                  chown -R 1000:1000 /app/config
                  chmod -R u+rwX /app/config
                fi
                mkdir -p /app/config/logs
                chown -R 1000:1000 /app/config/logs

                settings_file="/app/config/settings.json"
                settings_json='{}'
                if [ -s "$settings_file" ]; then
                  settings_json="$(cat "$settings_file")"
                else
                  echo "[jellyseerr-bootstrap] settings.json missing; bootstrapping from empty config."
                fi

                wait_for_arr() {
                  base_url="$1"
                  api_key="$2"
                  attempts=0
                  while [ "$attempts" -lt 20 ]; do
                    if curl -fsS -m 5 -H "X-Api-Key: $api_key" "$base_url/system/status" >/dev/null 2>&1; then
                      return 0
                    fi
                    attempts=$((attempts + 1))
                    sleep 3
                  done
                  return 1
                }

                settings_json="$(
                  printf '%s' "$settings_json" \
                  | jq --arg appTitle "$${JELLYSEERR_APP_TITLE:-Jellyseerr}" --arg appUrl "$${JELLYSEERR_APP_URL:-}" --arg jellyfinName "$${JELLYFIN_SERVER_NAME:-Jellyfin}" --arg jellyfinIP "$${JELLYFIN_SERVER_HOST:-jellyfin}" --arg jellyfinPort "$${JELLYFIN_SERVER_PORT:-8096}" --arg jellyfinHost "$${JELLYFIN_HOSTNAME:-http://jellyfin:8096}" --arg jellyfinExternal "$${JELLYFIN_EXTERNAL_HOSTNAME:-}" --arg forgotPassword "$${JELLYFIN_FORGOT_PASSWORD_URL:-}" --arg oidcName "$${OIDC_PROVIDER_NAME:-Authelia}" --arg oidcSlug "$${OIDC_PROVIDER_SLUG:-authelia}" --arg oidcIssuer "$${OIDC_ISSUER_URL:-}" --arg oidcClientId "$${OIDC_CLIENT_ID:-jellyseerr}" --arg oidcScopes "$${OIDC_SCOPES:-openid profile email groups}" --argjson jellyfinUseSsl "$${JELLYFIN_SERVER_USE_SSL:-false}" '
                    .main.applicationTitle = $appTitle
                    | .main.applicationUrl = $appUrl
                    | .main.mediaServerType = 4
                    | .main.oidcLogin = true
                    | .main.localLogin = true
                    | .main.mediaServerLogin = true
                    | .oidc = (.oidc // {})
                    | .oidc.providers = [
                        {
                          slug: ($oidcSlug | ascii_downcase),
                          name: $oidcName,
                          issuerUrl: $oidcIssuer,
                          clientId: $oidcClientId,
                          scopes: $oidcScopes,
                          newUserLogin: true
                        }
                      ]
                    | .jellyfin.name = $jellyfinName
                    | .jellyfin.ip = $jellyfinIP
                    | .jellyfin.port = $jellyfinPort
                    | .jellyfin.useSsl = $jellyfinUseSsl
                    | .jellyfin.hostname = $jellyfinHost
                    | .jellyfin.externalHostname = $jellyfinExternal
                    | .jellyfin.jellyfinForgotPasswordUrl = $forgotPassword
                    | .public.initialized = true
                  '
                )"

                if [ -n "$${RADARR_API_KEY:-}" ] && wait_for_arr "http://radarr:7878/api/v3" "$RADARR_API_KEY"; then
                  radarr_profile_json="$(curl -fsS -m 20 -H "X-Api-Key: $RADARR_API_KEY" "http://radarr:7878/api/v3/qualityprofile")"
                  radarr_root_json="$(curl -fsS -m 20 -H "X-Api-Key: $RADARR_API_KEY" "http://radarr:7878/api/v3/rootfolder")"
                  radarr_profile_id="$(printf '%s' "$radarr_profile_json" | jq -r 'map(select(.name == "HD - 720p/1080p"))[0].id // map(select(.name | test("1080|HD"; "i")))[0].id // .[0].id // 0')"
                  radarr_profile_name="$(printf '%s' "$radarr_profile_json" | jq -r 'map(select(.name == "HD - 720p/1080p"))[0].name // map(select(.name | test("1080|HD"; "i")))[0].name // .[0].name // "Any"')"
                  radarr_root_dir="$(printf '%s' "$radarr_root_json" | jq -r '.[0].path // "/media/movies"')"
                  radarr_service="$(
                    jq -cn \
                      --arg apiKey "$RADARR_API_KEY" \
                      --arg activeProfileName "$radarr_profile_name" \
                      --arg activeDirectory "$radarr_root_dir" \
                      --arg externalUrl "$${RADARR_EXTERNAL_URL:-}" \
                      --argjson activeProfileId "$radarr_profile_id" \
                      '{
                        name: "radarr",
                        hostname: "radarr",
                        port: 7878,
                        apiKey: $apiKey,
                        useSsl: false,
                        baseUrl: "",
                        activeProfileId: $activeProfileId,
                        activeProfileName: $activeProfileName,
                        activeDirectory: $activeDirectory,
                        is4k: false,
                        minimumAvailability: "released",
                        isDefault: true,
                        externalUrl: $externalUrl,
                        syncEnabled: true,
                        preventSearch: false
                      }'
                  )"
                  settings_json="$(printf '%s' "$settings_json" | jq --argjson svc "$radarr_service" '.radarr = [$svc]')"
                fi

                if [ -n "$${SONARR_API_KEY:-}" ] && wait_for_arr "http://sonarr:8989/api/v3" "$SONARR_API_KEY"; then
                  sonarr_profile_json="$(curl -fsS -m 20 -H "X-Api-Key: $SONARR_API_KEY" "http://sonarr:8989/api/v3/qualityprofile")"
                  sonarr_language_json="$(curl -fsS -m 20 -H "X-Api-Key: $SONARR_API_KEY" "http://sonarr:8989/api/v3/languageprofile")"
                  sonarr_root_json="$(curl -fsS -m 20 -H "X-Api-Key: $SONARR_API_KEY" "http://sonarr:8989/api/v3/rootfolder")"
                  sonarr_profile_id="$(printf '%s' "$sonarr_profile_json" | jq -r 'map(select(.name == "HD - 720p/1080p"))[0].id // map(select(.name | test("1080|HD"; "i")))[0].id // .[0].id // 0')"
                  sonarr_profile_name="$(printf '%s' "$sonarr_profile_json" | jq -r 'map(select(.name == "HD - 720p/1080p"))[0].name // map(select(.name | test("1080|HD"; "i")))[0].name // .[0].name // "Any"')"
                  sonarr_language_id="$(printf '%s' "$sonarr_language_json" | jq -r 'map(select(.name == "German + English"))[0].id // .[0].id // 1')"
                  sonarr_root_dir="$(printf '%s' "$sonarr_root_json" | jq -r '.[0].path // "/media/tv"')"
                  sonarr_service="$(
                    jq -cn \
                      --arg apiKey "$SONARR_API_KEY" \
                      --arg activeProfileName "$sonarr_profile_name" \
                      --arg activeDirectory "$sonarr_root_dir" \
                      --arg externalUrl "$${SONARR_EXTERNAL_URL:-}" \
                      --argjson activeProfileId "$sonarr_profile_id" \
                      --argjson activeLanguageProfileId "$sonarr_language_id" \
                      '{
                        name: "sonarr",
                        hostname: "sonarr",
                        port: 8989,
                        apiKey: $apiKey,
                        useSsl: false,
                        baseUrl: "",
                        activeProfileId: $activeProfileId,
                        activeProfileName: $activeProfileName,
                        activeDirectory: $activeDirectory,
                        activeLanguageProfileId: $activeLanguageProfileId,
                        is4k: false,
                        enableSeasonFolders: true,
                        isDefault: true,
                        externalUrl: $externalUrl,
                        syncEnabled: true,
                        preventSearch: false
                      }'
                  )"
                  settings_json="$(printf '%s' "$settings_json" | jq --argjson svc "$sonarr_service" '.sonarr = [$svc]')"
                fi

                printf '%s\n' "$settings_json" > "$${settings_file}.tmp"
                mv "$${settings_file}.tmp" "$settings_file"
                echo "[jellyseerr-bootstrap] settings updated."
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: preview-new-oidc
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            env:
              TZ: ${media_timezone}
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                cpu: 1000m
                memory: 512Mi
    service:
      main:
        ports:
          http:
            port: 5055
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${default_cluster_issuer}
          external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
        hosts:
          - host: jellyseerr${public_host_suffix}.${delegating_domain}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: jellyseerr-tls
            hosts:
              - jellyseerr${public_host_suffix}.${delegating_domain}
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: ${arr_config_storage_class_name}
        size: ${arr_config_size}
        globalMounts:
          - path: /app/config
