apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          main:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 7.5.2
            command:
              - recyclarr
            args:
              - sync
              - --config
              - /config/recyclarr.yml
              - --secrets
              - /config/secrets.yml
            workingDir: /config
            env:
              TZ: ${media_timezone}
    persistence:
      config:
        enabled: true
        type: configMap
        name: recyclarr-config
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
      secret:
        enabled: true
        type: secret
        name: recyclarr-secrets
        globalMounts:
          - path: /config/secrets.yml
            subPath: secrets.yml
