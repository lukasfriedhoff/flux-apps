apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-download-promoter
  namespace: media
spec:
  schedule: "${media_download_promotion_cron}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: promote
              image: python:3.12-alpine
              env:
                - name: ENABLED
                  value: "${media_download_promotion_enabled}"
                - name: DRY_RUN
                  value: "${media_download_promotion_dry_run}"
                - name: MIN_AGE_HOURS
                  value: "${media_download_promotion_min_age_hours}"
                - name: CATEGORY_REGEX
                  value: "${media_download_promotion_category_regex}"
                - name: TARGET_BASE
                  value: "${media_download_promotion_target_base}"
                - name: QB_URL
                  value: "http://qbittorrent:8080"
              volumeMounts:
                - name: media
                  mountPath: /media
              command:
                - /usr/local/bin/python
                - -c
                - |
                  import json
                  import os
                  import re
                  import sys
                  import time
                  import urllib.parse
                  import urllib.request
                  from urllib.error import HTTPError, URLError

                  TRUE_TOKENS = {"true", "1", "yes", "on", "enabled"}


                  def env_true(name: str, default: str) -> bool:
                      value = os.getenv(name, default)
                      return str(value).strip().lower() in TRUE_TOKENS


                  def http_get_json(url: str):
                      with urllib.request.urlopen(url, timeout=30) as resp:
                          return json.loads(resp.read().decode("utf-8"))


                  def http_post_form(url: str, payload: dict):
                      data = urllib.parse.urlencode(payload).encode("utf-8")
                      req = urllib.request.Request(url=url, data=data, method="POST")
                      with urllib.request.urlopen(req, timeout=30):
                          return


                  enabled = env_true("ENABLED", "disabled")
                  if not enabled:
                      print("[download-promoter] disabled")
                      sys.exit(0)

                  dry_run = env_true("DRY_RUN", "enabled")
                  min_age_raw = os.getenv("MIN_AGE_HOURS", "72h")
                  m = re.match(r"^([0-9]+)", min_age_raw or "")
                  if not m:
                      print(
                          f"[download-promoter] MIN_AGE_HOURS must start with a number, got: {min_age_raw}",
                          file=sys.stderr,
                      )
                      sys.exit(1)
                  min_age_seconds = int(m.group(1)) * 3600
                  now = int(time.time())
                  category_re = os.getenv(
                      "CATEGORY_REGEX", r"^(radarr|sonarr|lidarr|readarr)-imported$"
                  )
                  category_rx = re.compile(category_re)
                  target_base = os.getenv("TARGET_BASE", "/media/staged").rstrip("/")
                  qb_url = os.getenv("QB_URL", "http://qbittorrent:8080").rstrip("/")

                  try:
                      torrents = http_get_json(f"{qb_url}/api/v2/torrents/info?filter=completed")
                  except (HTTPError, URLError, TimeoutError) as exc:
                      print(
                          f"[download-promoter] failed to query qBittorrent API at {qb_url}: {exc}",
                          file=sys.stderr,
                      )
                      sys.exit(1)

                  candidates = []
                  for torrent in torrents:
                      category = str(torrent.get("category", ""))
                      completion_on = int(torrent.get("completion_on") or 0)
                      if not category_rx.search(category):
                          continue
                      if completion_on <= 0:
                          continue
                      if (now - completion_on) < min_age_seconds:
                          continue
                      candidates.append(torrent)

                  if not candidates:
                      print("[download-promoter] no torrents matched category/age policy")
                      sys.exit(0)

                  promoted = 0
                  skipped = 0
                  bucket_map = {
                      "radarr-imported": "movies",
                      "sonarr-imported": "tv",
                      "lidarr-imported": "music",
                      "readarr-imported": "books",
                  }

                  for torrent in candidates:
                      hash_ = str(torrent.get("hash", ""))
                      name = str(torrent.get("name", ""))
                      category = str(torrent.get("category", ""))
                      completion_on = int(torrent.get("completion_on") or 0)
                      age_hours = (now - completion_on) // 3600
                      bucket = bucket_map.get(category, "other")
                      target_dir = f"{target_base}/{bucket}"
                      os.makedirs(target_dir, exist_ok=True)

                      if dry_run:
                          print(
                              f"[download-promoter] DRY-RUN would move hash={hash_} "
                              f"name='{name}' category='{category}' age_h={age_hours} target='{target_dir}'"
                          )
                          skipped += 1
                          continue

                      try:
                          http_post_form(
                              f"{qb_url}/api/v2/torrents/setLocation",
                              {"hashes": hash_, "location": target_dir},
                          )
                      except (HTTPError, URLError, TimeoutError) as exc:
                          print(
                              f"[download-promoter] failed move hash={hash_} name='{name}' "
                              f"target='{target_dir}': {exc}",
                              file=sys.stderr,
                          )
                          continue

                      print(
                          f"[download-promoter] moved hash={hash_} name='{name}' "
                          f"category='{category}' age_h={age_hours} target='{target_dir}'"
                      )
                      promoted += 1

                  print(
                      f"[download-promoter] finished (promoted={promoted}, dry_run_skipped={skipped})"
                  )
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: arr-media
