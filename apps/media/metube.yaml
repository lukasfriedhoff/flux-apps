apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metube
  namespace: media
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 10m0s
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    controllers:
      main:
        replicas: 1
        initContainers:
          prepare-directories:
            image:
              repository: alpine
              tag: "3.20"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                mkdir -p \
                  "$DOWNLOAD_DIR" \
                  "$AUDIO_DOWNLOAD_DIR" \
                  "$TEMP_DIR" \
                  "$STATE_DIR"
                chown -R "$PUID:$PGID" \
                  "$DOWNLOAD_DIR" \
                  "$AUDIO_DOWNLOAD_DIR" \
                  "$TEMP_DIR" \
                  "$STATE_DIR"
            env:
              PUID: ${media_puid}
              PGID: ${media_pgid}
              DOWNLOAD_DIR: "${metube_video_download_dir:=/downloads/metube/videos}"
              AUDIO_DOWNLOAD_DIR: "${metube_audio_download_dir:=/downloads/metube/audio}"
              TEMP_DIR: /downloads/metube-incomplete
              STATE_DIR: /config
        containers:
          main:
            image:
              repository: ghcr.io/alexta69/metube
              tag: "${metube_image_tag:=2026.06.18}"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                cd /app
                python3 - <<'PY'
                from pathlib import Path

                path = Path("/app/app/main.py")
                text = path.read_text()
                needle = "    url = str(url).strip()\n"
                patch = """    url = str(url).strip()
                    if "youtube.com/watch" in url and "list=" in url:
                        from urllib.parse import parse_qs, urlparse

                        parsed = urlparse(url)
                        playlist_id = parse_qs(parsed.query).get("list", [""])[0]
                        if playlist_id:
                            url = f"https://www.youtube.com/playlist?list={playlist_id}"
                """
                if patch not in text:
                    path.write_text(text.replace(needle, patch, 1))
                PY
                exec python3 app/main.py
            env:
              TZ: ${media_timezone}
              PUID: ${media_puid}
              PGID: ${media_pgid}
              UMASK: "002"
              PORT: "8081"
              HOST: 0.0.0.0
              DOWNLOAD_DIR: "${metube_video_download_dir:=/downloads/metube/videos}"
              AUDIO_DOWNLOAD_DIR: "${metube_audio_download_dir:=/downloads/metube/audio}"
              STATE_DIR: /config
              TEMP_DIR: /downloads/metube-incomplete
              CUSTOM_DIRS: "true"
              CREATE_CUSTOM_DIRS: "true"
              DOWNLOAD_DIRS_INDEXABLE: "false"
              MAX_CONCURRENT_DOWNLOADS: "${metube_max_concurrent_downloads:=2}"
              CLEAR_COMPLETED_AFTER: "${metube_clear_completed_after:=604800}"
              DEFAULT_OPTION_PLAYLIST_ITEM_LIMIT: "${metube_playlist_item_limit:=0}"
              OUTPUT_TEMPLATE: "%(uploader)s/%(title)s.%(ext)s"
              OUTPUT_TEMPLATE_PLAYLIST: "%(playlist_title)s/%(playlist_index)03d - %(title)s.%(ext)s"
              OUTPUT_TEMPLATE_CHANNEL: "%(channel)s/%(upload_date)s - %(title)s.%(ext)s"
              YTDL_OPTIONS_PRESETS_FILE: /config-presets/presets.json
              ALLOW_YTDL_OPTIONS_OVERRIDES: "false"
              DEFAULT_THEME: dark
            resources:
              requests:
                cpu: 100m
                memory: "${metube_memory_request:=512Mi}"
              limits:
                cpu: 2000m
                memory: "${metube_memory_limit:=6Gi}"
    service:
      main:
        ports:
          http:
            port: 8081
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ${default_cluster_issuer}
          external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: metube${public_host_suffix}.${delegating_domain}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: metube-tls
            hosts:
              - metube${public_host_suffix}.${delegating_domain}
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: ${arr_config_storage_class_name}
        size: "${metube_config_size:=2Gi}"
        globalMounts:
          - path: /config
      presets:
        enabled: true
        type: configMap
        name: metube-presets
        globalMounts:
          - path: /config-presets
      downloads:
        enabled: true
        existingClaim: arr-downloads
        globalMounts:
          - path: /downloads
      media:
        enabled: true
        existingClaim: arr-media
        globalMounts:
          - path: /media
