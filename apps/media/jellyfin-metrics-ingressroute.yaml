---
# Jellyfin exposes /metrics on the same listener as the web UI, and its
# Ingress routes / for jellyfin.<domain>, so enabling EnableMetrics would also
# publish them. Jellyfin uses its own SSO rather than the Authelia
# forward-auth other media apps carry, so the path needs blocking explicitly.
#
# Traefik runs with allowCrossNamespace disabled, so the middleware has to live
# in this namespace rather than referencing traefik/authelia-forwardauth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-authelia-forwardauth
  namespace: media
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/verify
    trustForwardHeader: true
    authRequestHeaders:
      - Authorization
      - Cookie
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-metrics-protected
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: metrics
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # Built directly rather than via jellyfin_external_hostname: that
      # variable's value itself contains ${...}, and Flux substitution is a
      # single pass, so the inner references would survive into the rule.
      match: Host(`jellyfin${public_host_suffix}.${delegating_domain}`) && PathPrefix(`/metrics`)
      priority: 200
      middlewares:
        - name: jellyfin-authelia-forwardauth
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: jellyfin-tls
