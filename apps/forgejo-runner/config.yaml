apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: ${forgejo_namespace:=forgejo}
data:
  config.yml: |
    log:
      level: info
    runner:
      capacity: 2
      timeout: 3h
      fetch_timeout: 30s
      fetch_interval: 5s
    cache:
      enabled: true
    container:
      # Job containers get the dind daemon socket mounted, so `docker build`
      # and `docker compose` inside workflows just work.
      docker_host: automount
      force_pull: false
      # Named volumes a workflow may mount. The nix repo's CI keeps its /nix
      # store in `ci-nix-store-<nix version>` (on the dind PVC) so runs stop
      # re-downloading every flake input from scratch.
      valid_volumes:
        - ci-nix-store-*
