apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 10m0s
  chart:
    spec:
      chart: reloader
      version: 2.2.7
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
      interval: 10m0s
  values:
    reloader:
      watchGlobally: true
      reloadOnCreate: true
      reloadOnDelete: true
