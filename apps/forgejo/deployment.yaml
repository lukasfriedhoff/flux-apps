apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${forgejo_service_name}
  namespace: ${forgejo_namespace}
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: app
spec:
  replicas: ${forgejo_replicas}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap-admin
          image: ${forgejo_image}
          imagePullPolicy: ${forgejo_image_pull_policy}
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/docker-entrypoint.sh forgejo migrate \
                --config /var/lib/gitea/custom/conf/app.ini \
                --work-path /var/lib/gitea
              /usr/local/bin/docker-entrypoint.sh forgejo admin user create \
                --config /var/lib/gitea/custom/conf/app.ini \
                --work-path /var/lib/gitea \
                --admin \
                --username "$${FORGEJO_ADMIN_USERNAME}" \
                --password "$${FORGEJO_ADMIN_PASSWORD}" \
                --email "$${FORGEJO_ADMIN_EMAIL}" \
                --must-change-password=false || true
          env:
            - name: FORGEJO_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_admin_secret_name}
                  key: username
            - name: FORGEJO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_admin_secret_name}
                  key: password
            - name: FORGEJO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_admin_secret_name}
                  key: email
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__HOST
              value: ${forgejo_postgres_cluster_name}-rw.${forgejo_namespace}.svc.cluster.local:5432
            - name: GITEA__database__NAME
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_postgres_cluster_name}-app
                  key: dbname
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_postgres_cluster_name}-app
                  key: username
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_postgres_cluster_name}-app
                  key: password
            - name: GITEA__server__DOMAIN
              value: git${public_host_suffix}.${delegating_domain}
            - name: GITEA__server__ROOT_URL
              value: https://git${public_host_suffix}.${delegating_domain}/
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      containers:
        - name: forgejo
          image: ${forgejo_image}
          imagePullPolicy: ${forgejo_image_pull_policy}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__HOST
              value: ${forgejo_postgres_cluster_name}-rw.${forgejo_namespace}.svc.cluster.local:5432
            - name: GITEA__database__NAME
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_postgres_cluster_name}-app
                  key: dbname
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_postgres_cluster_name}-app
                  key: username
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: ${forgejo_postgres_cluster_name}-app
                  key: password
            - name: GITEA__server__DOMAIN
              value: git${public_host_suffix}.${delegating_domain}
            - name: GITEA__server__ROOT_URL
              value: https://git${public_host_suffix}.${delegating_domain}/
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__START_SSH_SERVER
              value: "true"
            - name: GITEA__server__SSH_DOMAIN
              value: git${public_host_suffix}.${delegating_domain}
            - name: GITEA__server__SSH_PORT
              value: ${forgejo_ssh_public_port}
            - name: GITEA__server__SSH_LISTEN_PORT
              value: "2222"
            - name: GITEA__server__LFS_START_SERVER
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: GITEA__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: GITEA__openid__ENABLE_OPENID_SIGNUP
              value: "false"
            - name: GITEA__repository__ENABLE_PUSH_CREATE_USER
              value: "true"
            - name: GITEA__repository__ENABLE_PUSH_CREATE_ORG
              value: "false"
            - name: GITEA__packages__ENABLED
              value: "true"
            - name: GITEA__actions__ENABLED
              value: "false"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: ${forgejo_requests_cpu}
              memory: ${forgejo_requests_memory}
              ephemeral-storage: ${forgejo_requests_ephemeral_storage}
            limits:
              memory: ${forgejo_limits_memory}
              ephemeral-storage: ${forgejo_limits_ephemeral_storage}
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${forgejo_service_name}-data
