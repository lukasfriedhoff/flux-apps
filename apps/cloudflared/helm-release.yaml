apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflared
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: cloudflare-tunnel
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: cloudflared
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: cloudflare-tunnel-credentials
      valuesKey: token
      targetPath: cloudflare.token
