apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: ${cloudflare_tunnel_id}
    credentials-file: /etc/cloudflared/credentials.json
    ingress:
      - hostname: nextcloud.${delegating_domain}
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          originServerName: nextcloud.${delegating_domain}
          httpHostHeader: nextcloud.${delegating_domain}
      - hostname: auth.${delegating_domain}
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          originServerName: auth.${delegating_domain}
          httpHostHeader: auth.${delegating_domain}
      - hostname: dashboard.${delegating_domain}
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          originServerName: dashboard.${delegating_domain}
          httpHostHeader: dashboard.${delegating_domain}
      - hostname: collabora.${delegating_domain}
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          originServerName: collabora.${delegating_domain}
          httpHostHeader: collabora.${delegating_domain}
      - service: http_status:404
