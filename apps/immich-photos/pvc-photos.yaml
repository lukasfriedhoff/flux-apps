apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${immich_photos_shared_claim_name:=immich-photos-shared}
  namespace: immich-photos
  annotations:
    # longhorn-replica-policy resets every volume's replica count from its
    # StorageClass on a 5 minute timer, so a replica bump only sticks if it is
    # declared here. storageClassName cannot be used for this: it is immutable
    # on a bound PVC, and changing it on a StatefulSet's volumeClaimTemplates
    # is rejected outright.
    longhorn.h4xx.io/replica-count: "${longhorn_pvc_replica_count:=2}"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: ${immich_photos_shared_pv_name:=immich-photos-shared-pv}
  resources:
    requests:
      storage: ${nextcloud_photos_size:=50Gi}
