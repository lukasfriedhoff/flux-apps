apiVersion: batch/v1
kind: Job
metadata:
  name: immich-photos-db-schema-repair-v6
  namespace: immich-photos
  labels:
    app.kubernetes.io/name: immich-photos-db-schema-repair-v6
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-photos-db-schema-repair-v6
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: repair
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: immich-photos-postgres-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: ${immich_photos_secret_name}
                  key: DB_DATABASE_NAME
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${immich_photos_secret_name}
                  key: DB_USERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${immich_photos_secret_name}
                  key: DB_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              psql -v ON_ERROR_STOP=1 <<'SQL'
              BEGIN;

              SELECT 'repairing immich photos person constraints';

              DELETE FROM public.asset_face asset_face
                    USING public.person person
               WHERE asset_face."personId" = person.id
                 AND NOT EXISTS (
                       SELECT 1
                         FROM public."user" app_user
                        WHERE app_user.id = person."ownerId"
                     );

              DELETE FROM public.person person
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM public."user" app_user
                      WHERE app_user.id = person."ownerId"
                   );

              UPDATE public.person person
                 SET "faceAssetId" = NULL
               WHERE person."faceAssetId" IS NOT NULL
                 AND NOT EXISTS (
                       SELECT 1
                         FROM public.asset_face asset_face
                        WHERE asset_face.id = person."faceAssetId"
                     );

              SELECT 'ALTER TABLE public."user" ADD CONSTRAINT user_pkey PRIMARY KEY (id)'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public."user"'::regclass
                        AND conname = 'user_pkey'
                   )
              \gexec

              SELECT 'ALTER TABLE public."user" ADD CONSTRAINT user_email_uq UNIQUE (email)'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public."user"'::regclass
                        AND conname = 'user_email_uq'
                   )
              \gexec

              SELECT 'ALTER TABLE public."user" ADD CONSTRAINT "user_storageLabel_uq" UNIQUE ("storageLabel")'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public."user"'::regclass
                        AND conname = 'user_storageLabel_uq'
                   )
              \gexec

              SELECT 'ALTER TABLE public.person ADD CONSTRAINT person_pkey PRIMARY KEY (id)'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public.person'::regclass
                        AND conname = 'person_pkey'
                   )
              \gexec

              SELECT 'ALTER TABLE public.person ADD CONSTRAINT "person_ownerId_fkey" FOREIGN KEY ("ownerId") REFERENCES public."user"(id) ON UPDATE CASCADE ON DELETE CASCADE'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public.person'::regclass
                        AND conname = 'person_ownerId_fkey'
                   )
              \gexec

              SELECT 'ALTER TABLE public.asset_face ADD CONSTRAINT asset_face_pkey PRIMARY KEY (id)'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public.asset_face'::regclass
                        AND conname = 'asset_face_pkey'
                   )
              \gexec

              SELECT 'ALTER TABLE public.person ADD CONSTRAINT "person_faceAssetId_fkey" FOREIGN KEY ("faceAssetId") REFERENCES public.asset_face(id) ON DELETE SET NULL'
               WHERE NOT EXISTS (
                     SELECT 1
                       FROM pg_constraint
                      WHERE conrelid = 'public.person'::regclass
                        AND conname = 'person_faceAssetId_fkey'
                   )
              \gexec

              COMMIT;
              SQL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
