apiVersion: v1
kind: Service
metadata:
  name: immich-photos-redis
  namespace: immich-photos
spec:
  selector:
    app.kubernetes.io/name: immich-photos-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-photos-redis
  namespace: immich-photos
spec:
  serviceName: immich-photos-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-photos-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-photos-redis
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3-alpine
          command:
            - /bin/sh
            - -ec
            - exec valkey-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${immich_photos_secret_name}
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: ${immich_photos_redis_requests_cpu}
              memory: ${immich_photos_redis_requests_memory}
            limits:
              cpu: ${immich_photos_redis_limits_cpu}
              memory: ${immich_photos_redis_limits_memory}
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ${immich_photos_redis_storage_class_name}
        resources:
          requests:
            storage: ${immich_photos_redis_size}
