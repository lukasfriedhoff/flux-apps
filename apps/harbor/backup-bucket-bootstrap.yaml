apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-postgres-backup-bucket-bootstrap
  namespace: ${harbor_namespace}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          # Circular by construction: this pulls mc FROM Harbor to bootstrap
          # Harbor's own backup bucket. Fine in steady state, but on a
          # cold rebuild of Harbor from nothing the image will not exist
          # yet - push containers/mc manually first, or point mc_image at
          # another registry for that one run.
          image: ${mc_image:=harbor.h4xx.io/library/mc:RELEASE.2025-08-13T08-35-41Z}
          env:
            - name: AWS_ENDPOINTS
              valueFrom:
                secretKeyRef:
                  name: ${harbor_postgres_backup_credential_secret_name:=harbor-postgres-backup-credentials}
                  key: AWS_ENDPOINTS
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ${harbor_postgres_backup_credential_secret_name:=harbor-postgres-backup-credentials}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ${harbor_postgres_backup_credential_secret_name:=harbor-postgres-backup-credentials}
                  key: AWS_SECRET_ACCESS_KEY
            - name: BACKUP_BUCKET
              value: ${harbor_postgres_backup_bucket:=harbor-postgres-backup}
          command:
            - /bin/sh
            - -ceu
            - |
              until mc alias set backup "$${AWS_ENDPOINTS}" "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" >/dev/null 2>&1; do
                sleep 5
              done

              mc mb --ignore-existing "backup/$${BACKUP_BUCKET}"
