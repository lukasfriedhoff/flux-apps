apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${harbor_postgres_cluster_name}
  namespace: ${harbor_namespace}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: database
spec:
  imageName: ${harbor_postgres_image}
  instances: ${harbor_postgres_instances}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: ${harbor_postgres_db_name}
      owner: ${harbor_postgres_user}
  # BACKUPS DISABLED 2026-09-22 (storage01 MinIO at 100%) - see the
  # nextcloud postgres.yaml for the full incident note. Revert to re-enable.
  storage:
    storageClass: ${harbor_postgres_storage_class_name}
    size: ${harbor_postgres_size}
  resources:
    requests:
      cpu: ${harbor_postgres_requests_cpu}
      memory: ${harbor_postgres_requests_memory}
    limits:
      memory: ${harbor_postgres_limits_memory}
