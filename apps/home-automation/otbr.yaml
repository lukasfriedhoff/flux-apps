# The RCP radio reaches this pod over TCP (socat on srv4 today, MikroTik
# /port remote-access later). otbr-agent spawns the bridge itself via its
# forkpty radio URL; python3 is the only stream tool the image ships.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otbr-bridge
  namespace: home-automation
data:
  bridge.py: |
    #!/usr/bin/env python3
    # stdio (a pty provided by otbr-agent's forkpty) <-> raw TCP serial.
    # NEVER write diagnostics to stdout/stderr - under forkpty they ARE the
    # spinel stream; log to the PVC instead.
    import os, select, socket, sys, time
    log = open("/data/bridge.err", "a", buffering=1)
    def note(msg):
        log.write(time.strftime("%H:%M:%S ") + msg + "\n")
    try:
        host, port = sys.argv[1], int(sys.argv[2])
        note(f"start argv={sys.argv!r}")
        s = socket.create_connection((host, port), timeout=10)
        s.settimeout(None)
        s.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
        note("connected")
        rx = tx = 0
        while True:
            r, _, _ = select.select([s.fileno(), 0], [], [])
            if s.fileno() in r:
                d = s.recv(4096)
                if not d:
                    note(f"tcp closed rx={rx} tx={tx}")
                    sys.exit(1)
                rx += len(d)
                os.write(1, d)
            if 0 in r:
                d = os.read(0, 4096)
                if not d:
                    note(f"pty closed rx={rx} tx={tx}")
                    sys.exit(1)
                tx += len(d)
                s.sendall(d)
    except SystemExit:
        raise
    except Exception as e:
        note(f"EXC {e!r}")
        sys.exit(1)
---
# OpenThread Border Router for the Thread part of the Matter stack. Replicas
# stay 0 until the Thread RCP USB stick (Silicon Labs CP210x) is physically
# attached to ${ha_node} (see the migration plan); the serial path is the
# stable /dev/serial/by-id link. hostNetwork is required so otbr-agent can
# use the IoT VLAN bridge as its backbone interface for mDNS, ICMPv6 route
# advertisements and Thread border routing. The REST API (8081) is consumed
# by Home Assistant on the same host, so no Service/Ingress is exposed.
# Upstream only publishes a rolling :latest tag, hence the digest pin.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otbr-data
  namespace: home-automation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ${ha_storage_class:=longhorn-ssd-rwo-1r}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr
  namespace: home-automation
  labels:
    app.kubernetes.io/name: otbr
spec:
  replicas: ${ha_otbr_replicas:=0}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otbr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otbr
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ${ha_node:=srv9}
      initContainers:
        # The same sysctls the official docker run command sets; pod-level
        # net.* sysctls are rejected for hostNetwork pods, so write them on
        # the host from a privileged init container instead.
        - name: sysctls
          image: ${ha_otbr_image:=docker.io/openthread/otbr@sha256:35c6e6520080116572fea50bbf271eff337992dd34e0cb095f4289f7853311e9}
          command:
            - sh
            - -c
            - |
              echo 1 > /proc/sys/net/ipv4/conf/all/forwarding
              echo 1 > /proc/sys/net/ipv6/conf/all/forwarding
              echo 0 > /proc/sys/net/ipv6/conf/all/disable_ipv6
          securityContext:
            privileged: true
      containers:
        # otbr-agent hard-requires the system DBus for its control API;
        # bypassing the image's s6 init means providing it ourselves.
        - name: dbus
          image: ${ha_otbr_image:=docker.io/openthread/otbr@sha256:35c6e6520080116572fea50bbf271eff337992dd34e0cb095f4289f7853311e9}
          command: ["sh", "-c", "dbus-uuidgen --ensure; exec dbus-daemon --system --nofork --nopidfile"]
          volumeMounts:
            - name: run-dbus
              mountPath: /run/dbus
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: otbr
          # Run the agent directly: the image's s6/entrypoint stack fights
          # the nft-only host (legacy iptables) and ignores runtime env for
          # the radio/backbone config (baked /etc/default/otbr-agent).
          # Wrapper restores the entrypoint's one useful side effect: Thread
          # state (active dataset!) persists under /var/lib/thread, which must
          # live on the PVC or the network dies with every pod restart.
          command: ["sh", "-c"]
          args:
            - >-
              mkdir -p /data/thread &&
              rm -rf /var/lib/thread &&
              ln -sfn /data/thread /var/lib/thread &&
              exec /usr/sbin/otbr-agent -I wpan0
              -B ${ha_otbr_backbone_if:=brvlan12} -d4 -v
              --rest-listen-address 0.0.0.0 --rest-listen-port 8081
              --auto-attach=1
              "${ha_thread_radio_url:=spinel+hdlc+uart:///dev/null}"
          image: ${ha_otbr_image:=docker.io/openthread/otbr@sha256:35c6e6520080116572fea50bbf271eff337992dd34e0cb095f4289f7853311e9}
          securityContext:
            privileged: true
          env:
            - name: OT_RCP_DEVICE
              value: "${ha_thread_radio_url:=spinel+hdlc+uart:///dev/null?uart-baudrate=460800}"
            # NAT64/firewall stages use the image's legacy iptables, which
            # cannot run on the nft-only host kernel; routing and firewall
            # are the host's (nix) responsibility anyway.
            - name: NAT64
              value: "0"
            - name: FIREWALL
              value: "0"
            # nat44_start is gated on DOCKER=1 (baked into the image), not
            # on NAT64 - it would still hit the legacy-iptables wall.
            - name: DOCKER
              value: "0"
            - name: OT_INFRA_IF
              value: "${ha_otbr_backbone_if:=brvlan12}"
            - name: OT_REST_LISTEN_ADDR
              value: "0.0.0.0"
            - name: OT_REST_LISTEN_PORT
              value: "8081"
            - name: OT_LOG_LEVEL
              value: "5"
          ports:
            - containerPort: 8081
          volumeMounts:
            # otbr-agent persists Thread network data under /data/thread
            # (symlinked to /var/lib/thread by the image entrypoint).
            - name: data
              mountPath: /data
            - name: bridge
              mountPath: /otbr-bridge
            - name: run-dbus
              mountPath: /run/dbus
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otbr-data
        - name: bridge
          configMap:
            name: otbr-bridge
        - name: run-dbus
          emptyDir: {}
