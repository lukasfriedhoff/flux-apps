apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 10m0s
  values:
    # Force HTTP -> HTTPS at Traefik.
    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=:443"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
    deployment:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    ports:
      websecure:
        http:
          tls:
            enabled: true
      metrics:
        port: 9100
        expose:
          default: true
        exposedPort: 9100
        protocol: TCP
    # No external LoadBalancer needed - cloudflared handles external traffic
    service:
      type: ClusterIP
    # Enable Kubernetes Ingress provider
    providers:
      kubernetesIngress:
        enabled: true
    metrics:
      prometheus:
        entryPoint: metrics
        service:
          enabled: true
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9100"
            prometheus.io/path: "/metrics"
    tracing:
      serviceName: traefik
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://alloy.monitoring.svc.cluster.local:4318/v1/traces
