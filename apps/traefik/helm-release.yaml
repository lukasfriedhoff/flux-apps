apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 10m0s
  values:
    # Force HTTP -> HTTPS at Traefik.
    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=:443"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Disable read timeout on the HTTPS entrypoint so large uploads (Attic NARs,
      # Nextcloud files) are not cut off by Traefik's default 60s limit.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
    deployment:
      replicas: ${traefik_replicas:=2}
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    ports:
      websecure:
        http:
          tls:
            enabled: true
      metrics:
        port: 9100
        expose:
          default: true
        exposedPort: 9100
        protocol: TCP
    # cloudflared handles external traffic; clusters that also want a LAN
    # entry point (split-horizon DNS, full-rate streaming, no 100s tunnel
    # timeout) set this to LoadBalancer so k3s servicelb binds 80/443 on
    # the node IPs.
    service:
      spec:
        type: ${traefik_service_type:=ClusterIP}
    # Enable Kubernetes Ingress provider
    providers:
      kubernetesIngress:
        enabled: true
    metrics:
      prometheus:
        entryPoint: metrics
        service:
          enabled: true
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9100"
            prometheus.io/path: "/metrics"
    # Spread across nodes; single-node clusters must set traefik_replicas
    # to 1. Certificates come from cert-manager, so replicas share no state.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 600m
        memory: 384Mi
    tracing:
      serviceName: traefik
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://alloy.monitoring.svc.cluster.local:4318/v1/traces
