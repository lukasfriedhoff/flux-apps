apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 10m0s
  values:
    # Redirect all HTTP traffic to HTTPS.
    ports:
      web:
        redirectTo: websecure
      websecure:
        tls:
          enabled: true
    # No external LoadBalancer needed - cloudflared handles external traffic
    service:
      type: ClusterIP
    # Disable dashboard externally (access via port-forward if needed)
    ingressRoute:
      dashboard:
        enabled: false
    # Enable Kubernetes Ingress provider
    providers:
      kubernetesIngress:
        enabled: true
