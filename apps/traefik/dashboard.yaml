apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: traefik
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/verify
    trustForwardHeader: true
    authRequestHeaders:
      - Authorization
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth-redirect
  namespace: traefik
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/verify?rd=https://auth.${delegating_domain}
    trustForwardHeader: true
    authRequestHeaders:
      - Authorization
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: traefik
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: ${default_cluster_issuer}
    kind: ClusterIssuer
  dnsNames:
    - dashboard.${delegating_domain}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashboard.${delegating_domain}`)
      kind: Rule
      middlewares:
        - name: authelia-forwardauth
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: traefik-dashboard-tls

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard-dns
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
spec:
  ingressClassName: external-dns
  rules:
    - host: dashboard.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  number: 80
