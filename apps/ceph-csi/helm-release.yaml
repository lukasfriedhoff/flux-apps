apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
  namespace: ${ceph_csi_namespace}
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: ceph-csi-rbd
      version: "3.12.2"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
        namespace: ${ceph_csi_namespace}
      interval: 10m0s
  valuesFrom:
    - kind: ConfigMap
      name: ceph-csi-values
      valuesKey: values.yaml
      optional: true
  values:
    csiConfig:
      - clusterID: "${ceph_cluster_id}"
        monitors:
          - "${ceph_mon_hosts}"
    provisioner:
      replicaCount: 1
    storageClass:
      # Disabled - we create storage classes via separate manifests
      create: false
    secret:
      create: false
