apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
  namespace: ${ceph_csi_namespace}
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: ceph-csi-rbd
      version: "3.12.2"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
        namespace: ${ceph_csi_namespace}
      interval: 10m0s
  valuesFrom:
    - kind: ConfigMap
      name: ceph-csi-rbd-values
      valuesKey: values.yaml
      optional: true
  values:
    csiConfig:
      - clusterID: "${ceph_cluster_id}"
        monitors:
          - "${ceph_mon_hosts}"
    provisioner:
      replicaCount: 1
      provisioner:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      attacher:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      resizer:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      snapshotter:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    nodeplugin:
      plugin:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2048Mi
      registrar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
    storageClass:
      # Disabled - we create storage classes via separate manifests
      create: false
    secret:
      create: false
