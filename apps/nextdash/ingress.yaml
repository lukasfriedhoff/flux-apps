# NextDash has no auth of its own - keep it behind Authelia.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextdash
  namespace: nextdash
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ${nextdash_host:=nextdash}${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextdash
                port:
                  number: 80
  tls:
    - secretName: nextdash-tls
      hosts:
        - ${nextdash_host:=nextdash}${public_host_suffix}.${delegating_domain}
