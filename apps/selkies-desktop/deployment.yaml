apiVersion: apps/v1
kind: Deployment
metadata:
  name: selkies-desktop
  namespace: cloud-desktop
  labels:
    app.kubernetes.io/name: selkies-desktop
spec:
  replicas: 1
  # A desktop session is stateful; never run two instances against one home.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: selkies-desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selkies-desktop
    spec:
      # Capability selection, not hostname pinning: h4xx.io/gpu.* labels are
      # derived from each node's facter report in the nix repo. The image
      # picks the matching VA-API driver (radeonsi/iHD) from the render node
      # at startup and falls back to CPU striped encoding without a GPU.
      nodeSelector:
        h4xx.io/gpu.vaapi: "true"
      # The desktop needs no API access, and the token mount pre-creates
      # /var/run as a real directory — which shadows NixOS' /var/run -> /run
      # symlink and crash-loops nsncd (and hides /var/run/dbus).
      automountServiceAccountToken: false
      containers:
        - name: selkies-desktop
          # Full NixOS personal desktop (nix repo: packages.cloud-desktop-image,
          # streamLayeredImage over the cloud-desktop nixosConfiguration).
          # Boots systemd via the baked /init Entrypoint; StopSignal
          # SIGRTMIN+3 is baked too. Push from the in-cluster builder over
          # the LAN path — see the harbor AI skill.
          image: harbor.h4xx.io/library/cloud-desktop:${selkies_image_tag}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Auth (Authelia-only, basic auth off) and env are baked into the
          # NixOS config (lukasf.selkies in hosts/personal/cloud-desktop);
          # the NetworkPolicy keeps in-cluster traffic away from the
          # unauthenticated port.
          # A full NixOS boot plus Home Manager activation precedes the
          # server; probe patiently.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 20
          resources:
            requests:
              cpu: ${selkies_requests_cpu}
              memory: ${selkies_requests_memory}
            limits:
              cpu: ${selkies_limits_cpu}
              memory: ${selkies_limits_memory}
          # Privileged solely for GPU encode: the device cgroup denies
          # hostPath character devices to unprivileged containers, so
          # /dev/dri stays invisible without it. Drop this (and the dri
          # mount) to run CPU-only, or replace with a device plugin later.
          securityContext:
            privileged: true
          volumeMounts:
            - name: home
              mountPath: /home/lukasf
            # Xorg/XShm capture and desktop apps outgrow the 64Mi k8s default.
            - name: shm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            # systemd-in-a-pod: stage 2 wants writable tmpfs here.
            - name: run
              mountPath: /run
            - name: run-lock
              mountPath: /run/lock
            - name: tmp
              mountPath: /tmp
            # Browser/font/Electron caches are small-file write churn —
            # the worst case for a replicated Longhorn volume, and nothing
            # in here is worth replicating.
            - name: cache
              mountPath: /home/lukasf/.cache
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: selkies-desktop-home
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: ${selkies_shm_size}
        # DirectoryOrCreate: on a GPU-less node this mounts an empty dir and
        # pixelflux falls back to software encoding instead of failing.
        - name: dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
        - name: run
          emptyDir:
            medium: Memory
        - name: run-lock
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: ${selkies_cache_size}
