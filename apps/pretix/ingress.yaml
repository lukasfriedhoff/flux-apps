# The h4xx.io names, via the Cloudflare tunnel. They predate the move of the
# system URL to tickets.hackimpott.de; served directly they would only show
# pretix's "Unknown host" page, so they 301 to the canonical shop instead.
# (To use one as a real in-app organizer domain later, drop the middleware
# annotation so the host reaches pretix again.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pretix
  namespace: pretix
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: pretix-redirect-to-primary@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ${pretix_primary_host:=pretix}${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pretix
                port:
                  number: 80
    - host: ${pretix_alias_host:=tickets}${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pretix
                port:
                  number: 80
  tls:
    - secretName: pretix-tls
      hosts:
        - ${pretix_primary_host:=pretix}${public_host_suffix}.${delegating_domain}
        - ${pretix_alias_host:=tickets}${public_host_suffix}.${delegating_domain}
---
# Event-domain hosts (hackimpott.de). DNS lives on an external nameserver
# (A records -> ionos1), traffic rides the ddnss-ingress WireGuard path, and
# certs validate via http-01 (see the letsencrypt-prod dnsZones selector).
# No external-dns annotation: that automation only manages the Cloudflare
# zone. tickets.* is the pretix system URL; pretix.* is served by pretix too
# (assignable as an organizer domain in-app).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pretix-event
  namespace: pretix
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${pretix_url_host:=tickets.hackimpott.de}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pretix
                port:
                  number: 80
    - host: ${pretix_event_alias_host:=pretix.hackimpott.de}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pretix
                port:
                  number: 80
  tls:
    - secretName: pretix-event-tls
      hosts:
        - ${pretix_url_host:=tickets.hackimpott.de}
        - ${pretix_event_alias_host:=pretix.hackimpott.de}
---
# Any request on an h4xx.io alias, whatever the path, goes to the canonical
# shop. $${1} survives flux substitution as the literal ${1} traefik needs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-primary
  namespace: pretix
spec:
  redirectRegex:
    regex: ^https?://[^/]+/(.*)
    replacement: https://${pretix_url_host:=tickets.hackimpott.de}/$${1}
    permanent: true
