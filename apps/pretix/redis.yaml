# Redis for pretix: sessions, cache, and the Celery broker/result backend.
# No password - it is only reachable in-namespace over the pod network and no
# NetworkPolicy exposes it. requirepass would mean an extra SOPS secret for no
# real gain here.
apiVersion: v1
kind: Service
metadata:
  name: pretix-valkey
  namespace: pretix
spec:
  selector:
    app.kubernetes.io/name: pretix-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pretix-valkey
  namespace: pretix
spec:
  serviceName: pretix-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pretix-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pretix-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:${pretix_valkey_image_tag:=9.1.2-alpine}
          command:
            - /bin/sh
            - -ec
            - exec valkey-server --save "" --appendonly no
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ${pretix_redis_storage_class_name:=longhorn-ssd-rwo-1r}
        resources:
          requests:
            storage: ${pretix_redis_size:=1Gi}
