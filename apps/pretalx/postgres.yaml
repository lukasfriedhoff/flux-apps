apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pretalx-postgres
  namespace: pretalx
spec:
  instances: ${pretalx_postgres_instances:=1}
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: pretalx
      owner: pretalx
  backup:
    barmanObjectStore:
      destinationPath: "s3://${pretalx_postgres_backup_bucket:=pretalx-postgres-backup}/${cluster_environment}/${pretalx_postgres_backup_generation:=}pretalx-postgres/"
      endpointURL: "${pretalx_postgres_backup_endpoint_url:=}"
      serverName: ${pretalx_postgres_backup_server_name:=pretalx-postgres}
      s3Credentials:
        accessKeyId:
          name: ${pretalx_postgres_backup_credential_secret_name:=pretalx-postgres-backup-credentials}
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: ${pretalx_postgres_backup_credential_secret_name:=pretalx-postgres-backup-credentials}
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "${pretalx_postgres_backup_retention:=30d}"
  storage:
    storageClass: ${pretalx_postgres_storage_class_name:=longhorn-nvme-rwo-2r}
    size: ${pretalx_postgres_size:=8Gi}
  resources:
    requests:
      cpu: ${pretalx_postgres_requests_cpu:=50m}
      memory: ${pretalx_postgres_requests_memory:=256Mi}
    limits:
      memory: ${pretalx_postgres_limits_memory:=1Gi}
