# pretalx: talk submission (Call for Papers) and conference scheduling. Same
# single-replica `all` pattern as pretix - the image's supervisord runs
# gunicorn (:80), the Celery worker and the scheduler together, over one RWO
# /data volume. Split web/worker + RWX /data only if HA is ever needed.
#
# Config via PRETALX_<SECTION>_<KEY> env (pretalx's env-override of
# pretalx.cfg); DB credentials from the CNPG pretalx-postgres-app secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pretalx
  namespace: pretalx
  labels:
    app.kubernetes.io/name: pretalx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pretalx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pretalx
    spec:
      # pretix/pretalx run as a non-root user but the Longhorn PVC mounts
      # root-owned; fsGroup lets the app write /data (logs, media, uploads).
      securityContext:
        fsGroup: 999
      containers:
        - name: pretalx
          image: docker.io/pretalx/standalone:${pretalx_image_tag:=v2026.2.1}
          args: ["all"]
          env:
            - name: PRETALX_DATABASE_BACKEND
              value: postgresql
            - name: PRETALX_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: pretalx-postgres-app
                  key: dbname
            - name: PRETALX_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: pretalx-postgres-app
                  key: username
            - name: PRETALX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pretalx-postgres-app
                  key: password
            - name: PRETALX_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: pretalx-postgres-app
                  key: host
            - name: PRETALX_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: pretalx-postgres-app
                  key: port
            - name: PRETALX_SITE_URL
              value: https://${pretalx_primary_host:=pretalx}${public_host_suffix}.${delegating_domain}
            - name: PRETALX_FILESYSTEM_DATA
              value: /data
            - name: PRETALX_REDIS_LOCATION
              value: redis://pretalx-valkey:6379/0
            - name: PRETALX_CELERY_BACKEND
              value: redis://pretalx-valkey:6379/1
            - name: PRETALX_CELERY_BROKER
              value: redis://pretalx-valkey:6379/2
            - name: PRETALX_MAIL_FROM
              value: ${pretalx_mail_from:=cfp@h4xx.io}
            - name: PRETALX_MAIL_HOST
              value: mailpit.mailpit.svc.cluster.local
            - name: PRETALX_MAIL_PORT
              value: ${quote}1025${quote}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: ${pretalx_requests_cpu:=100m}
              memory: ${pretalx_requests_memory:=512Mi}
            limits:
              memory: ${pretalx_limits_memory:=1536Mi}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pretalx-data
