apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: ${metallb_namespace:=metallb-system}
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: metallb
      version: ${metallb_chart_version:=0.16.1}
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: ${metallb_namespace:=metallb-system}
      interval: 1h0m0s
  values:
    speaker:
      # L2 mode only - no FRR/BGP in this homelab
      frr:
        enabled: false
