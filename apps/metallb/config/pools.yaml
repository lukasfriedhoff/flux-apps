# Service VIPs live on VLAN20 (SERVER, 10.1.20.0/24): all four k3s nodes are
# attached there, and the range sits below the vlan20 DHCP pool (.100+), so
# no reservation on the router is needed. VLAN30 stays management-only.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: services
  namespace: ${metallb_namespace:=metallb-system}
spec:
  addresses:
    - ${metallb_pool_range:=10.1.20.40-10.1.20.49}
---
# The apiserver VIP gets its own pool + an announcement pinned to the
# control-plane nodes: speaker election across all nodes proved flappy on
# the RB5009's ARP cache (silent blackholes when a non-CP node won).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: apiserver
  namespace: ${metallb_namespace:=metallb-system}
spec:
  addresses:
    - ${metallb_apiserver_pool:=10.1.20.50-10.1.20.59}
  serviceAllocation:
    namespaces:
      - kube-system
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: apiserver
  namespace: ${metallb_namespace:=metallb-system}
spec:
  ipAddressPools:
    - apiserver
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/control-plane: "true"
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: services
  namespace: ${metallb_namespace:=metallb-system}
spec:
  ipAddressPools:
    - services
---
# IoT VLAN VIPs (10.1.12.0/24): only srv9 carries brvlan12, so announcements
# are pinned to that interface. autoAssign off - the pool holds the legacy
# Home Assistant VM address (10.1.12.13), claimed only by explicit annotation
# so IoT devices and companion apps keep their configured endpoint.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: iot
  namespace: ${metallb_namespace:=metallb-system}
spec:
  autoAssign: false
  addresses:
    - ${metallb_iot_pool:=10.1.12.13/32}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: iot
  namespace: ${metallb_namespace:=metallb-system}
spec:
  ipAddressPools:
    - iot
  interfaces:
    - ${metallb_iot_interface:=brvlan12}
