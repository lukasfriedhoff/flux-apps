# phone-broker-emulator — lease, presence and action gateway for the Android
# Emulator pod.
#
# How this differs from the USB variant in the phone-broker repo's deploy/base:
#
#   * The device is adb-over-TCP (the emulator Service on 5555), so there is no
#     node adb socket to share. The broker runs ITS OWN adb server inside the
#     pod (--adb-socket tcp:localhost:5037, own-server mode) and `adb connect`s
#     the Service address at start and whenever the device is not `device`.
#   * It authenticates with the key the emulator's AVD was created with: the
#     same Secret the emulator's initContainer seeds (android-emulator-adbkey,
#     = srv1's adb host key). ADB_VENDOR_KEYS points at it; no on-screen
#     authorisation popup is ever involved.
#   * No nodeSelector: nothing here is node-local. It still runs as one
#     replica with Recreate so there is exactly one lease authority.
#   * adb-over-TCP tolerates several adb servers (automation Jobs bring their
#     own); exclusivity therefore rests on the lease + presence detection, not
#     on socket ownership. See phone-broker docs/architecture.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phone-broker-emulator
  namespace: ${phone_broker_namespace:=android}
  labels:
    app.kubernetes.io/name: phone-broker-emulator
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: android-platform
    h4xx.io/device: emulator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phone-broker-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phone-broker-emulator
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: android-platform
        h4xx.io/device: emulator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: ${phone_broker_image}
          imagePullPolicy: IfNotPresent
          env:
            # Own adb server on loopback. The spec must say "localhost": adb only
            # auto-starts a server for localhost or Unix-socket specs and answers
            # "cannot start server on remote host" for 127.0.0.1 (socket_spec.cpp).
            - name: PHONE_BROKER_ADB_SOCKET
              value: tcp:localhost:5037
            - name: PHONE_BROKER_ADB_OWN_SERVER
              value: "true"
            # The emulator's adbd. Reconnected whenever the device is not `device`.
            - name: PHONE_BROKER_ADB_CONNECT
              value: ${phone_broker_emulator_adb_connect:=android-emulator.android.svc.cluster.local:5555}
            # Empty = the connect address.
            - name: PHONE_BROKER_SERIAL
              value: ""
            - name: PHONE_BROKER_LISTEN
              value: ":8080"
            - name: PHONE_BROKER_LEASE_TTL
              value: ${phone_broker_lease_ttl:=60s}
            - name: PHONE_BROKER_PRESENCE_POLL
              value: ${phone_broker_presence_poll:=30s}
            - name: PHONE_BROKER_K8S_LEASE_NAME
              value: ${phone_broker_emulator_k8s_lease_name:=phone-emulator}
            - name: PHONE_BROKER_LOG_LEVEL
              value: ${phone_broker_log_level:=info}
            # The device's trusted key (same Secret the emulator seeds its AVD from).
            - name: ADB_VENDOR_KEYS
              value: /adbkey/adbkey
            - name: HOME
              value: /tmp
            - name: GOMEMLIMIT
              value: ${phone_broker_gomemlimit:=100MiB}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          # /readyz = device connected, booted, authorised, unlocked. A fresh
          # emulator boot sits on its lock screen: NotReady until /wake runs.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: ${phone_broker_requests_cpu:=25m}
              memory: ${phone_broker_requests_memory:=64Mi}
            limits:
              cpu: ${phone_broker_limits_cpu:=500m}
              memory: ${phone_broker_limits_memory:=192Mi}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: adbkey
              mountPath: /adbkey
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: adbkey
          secret:
            secretName: ${android_emulator_adbkey_secret:=android-emulator-adbkey}
            defaultMode: 0440
        # $HOME for the in-pod adb server (it writes ~/.android/adbkey) and
        # scratch for a screenshot in flight.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
# http://phone-broker-emulator.android.svc.cluster.local:8080 — the address
# automation Jobs talk to. ClusterIP only: the API is a shell on a logged-in
# device behind nothing but a lease token. Never an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: phone-broker-emulator
  namespace: ${phone_broker_namespace:=android}
  labels:
    app.kubernetes.io/name: phone-broker-emulator
    app.kubernetes.io/part-of: android-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phone-broker-emulator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
