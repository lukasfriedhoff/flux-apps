# phone-broker — the device lease and single automation gateway for one
# Android device (git.h4xx.io/lukasf/phone-broker).
#
# Two instances, one per device (they never share a device, so they never
# share a lease):
#   emulator.yaml  the Android Emulator pod in apps/android-emulator (adb-TCP)
#   oneplus8.yaml  the OnePlus 8 Pro daily phone over adb-TCP at its WireGuard
#                  address, API also on a LAN VIP for manual runs
# The USB variant (hostPath adb socket on srv1) from the phone-broker repo's
# deploy/base is still the template for a racked dedicated phone.
#
# No Namespace: `android` is owned by flux-cluster base/namespaces. No
# `namespace:` transformer; every manifest names its namespace itself.
# The placeholders are resolved by the flux-cluster Kustomization
# `phone-broker-app` (postBuild.substituteFrom base-config);
# examples/apps/phone-broker/base-config.defaults.yaml lists every key.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - emulator.yaml
  - network-policy.yaml
  - oneplus8.yaml
  - network-policy-oneplus8.yaml
