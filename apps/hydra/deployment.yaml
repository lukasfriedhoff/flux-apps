apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${hydra_service_name}
  namespace: ${hydra_namespace}
  labels:
    app.kubernetes.io/name: hydra
spec:
  progressDeadlineSeconds: 3600
  replicas: ${hydra_replicas:=1}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hydra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydra
      annotations:
        # hydra-queue-runner has always exposed these on 9198; nothing was
        # scraping them, which is why a 0% build success rate went unnoticed
        # for weeks. queue_steps_created_total is the signal that matters:
        # it stays flat when the runner cannot dispatch, even though the
        # process is up and the queue is full.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9198"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-nix-store
          image: nixos/nix:${hydra_nix_image_tag}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              if [ ! -e /nix-persist/store ]; then
                mkdir -p /nix-persist
                cp -a /nix/. /nix-persist/.
              fi
              mkdir -p /nix-persist/store /nix-persist/var/nix
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: nix-store
              mountPath: /nix-persist
      containers:
        - name: hydra
          image: nixos/nix:${hydra_nix_image_tag}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${hydra_service_port}
              protocol: TCP
          env:
            - name: HYDRA_PUBLIC_URL
              value: ${hydra_public_url}
            - name: HYDRA_LISTEN_HOST
              value: "0.0.0.0"
            - name: HYDRA_JOBSET_FLAKE
              value: ${hydra_jobset_flake}
            - name: NIX_CONFIG
              value: |
                experimental-features = nix-command flakes
                sandbox = false
                require-sigs = false
                # nixpkgs' minimal-bootstrap derivations are i686-linux.
                extra-platforms = i686-linux
                max-jobs = ${hydra_nix_max_jobs}
                cores = ${hydra_nix_cores}
                trusted-users = root
                allowed-uris = github: git+https://github.com/ https://github.com/
                extra-substituters = ${hydra_nix_substituters}
                extra-trusted-public-keys = ${hydra_nix_trusted_public_keys}
                # Builds run through ssh://localhost, so the build machine is a
                # remote builder. Left false it never consults a substituter and
                # tries to build inputs instead, which is fatal for nixpkgs
                # minimal-bootstrap sources like stage0-posix whose builder only
                # prints instructions. Every job died with a dependency failure.
                builders-use-substitutes = true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_cluster_name}-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_cluster_name}-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_cluster_name}-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_cluster_name}-app
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_cluster_name}-app
                  key: dbname
            - name: HYDRA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${hydra_admin_secret_name}
                  key: password
            - name: ATTIC_UPLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${hydra_attic_upload_secret_name}
                  key: ${hydra_attic_upload_token_key}
            - name: ATTIC_SERVER
              value: ${hydra_attic_server}
            - name: ATTIC_CACHE
              value: ${hydra_attic_cache}
            - name: HYDRA_GITHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${hydra_github_credentials_secret_name}
                  key: username
                  optional: true
            - name: HYDRA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${hydra_github_credentials_secret_name}
                  key: password
                  optional: true
            # Read-only deploy key for the private nix-secrets flake input.
            # The token above authenticates the fetch of the nix repo itself;
            # flake inputs are fetched separately by nix and need their own
            # credential. SSH here so it matches how the servers reach it.
            - name: NIX_SECRETS_DEPLOY_KEY
              valueFrom:
                secretKeyRef:
                  name: ${hydra_nix_secrets_key_secret_name:=hydra-nix-secrets-deploy-key}
                  key: identity
                  optional: true
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              export HOME=/state/root
              export USER=root
              export LOGNAME=root
              export PATH="/nix/var/nix/profiles/default/bin:$${HOME}/.nix-profile/bin:/root/.nix-profile/bin:$${PATH}"
              export XDG_CONFIG_HOME=/state/root/.config
              export HYDRA_HOME=/state/hydra
              export HYDRA_DATA=/state/hydra
              export HYDRA_DBI="dbi:Pg:dbname=$${POSTGRES_DB};host=$${POSTGRES_HOST};port=$${POSTGRES_PORT};user=$${POSTGRES_USER};password=$${POSTGRES_PASSWORD}"
              export HYDRA_PORT="${hydra_service_port}"
              export HYDRA_JOBSET_CHECK_INTERVAL="${hydra_jobset_check_interval}"
              export HYDRA_JOBSET_KEEP_NR="${hydra_jobset_keep_nr}"
              export HYDRA_MAX_SERVERS="${hydra_max_servers}"
              export HYDRA_MIN_SPARE_SERVERS="${hydra_min_spare_servers}"
              export HYDRA_MAX_SPARE_SERVERS="${hydra_max_spare_servers}"
              export HYDRA_EVALUATOR_MAX_MEMORY_SIZE="${hydra_evaluator_max_memory_size}"

              if ! grep -q '^hydra:' /etc/group; then
                echo 'hydra:x:1000:' >> /etc/group
              fi
              if ! grep -q '^hydra:' /etc/passwd; then
                echo 'hydra:x:1000:1000:Hydra:/state/hydra:/bin/sh' >> /etc/passwd
              fi

              mkdir -p /state/root /state/root/bin /state/hydra /state/hydra/www /state/hydra/queue-runner /state/hydra/build-logs /state/hydra/runcommand-logs /nix/var/nix/gcroots/hydra /etc/nix /var/lib
              ln -sfn /state/hydra /var/lib/hydra
              chown -R hydra:hydra /state/hydra /nix/var/nix/gcroots/hydra

              # fsGroup stamps the setgid bit on the root of the /nix volume, and
              # nix's default build-dir (/nix/var/nix/builds) inherits it, as does
              # every build directory created underneath. Nix's seccomp filter
              # (filter-syscalls, on by default) denies chmod with S_ISGID so that
              # setgid binaries can never be created in the store — so any build
              # that preserves directory modes fails. The first one to hit it is
              # gcc's install-headers-tar:
              #   tar: .: Cannot change mode to rwxr-sr-x: Operation not permitted
              # gcc is a bootstrap package, so that single failure cascaded into a
              # dependency failure for every other job and pinned the build success
              # rate at 0%. Clearing the bit is the fix; turning off filter-syscalls
              # would also stop the error but would give up a real protection.
              mkdir -p /nix/var/nix/builds
              chmod g-s /nix /nix/var/nix/builds
              # Deploy key for the private nix-secrets flake input. Written to
              # state rather than mounted from the secret so the mode can be
              # 0400: ssh refuses a key it considers group- or world-readable,
              # and projected secret volumes are 0444 by default.
              if [ -n "$${NIX_SECRETS_DEPLOY_KEY:-}" ]; then
                install -d -m 0700 /root/.ssh
                install -m 0400 -o root -g root /dev/null /state/root/nix-secrets-deploy.key
                printf '%s' "$${NIX_SECRETS_DEPLOY_KEY}" > /state/root/nix-secrets-deploy.key
                chmod 0400 /state/root/nix-secrets-deploy.key
                ssh-keyscan -t ed25519 github.com > /root/.ssh/known_hosts_github 2>/dev/null
                cat > /root/.ssh/config <<'EOF_SSHCFG'
              Host github.com
                IdentityFile /state/root/nix-secrets-deploy.key
                IdentitiesOnly yes
                UserKnownHostsFile /root/.ssh/known_hosts_github
              EOF_SSHCFG
                chmod 0600 /root/.ssh/config
              fi
              if [ -n "$${HYDRA_GITHUB_TOKEN:-}" ]; then
                install -m 0600 -o root -g root /dev/null /state/root/github-token
                printf '%s' "$${HYDRA_GITHUB_TOKEN}" > /state/root/github-token
                cat > /state/root/bin/git-askpass <<'EOF_ASKPASS'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' "$${HYDRA_GITHUB_USERNAME:-lukasfriedhoff}" ;;
                *Password*) cat /state/root/github-token ;;
                *) printf '\n' ;;
              esac
              EOF_ASKPASS
                chmod 0700 /state/root/bin/git-askpass
                export GIT_ASKPASS=/state/root/bin/git-askpass
                export GIT_TERMINAL_PROMPT=0
              fi
              install -m 0600 -o root -g root /dev/null /state/hydra/attic-upload-token
              printf '%s' "$${ATTIC_UPLOAD_TOKEN}" > /state/hydra/attic-upload-token
              rm -f /state/root/bin/su
              printf '%s\n' \
                '#!/bin/sh' \
                'while [ "$#" -gt 0 ]; do' \
                '  case "$1" in' \
                '    -s) shift 2 ;;' \
                '    -c) shift; exec /bin/sh -lc "$1" ;;' \
                '    --) shift ;;' \
                '    -*) shift ;;' \
                '    *) shift ;;' \
                '  esac' \
                'done' \
                'exec /bin/sh' \
                > /state/root/bin/su
              chmod +x /state/root/bin/su
              export PATH="/state/root/bin:$${PATH}"

              cat > /state/root/bin/hydra-attic-upload-hook <<'EOF_HOOK'
              #!/bin/sh
              set -eu
              export HOME=/state/root
              export XDG_CONFIG_HOME=/state/root/.config
              export PATH="/nix/var/nix/profiles/default/bin:$${HOME}/.nix-profile/bin:/root/.nix-profile/bin:/run/current-system/sw/bin:/bin:/usr/bin"

              if [ -z "$${OUT_PATHS:-}" ]; then
                exit 0
              fi
              if ! command -v attic >/dev/null 2>&1; then
                echo "hydra-attic-upload-hook: attic client is unavailable; skipping upload" >&2
                exit 0
              fi
              token_file=/state/hydra/attic-upload-token
              if [ ! -s "$token_file" ]; then
                echo "hydra-attic-upload-hook: upload token is unavailable; skipping upload" >&2
                exit 0
              fi
              token="$(cat "$token_file")"
              if [ -z "$token" ]; then
                echo "hydra-attic-upload-hook: upload token is empty; skipping upload" >&2
                exit 0
              fi

              mkdir -p "$XDG_CONFIG_HOME"
              if ! attic login hydra "$ATTIC_SERVER" "$token" >/dev/null 2>&1; then
                echo "hydra-attic-upload-hook: attic login failed; skipping upload" >&2
                exit 0
              fi
              if ! attic push "hydra:$ATTIC_CACHE" $OUT_PATHS; then
                echo "hydra-attic-upload-hook: attic push failed; build remains successful" >&2
              fi
              EOF_HOOK
              chmod +x /state/root/bin/hydra-attic-upload-hook

              cat > /state/hydra/hydra.conf <<EOF_CONFIG
              store_uri = auto
              # The queue runner builds every derivation from scratch unless
              # this is set, which is fatal for nixpkgs' minimal-bootstrap
              # sources: stage0-posix has no real builder, only a placeholder
              # that prints instructions, so it can only ever be substituted.
              # Its output is in cache.nixos.org the whole time.
              use-substitutes = 1
              binary_cache_public_uri = ${hydra_binary_cache_public_uri}
              binary_cache_secret_key_file =
              max_output_size = ${hydra_max_output_size}
              evaluator_max_memory_size = $${HYDRA_EVALUATOR_MAX_MEMORY_SIZE}
              hydra_url = $${HYDRA_PUBLIC_URL}
              notification_sender = ${hydra_notification_sender}
              gc_roots_dir = /nix/var/nix/gcroots/hydra
              EOF_CONFIG
              ln -sf /state/hydra/hydra.conf /etc/hydra.conf

              cat > /etc/nix/nix.conf <<EOF_NIX
              experimental-features = nix-command flakes
              sandbox = false
              require-sigs = false
              # nixpkgs' minimal-bootstrap derivations are i686-linux.
              extra-platforms = i686-linux
              max-jobs = ${hydra_nix_max_jobs}
              cores = ${hydra_nix_cores}
              trusted-users = root
              allowed-uris = github: git+https://github.com/ https://github.com/
              extra-substituters = ${hydra_nix_substituters}
              extra-trusted-public-keys = ${hydra_nix_trusted_public_keys}
              builders-use-substitutes = true
              post-build-hook = /state/root/bin/hydra-attic-upload-hook
              EOF_NIX

              # hydra-queue-runner assigns every build step to a machine from
              # this file. nix.conf's max-jobs does not apply to it — that only
              # governs the nix daemon. With no machines file the queue runner
              # can claim nothing and reports "unsupported system type" (step
              # status 8) even for plain x86_64-linux, which then fails every
              # build as a dependency failure. That is why 84 builds ran with
              # a 0% success rate and the first failing derivation was always
              # a bootstrap one (gnused-4.2): nothing could be dispatched.
              #
              # localhost is the special entry that builds through the local
              # daemon. Fields: uri system sshKey maxJobs speedFactor
              # supportedFeatures mandatoryFeatures publicHostKey.
              # kvm/nixos-test are deliberately absent — this is a container.
              #
              # i686-linux is required, not optional. nixpkgs' minimal-bootstrap
              # chain (stage0-posix, mes and friends) is i686-linux, so with only
              # x86_64-linux advertised the queue runner logs
              #   aborting unsupported build step '...-mes.drv' (type 'i686-linux')
              # and every nixosConfigurations job ends as bsUnsupported (status 9).
              # The kernel has 32-bit emulation (/proc/sys/abi/vsyscall32), and
              # builders-use-substitutes means most of these come from the binary
              # cache rather than being built here at all.
              mkdir -p /etc/nix
              cat > /etc/nix/machines <<EOF_MACHINES
              localhost x86_64-linux,i686-linux - ${hydra_nix_max_jobs} 1 big-parallel - -
              EOF_MACHINES

              if ! command -v hydra-init >/dev/null 2>&1; then
                nix profile install --refresh ${hydra_nix_packages}
              fi
              if ! command -v su >/dev/null 2>&1; then
                nix profile install --refresh ${hydra_nix_extra_packages}
              fi
              if ! command -v attic >/dev/null 2>&1; then
                nix profile install --refresh ${hydra_nix_attic_package}
              fi

              hydra-init
              hydra-create-user admin \
                --full-name "Admin" \
                --email-address "admin@localhost" \
                --password "$${HYDRA_ADMIN_PASSWORD}" \
                --role admin || true

              hydra-queue-runner -v &
              queue_pid="$${!}"
              hydra-evaluator &
              evaluator_pid="$${!}"
              hydra-update-gc-roots &
              gc_pid="$${!}"
              hydra-server -f -h "$${HYDRA_LISTEN_HOST}" -p "$${HYDRA_PORT}" \
                --min_spare_servers "$${HYDRA_MIN_SPARE_SERVERS}" \
                --max_spare_servers "$${HYDRA_MAX_SPARE_SERVERS}" \
                --max_servers "$${HYDRA_MAX_SERVERS}" \
                --max_requests 100 &
              server_pid="$${!}"

              for i in $(seq 1 60); do
                curl -sf "http://127.0.0.1:$${HYDRA_PORT}/" >/dev/null 2>&1 && break
                [ "$${i}" = 60 ] && { echo "Hydra web server did not become ready" >&2; exit 1; }
                sleep 2
              done

              cookie_jar=/tmp/hydra-cookie
              curl -sf -c "$${cookie_jar}" \
                -X POST \
                -H "Referer: http://127.0.0.1:$${HYDRA_PORT}/" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "username=admin" \
                --data-urlencode "password=$${HYDRA_ADMIN_PASSWORD}" \
                "http://127.0.0.1:$${HYDRA_PORT}/login" >/dev/null || true

              curl -sf -b "$${cookie_jar}" \
                -X PUT \
                -H "Content-Type: application/json" \
                --data '{"displayname":"NixOS Configurations","description":"All NixOS host configurations","enabled":"1","visible":"1"}' \
                "http://127.0.0.1:$${HYDRA_PORT}/project/nixos-configs" >/dev/null || true

              curl -sf -b "$${cookie_jar}" \
                -X PUT \
                -H "Content-Type: application/json" \
                --data "{\"type\":1,\"flake\":\"$${HYDRA_JOBSET_FLAKE}\",\"description\":\"All NixOS host configurations\",\"checkinterval\":$${HYDRA_JOBSET_CHECK_INTERVAL},\"schedulingshares\":1,\"keepnr\":$${HYDRA_JOBSET_KEEP_NR},\"enabled\":1,\"visible\":true}" \
                "http://127.0.0.1:$${HYDRA_PORT}/jobset/nixos-configs/all" >/dev/null || true

              trap 'kill "$${server_pid}" "$${queue_pid}" "$${evaluator_pid}" "$${gc_pid}" 2>/dev/null || true; wait' TERM INT
              wait "$${server_pid}"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1800
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: ${hydra_requests_cpu}
              memory: ${hydra_requests_memory}
              ephemeral-storage: ${hydra_requests_ephemeral_storage}
            limits:
              cpu: ${hydra_limits_cpu}
              memory: ${hydra_limits_memory}
              ephemeral-storage: ${hydra_limits_ephemeral_storage}
          volumeMounts:
            - name: nix-store
              mountPath: /nix
            - name: state
              mountPath: /state
      volumes:
        - name: nix-store
          persistentVolumeClaim:
            claimName: ${hydra_service_name}-nix-store
        - name: state
          persistentVolumeClaim:
            claimName: ${hydra_service_name}-state
