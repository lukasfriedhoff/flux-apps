apiVersion: batch/v1
kind: Job
metadata:
  name: hydra-postgres-backup-bucket-bootstrap
  namespace: ${hydra_namespace}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: quay.io/minio/mc:latest
          env:
            - name: AWS_ENDPOINTS
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_backup_credential_secret_name:=hydra-postgres-backup-credentials}
                  key: AWS_ENDPOINTS
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_backup_credential_secret_name:=hydra-postgres-backup-credentials}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ${hydra_postgres_backup_credential_secret_name:=hydra-postgres-backup-credentials}
                  key: AWS_SECRET_ACCESS_KEY
            - name: BACKUP_BUCKET
              value: ${hydra_postgres_backup_bucket:=hydra-postgres-backup}
          command:
            - /bin/sh
            - -ceu
            - |
              until mc alias set backup "$${AWS_ENDPOINTS}" "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" >/dev/null 2>&1; do
                sleep 5
              done

              mc mb --ignore-existing "backup/$${BACKUP_BUCKET}"
