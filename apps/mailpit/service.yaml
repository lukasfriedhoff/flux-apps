apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    # SMTP: what pretix/pretalx connect to. Reachable cluster-wide as
    # mailpit.mailpit.svc.cluster.local:1025
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
