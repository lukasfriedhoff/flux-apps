# Mailpit: a mail CATCHER, not a relay. It accepts SMTP on 1025 and shows every
# captured message in a web UI on 8025 - nothing is delivered onward. It is the
# outbound-mail target for pretix and pretalx so their ticket/CfP emails can be
# inspected without actually sending to attendees. Swap MP_SMTP_RELAY_* in later
# to forward real mail through an upstream provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:${mailpit_image_tag:=v1.31.4}
          env:
            - name: MP_DATABASE
              value: /data/mailpit.db
            - name: MP_MAX_MESSAGES
              value: ${quote}${mailpit_max_messages:=5000}${quote}
            # Trust the pod network; auth is unnecessary for an internal catcher
            # and the UI sits behind Authelia at the ingress.
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailpit-data
