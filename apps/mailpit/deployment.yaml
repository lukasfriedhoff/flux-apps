# Mailpit: a mail CATCHER, not a relay. It accepts SMTP on 1025 and shows every
# captured message in a web UI on 8025 - nothing is delivered onward. It is the
# outbound-mail target for pretix and pretalx so their ticket/CfP emails can be
# inspected without actually sending to attendees. Swap MP_SMTP_RELAY_* in later
# to forward real mail through an upstream provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:${mailpit_image_tag:=v1.31.4}
          env:
            - name: MP_DATABASE
              value: /data/mailpit.db
            - name: MP_MAX_MESSAGES
              value: ${quote}${mailpit_max_messages:=5000}${quote}
            # Trust the pod network; auth is unnecessary for an internal catcher
            # and the UI sits behind Authelia at the ingress.
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
            # Relay EVERYTHING that arrives here onward through the maddy
            # relay on ionos1 (via the ddnss-ingress wg tunnel) - mailpit is
            # the visible outbox archive, maddy does DKIM + delivery. NOTE:
            # every mail reaching :1025 goes OUT to its real recipients.
            - name: MP_SMTP_RELAY_ALL
              value: ${quote}${mailpit_relay_all:=true}${quote}
            - name: MP_SMTP_RELAY_HOST
              value: ddnss-ingress-smtp.${ddnss_ingress_namespace:=ddnss-ingress}.svc.cluster.local
            - name: MP_SMTP_RELAY_PORT
              value: ${quote}587${quote}
            - name: MP_SMTP_RELAY_STARTTLS
              value: ${quote}true${quote}
            # maddy presents a self-signed cert (CN mail.hackimpott.de).
            - name: MP_SMTP_RELAY_ALLOW_INSECURE
              value: ${quote}true${quote}
            - name: MP_SMTP_RELAY_AUTH
              value: plain
            - name: MP_SMTP_RELAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mailpit-relay-credentials
                  key: MP_SMTP_RELAY_USERNAME
            - name: MP_SMTP_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mailpit-relay-credentials
                  key: MP_SMTP_RELAY_PASSWORD
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailpit-data
