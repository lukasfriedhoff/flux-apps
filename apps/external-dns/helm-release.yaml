apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: external-dns
      version: 1.14.5
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 10m0s
  values:
    provider: cloudflare
    domainFilters:
      - h4xx.io
      - lab.h4xx.io
    sources:
      - ingress
      - service
    policy: upsert-only
    txtOwnerId: srv1-k3s
    extraArgs:
      - --cloudflare-proxied
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
