apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${nix_remote_builder_service_name}
  namespace: ${nix_remote_builder_namespace}
  labels:
    app.kubernetes.io/name: nix-remote-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-remote-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-remote-builder
    spec:
      initContainers:
        - name: seed-nix-store
          image: nixos/nix:${nix_remote_builder_image_tag}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              export PATH="/nix/var/nix/profiles/default/bin:$${PATH}"
              # The PVC is mounted at /seed/nix so that /seed is a valid chroot-store root
              # (local?root=/seed -> /seed/nix/store, /seed/nix/var/nix/db).
              dst=/seed/nix
              marker="$${dst}/var/nix/seeded-from-image"
              image_profile="$(readlink /nix/var/nix/profiles/default-1-link)"
              image_sh="$(readlink /bin/sh)"
              want="$(nix --version) $${image_profile}"
              have="$(cat "$${marker}" 2>/dev/null || echo none)"

              if [ ! -e "$${dst}/store" ]; then
                echo "seed: empty volume, copying the image's /nix"
                cp -a /nix/. "$${dst}/."
              elif [ "$${have}" != "$${want}" ]; then
                # A new image: its /bin/sh, nix and profile live in store paths the
                # volume has never seen. Add (and register) them; never delete anything,
                # existing paths, profiles and gcroots stay as they are.
                echo "seed: volume has '$${have}', image is '$${want}'; importing the image's store paths"
                nix --extra-experimental-features nix-command copy --all --no-check-sigs --to "local?root=/seed"
                mkdir -p "$${dst}/var/nix/gcroots/docker"
                for root in /nix/var/nix/gcroots/docker/*; do
                  [ -L "$${root}" ] || continue
                  ln -sfn "$(readlink "$${root}")" "$${dst}/var/nix/gcroots/docker/$${root##*/}"
                done
                # Point the default profile at the image's profile as a NEW generation.
                # Links on the volume are absolute /nix/... paths, so resolve by hand.
                profiles="$${dst}/var/nix/profiles"
                current="$(readlink "$${profiles}/default" 2>/dev/null || true)"
                if [ "$(readlink "$${profiles}/$${current##*/}" 2>/dev/null || true)" != "$${image_profile}" ]; then
                  last=0
                  for link in "$${profiles}"/default-*-link; do
                    [ -L "$${link}" ] || continue
                    gen="$${link##*/default-}"; gen="$${gen%-link}"
                    [ "$${gen}" -gt "$${last}" ] && last="$${gen}"
                  done
                  next=$((last + 1))
                  ln -s "$${image_profile}" "$${profiles}/default-$${next}-link"
                  ln -sfn "/nix/var/nix/profiles/default-$${next}-link" "$${profiles}/.default.new"
                  mv -T "$${profiles}/.default.new" "$${profiles}/default"
                  echo "seed: default profile -> generation $${next} ($${image_profile})"
                fi
              fi

              mkdir -p "$${dst}/store" "$${dst}/var/nix"
              # Refuse to start the main container on a store that cannot run the image.
              for path in "$${image_profile}" "$${image_sh}"; do
                rel="$${path#/nix/}"
                if [ ! -e "$${dst}/$${rel}" ]; then
                  echo "seed: $${path} missing from the volume, refusing to continue" >&2
                  exit 1
                fi
              done
              printf '%s\n' "$${want}" > "$${marker}"
              echo "seed: volume matches $${want}"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: nix-store
              mountPath: /seed/nix
      containers:
        - name: builder
          image: nixos/nix:${nix_remote_builder_image_tag}
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: ${nix_remote_builder_ssh_port}
              protocol: TCP
          env:
            - name: NIX_REMOTE_BUILDER_SSH_PORT
              value: "22"
            - name: NIX_REMOTE_BUILDER_AUTHORIZED_KEY
              value: "${nix_remote_builder_authorized_key}"
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              export PATH="/nix/var/nix/profiles/default/bin:/root/.nix-profile/bin:$${PATH}"

              mkdir -p /run/sshd /root/.ssh /state/ssh /state/tmp /etc/nix /var/empty
              chmod 0700 /root/.ssh

              if ! command -v sshd >/dev/null 2>&1; then
                nix profile install --refresh nixpkgs#openssh
              fi

              if ! grep -q '^sshd:' /etc/group; then
                echo 'sshd:x:74:' >> /etc/group
              fi
              if ! grep -q '^sshd:' /etc/passwd; then
                echo 'sshd:x:74:74:sshd:/var/empty:/bin/false' >> /etc/passwd
              fi
              if [ -L /etc/shadow ]; then
                cp /etc/shadow /tmp/shadow
                rm /etc/shadow
                cp /tmp/shadow /etc/shadow
                chmod 0600 /etc/shadow
              fi
              while IFS=: read -r user password rest; do
                if [ "$${user}" = root ]; then
                  printf 'root:*:%s\n' "$${rest}"
                else
                  printf '%s:%s:%s\n' "$${user}" "$${password}" "$${rest}"
                fi
              done < /etc/shadow > /tmp/shadow
              cp /tmp/shadow /etc/shadow
              chmod 0600 /etc/shadow

              if [ ! -s /state/ssh/ssh_host_ed25519_key ] || ! ssh-keygen -y -f /state/ssh/ssh_host_ed25519_key >/dev/null 2>&1; then
                cp /host-key/ssh_host_ed25519_key /state/ssh/ssh_host_ed25519_key
                chmod 0600 /state/ssh/ssh_host_ed25519_key
                rm -f /state/ssh/ssh_host_ed25519_key.pub
              fi
              if [ ! -s /state/ssh/ssh_host_ed25519_key.pub ]; then
                ssh-keygen -y -f /state/ssh/ssh_host_ed25519_key > /state/ssh/ssh_host_ed25519_key.pub
              fi

              printf '%s\n' "restrict $${NIX_REMOTE_BUILDER_AUTHORIZED_KEY}" > /root/.ssh/authorized_keys
              chmod 0600 /root/.ssh/authorized_keys

              cat > /state/sshd_config <<CFG
              Port $${NIX_REMOTE_BUILDER_SSH_PORT:-22}
              HostKey /state/ssh/ssh_host_ed25519_key
              PermitRootLogin prohibit-password
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              ChallengeResponseAuthentication no
              UsePAM no
              PubkeyAuthentication yes
              AuthorizedKeysFile /root/.ssh/authorized_keys
              PrintMotd no
              Subsystem sftp internal-sftp
              AllowTcpForwarding no
              X11Forwarding no
              CFG

              cat > /etc/nix/nix.conf <<'NIXCONF'
              experimental-features = nix-command flakes
              max-jobs = auto
              cores = 0
              sandbox = false  # required in containers — kernel namespacing needs extra capabilities unavailable here
              trusted-users = root
              build-users-group =
              NIXCONF

              mkdir -p /usr/bin
              ln -sf /nix/var/nix/profiles/default/bin/nix /usr/bin/nix
              ln -sf /nix/var/nix/profiles/default/bin/nix-store /usr/bin/nix-store
              ln -sf /nix/var/nix/profiles/default/bin/nix-daemon /usr/bin/nix-daemon

              if command -v nix-daemon >/dev/null 2>&1; then
                nix-daemon &
              else
                /nix/var/nix/profiles/default/bin/nix-daemon &
              fi

              exec /nix/var/nix/profiles/default/bin/sshd -D -e -f /state/sshd_config
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: ${nix_remote_builder_requests_cpu}
              memory: ${nix_remote_builder_requests_memory}
              ephemeral-storage: ${nix_remote_builder_requests_ephemeral_storage}
            limits:
              cpu: ${nix_remote_builder_limits_cpu}
              memory: ${nix_remote_builder_limits_memory}
              ephemeral-storage: ${nix_remote_builder_limits_ephemeral_storage}
          volumeMounts:
            - name: nix-store
              mountPath: /nix
            - name: state
              mountPath: /state
            - name: host-key
              mountPath: /host-key
              readOnly: true
      volumes:
        - name: nix-store
          persistentVolumeClaim:
            claimName: ${nix_remote_builder_service_name}-nix-store
        - name: state
          persistentVolumeClaim:
            claimName: ${nix_remote_builder_service_name}-state
        - name: host-key
          secret:
            secretName: ${nix_remote_builder_hostkey_secret_name}
            defaultMode: 0400
