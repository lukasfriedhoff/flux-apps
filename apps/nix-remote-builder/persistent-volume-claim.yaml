apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${nix_remote_builder_service_name}-state
  namespace: ${nix_remote_builder_namespace}
  annotations:
    # longhorn-replica-policy resets every volume's replica count from its
    # StorageClass on a 5 minute timer, so a replica bump only sticks if it is
    # declared here. storageClassName cannot be used for this: it is immutable
    # on a bound PVC, and changing it on a StatefulSet's volumeClaimTemplates
    # is rejected outright.
    longhorn.h4xx.io/replica-count: "${longhorn_pvc_replica_count:=2}"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${nix_remote_builder_storage_class_name}
  resources:
    requests:
      storage: ${nix_remote_builder_storage_size}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${nix_remote_builder_service_name}-nix-store
  namespace: ${nix_remote_builder_namespace}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${nix_remote_builder_nix_store_storage_class_name}
  resources:
    requests:
      storage: ${nix_remote_builder_nix_store_size}
