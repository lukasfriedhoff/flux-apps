apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sitemap
  namespace: ${sitemap_namespace:=sitemap}
  annotations:
    external-dns.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    # Required because this Ingress declares a tls block: without an issuer
    # nothing ever creates sitemap-tls, Traefik cannot complete the handshake
    # and the host fails to connect entirely (not a cert warning - a dead
    # connection). Apps that omit tls: fall back to Traefik's default cert.
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Behind Authelia like everything else. This is the page people land on
    # first, so the SSO prompt here is the single login for the whole estate -
    # after this every linked service is already authenticated.
    # -redirect, not the plain forwardauth: this is a browser UI. The plain
    # middleware answers an unauthenticated request with a bare
    # text/plain 401 carrying no Location and no session cookie, so the
    # browser lands on a dead wall with no way to reach the auth portal.
    # Reported 2026-09-27 as "cannot log in" - there was no login flow to
    # reach at all. Keep the plain variant only for machine endpoints
    # (see apps/monitoring/ingress-ingest.yaml), never for a UI.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: start${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sitemap
                port:
                  number: 80
  tls:
    - hosts:
        - start${public_host_suffix}.${delegating_domain}
      secretName: sitemap-tls
