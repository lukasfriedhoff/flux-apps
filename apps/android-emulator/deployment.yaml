apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-emulator
  namespace: android
  labels:
    app.kubernetes.io/name: android-emulator
spec:
  replicas: 1
  strategy:
    # One Android, one RWO volume: never let two instances overlap.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: android-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: android-emulator
    spec:
      securityContext:
        # The image runs as androidusr (uid 1300, gid 1301) even though the
        # container is privileged; a fresh Longhorn volume is root-owned, so
        # hand it to that group or the first AVD write fails.
        fsGroup: 1301
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        # KVM is on every node. Rendering is software (no node has a usable
        # GPU for the emulator), so per-core speed decides: the Xeon Gold node
        # was ~1.7x faster than the E5-2620 v4 one. Keep the node on the SSD
        # tier that holds a replica of the volume. The volume is RWO anyway.
        kubernetes.io/hostname: ${android_emulator_node}
      initContainers:
        # The emulator seeds the public half of ~/.android/adbkey into the
        # guest's trusted adb keys when it creates the AVD (ro.adb.secure=1 on
        # this image). The container otherwise regenerates that key on every
        # start while the AVD persists, so after one restart even its own adb
        # is `unauthorized`. Provisioning the key from a Secret gives the
        # device ONE stable identity — the same key srv1's adb server and the
        # phone-broker present — so automation never needs the on-screen
        # authorisation popup. ~/.android must stay writable (adb.5037, the
        # console token live there), hence the copy into an emptyDir.
        - name: adb-identity
          image: ${android_emulator_initcontainer_image}
          command:
            - sh
            - -ec
            - |
              install -m 0600 -o 1300 -g 1301 /adbkey/adbkey /dot-android/adbkey
              install -m 0644 -o 1300 -g 1301 /adbkey/adbkey.pub /dot-android/adbkey.pub
              # The AVD registration lives in ~/.android/avd/<name>.ini and is
              # lost with this emptyDir. Once the AVD exists (see
              # configmap.yaml), upstream no longer runs avdmanager, so the
              # emulator would not find @<name> without it. avdmanager -f
              # overwrites this file on a genuinely fresh volume.
              name="$(printf '%s' "$EMULATOR_DEVICE" | tr 'A-Z ' 'a-z_')_$EMULATOR_ANDROID_VERSION"
              mkdir -p /dot-android/avd
              printf 'avd.ini.encoding=UTF-8\npath=/home/androidusr/emulator\ntarget=android-%s\n' "$EMULATOR_API_LEVEL" > "/dot-android/avd/$name.ini"
              chown -R 1300:1301 /dot-android
          env:
            - name: EMULATOR_DEVICE
              value: ${android_emulator_device}
            - name: EMULATOR_ANDROID_VERSION
              value: "${android_emulator_android_version:=11.0}"
            - name: EMULATOR_API_LEVEL
              value: "${android_emulator_api_level:=30}"
          volumeMounts:
            - name: adbkey
              mountPath: /adbkey
              readOnly: true
            - name: dot-android
              mountPath: /dot-android
      containers:
        - name: emulator
          # Google Play Store image of the official Android Emulator, run under
          # KVM. redroid was dropped: no video encoder, no Play, x86-only.
          image: ${android_emulator_image}
          imagePullPolicy: IfNotPresent
          env:
            - name: EMULATOR_DEVICE
              value: ${android_emulator_device}
            - name: WEB_VNC
              value: "true"
            # Extra emulator flags. -cores/-memory override the AVD's 3 vCPU /
            # 2 GB defaults at runtime without touching config.ini (2 GB left
            # the Play image 600 MB deep in swap). A changed RAM size only
            # invalidates the quick-boot snapshot: one cold boot, data kept.
            - name: EMULATOR_ADDITIONAL_ARGS
              value: "${android_emulator_additional_args:=-cores 4 -memory 4096}"
            # See configmap.yaml: keeps upstream from wiping the AVD on restart.
            - name: EMULATOR_CONFIG_PATH
              value: /config/config-override.ini
          ports:
            - name: novnc
              containerPort: 6080
              protocol: TCP
            - name: adb
              containerPort: 5555
              protocol: TCP
          securityContext:
            # The emulator needs /dev/kvm. Without a device plugin the device
            # cgroup only admits it for a privileged container; the pod runs
            # on one node, behind a ClusterIP, with no hostPath but the device.
            privileged: true
          readinessProbe:
            httpGet:
              path: /
              port: novnc
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: adb
            initialDelaySeconds: 600
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: ${android_emulator_requests_cpu}
              memory: ${android_emulator_requests_memory}
            limits:
              cpu: ${android_emulator_limits_cpu}
              memory: ${android_emulator_limits_memory}
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            # Upstream says "mount a volume at /home/androidusr", which works
            # under Docker because a named volume is seeded from the image on
            # first use. A Kubernetes PVC is not: mounted there it hides the
            # image's entrypoint (…/docker-android/mixins/scripts/run.sh → exit
            # 127, CrashLoopBackOff). The emulator writes its AVD — userdata
            # with installed apps and logins, hardware-qemu.ini — to
            # ~/emulator (verified on the running pod; ~/.android only holds
            # the adb keys), so persist exactly that directory, created at
            # runtime, and keep the scripts from the image — which also means
            # an image bump never runs stale scripts.
            - name: data
              mountPath: /home/androidusr/emulator
            - name: dot-android
              mountPath: /home/androidusr/.android
            - name: config-override
              mountPath: /config
              readOnly: true
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: data
          persistentVolumeClaim:
            claimName: android-emulator-data
        - name: dot-android
          emptyDir: {}
        - name: config-override
          configMap:
            name: android-emulator-config
        - name: adbkey
          secret:
            secretName: ${android_emulator_adbkey_secret}
            items:
              - key: adbkey
                path: adbkey
              - key: adbkey.pub
                path: adbkey.pub
