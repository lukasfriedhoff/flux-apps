apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-emulator
  namespace: android
  labels:
    app.kubernetes.io/name: android-emulator
spec:
  replicas: 1
  strategy:
    # One Android, one RWO volume: never let two instances overlap.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: android-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: android-emulator
    spec:
      securityContext:
        # The image runs as androidusr (uid 1300, gid 1301) even though the
        # container is privileged; a fresh Longhorn volume is root-owned, so
        # hand it to that group or the first AVD write fails.
        fsGroup: 1301
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        # KVM is on every node; this one has the headroom (16c/94Gi) and the
        # node adb server the phone-broker fronts. The volume is RWO anyway.
        kubernetes.io/hostname: ${android_emulator_node}
      containers:
        - name: emulator
          # Google Play Store image of the official Android Emulator, run under
          # KVM. redroid was dropped: no video encoder, no Play, x86-only.
          image: ${android_emulator_image}
          imagePullPolicy: IfNotPresent
          env:
            - name: EMULATOR_DEVICE
              value: ${android_emulator_device}
            - name: WEB_VNC
              value: "true"
          ports:
            - name: novnc
              containerPort: 6080
              protocol: TCP
            - name: adb
              containerPort: 5555
              protocol: TCP
          securityContext:
            # The emulator needs /dev/kvm. Without a device plugin the device
            # cgroup only admits it for a privileged container; the pod runs
            # on one node, behind a ClusterIP, with no hostPath but the device.
            privileged: true
          readinessProbe:
            httpGet:
              path: /
              port: novnc
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: adb
            initialDelaySeconds: 600
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: ${android_emulator_requests_cpu}
              memory: ${android_emulator_requests_memory}
            limits:
              cpu: ${android_emulator_limits_cpu}
              memory: ${android_emulator_limits_memory}
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            # Upstream says "mount a volume at /home/androidusr", which works
            # under Docker because a named volume is seeded from the image on
            # first use. A Kubernetes PVC is not: mounted there it hides the
            # image's entrypoint (…/docker-android/mixins/scripts/run.sh → exit
            # 127, CrashLoopBackOff). The emulator writes its AVD — userdata
            # with installed apps and logins, hardware-qemu.ini — to
            # ~/emulator (verified on the running pod; ~/.android only holds
            # the adb keys), so persist exactly that directory, created at
            # runtime, and keep the scripts from the image — which also means
            # an image bump never runs stale scripts.
            - name: data
              mountPath: /home/androidusr/emulator
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: data
          persistentVolumeClaim:
            claimName: android-emulator-data
