apiVersion: v1
kind: Service
metadata:
  name: android-emulator
  namespace: android
  labels:
    app.kubernetes.io/name: android-emulator
spec:
  # Cluster-internal endpoints: noVNC is reached through the Ingress behind
  # Authelia, adb by the phone-broker and the automation jobs. Interactive
  # scrcpy clients use the LAN VIP in service-adb-lan.yaml instead; the
  # NetworkPolicy decides who gets to port 5555 at all.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: android-emulator
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
    - name: adb
      port: 5555
      targetPort: adb
