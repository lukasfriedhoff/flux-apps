apiVersion: v1
kind: Service
metadata:
  name: android-emulator
  namespace: android
  labels:
    app.kubernetes.io/name: android-emulator
spec:
  # ClusterIP only. adb on 5555 is an unauthenticated root shell on the
  # device; noVNC is reached through the Ingress behind Authelia, adb only
  # from inside the cluster (phone-broker / automation).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: android-emulator
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
    - name: adb
      port: 5555
      targetPort: adb
