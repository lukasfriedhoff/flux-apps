# dating-automation on the cluster (git.h4xx.io/lukasf/dating-automation).
#
# One CronJob runs the Bumble pet-filter swipe mode on the Android Emulator
# (apps/android-emulator) behind the phone-broker lease (apps/phone-broker)
# and persists records to the CNPG cluster here (postgres.yaml) and media to
# the Garage bucket dating-media. Manual runs on the workstation against the
# real phone write to the same store through MetalLB VIPs. web.yaml is the
# dashboard over that store, behind Authelia.
#
# No Namespace: `dating` is owned by flux-cluster base/namespaces. No
# `namespace:` transformer; every manifest names its namespace itself. The
# placeholders are resolved by the flux-cluster Kustomization
# `dating-automation-app`; examples/apps/dating-automation lists every key.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - cronjob.yaml
  - postgres.yaml
  - backup-bucket-bootstrap.yaml
  - web.yaml
  - web-rbac.yaml
