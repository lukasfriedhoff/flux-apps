# The scheduled swipe run.
#
#   * Forbid + backoffLimit 0 + restartPolicy Never: a swipe run is not
#     idempotent and must never overlap itself or be retried blindly. A run
#     that the broker refuses (someone is on the device) exits 0 as "skipped".
#   * The lease is the mutual exclusion: PHONE_BROKER_URL makes the CLI acquire
#     a `job` lease before the first adb call, renew it, stop between cards if
#     a human appears, and release it in a finally block.
#   * The job brings its own adb client and connects over TCP to the emulator
#     (ADB_CONNECT); it authenticates with the device's one trusted key from
#     the Secret copy in this namespace (ADB_VENDOR_KEYS).
#   * Suspended by default; the first runs are started by hand from this
#     template (kubectl create job --from=cronjob/...) while someone watches
#     the noVNC screen.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dating-automation-swipe
  namespace: ${dating_automation_namespace:=dating}
  labels:
    app.kubernetes.io/name: dating-automation
    app.kubernetes.io/component: swipe
    app.kubernetes.io/part-of: android-platform
spec:
  schedule: ${dating_automation_schedule:=15 9,13,19 * * *}
  timeZone: Europe/Berlin
  suspend: ${dating_automation_cronjob_suspend:=true}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: dating-automation
        app.kubernetes.io/component: swipe
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2700
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dating-automation
            app.kubernetes.io/component: swipe
            app.kubernetes.io/part-of: android-platform
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # kube-router populates the broker's NetworkPolicy ipsets from pod
          # events; a pod that connects in its first seconds can still be
          # dropped (observed 2026-11-28: a fresh pod got 000s for ~20 s while
          # a settled one got 200 at once). Wait for the broker before the run
          # so a lease request never fails on that lag.
          initContainers:
            - name: wait-broker
              image: ${dating_automation_image}
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 90); do
                    curl -sf -m 3 -o /dev/null "$PHONE_BROKER_URL/healthz" && exit 0
                    sleep 2
                  done
                  echo "phone-broker not reachable after 180 s" >&2
                  exit 1
              env:
                - name: PHONE_BROKER_URL
                  value: ${dating_automation_broker_url:=http://phone-broker-emulator.android.svc.cluster.local:8080}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
          containers:
            - name: swipe
              image: ${dating_automation_image}
              imagePullPolicy: IfNotPresent
              args:
                - --app=${dating_automation_app:=bumble}
                - --mode=${dating_automation_mode:=auto-vision}
                - --cards=${dating_automation_cards:=15}
                - --analysis-workers=${dating_automation_analysis_workers:=2}
                - --debug
                # Records to Postgres, media to Garage (persistence section
                # in the env below). The decision dir is pinned onto the PVC;
                # the app's built-in default points at a workstation path.
                - --persist
                - --decision-dir=/app/profiles/${dating_automation_app:=bumble}-debug/decisions
              env:
                - name: PHONE_BROKER_URL
                  value: ${dating_automation_broker_url:=http://phone-broker-emulator.android.svc.cluster.local:8080}
                - name: ADB_CONNECT
                  value: ${dating_automation_adb_connect:=android-emulator.android.svc.cluster.local:5555}
                - name: ADB_VENDOR_KEYS
                  value: /adbkey/adbkey
                - name: HOME
                  value: /home/dating
                - name: PYTHONUNBUFFERED
                  value: "1"
                # Persistence. The CNPG app secret carries no uri key, so the
                # URL has no password and PGPASSWORD supplies it (libpq env).
                - name: DATABASE_URL
                  value: postgresql://dating@dating-postgres-rw.${dating_automation_namespace:=dating}.svc.cluster.local:5432/dating
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${dating_automation_postgres_secret:=dating-postgres-app}
                      key: password
                - name: S3_ENDPOINT_URL
                  value: ${dating_automation_s3_endpoint_url:=http://garage.object-storage.svc.cluster.local:3900}
                - name: S3_BUCKET
                  value: ${dating_automation_s3_bucket:=dating-media}
                - name: S3_PREFIX
                  value: ${dating_automation_s3_prefix:=prod}
                # Garage checks the SigV4 region; it must equal its s3_region.
                - name: AWS_REGION
                  value: ${garage_s3_region:=us-east-1}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${dating_automation_s3_secret:=dating-s3}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${dating_automation_s3_secret:=dating-s3}
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: ${dating_automation_requests_cpu:=500m}
                  memory: ${dating_automation_requests_memory:=1Gi}
                limits:
                  cpu: ${dating_automation_limits_cpu:=3000m}
                  memory: ${dating_automation_limits_memory:=3Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: adbkey
                  mountPath: /adbkey
                  readOnly: true
                - name: home
                  mountPath: /home/dating
                - name: data
                  mountPath: /home/dating/.cache/dating-automation
                  subPath: models
                - name: data
                  mountPath: /app/profiles
                  subPath: profiles
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: adbkey
              secret:
                secretName: ${dating_automation_adbkey_secret:=dating-adbkey}
                defaultMode: 0440
            - name: data
              persistentVolumeClaim:
                claimName: dating-automation-data
            - name: home
              emptyDir:
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
