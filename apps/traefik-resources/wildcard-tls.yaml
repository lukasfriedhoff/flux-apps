apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-wildcard
  namespace: traefik
spec:
  secretName: traefik-wildcard-tls
  issuerRef:
    name: ${default_cluster_issuer}
    kind: ClusterIssuer
  dnsNames:
    - "*.${delegating_domain}"
    - "${delegating_domain}"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: traefik-wildcard-tls
