apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: valheim-webui
  namespace: ${valheim_namespace}
  annotations:
    external-dns.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # -redirect, not the plain forwardauth: this is a browser UI. The plain
    # middleware answers an unauthenticated request with a bare
    # text/plain 401 carrying no Location and no session cookie, so the
    # browser lands on a dead wall with no way to reach the auth portal.
    # Reported 2026-09-27 as "cannot log in" - there was no login flow to
    # reach at all. Keep the plain variant only for machine endpoints
    # (see apps/monitoring/ingress-ingest.yaml), never for a UI.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: valheim${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valheim-olivetin
                port:
                  number: 80
    - host: valheim-files${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valheim-filebrowser
                port:
                  number: 80
