apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: valheim-webui
  namespace: ${valheim_namespace}
  annotations:
    external-dns.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: valheim${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valheim-olivetin
                port:
                  number: 80
    - host: valheim-files${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valheim-filebrowser
                port:
                  number: 80
