# Operations UI: one-click backup, snapshot listing, guarded restore and a
# live server status readout. Exposed only behind the authelia forwardauth
# middleware (see ingress).
#
# NOTE ON $ IN THESE SCRIPTS: flux postBuild substitutes braced ${VAR} (an
# undefined one silently becomes empty — it broke icarus's update gate), but
# leaves bare $VAR and $(...) alone. Shell variables here are therefore
# written unbraced on purpose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-olivetin-config
  namespace: ${valheim_namespace}
data:
  config.yaml: |
    listenAddressSingleHTTPFrontend: 0.0.0.0:1337
    logLevel: INFO
    actions:
      - title: Server status (who is online)
        icon: search
        # Runs in the OliveTin container itself: it already has curl + jq, and
        # the ServiceAccount is deliberately NOT allowed to create pods, so a
        # `kubectl run` wrapper here just fails with exit code 1.
        shell: |
          curl -sf --max-time 10 http://valheim-status/status.json \
            | jq '{server: .server_name, state: .server_status, online: (.players | length), players: [.players[]?.name]}'
        timeout: 60
      - title: Backup now
        icon: box
        shell: |
          kubectl -n ${valheim_namespace} create job --from=cronjob/valheim-backup valheim-backup-manual-$(date +%s)
        timeout: 30
      - title: List snapshots
        icon: search
        shell: restic snapshots --compact
        timeout: 120
      - title: Restart server (also runs a Steam update check)
        icon: restart
        shell: |
          kubectl -n ${valheim_namespace} rollout restart deployment/valheim
        timeout: 30
      - title: Check Steam listing
        icon: ping
        shell: |
          [ -n "$VALHEIM_PUBLIC_HOST" ] || { echo "public_host missing in credentials secret"; exit 1; }
          # ahostsv4, not `hosts`: in-cluster DNS answers with IPv6 first and
          # Steam's API rejects anything that is not IPv4.
          IP=$(getent ahostsv4 "$VALHEIM_PUBLIC_HOST" | awk '{print $1; exit}')
          [ -n "$IP" ] || { echo "cannot resolve the public host to IPv4"; exit 1; }
          curl -sf "https://api.steampowered.com/ISteamApps/GetServersAtAddress/v0001?addr=$IP" \
            | jq -e ".response.servers[] | select(.gameport == ${valheim_game_port:=2456})" \
            || { echo "NOT listed on Steam (gameport ${valheim_game_port:=2456})"; exit 1; }
          echo "OK: listed on Steam"
        timeout: 120
      - title: Restore snapshot (STOPS the server)
        icon: warning
        timeout: 900
        arguments:
          - name: snapshot
            title: restic snapshot ID (see List snapshots)
            type: ascii_identifier
        shell: |
          set -e
          kubectl -n ${valheim_namespace} scale deployment/valheim --replicas=0
          kubectl -n ${valheim_namespace} wait --for=delete pod -l app.kubernetes.io/name=valheim --timeout=180s || true
          restic restore {{ snapshot }} --target /restore-data --delete
          kubectl -n ${valheim_namespace} scale deployment/valheim --replicas=${valheim_replicas:=1}
    # Landing page. The `display` carries raw HTML, which is how this OliveTin
    # release does links (additionalNavigationLinks only exists in newer ones).
    dashboards:
      - title: Valheim
        contents:
          - type: display
            title: |
              <strong>Server:</strong> ${valheim_server_name} &nbsp;|&nbsp;
              <strong>World:</strong> ${valheim_world_name} &nbsp;|&nbsp;
              <strong>Connect:</strong> <code>${valheim_public_host}:${valheim_game_port:=2456}</code>
              <br />
              <a href="https://valheim-files${public_host_suffix}.${delegating_domain}" target="_blank">
              Open the file browser</a> &mdash; worlds, mods, admin list, in-container backups
              &nbsp;|&nbsp;
              <strong>New here? Read the <em>Manual</em> tab above.</strong>
          - title: Server status (who is online)
          - title: Check Steam listing
          - title: Backup now
          - title: List snapshots
          - title: Restart server (also runs a Steam update check)
          - title: Restore snapshot (STOPS the server)
      # Second tab: the manual lives here rather than behind a link, so it
      # cannot rot, needs no extra hosting, and is readable by anyone who can
      # already open this page. Full version: apps/valheim/MANUAL.md.
      #
      # ONE display block on purpose. OliveTin lays each entry in `contents`
      # out as its own card in a grid, so splitting the manual into five
      # blocks produced five ~180px columns of centred text. Everything lives
      # in one block, left-aligned and width-capped by inline style, because
      # the card CSS centres by default.
      - title: Manual
        contents:
          - type: display
            title: |
              <style>
              /* OliveTin lays a dashboard's contents out as a grid of FIXED
                 180px tiles - fieldset{grid-template-columns:repeat(auto-fit,180px)}
                 - plus div.display{align-items:center;font-size:small}. That is
                 right for action buttons and useless for prose, and no inner
                 styling can escape a 180px parent. Override it, scoped with
                 :has() to this one card so the button grid on the other tab is
                 untouched. */
              fieldset:has(#vh-manual){grid-template-columns:1fr!important;justify-content:stretch!important}
              div.display:has(#vh-manual){align-items:stretch!important;place-content:start!important;font-size:1rem!important;text-align:left!important}
              #vh-manual{text-align:left;line-height:1.55;padding:.5em 1.2em;max-width:70em}
              #vh-manual h2{font-size:1.25em;margin:1.3em 0 .4em;display:block}
              #vh-manual h2:first-child{margin-top:.2em}
              #vh-manual li{margin-bottom:.45em}
              #vh-manual code{font-size:.95em}
              </style>
              <div id="vh-manual">
              <h2>Install a mod</h2>
              <p><b>1.</b> Open the
              <a href="https://valheim-files${public_host_suffix}.${delegating_domain}" target="_blank">file browser</a>
              &rarr; <code>bepinex/plugins/</code> &nbsp;
              <b>2.</b> Drop the mod's <code>.dll</code> in &nbsp;
              <b>3.</b> Back here &rarr; <b>Restart server</b></p>
              <p>That is all of it. BepInEx is installed already and updates
              itself. To uninstall, delete the <code>.dll</code> and restart.</p>
              <p><b>Three things that will bite you:</b></p>
              <ul>
              <li><b>Everyone needs the same mods</b> &mdash; they are client AND
              server side. If the server has a mod and your game does not, you
              cannot join at all. Agree a list first.</li>
              <li><b>Most pre-1.0 mods are broken.</b> 1.0 was a major release
              with a Unity upgrade and there is no official mod support. Check
              the author shipped a 1.0 build before blaming the server.</li>
              <li><b>A bad mod breaks joining silently</b> &mdash; server looks
              healthy, nobody gets in. Remove the newest <code>.dll</code>,
              restart.</li>
              </ul>

              <h2>Update a mod</h2>
              <p><b>Delete the old <code>.dll</code> first</b>, then upload the
              new one &mdash; two versions in the folder makes BepInEx load both
              and the server misbehaves or will not start. Then
              <b>Restart server</b>.</p>
              <p><b>Everyone updates too:</b> a player on the old version is
              rejected exactly like someone missing the mod. The mod's
              <code>.cfg</code> keeps your settings across an update; delete it
              only if you want the defaults back.</p>
              <p>The server updates itself every 15 min while empty, so a
              Valheim patch can outdate a mod overnight &mdash; same silent
              symptom as above.</p>

              <h2>Upload a world</h2>
              <p>Worlds are folders under <code>worlds_local/</code> in the file
              browser.</p>
              <p><b>Close Valheim on your PC first.</b> A running game holds the
              save files open, and then only the map cache copies while the
              actual world silently does not &mdash; that has already happened
              here once.</p>
              <p>Copy the whole folder from
              <code>%USERPROFILE%\AppData\LocalLow\IronGate\Valheim\worlds_local\</code>.
              Besides the <code>cacheMinimap*</code> files a complete world has
              <code>_main.&lt;n&gt;.db2</code> (the world itself, the one that
              matters), <code>_main.&lt;n&gt;.fwl2</code> (seed and metadata),
              <code>_main.&lt;n&gt;.chunks</code>, <code>_main.&lt;n&gt;.ok</code>
              and one or more <code>*.chunk</code>.</p>
              <p>If all you see after uploading are four <code>cacheMinimap*</code>
              files, the world did not come with it. Names are also truncated to
              20 characters, so check the folder name survived.</p>

              <h2>Switching which world runs</h2>
              <p>Not self-service, and not a permissions problem: a Valheim
              dedicated server hosts exactly <b>one</b> world, picked when it
              starts. There is no in-game world chooser, and the setting lives
              in the deployment config, not in any file here. Ask Lukas &mdash;
              it is a one-line change. Two worlds playable at once means a
              second server, also possible. Switching deletes nothing.</p>

              <h2>Backups</h2>
              <p><b>Backup now</b> before anything risky. <b>List snapshots</b>
              shows what can be restored. <b>Restore snapshot</b> stops the
              server and <b>rolls the world back for everyone</b> &mdash; check
              <i>Server status</i> and warn people first. The server also
              snapshots itself every 6 hours and a nightly job ships everything
              off-site, so there are two layers before anything is really lost.</p>
              <p>🙂 <b>Smiley: please do not use up all the leather.</b>
              Leather scraps gate half the workbench upgrades, and "I only
              needed a few" has a way of ending as an empty chest. Take what
              the build actually needs and leave the rest &mdash; and if you
              take the last of anything from a shared chest, say so in chat.</p>
              <p><b>Please do not:</b> delete or rename anything in
              <code>worlds_local/</code> except a world you uploaded yourself
              (the <code>*_backup_auto-*</code> folders are the safety net);
              restore while people are playing; install a server mod without
              telling the others.</p>

              <h2>When something is wrong</h2>
              <ul>
              <li><b>Not in the server browser</b> &mdash; press <i>Check Steam
              listing</i>. Steam drops healthy servers sometimes.</li>
              <li><b>You cannot join, others can</b> &mdash; your mods differ
              from the server's.</li>
              <li><b>Nobody can join, server looks up</b> &mdash; newest mod.
              Remove the <code>.dll</code>, restart.</li>
              <li><b>World looks older than it should</b> &mdash; someone
              restored a snapshot; <i>List snapshots</i> shows when.</li>
              <li><b>Uploaded world does not appear</b> &mdash; it is not
              selected yet (see above), and check the
              <code>_main.*.db2</code> really uploaded.</li>
              </ul>
              <p>Anything else: note the time it happened and ask Lukas. The
              server keeps logs, and an exact time makes it findable.</p>
              </div>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim-olivetin
  namespace: ${valheim_namespace}
  annotations:
    # OliveTin reads its config once at startup and does not watch the file, so
    # editing the ConfigMap alone changes nothing on the page - which looks like
    # the change did not deploy. Let reloader restart it.
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: valheim-olivetin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valheim-olivetin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valheim-olivetin
    spec:
      serviceAccountName: valheim-olivetin
      nodeSelector:
        kubernetes.io/hostname: ${valheim_node}
      initContainers:
        # The OliveTin image ships neither kubectl nor restic; stage both
        # into a shared tools dir the actions can use.
        - name: stage-kubectl
          image: ${valheim_kubectl_image:=docker.io/alpine/k8s:1.34.1}
          command: ["cp", "/usr/bin/kubectl", "/tools/kubectl"]
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: stage-restic
          image: ${valheim_restic_image:=restic/restic:0.19.1}
          command: ["cp", "/usr/bin/restic", "/tools/restic"]
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: olivetin
          image: ${valheim_olivetin_image:=ghcr.io/olivetin/olivetin:2024.05.27}
          ports:
            - containerPort: 1337
          env:
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: RESTIC_CACHE_DIR
              value: /tmp/restic-cache
            # Public DNS name for the Steam-listing action; deliberately a
            # secret, not a config var — the operator keeps it unpublished.
            - name: VALHEIM_PUBLIC_HOST
              valueFrom:
                secretKeyRef:
                  name: ${valheim_credentials_secret_name:=valheim-credentials}
                  key: public_host
                  optional: true
          envFrom:
            - secretRef:
                name: ${valheim_backup_secret_name:=valheim-backup-credentials}
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: config
              mountPath: /config
            - name: data
              mountPath: /restore-data
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tools
          emptyDir: {}
        - name: config
          configMap:
            name: valheim-olivetin-config
        - name: data
          persistentVolumeClaim:
            claimName: valheim-config
---
apiVersion: v1
kind: Service
metadata:
  name: valheim-olivetin
  namespace: ${valheim_namespace}
spec:
  selector:
    app.kubernetes.io/name: valheim-olivetin
  ports:
    - port: 80
      targetPort: 1337
