# The steamcmd install (~3 GiB incl. depot cache). Re-downloadable at any
# time, so one replica on fast storage is enough.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valheim-server
  namespace: ${valheim_namespace}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${valheim_server_size:=20Gi}
  storageClassName: ${valheim_server_storage_class_name:=longhorn-ssd-rwo-1r}
