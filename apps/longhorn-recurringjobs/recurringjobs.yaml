# Volumes EXCLUDED from backup (2026-09-23). Longhorn selects volumes by a
# label on the Volume CR, and the opt-out is expressed by the label VALUE, not
# by removing it - removing it just makes Longhorn re-add `default` itself.
# These CRs are not flux-managed (Longhorn owns them), so if a PVC is ever
# recreated its volume rejoins `default` and starts being backed up again.
# Re-apply with:
#
#   kubectl -n longhorn-system label volume.longhorn.io <vol> \
#     'recurring-job-group.longhorn.io/default=disabled' --overwrite
#
#   media/jellyfin-transcode-cache        ~98Gi/backup - a transcode CACHE
#   nix-cache/hydra-nix-store            ~250Gi/backup - reproducible via Hydra
#   nix-cache/nix-remote-builder-nix-store ~62Gi/backup - build scratch store
#   nix-cache/attic-storage               ~36Gi/backup - binary CACHE, refetchable
#   immich/immich-ml-cache                 ~1Gi/backup - ML models, redownloadable
#   immich-photos/immich-photos-ml-cache   ~1Gi/backup - ditto
#   media/arr-media-v2                   (pre-existing exclusion, 4.2TiB library)
#
# Deliberately still BACKED UP (state, not cache): nix-cache/hydra-state
# (jobsets + build history) and nix-cache/nix-remote-builder-state.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: ${longhorn_namespace}
spec:
  name: backup-daily
  # RE-ENABLED 2026-09-24 (was disabled 09-22 when storage01 hit 100%).
  # storage01 is back to 74% / 1.5T free and d9a2c68's cache exclusions are
  # banked, so a generation costs ~30-40Gi of changed blocks, not a fresh full
  # (the store dedups by block checksum: 2 fleet-wide full days in a row still
  # total only 2445Gi stored). The first run also PRUNES - retain was cut 14->7
  # while the job was disabled, so every volume still holds 14 generations and
  # night one drops roughly half of them.
  #
  # Caution for the next person: this bucket store is SHARED with the CNPG
  # barman WAL archives. Filling it does not just stop volume backups, it stops
  # every postgres from archiving WAL, which fills the primaries' PVCs and ends
  # in "no primary at all". Watch /mnt/backup after the first few runs.
  cron: "${longhorn_recurring_backup_cron:=15 3 * * *}"
  task: backup
  groups:
    - default
  # was :=14 - stale. The live object and base-config both say 7; keep the
  # default honest so a fresh cluster does not silently retain twice as much.
  retain: ${longhorn_recurring_backup_retain:=7}
  # Was 1. With 120 volumes in the 'default' group this queue is strictly
  # serial, so one volume that cannot acquire its backupstore lock stalls
  # everything behind it - which is how authelia-valkey, nix-remote-builder-state
  # and attic-postgres-1 went 5-6 days without a backup while every other volume
  # completed nightly. Longhorn's own backup-concurrent-limit is already 2.
  #
  # This alone does not fix a stuck volume; it only stops one from starving the
  # rest. Stale *.lck files in the backupstore still have to be removed.
  concurrency: ${longhorn_recurring_backup_concurrency:=2}
  labels:
    backup-target: external-minio
  parameters:
    full-backup-interval: "7"
---
# Snapshot retention. There was NO snapshot cleanup job at all until 2026-10-08,
# and that is what actually broke backups.
#
# Longhorn caps a volume at snapshot-max-count (250). Four volumes reached it -
# authelia-valkey 249, attic-postgres-1 250, nix-remote-builder-state 249,
# attic-storage 249 - and a volume at the cap cannot create a new snapshot, so
# its backup cannot start either. Three of those four are exactly the volumes
# that had not been backed up since 29/30 September, and the newest snapshot on
# authelia-valkey was dated 2026-09-29T23:53 - the day it jammed.
#
# Only 38 of those 249 came from backup-daily; the other 211 were system
# snapshots, almost certainly left behind by the September replica-rebuild
# storm. Nothing was ever going to remove them.
#
# The space cost was real too: authelia-valkey declared 1Gi but occupied 13Gi,
# attic-postgres-1 declared 20Gi but occupied 79Gi.
#
# Runs before backup-daily (03:15) so the backup always has a free slot.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: ${longhorn_namespace}
spec:
  name: snapshot-cleanup
  cron: "${longhorn_recurring_snapshot_cleanup_cron:=0 1 * * *}"
  # snapshot-delete, not snapshot-cleanup: 'cleanup' only purges snapshots that
  # are already marked for deletion, which would have done nothing here because
  # nothing was marking them. 'snapshot-delete' trims to retain and then purges.
  task: snapshot-delete
  groups:
    - default
  retain: ${longhorn_recurring_snapshot_retain:=10}
  concurrency: ${longhorn_recurring_snapshot_concurrency:=2}
  labels:
    purpose: snapshot-retention
