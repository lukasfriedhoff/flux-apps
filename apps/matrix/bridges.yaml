apiVersion: v1
kind: Service
metadata:
  name: whatsapp
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: whatsapp
  ports:
    - name: http
      port: 29318
      targetPort: 29318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whatsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatsapp
    spec:
      securityContext:
        fsGroup: 1337
      containers:
        - name: whatsapp
          image: dock.mau.dev/mautrix/whatsapp:${matrix_whatsapp_image_tag}
          resources:
            requests:
              cpu: ${matrix_bridge_requests_cpu}
              memory: ${matrix_bridge_requests_memory}
            limits:
              cpu: ${matrix_bridge_limits_cpu}
              memory: ${matrix_bridge_limits_memory}
          volumeMounts:
            - name: whatsapp-data
              mountPath: /data
            - name: whatsapp-config
              mountPath: /data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: whatsapp-config
              mountPath: /data/registration.yaml
              subPath: registration.yaml
              readOnly: true
      volumes:
        - name: whatsapp-data
          persistentVolumeClaim:
            claimName: matrix-whatsapp-data
        - name: whatsapp-config
          secret:
            secretName: matrix-whatsapp-config
---
