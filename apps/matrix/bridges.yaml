apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaldprivate
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: signaldprivate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signaldprivate
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: signalbridgeprivate
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1337
      containers:
        - name: signaldprivate
          image: docker.io/signald/signald:${matrix_signald_image_tag}
          resources:
            requests:
              cpu: ${matrix_signald_requests_cpu}
              memory: ${matrix_signald_requests_memory}
            limits:
              cpu: ${matrix_signald_limits_cpu}
              memory: ${matrix_signald_limits_memory}
          volumeMounts:
            - name: signald-data
              mountPath: /signald
      volumes:
        - name: signald-data
          persistentVolumeClaim:
            claimName: matrix-signald-data
