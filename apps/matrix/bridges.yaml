apiVersion: v1
kind: Service
metadata:
  name: telegram
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: telegram
  ports:
    - name: http
      port: 29317
      targetPort: 29317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram
    spec:
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: telegram-config-bootstrap
          image: busybox:1.36
          command:
            - /bin/sh
            - -ceu
            - |
              if [ ! -s /data/config.yaml ]; then
                cp /seed/config.yaml /data/config.yaml
              fi
              if [ ! -s /data/registration.yaml ]; then
                cp /seed/registration.yaml /data/registration.yaml
              fi
              # Normalize legacy permission values for current mautrix-telegram releases.
              sed -i "s/relaybot/relay/g" /data/config.yaml
              sed -E -i "s/^([[:space:]]*[^#].*:[[:space:]]*)full$/\\1admin/" /data/config.yaml
              # Migrate legacy CNPG service name used before custom services were removed.
              sed -E -i "s/@telegramdb([:/])/@telegramdb-rw\\1/g" /data/config.yaml
              chown 1337:1337 /data/config.yaml /data/registration.yaml || true
          volumeMounts:
            - name: telegram-data
              mountPath: /data
            - name: telegram-config
              mountPath: /seed
              readOnly: true
      containers:
        - name: telegram
          image: dock.mau.dev/mautrix/telegram:${matrix_telegram_image_tag}
          resources:
            requests:
              cpu: ${matrix_bridge_requests_cpu}
              memory: ${matrix_bridge_requests_memory}
            limits:
              cpu: ${matrix_bridge_limits_cpu}
              memory: ${matrix_bridge_limits_memory}
          volumeMounts:
            - name: telegram-data
              mountPath: /data
      volumes:
        - name: telegram-data
          persistentVolumeClaim:
            claimName: matrix-telegram-data
        - name: telegram-config
          secret:
            secretName: matrix-telegram-config
---
