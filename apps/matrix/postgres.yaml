apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: synapsedb
  namespace: matrix
spec:
  schedule: "${matrix_postgres_backup_cron:=0 0 2 * * *}"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: synapsedb
