apiVersion: v1
kind: Service
metadata:
  name: synapsedb-source
  namespace: matrix
  annotations:
    lukasf.io/migration-temporary: "true"
spec:
  selector:
    app.kubernetes.io/name: synapsedb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: synapsedb
  namespace: matrix
spec:
  # Keep the historical service name stable for app-side config.
  selector:
    cnpg.io/cluster: synapsedb
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: synapsedb
  namespace: matrix
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-trixie
  instances: 1
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: ${matrix_synapse_postgres_source_dbname:=synapse}
      owner: ${matrix_synapse_postgres_source_user:=synapse}
      secret:
        name: synapsedb-app
      import:
        type: microservice
        databases:
          - ${matrix_synapse_postgres_source_dbname:=synapse}
        source:
          externalCluster: synapsedb-source
  managed:
    roles:
      - name: ${matrix_synapse_postgres_source_user:=synapse}
        ensure: present
        login: true
        passwordSecret:
          name: synapsedb-app
  externalClusters:
    - name: synapsedb-source
      connectionParameters:
        host: synapsedb-source
        user: ${matrix_synapse_postgres_source_user:=synapse}
        dbname: ${matrix_synapse_postgres_source_dbname:=synapse}
      password:
        name: matrix-db
        key: SYNAPSE_DB_PASSWORD
  storage:
    storageClass: ${matrix_postgres_storage_class_name}
    size: ${matrix_postgres_size}
  resources:
    requests:
      cpu: ${matrix_postgres_requests_cpu}
      memory: ${matrix_postgres_requests_memory}
    limits:
      cpu: ${matrix_postgres_limits_cpu}
      memory: ${matrix_postgres_limits_memory}
---
