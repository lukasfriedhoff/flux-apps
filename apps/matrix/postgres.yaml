apiVersion: v1
kind: Service
metadata:
  name: synapsedb
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: synapsedb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapsedb
  namespace: matrix
spec:
  serviceName: synapsedb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapsedb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapsedb
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: matrix-db
                  key: SYNAPSE_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-db
                  key: SYNAPSE_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: matrix-db
                  key: SYNAPSE_DB_NAME
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C"
          resources:
            requests:
              cpu: ${matrix_postgres_requests_cpu}
              memory: ${matrix_postgres_requests_memory}
            limits:
              cpu: ${matrix_postgres_limits_cpu}
              memory: ${matrix_postgres_limits_memory}
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ${matrix_postgres_storage_class_name}
        resources:
          requests:
            storage: ${matrix_postgres_size}
---
