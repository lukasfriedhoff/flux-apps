apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: synapsedb
  namespace: matrix
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  instances: 1
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: ${matrix_synapse_postgres_source_dbname:=synapse}
      owner: ${matrix_synapse_postgres_source_user:=synapse}
      secret:
        name: synapsedb-app
  managed:
    roles:
      - name: ${matrix_synapse_postgres_source_user:=synapse}
        ensure: present
        login: true
        passwordSecret:
          name: synapsedb-app
  storage:
    storageClass: ${matrix_postgres_storage_class_name}
    size: ${matrix_postgres_size}
  backup:
    barmanObjectStore:
      destinationPath: "s3://${matrix_postgres_backup_bucket}/${cluster_environment}/${matrix_synapsedb_backup_path:=synapsedb}/"
      endpointURL: "${matrix_postgres_backup_endpoint_url:=}"
      s3Credentials:
        accessKeyId:
          name: ${matrix_postgres_backup_credential_secret_name}
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: ${matrix_postgres_backup_credential_secret_name}
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  resources:
    requests:
      cpu: ${matrix_postgres_requests_cpu}
      memory: ${matrix_postgres_requests_memory}
    limits:
      cpu: ${matrix_postgres_limits_cpu}
      memory: ${matrix_postgres_limits_memory}
---
