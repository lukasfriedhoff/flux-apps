apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-config
  namespace: matrix
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "${matrix_public_baseurl}",
          "server_name": "${matrix_server_name}"
        }
      },
      "default_theme": "dark",
      "disable_custom_urls": true,
      "disable_guests": true,
      "show_labs_settings": false,
      "brand": "h4xx Matrix",
      "room_directory": {
        "servers": [
          "${matrix_server_name}"
        ]
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: element-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element-web
    spec:
      enableServiceLinks: false
      containers:
        - name: element-web
          image: vectorim/element-web:${matrix_element_image_tag}
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: element-web-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: element-web-config
          configMap:
            name: element-web-config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: element-web
  namespace: matrix
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: chat${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /_matrix
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 8008
          - path: /_synapse
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 8008
          - path: /
            pathType: Prefix
            backend:
              service:
                name: element-web
                port:
                  number: 80
  tls:
    - secretName: element-web-tls
      hosts:
        - chat${public_host_suffix}.${delegating_domain}
