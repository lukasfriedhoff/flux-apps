apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: synapse
  ports:
    - name: http
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: ${matrix_synapse_replicas}
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
    spec:
      securityContext:
        fsGroup: 0
      initContainers:
        - name: synapse-config-bootstrap
          image: busybox:1.36
          command:
            - /bin/sh
            - -ceu
            - |
              cp /seed/server.yaml /config/server.yaml
              cp /seed/homeserver.log.config /config/homeserver.log.config
          volumeMounts:
            - name: synapse-config
              mountPath: /seed
              readOnly: true
            - name: synapse-config-dir
              mountPath: /config
      containers:
        - name: synapse
          image: matrixdotorg/synapse:${matrix_synapse_image_tag}
          ports:
            - name: http
              containerPort: 8008
          env:
            - name: SYNAPSE_CONFIG_DIR
              value: /config
            - name: SYNAPSE_CONFIG_PATH
              value: /config/server.yaml
            - name: SYNAPSE_REPORT_STATS
              value: "no"
            - name: UID
              value: "0"
            - name: GID
              value: "0"
          resources:
            requests:
              cpu: ${matrix_synapse_requests_cpu}
              memory: ${matrix_synapse_requests_memory}
            limits:
              cpu: ${matrix_synapse_limits_cpu}
              memory: ${matrix_synapse_limits_memory}
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: synapse-data
              mountPath: /data
            - name: synapse-media
              mountPath: /media_store
            - name: synapse-config-dir
              mountPath: /config
            - name: telegram-config
              mountPath: /telegramdata/registration.yaml
              subPath: registration.yaml
              readOnly: true
            - name: signal-config
              mountPath: /signaldataprivate/registration.yaml
              subPath: registration.yaml
              readOnly: true
            - name: whatsapp-config
              mountPath: /whatsappdata/registration.yaml
              subPath: registration.yaml
              readOnly: true
            - name: wa-config
              mountPath: /wadata/registration.yaml
              subPath: registration.yaml
              readOnly: true
      volumes:
        - name: synapse-data
          persistentVolumeClaim:
            claimName: matrix-synapse-data
        - name: synapse-media
          persistentVolumeClaim:
            claimName: matrix-synapse-media
        - name: synapse-config
          secret:
            secretName: matrix-synapse-config
        - name: synapse-config-dir
          emptyDir: {}
        - name: telegram-config
          secret:
            secretName: matrix-telegram-config
        - name: signal-config
          secret:
            secretName: matrix-signal-config
        - name: whatsapp-config
          secret:
            secretName: matrix-whatsapp-config
        - name: wa-config
          secret:
            secretName: matrix-wa-config
