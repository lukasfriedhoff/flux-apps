apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: synapse
  ports:
    - name: http
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: ${matrix_synapse_replicas}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: synapse
    spec:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: synapse-config-bootstrap
          image: busybox:1.36
          command:
            - /bin/sh
            - -ce
            - |
              cp /seed/server.yaml /config/server.yaml
              if grep -Eq '^[[:space:]]*server_name:[[:space:]]*' /config/server.yaml; then
                sed -i "s#^[[:space:]]*server_name:[[:space:]].*#server_name: \"$MATRIX_SERVER_NAME\"#" /config/server.yaml
              else
                printf '%s\n' "server_name: \"$MATRIX_SERVER_NAME\"" >> /config/server.yaml
              fi
              if grep -Eq '^[[:space:]]*public_baseurl:[[:space:]]*' /config/server.yaml; then
                sed -i "s#^[[:space:]]*public_baseurl:[[:space:]].*#public_baseurl: \"$MATRIX_PUBLIC_BASEURL\"#" /config/server.yaml
              else
                printf '%s\n' "public_baseurl: \"$MATRIX_PUBLIC_BASEURL\"" >> /config/server.yaml
              fi
              # Some encrypted seed configs do not end with a newline. Normalize
              # before appending generated top-level keys.
              printf '\n' >> /config/server.yaml
              if grep -Eq '^[[:space:]]*enable_authenticated_media:[[:space:]]*' /config/server.yaml; then
                sed -i 's/^[[:space:]]*enable_authenticated_media:[[:space:]]*.*/enable_authenticated_media: false/' /config/server.yaml
              else
                printf '%s\n' 'enable_authenticated_media: false' >> /config/server.yaml
              fi
              sed -i '\#^[[:space:]]*-[[:space:]]*/wadata/registration.yaml[[:space:]]*$#d' /config/server.yaml
              # Some historical secret revisions contain signing-key spillover in
              # homeserver.log.config. Keep only the expected logging config.
              awk '
                /^disable_existing_loggers:[[:space:]]*false/ {
                  print "disable_existing_loggers: false"
                  exit
                }
                { print }
              ' /seed/homeserver.log.config > /config/homeserver.log.config
              # Synapse may append generated key settings to server.yaml on first boot.
              # Ensure the file ends with a newline so appended content remains valid YAML.
              printf '\n' >> /config/server.yaml
              # Federation discovery from remote homeservers depends on this endpoint.
              if grep -Eq '^[[:space:]]*serve_server_wellknown:[[:space:]]*' /config/server.yaml; then
                sed -i 's/^[[:space:]]*serve_server_wellknown:[[:space:]]*.*/serve_server_wellknown: true/' /config/server.yaml
              else
                printf '%s\n' 'serve_server_wellknown: true' >> /config/server.yaml
              fi
              # Keep the signing key stable across restarts.
              if [ -s /seed/homeserver.signing.key ]; then
                cp /seed/homeserver.signing.key /config/homeserver.signing.key
              elif [ -s /data/homeserver.signing.key ]; then
                cp /data/homeserver.signing.key /config/homeserver.signing.key
              fi
              if [ -s /config/homeserver.signing.key ]; then
                chmod 600 /config/homeserver.signing.key
                cp /config/homeserver.signing.key /data/homeserver.signing.key
                chmod 600 /data/homeserver.signing.key
              fi
              if [ "$MATRIX_OIDC_PROVIDER" = "authelia" ]; then
                if [ -z "$MATRIX_OIDC_ISSUER_URL" ] || [ -z "$MATRIX_OIDC_CLIENT_ID" ] || [ -z "$MATRIX_OIDC_CLIENT_SECRET" ]; then
                  echo "Matrix OIDC is enabled but issuer/client settings are missing." >&2
                  exit 1
                fi
                if grep -Eq '^[[:space:]]*-[[:space:]]*idp_id:[[:space:]]*authelia([[:space:]]|$)' /config/server.yaml; then
                  echo "Matrix OIDC: authelia provider already present; skipping append."
                else
                  cat > /tmp/matrix-oidc-provider.yaml <<EOF
                - idp_id: authelia
                  idp_name: Authelia
                  discover: true
                  issuer: "$MATRIX_OIDC_ISSUER_URL"
                  client_id: "$MATRIX_OIDC_CLIENT_ID"
                  client_secret: "$MATRIX_OIDC_CLIENT_SECRET"
                  client_auth_method: client_secret_post
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
                  user_profile_method: userinfo_endpoint
                  allow_existing_users: true
                  user_mapping_provider:
                    config:
                      localpart_template: "{{ user.preferred_username or user.nickname or user.email.split('@')[0] }}"
                      display_name_template: "{{ user.name or user.preferred_username }}"
              EOF
                  if grep -q '^oidc_providers:[[:space:]]*$' /config/server.yaml; then
                    awk '
                      {
                        print
                        if (!inserted && $0 ~ /^oidc_providers:[[:space:]]*$/) {
                          while ((getline line < "/tmp/matrix-oidc-provider.yaml") > 0) {
                            print line
                          }
                          close("/tmp/matrix-oidc-provider.yaml")
                          inserted = 1
                        }
                      }
                    ' /config/server.yaml > /config/server.yaml.tmp
                    mv /config/server.yaml.tmp /config/server.yaml
                  else
                    cat >> /config/server.yaml <<EOF
              oidc_providers:
              EOF
                    cat /tmp/matrix-oidc-provider.yaml >> /config/server.yaml
                  fi
                fi
              fi
          env:
            - name: MATRIX_OIDC_PROVIDER
              value: ${matrix_oidc:=none}
            - name: MATRIX_SERVER_NAME
              value: ${matrix_server_name}
            - name: MATRIX_PUBLIC_BASEURL
              value: ${matrix_public_baseurl}
            - name: MATRIX_OIDC_ISSUER_URL
              value: https://auth${public_host_suffix}.${delegating_domain}
            - name: MATRIX_OIDC_CLIENT_ID
              value: ${matrix_oidc_client_id:=matrix-synapse}
            - name: MATRIX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-oidc
                  key: MATRIX_OIDC_CLIENT_SECRET
                  optional: true
          volumeMounts:
            - name: synapse-config
              mountPath: /seed
              readOnly: true
            - name: synapse-data
              mountPath: /data
            - name: synapse-config-dir
              mountPath: /config
      containers:
        - name: synapse
          image: matrixdotorg/synapse:${matrix_synapse_image_tag}
          ports:
            - name: http
              containerPort: 8008
          env:
            - name: SYNAPSE_CONFIG_DIR
              value: /config
            - name: SYNAPSE_CONFIG_PATH
              value: /config/server.yaml
            - name: SYNAPSE_REPORT_STATS
              value: "no"
            - name: UID
              value: "0"
            - name: GID
              value: "0"
            - name: MATRIX_OIDC_PROVIDER
              value: ${matrix_oidc:=none}
            - name: MATRIX_OIDC_ISSUER_URL
              value: https://auth${public_host_suffix}.${delegating_domain}
            - name: MATRIX_OIDC_CLIENT_ID
              value: ${matrix_oidc_client_id:=matrix-synapse}
            - name: MATRIX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-oidc
                  key: MATRIX_OIDC_CLIENT_SECRET
                  optional: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ce
                  - |
                    # On first boot, Synapse may generate the key after startup.
                    # Persist it into the data PVC for future pod restarts.
                    for _ in $(seq 1 60); do
                      if [ -s /config/homeserver.signing.key ]; then
                        cp /config/homeserver.signing.key /data/homeserver.signing.key
                        chmod 600 /data/homeserver.signing.key
                        exit 0
                      fi
                      sleep 1
                    done
                    exit 0
          resources:
            requests:
              cpu: ${matrix_synapse_requests_cpu}
              memory: ${matrix_synapse_requests_memory}
            limits:
              cpu: ${matrix_synapse_limits_cpu}
              memory: ${matrix_synapse_limits_memory}
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: synapse-data
              mountPath: /data
            - name: synapse-media
              mountPath: /media_store
            - name: synapse-config-dir
              mountPath: /config
            - name: telegram-config
              mountPath: /telegramdata/registration.yaml
              subPath: registration.yaml
              readOnly: true
            - name: signal-config
              mountPath: /signaldataprivate/registration.yaml
              subPath: registration.yaml
              readOnly: true
            - name: whatsapp-config
              mountPath: /whatsappdata/registration.yaml
              subPath: registration.yaml
              readOnly: true
      volumes:
        - name: synapse-data
          persistentVolumeClaim:
            claimName: matrix-synapse-data
        - name: synapse-media
          persistentVolumeClaim:
            claimName: matrix-synapse-media
        - name: synapse-config
          secret:
            secretName: matrix-synapse-config
        - name: synapse-config-dir
          emptyDir: {}
        - name: telegram-config
          secret:
            secretName: matrix-telegram-config
        - name: signal-config
          secret:
            secretName: matrix-signal-config
        - name: whatsapp-config
          secret:
            secretName: matrix-whatsapp-config
