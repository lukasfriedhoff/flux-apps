apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-dashboard
  namespace: ${status_dashboard_namespace}
  labels:
    app.kubernetes.io/name: status-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-dashboard
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: status-dashboard-config
