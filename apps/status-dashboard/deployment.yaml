apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-dashboard
  namespace: ${status_dashboard_namespace}
  labels:
    app.kubernetes.io/name: status-dashboard
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: ${status_dashboard_replicas:=1}
  strategy:
    # No local state any more (history lives in CNPG), so a rolling update is
    # safe. Start at one replica: Gatus runs its schema migration on startup,
    # and two pods racing that on a fresh database is an avoidable risk. Raise
    # status_dashboard_replicas once the schema exists.
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: status-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-dashboard
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:latest
          imagePullPolicy: IfNotPresent
          env:
            # Gatus expands ${...} in its config at startup. Written as
            # $${GATUS_DB_URI} in the ConfigMap so flux's envsubst leaves it
            # alone - an unescaped one would be replaced with an empty string
            # before Gatus ever sees it.
            - name: GATUS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: status-dashboard-postgres-app
                  key: uri
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: status-dashboard-config
