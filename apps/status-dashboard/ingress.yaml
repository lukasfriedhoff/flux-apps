apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-dashboard
  namespace: ${status_dashboard_namespace}
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${status_dashboard_host}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: status-dashboard
                port:
                  number: 80
  tls:
    - secretName: status-dashboard-tls
      hosts:
        - ${status_dashboard_host}
