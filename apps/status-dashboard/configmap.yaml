apiVersion: v1
kind: ConfigMap
metadata:
  name: status-dashboard-config
  namespace: ${status_dashboard_namespace}
data:
  config.yaml: |
    ui:
      title: ${status_dashboard_title}
      description: ${status_dashboard_description}
    endpoints:
      - name: Authelia
        group: Core
        url: https://auth${public_host_suffix}.${delegating_domain}/api/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Nextcloud
        group: Core
        url: https://nextcloud${public_host_suffix}.${delegating_domain}/status.php
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Immich
        group: Photos
        url: https://meme${public_host_suffix}.${delegating_domain}/api/server/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Immich Photos
        group: Photos
        url: https://photos${public_host_suffix}.${delegating_domain}/api/server/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Matrix
        group: Core
        url: https://matrix${public_host_suffix}.${delegating_domain}/_matrix/client/versions
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Element Chat
        group: Core
        url: https://chat${public_host_suffix}.${delegating_domain}/config.json
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Collabora
        group: Core
        url: https://collabora${public_host_suffix}.${delegating_domain}/hosting/discovery
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Grafana
        group: Monitoring
        url: https://grafana${public_host_suffix}.${delegating_domain}/api/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Traefik Dashboard
        group: Monitoring
        url: https://dashboard${public_host_suffix}.${delegating_domain}/dashboard/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Metrics Ingest
        group: Monitoring
        url: https://metrics${public_host_suffix}.${delegating_domain}/ready
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Logs Ingest
        group: Monitoring
        url: https://logs${public_host_suffix}.${delegating_domain}/ready
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Traces Ingest
        group: Monitoring
        url: https://traces${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Nix Cache
        group: Build
        url: https://nix${public_host_suffix}.${delegating_domain}/nix-cache-info
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Attic
        group: Build
        url: https://attic${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Hydra
        group: Build
        url: https://hydra${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Jellyfin
        group: Media
        url: https://jellyfin${public_host_suffix}.${delegating_domain}/health
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Jellyseerr
        group: Media
        url: https://jellyseerr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: qBittorrent
        group: Media
        url: https://qbittorrent${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Prowlarr
        group: Media
        url: https://prowlarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Sonarr
        group: Media
        url: https://sonarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Radarr
        group: Media
        url: https://radarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Lidarr
        group: Media
        url: https://lidarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Readarr
        group: Media
        url: https://readarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Bazarr
        group: Media
        url: https://bazarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Profilarr
        group: Media
        url: https://profilarr${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: MeTube
        group: Media
        url: https://metube${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      # --- Platform: the things everything else depends on. A failure here
      # usually explains failures further down this page, so keep it first.
      - name: Forgejo
        group: Platform
        url: https://git${public_host_suffix}.${delegating_domain}/api/healthz
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Harbor
        group: Platform
        url: https://harbor${public_host_suffix}.${delegating_domain}/api/v2.0/ping
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == Pong"
      - name: LLDAP
        group: Platform
        # The directory behind Authelia: if this is down nobody can log in
        # anywhere, including this dashboard's own protected endpoints.
        url: https://lldap${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Matrix Auth (MAS)
        group: Platform
        # MAS has no /health or /healthz (both 404). The OIDC discovery
        # document is a better probe anyway: a 200 here means it is actually
        # serving OIDC, which is what Matrix logins depend on.
        url: https://matrix-auth${public_host_suffix}.${delegating_domain}/.well-known/openid-configuration
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].issuer != "
      - name: Backrest
        group: Platform
        url: https://backrest${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"

      - name: Start Page
        group: Platform
        # The landing page people are pointed at; if it is down they have no
        # way to find anything else.
        url: https://start${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"

      # --- Home: automation and household-facing bits.
      - name: Home Assistant
        group: Home
        url: https://ha${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Zigbee2MQTT
        group: Home
        url: https://zigbee${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Kiosk
        group: Home
        url: https://kiosk${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Obsidian LiveSync
        group: Home
        url: https://obsidian-backend${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"

      # --- Games and remote desktop.
      - name: Icarus
        group: Games
        url: https://icarus${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Icarus Files
        group: Games
        url: https://icarus-files${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Valheim
        group: Games
        url: https://valheim${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Valheim Files
        group: Games
        url: https://valheim-files${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      # The game endpoints themselves, not just their ops UIs behind the
      # tunnel. These are backed by the A2S exporter, which reports up=1 only
      # when the server actually answered a Steam query - the one check that
      # distinguishes "joinable" from "process alive". ICMP was rejected here
      # (the container drops NET_RAW) and a UDP dial always succeeds because
      # UDP is connectionless, so neither was trustworthy.
      - name: Valheim Server
        group: Games
        url: http://gameserver-exporter.${gameserver_exporter_namespace:=monitoring}.svc.cluster.local/status
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].valheim.up == 1"
      - name: Icarus Server
        group: Games
        url: http://gameserver-exporter.${gameserver_exporter_namespace:=monitoring}.svc.cluster.local/status
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].icarus.up == 1"
      - name: Cloud Desktop
        group: Games
        url: https://desktop${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"

      # --- Apps: smaller self-hosted bits.
      - name: Kutschenapp
        group: Apps
        url: https://kutsche${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Kutschenapp API
        group: Apps
        # Returns 404 at / - it is an API with no root route. That still
        # proves the app is answering (traefik routed and the app replied);
        # a dead backend gives 502/503, which this condition catches.
        url: https://kutschenapi${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
      - name: Cryo
        group: Apps
        url: https://cryo${public_host_suffix}.${delegating_domain}/
        interval: 1m
        conditions:
          - "[STATUS] < 500"
