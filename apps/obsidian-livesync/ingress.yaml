# NO authelia forwardauth: LiveSync talks to CouchDB's own HTTP API with
# CouchDB basic auth (require_valid_user=true), which an interactive
# forwardauth would break. CouchDB serves CORS itself, so no traefik CORS
# middleware either (would double the headers).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian-livesync
  namespace: obsidian-livesync
  annotations:
    external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: obsidian-backend${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port:
                  number: 80
