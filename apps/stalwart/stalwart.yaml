# Stalwart v0.16 mail server (SMTP in/out, IMAP, JMAP, POP3, CalDAV/CardDAV,
# spam filter, Sieve, FTS).
#
# v0.16 redesigned configuration completely: the on-disk config.json holds
# ONLY the datastore pointer. Domains, listeners, directories, OIDC, DKIM,
# spam rules and every other setting live inside that datastore as JMAP
# objects, reconciled declaratively with `stalwart-cli apply` from the
# committed plan in apply-plan.yaml. That is what makes replicas
# interchangeable - scale with ${stalwart_replicas} once the cluster
# coordinator is declared in the plan.
#
# config.json is rendered at pod start from the template below so the
# CNPG-generated Postgres password never lands in git or in a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: mail
data:
  config.json.template: |
    {
      "@type": "PostgreSql",
      "host": "stalwart-postgres-rw.mail.svc.cluster.local",
      "port": 5432,
      "database": "stalwart",
      "authUsername": "__PG_USER__",
      "authSecret": { "@type": "Value", "secret": "__PG_PASSWORD__" },
      "timeout": 15000,
      "useTls": false,
      "poolMaxConnections": ${stalwart_pg_pool_max:=10},
      "poolRecyclingMethod": "fast"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: mail
  labels:
    app.kubernetes.io/name: stalwart
spec:
  replicas: ${stalwart_replicas:=1}
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      initContainers:
        # Render config.json with the CNPG credentials. python3 does the
        # substitution so a password containing shell or regex
        # metacharacters cannot corrupt the JSON (the mc image has no
        # python; this pulls through the Harbor docker proxy).
        - name: render-config
          image: ${stalwart_render_image:=harbor.h4xx.io/proxy-docker/library/python:3-alpine}
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-postgres-app
                  key: password
          command:
            - python3
            - -c
            - |
              import json, os
              tpl = open('/template/config.json.template').read()
              tpl = tpl.replace('"__PG_USER__"', json.dumps(os.environ['PG_USER']))
              tpl = tpl.replace('"__PG_PASSWORD__"', json.dumps(os.environ['PG_PASSWORD']))
              json.loads(tpl)  # fail loudly rather than boot-loop on bad JSON
              open('/etc/stalwart/config.json', 'w').write(tpl)
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: config
              mountPath: /etc/stalwart
      containers:
        - name: stalwart
          image: docker.io/stalwartlabs/stalwart:${stalwart_image_tag:=v0.16.25}
          args: ["--config", "/etc/stalwart/config.json"]
          env:
            # Fallback admin for the WebUI/CLI until real admins exist in the
            # directory. NOT recovery mode - that is migration-only.
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-admin
                  key: recoveryAdmin
          ports:
            - { name: smtp, containerPort: 25 }
            - { name: submission, containerPort: 587 }
            - { name: submissions, containerPort: 465 }
            - { name: imap, containerPort: 143 }
            - { name: imaptls, containerPort: 993 }
            - { name: sieve, containerPort: 4190 }
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
            - name: data
              mountPath: /var/lib/stalwart
          resources:
            requests:
              cpu: ${stalwart_requests_cpu:=200m}
              memory: ${stalwart_requests_memory:=512Mi}
            limits:
              memory: ${stalwart_limits_memory:=2Gi}
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
      volumes:
        - name: config-template
          configMap:
            name: stalwart-config
        - name: config
          emptyDir: {}
        # Scratch only: all persistent state lives in Postgres/S3, which is
        # what keeps replicas interchangeable.
        - name: data
          emptyDir: {}
