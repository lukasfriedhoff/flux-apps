# Ephemeral store + cluster coordination for Stalwart (its Coordinator
# "Default" variant reuses the in-memory store's Redis connection).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-valkey
  namespace: mail
  labels:
    app.kubernetes.io/name: stalwart-valkey
spec:
  serviceName: stalwart-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:${stalwart_valkey_image_tag:=9.1.2-alpine}
          args: ["--appendonly", "no", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-valkey
  namespace: mail
spec:
  selector:
    app.kubernetes.io/name: stalwart-valkey
  ports:
    - name: redis
      port: 6379
