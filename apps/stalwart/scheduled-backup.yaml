apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: stalwart-postgres
  namespace: mail
spec:
  # 04:15 - after the event-app wave (pretix 03:45, pretalx 04:00).
  schedule: "${stalwart_postgres_backup_cron:=0 15 4 * * *}"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: stalwart-postgres
