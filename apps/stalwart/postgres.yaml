apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: stalwart-postgres
  namespace: mail
spec:
  instances: ${stalwart_postgres_instances:=3}
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: stalwart
      owner: stalwart
  storage:
    storageClass: ${stalwart_postgres_storage_class_name:=longhorn-nvme-rwo-2r}
    size: ${stalwart_postgres_size:=20Gi}
  resources:
    requests:
      cpu: ${stalwart_postgres_requests_cpu:=100m}
      memory: ${stalwart_postgres_requests_memory:=512Mi}
    limits:
      memory: ${stalwart_postgres_limits_memory:=2Gi}
