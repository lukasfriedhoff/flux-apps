# SMART disk health exporter.
#
# Added 2026-10-25: there was no disk health telemetry anywhere in the homelab.
# smartctl was not even installed on srv1/srv8/srv9, so nothing tracked
# reallocated sectors, SSD wear or pending failures - on ~48 TB of HDD where
# several volumes are effectively single-replica.
#
# Runs as a DaemonSet rather than via NixOS smartd because the metrics then
# reach Mimir through the same Alloy annotation autodiscovery every other
# exporter uses, and because it needs no deploy to the host fleet.
#
# Privileges: the exporter runs `smartctl --scan`, which reads /dev, so the
# HOST /dev has to be mounted AT /dev - mounting it elsewhere just leaves
# smartctl scanning the container's own empty /dev. It also issues SG_IO
# ioctls, which need the device opened writable, so the mount cannot be
# read-only and capability-dropping is not sufficient. privileged:true is what
# the upstream chart uses and what actually works here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartctl-exporter
  namespace: ${k8s_monitoring_namespace:=monitoring}
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartctl-exporter
      # POD annotations, not service annotations - the k8s-monitoring chart's
      # annotationAutodiscovery watches pods.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9633"
        prometheus.io/path: /metrics
    spec:
      # Disk health matters most on the storage nodes, but every node has disks
      # worth watching, so tolerate everything rather than pinning.
      tolerations:
        - operator: Exists
      containers:
        - name: smartctl-exporter
          # PINNED to v0.14.0 deliberately - do NOT let Renovate move this to
          # v0.15.0 without re-testing srv9.
          #
          # v0.15.0 collects SCSI-only metrics
          # (smartctl_scsi_percentage_used_endurance_indicator,
          # smartctl_verify_errors_corrected_by_*,
          # smartctl_verify_total_uncorrected_errors) using descriptors it never
          # registers. The Prometheus client treats that as a collection error
          # and fails the ENTIRE response, so /metrics returns 500 with zero
          # metrics - not just the offending series.
          #
          # srv9's four Samsung SAS SSDs trigger it, which meant the node
          # carrying ~48 TB of bulk storage reported no SMART data at all while
          # srv1 and srv8 looked perfectly healthy. One unsupported device
          # silently blinds a whole node. v0.14.0 serves 200 with all eight of
          # srv9's disks visible through the H730P.
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.14.0
          args:
            - --web.listen-address=:9633
            # Rescan periodically: USB enclosures come and go, and a disk that
            # appears after start would otherwise never be reported.
            - --smartctl.rescan=10m
            # Skip Longhorn's own iSCSI block devices. This is not cosmetic -
            # it is what makes srv9 collectable at all.
            #
            # Every attached Longhorn volume shows up as a /dev/sdX with model
            # "IET VIRTUAL-DISK", and the exporter runs one smartctl per device
            # serially. srv9 discovered 94 devices (8 real disks behind the PERC
            # plus ~86 iSCSI) and took over 80 SECONDS to answer /metrics,
            # against the chart's 10s scrapeTimeout - so srv9, the node holding
            # ~48 TB of bulk storage, produced no SMART data whatsoever while
            # srv1 and srv8 looked fine.
            #
            # The regex keeps sda-sdf and everything non-sd. srv1's six real
            # disks are sda-sdf, srv8's three are sda-sdc, and srv9's real disks
            # are not sd* at all - they enumerate as bus_0_megaraid_N through the
            # H730P. Physical disks claim their letters at boot before any iSCSI
            # session attaches, so the low letters are stable.
            #
            # A handful of iSCSI devices in the sda-sdf range still slip through
            # on srv8/srv9. That is deliberate: a tighter regex would drop srv1's
            # genuine sdd/sde/sdf, and losing real disks to reduce noise is the
            # wrong trade. Identify the leftovers by model_name="IET VIRTUAL-DISK"
            # on the smartctl_device metric.
            - --smartctl.device-exclude=^sd([g-z]|[a-z]{2,})$
          ports:
            - name: metrics
              containerPort: 9633
              protocol: TCP
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
