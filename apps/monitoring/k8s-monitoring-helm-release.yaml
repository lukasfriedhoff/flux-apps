apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: ${k8s_monitoring_namespace:=monitoring}
spec:
  interval: 10m0s
  timeout: 15m0s
  # Helm skips CRD changes on upgrade by default; CreateReplace keeps chart
  # CRDs current so operator upgrades don't silently run on stale schemas.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: k8s-monitoring
      version: ${k8s_monitoring_chart_version:=4.5.5}
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: ${k8s_monitoring_namespace:=monitoring}
      interval: 10m0s
  valuesFrom:
    - kind: ConfigMap
      name: k8s-monitoring-values
  postRenderers:
    - kustomize:
        patches:
          # The four Alloy collectors (alloy-metrics/-logs/-receiver/-singleton)
          # are NOT patched here: the Alloy operator creates them from Alloy CRs,
          # so postRenderer patches never matched them (chart 3.x ran them with
          # resources: {}). Their resources live in the k8s-monitoring-values
          # ConfigMap in flux-cluster (collectors.<name>.alloy.resources).
          - target:
              kind: ConfigMap
              name: k8s-monitoring-kube-state-metrics-customresourcestate-config
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /metadata/labels/reloader
                value: "enabled"
              - op: add
                path: /metadata/annotations/reloader.stakater.com~1match
                value: "true"
          - target:
              kind: Deployment
              name: k8s-monitoring-kube-state-metrics
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/reloader
                value: "enabled"
              - op: add
                path: /spec/template/metadata/annotations/reloader.stakater.com~1search
                value: "true"
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  limits:
                    cpu: "300m"
                    memory: "256Mi"
          - target:
              kind: Deployment
              name: k8s-monitoring-alloy-operator
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  # Memory-only limits here and on node-exporter: both throttled
                  # 50-80 % of CFS periods at a p95 far below the old cpu limit
                  # (reconcile/scrape bursts), which only slows them down.
                  limits:
                    memory: "256Mi"
          - target:
              kind: DaemonSet
              name: k8s-monitoring-node-exporter
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    memory: "192Mi"
