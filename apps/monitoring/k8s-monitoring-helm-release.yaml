apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: ${k8s_monitoring_namespace:=monitoring}
spec:
  interval: 10m0s
  timeout: 15m0s
  # Helm skips CRD changes on upgrade by default; CreateReplace keeps chart
  # CRDs current so operator upgrades don't silently run on stale schemas.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: k8s-monitoring
      version: ${k8s_monitoring_chart_version:=3.4.0}
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: ${k8s_monitoring_namespace:=monitoring}
      interval: 10m0s
  valuesFrom:
    - kind: ConfigMap
      name: k8s-monitoring-values
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: k8s-monitoring-kube-state-metrics-customresourcestate-config
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /metadata/labels/reloader
                value: "enabled"
              - op: add
                path: /metadata/annotations/reloader.stakater.com~1match
                value: "true"
          - target:
              kind: Deployment
              name: k8s-monitoring-kube-state-metrics
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/reloader
                value: "enabled"
              - op: add
                path: /spec/template/metadata/annotations/reloader.stakater.com~1search
                value: "true"
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  limits:
                    cpu: "300m"
                    memory: "256Mi"
          - target:
              kind: StatefulSet
              name: k8s-monitoring-alloy-metrics
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "150m"
                    memory: "256Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1024Mi"
              - op: add
                path: /spec/template/spec/containers/1/resources
                value:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
          - target:
              kind: DaemonSet
              name: k8s-monitoring-alloy-logs
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  limits:
                    cpu: "400m"
                    memory: "384Mi"
              - op: add
                path: /spec/template/spec/containers/1/resources
                value:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
          - target:
              kind: DaemonSet
              name: k8s-monitoring-alloy-receiver
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  limits:
                    cpu: "400m"
                    memory: "384Mi"
              - op: add
                path: /spec/template/spec/containers/1/resources
                value:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
          - target:
              kind: Deployment
              name: k8s-monitoring-alloy-singleton
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  limits:
                    cpu: "400m"
                    memory: "384Mi"
              - op: add
                path: /spec/template/spec/containers/1/resources
                value:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
          - target:
              kind: Deployment
              name: k8s-monitoring-alloy-operator
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "50m"
                    memory: "96Mi"
                  limits:
                    cpu: "300m"
                    memory: "256Mi"
          - target:
              kind: DaemonSet
              name: k8s-monitoring-node-exporter
              namespace: ${k8s_monitoring_namespace:=monitoring}
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "192Mi"
