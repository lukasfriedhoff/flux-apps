apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: alloy
      version: 1.6.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 10m0s
  values:
    fullnameOverride: alloy
    alloy:
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      configMap:
        content: |-
          logging {
            level = "info"
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.kubernetes "endpoints" {
            role = "endpoints"
          }

          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              regex = "true"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              target_label = "__metrics_path__"
              regex = "(.+)"
            }

            rule {
              action = "replace"
              source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
              target_label = "__address__"
              regex = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement = "$1:$2"
            }

            rule {
              action = "labelmap"
              regex = "__meta_kubernetes_pod_label_(.+)"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
              target_label = "job"
              regex = "(.+)"
            }

            rule {
              action = "replace"
              source_labels = ["job", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label = "job"
              regex = ";(.+)"
              replacement = "$1"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
            }

            rule {
              action = "replace"
              target_label = "cluster"
              replacement = "${cluster_name}"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label = "pod"
            }
          }

          discovery.relabel "node_exporter" {
            targets = discovery.kubernetes.endpoints.targets

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_namespace"]
              regex = "monitoring"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_service_name"]
              regex = "node-exporter"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_endpoint_port_name"]
              regex = "metrics"
            }

            rule {
              action = "replace"
              target_label = "job"
              replacement = "node-exporter"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_endpoint_node_name"]
              target_label = "node"
            }

            rule {
              action = "replace"
              target_label = "cluster"
              replacement = "${cluster_name}"
            }
          }

          discovery.relabel "kube_state_metrics" {
            targets = discovery.kubernetes.endpoints.targets

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_namespace"]
              regex = "monitoring"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_service_name"]
              regex = "kube-state-metrics"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_endpoint_port_name"]
              regex = "http"
            }

            rule {
              action = "replace"
              target_label = "job"
              replacement = "kube-state-metrics"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
            }

            rule {
              action = "replace"
              target_label = "cluster"
              replacement = "${cluster_name}"
            }
          }

          discovery.relabel "nodes" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_node_address_InternalIP"]
              target_label = "__address__"
              regex = "(.+)"
              replacement = "$1:10250"
            }

            rule {
              action = "labelmap"
              regex = "__meta_kubernetes_node_label_(.+)"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_node_name"]
              target_label = "node"
            }

            rule {
              action = "replace"
              target_label = "cluster"
              replacement = "${cluster_name}"
            }
          }

          discovery.relabel "coredns" {
            targets = discovery.kubernetes.endpoints.targets

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_namespace"]
              regex = "kube-system"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_service_name"]
              regex = "kube-dns"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_endpoint_port_name"]
              regex = "metrics"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
            }

            rule {
              action = "replace"
              target_label = "cluster"
              replacement = "${cluster_name}"
            }
          }

          discovery.relabel "monitoring_components" {
            targets = discovery.kubernetes.endpoints.targets

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_namespace"]
              regex = "monitoring"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
              regex = "loki|mimir|tempo"
            }

            rule {
              action = "keep"
              source_labels = ["__meta_kubernetes_endpoint_port_number"]
              regex = "3100|3200|8080|9150"
            }

            rule {
              action = "labelmap"
              regex = "__meta_kubernetes_service_label_(.+)"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_service_name"]
              target_label = "job"
            }

            rule {
              action = "replace"
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
            }

            rule {
              action = "replace"
              target_label = "cluster"
              replacement = "${cluster_name}"
            }
          }

          loki.source.kubernetes "pods" {
            targets = discovery.kubernetes.pods.targets
            forward_to = [loki.write.loki.receiver]
          }

          loki.source.kubernetes_events "events" {
            forward_to = [loki.write.loki.receiver]
          }

          prometheus.scrape "pods" {
            targets = discovery.relabel.pods.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            scrape_interval = "30s"
            scrape_timeout = "10s"
          }

          prometheus.scrape "node_exporter" {
            targets = discovery.relabel.node_exporter.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            scrape_interval = "30s"
            scrape_timeout = "10s"
          }

          prometheus.scrape "kube_state_metrics" {
            targets = discovery.relabel.kube_state_metrics.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            scrape_interval = "30s"
            scrape_timeout = "10s"
          }

          prometheus.scrape "kubelet" {
            targets = discovery.relabel.nodes.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            job_name = "kubelet"
            scrape_interval = "30s"
            scrape_timeout = "10s"
            scheme = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              insecure_skip_verify = true
            }
          }

          prometheus.scrape "cadvisor" {
            targets = discovery.relabel.nodes.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            job_name = "cadvisor"
            scrape_interval = "30s"
            scrape_timeout = "10s"
            metrics_path = "/metrics/cadvisor"
            scheme = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              insecure_skip_verify = true
            }
          }

          prometheus.scrape "apiserver" {
            targets = [
              {
                "__address__" = "kubernetes.default.svc:443",
                "__metrics_path__" = "/metrics",
                "cluster" = "${cluster_name}",
              },
            ]
            forward_to = [prometheus.remote_write.mimir.receiver]
            job_name = "apiserver"
            scrape_interval = "30s"
            scrape_timeout = "10s"
            scheme = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            }
          }

          prometheus.scrape "coredns" {
            targets = discovery.relabel.coredns.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            job_name = "coredns"
            scrape_interval = "30s"
            scrape_timeout = "10s"
          }

          prometheus.scrape "monitoring_components" {
            targets = discovery.relabel.monitoring_components.output
            forward_to = [prometheus.remote_write.mimir.receiver]
            scrape_interval = "30s"
            scrape_timeout = "10s"
          }

          prometheus.scrape "ceph" {
            targets = [
              {
                "__address__" = "${ceph_mgr_prometheus_endpoint}",
                "cluster" = "${cluster_name}",
              },
            ]
            forward_to = [prometheus.remote_write.mimir.receiver]
            job_name = "ceph"
            scrape_interval = "30s"
            scrape_timeout = "10s"
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }

          prometheus.remote_write "mimir" {
            endpoint {
              url = "http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push"
            }
          }

          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces = [otelcol.processor.batch.default.input]
            }
          }

          otelcol.processor.batch "default" {
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo-distributor.monitoring.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }
