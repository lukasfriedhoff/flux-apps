apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 15m0s
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: loki
      version: 6.55.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: loki-values
      valuesKey: values.yaml
    - kind: Secret
      name: ${monitoring_s3_values_secret_name}
      valuesKey: loki.yaml
      optional: true
  values:
    fullnameOverride: loki
    deploymentMode: Distributed
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: ${loki_replication_factor}
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: ${monitoring_loki_bucket}
          ruler: ${monitoring_loki_bucket}
          admin: ${monitoring_loki_bucket}
        s3:
          endpoint: ${object_storage_endpoint}
          region: ${object_storage_region}
          s3ForcePathStyle: ${object_storage_force_path_style}
          insecure: ${object_storage_insecure}
    gateway:
      replicas: ${loki_read_replicas}
      affinity: null
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    distributor:
      replicas: ${loki_write_replicas}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 384Mi
    ingester:
      replicas: ${loki_write_replicas}
      zoneAwareReplication:
        enabled: false
      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 768Mi
    querier:
      replicas: ${loki_read_replicas}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 384Mi
    queryFrontend:
      replicas: ${loki_read_replicas}
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    queryScheduler:
      replicas: ${loki_read_replicas}
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    indexGateway:
      replicas: ${loki_backend_replicas}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 384Mi
    compactor:
      replicas: ${loki_backend_replicas}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 384Mi
    ruler:
      replicas: ${loki_backend_replicas}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 384Mi
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    minio:
      enabled: false
    chunksCache:
      allocatedMemory: 512
    resultsCache:
      allocatedMemory: 128
