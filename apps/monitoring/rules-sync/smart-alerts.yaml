# SMART disk health alerts (added 2026-10-25).
#
# Hand-written and kept SEPARATE from alerts.yaml and rules.yaml on purpose:
# those two are generated from the kubernetes-mixin by mixin/generate.sh, so
# anything added to them is lost on the next regeneration.
#
# Metric names and labels are taken from the smartctl_exporter EXAMPLE.md for
# the pinned v0.15.0, not from memory. Two shapes matter:
#   - most values are plain gauges labelled only by `device` (e.g. /dev/sda)
#   - SMART attributes are NOT separate metrics; they all arrive as
#     smartctl_device_attribute, keyed by attribute_name and attribute_value_type
groups:
  - name: smart-disk-health
    rules:
      # The headline signal: the drive's own overall assessment. 1 = passed.
      - alert: SmartDeviceHealthFailed
        expr: smartctl_device_smart_status == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: SMART overall health assessment FAILED
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} reports a failed SMART
            overall-health assessment. The drive is predicting its own failure.
            Check which Longhorn disk this backs and confirm every volume on it
            has a replica elsewhere before doing anything else - see
            cluster-disk-inventory.md, because schedulable HDD lives on srv9 only
            and some volumes are effectively single-replica.

      # Reallocated sectors are the earliest honest warning on spinning rust.
      # Any non-zero value is worth knowing; growth is what actually matters.
      - alert: SmartReallocatedSectors
        expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Drive has reallocated sectors
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} has
            {{ $value }} reallocated sectors. A stable small count is tolerable;
            a rising one means the drive is running out of spares. Compare against
            the last few days before replacing anything.

      - alert: SmartReallocatedSectorsGrowing
        expr: increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h]) > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: Reallocated sector count is GROWING
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} reallocated
            {{ $value }} further sectors in the last 24h. Growth, not the
            absolute count, is the replace signal.

      # Flash wear. percentage_used is an NVMe/SAS-SSD field; SATA SSDs expose
      # wear only as an attribute, so both are covered.
      - alert: SmartSsdWearHigh
        expr: smartctl_device_percentage_used > 80
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: SSD has used over 80% of its rated endurance
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} reports
            {{ $value }}% of rated write endurance consumed. Plan a replacement;
            this is not urgent until it approaches 100%.

      - alert: SmartSsdWearCritical
        expr: smartctl_device_percentage_used >= 95
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: SSD endurance nearly exhausted
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} is at {{ $value }}% of
            rated endurance. Replace it.

      # NVMe spare blocks falling below the drive's own threshold is a
      # manufacturer-defined "replace now" condition.
      - alert: SmartAvailableSpareLow
        expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: Available spare below the drive's own threshold
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} has
            {{ $value }}% spare capacity left, under the threshold the drive
            itself defines as end-of-life.

      - alert: SmartMediaErrorsGrowing
        expr: increase(smartctl_device_media_errors[24h]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Uncorrected media errors increasing
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} logged {{ $value }}
            new uncorrected media errors in 24h. Data has been lost or recovered
            from redundancy; check the filesystem and Longhorn replica health.

      - alert: SmartCriticalWarning
        expr: smartctl_device_critical_warning > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: NVMe critical warning flag set
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} has critical warning
            bits set ({{ $value }}) - may be spare exhaustion, thermal, or
            media/integrity failure. Read `smartctl -a` for the detail.

      # HDDs are rated to ~60C; sustained 55C in a rack this quiet means a fan
      # or airflow problem, which shortens every drive in the chassis.
      - alert: SmartDeviceTemperatureHigh
        expr: smartctl_device_temperature{temperature_type="current"} > 55
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Drive running hot
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} is at {{ $value }}C.
            Sustained heat is an airflow problem affecting every drive in the
            chassis, not just this one.

      # smartctl could not read the device. This is the one to expect on srv8:
      # all of its Longhorn disks are USB-attached, and USB bridges frequently
      # need an explicit -d sat or -d usbjmicron before they answer SMART at
      # all. A non-zero exit here means "no health data", which is a monitoring
      # gap rather than a failing disk - but it must not be silent, because an
      # unreadable drive is also an unmonitored one.
      - alert: SmartctlCannotReadDevice
        expr: smartctl_device_smartctl_exit_status != 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: smartctl cannot read SMART data from this device
          description: >-
            smartctl exits {{ $value }} for {{ $labels.device }} on
            {{ $labels.instance }}. No health data is being collected for it.
            On USB-attached disks try an explicit device type (-d sat).

      # The exporter itself going away is indistinguishable from "all disks
      # healthy" on a dashboard, which is exactly how the absence of SMART
      # monitoring went unnoticed until 2026-10-25.
      - alert: SmartExporterNoData
        expr: absent(smartctl_device_smart_status)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No SMART metrics are arriving at all
          description: >-
            smartctl_device_smart_status has no series. The exporter DaemonSet is
            down, unscheduled, or no longer being scraped. Disk health is
            unmonitored until this clears.
