apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 15m0s
  chart:
    spec:
      chart: mimir-distributed
      version: 6.0.5
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: mimir-values
      valuesKey: values.yaml
  values:
    fullnameOverride: mimir
    minio:
      enabled: true
      persistence:
        size: ${monitoring_minio_size}
        storageClass: ${monitoring_minio_storage_class_name}
