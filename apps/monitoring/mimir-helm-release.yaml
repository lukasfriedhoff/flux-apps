apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 30m0s
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: mimir-distributed
      version: 6.0.5
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: mimir-values
      valuesKey: values.yaml
    - kind: Secret
      name: ${monitoring_s3_values_secret_name}
      valuesKey: mimir.yaml
      optional: true
  values:
    fullnameOverride: mimir
    mimir:
      structuredConfig:
        common:
          storage:
            backend: s3
            s3:
              endpoint: ${object_storage_endpoint}
              region: ${object_storage_region}
              bucket_name: ${monitoring_mimir_blocks_bucket}
              insecure: ${object_storage_insecure}
        blocks_storage:
          backend: s3
          s3:
            endpoint: ${object_storage_endpoint}
            region: ${object_storage_region}
            bucket_name: ${monitoring_mimir_blocks_bucket}
            insecure: ${object_storage_insecure}
        alertmanager_storage:
          backend: s3
          s3:
            endpoint: ${object_storage_endpoint}
            region: ${object_storage_region}
            bucket_name: ${monitoring_mimir_alertmanager_bucket}
            insecure: ${object_storage_insecure}
        ruler_storage:
          backend: s3
          s3:
            endpoint: ${object_storage_endpoint}
            region: ${object_storage_region}
            bucket_name: ${monitoring_mimir_ruler_bucket}
            insecure: ${object_storage_insecure}
        ingest_storage:
          enabled: false
        ingester:
          push_grpc_method_enabled: true
          ring:
            replication_factor: ${mimir_replication_factor}
        limits:
          max_global_series_per_user: 1000000
          ingestion_rate: 1000000
          ingestion_burst_size: 1000000
    kafka:
      enabled: false
    minio:
      enabled: false
    ingester:
      replicas: ${mimir_ingester_replicas}
      zoneAwareReplication:
        enabled: ${mimir_ingester_zone_aware_replication}
      persistentVolume:
        storageClass: ${monitoring_storage_class_name}
      # An ingester holds its TSDB head in memory, so 512Mi was far too tight:
      # all three sat at 420-460Mi steady state and OOMed under any burst,
      # which is where the 40+ restarts each over 9 days came from. Recovery
      # made it obvious -- after the object-storage outage they could not drain
      # the buffered write backlog and every remote-write push timed out.
      resources:
        requests:
          cpu: ${mimir_ingester_requests_cpu:=200m}
          memory: ${mimir_ingester_requests_memory:=1Gi}
        limits:
          cpu: ${mimir_ingester_limits_cpu:=2000m}
          memory: ${mimir_ingester_limits_memory:=3Gi}
    store_gateway:
      replicas: ${mimir_store_gateway_replicas}
      zoneAwareReplication:
        enabled: ${mimir_store_gateway_zone_aware_replication}
      persistentVolume:
        storageClass: ${monitoring_storage_class_name}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
    querier:
      replicas: ${mimir_querier_replicas}
      # 256Mi produced 114 restarts on one replica alone. Queries fan out over
      # many blocks and briefly hold a lot of series in memory.
      resources:
        requests:
          cpu: ${mimir_querier_requests_cpu:=100m}
          memory: ${mimir_querier_requests_memory:=512Mi}
        limits:
          cpu: ${mimir_querier_limits_cpu:=2000m}
          memory: ${mimir_querier_limits_memory:=2Gi}
    query_scheduler:
      replicas: ${mimir_query_scheduler_replicas}
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi
    gateway:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    distributor:
      # Was pinned at its 300m CPU ceiling and OOMKilled (exit 137) while
      # draining the write backlog, which is what kept every remote-write push
      # returning context deadline exceeded.
      resources:
        requests:
          cpu: ${mimir_distributor_requests_cpu:=100m}
          memory: ${mimir_distributor_requests_memory:=512Mi}
        limits:
          cpu: ${mimir_distributor_limits_cpu:=1500m}
          memory: ${mimir_distributor_limits_memory:=2Gi}
    compactor:
      persistentVolume:
        storageClass: ${monitoring_storage_class_name}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
    alertmanager:
      persistentVolume:
        storageClass: ${monitoring_storage_class_name}
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    query_frontend:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    ruler:
      # 125 restarts at 256Mi. The ruler evaluates every recording and alerting
      # group on an interval, so it needs comparable headroom to a querier.
      resources:
        requests:
          cpu: ${mimir_ruler_requests_cpu:=100m}
          memory: ${mimir_ruler_requests_memory:=512Mi}
        limits:
          cpu: ${mimir_ruler_limits_cpu:=1500m}
          memory: ${mimir_ruler_limits_memory:=2Gi}
    overrides_exporter:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    rollout_operator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
