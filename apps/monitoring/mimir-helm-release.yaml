apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 15m0s
  chart:
    spec:
      chart: mimir-distributed
      version: 6.0.5
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: mimir-values
      valuesKey: values.yaml
  values:
    fullnameOverride: mimir
    mimir:
      structuredConfig:
        common:
          storage:
            backend: s3
            s3:
              endpoint: ${monitoring_s3_endpoint}
              region: ${monitoring_s3_region}
              bucket_name: ${monitoring_mimir_blocks_bucket}
              insecure: ${monitoring_s3_insecure}
        blocks_storage:
          backend: s3
          s3:
            endpoint: ${monitoring_s3_endpoint}
            region: ${monitoring_s3_region}
            bucket_name: ${monitoring_mimir_blocks_bucket}
            insecure: ${monitoring_s3_insecure}
        alertmanager_storage:
          backend: s3
          s3:
            endpoint: ${monitoring_s3_endpoint}
            region: ${monitoring_s3_region}
            bucket_name: ${monitoring_mimir_alertmanager_bucket}
            insecure: ${monitoring_s3_insecure}
        ruler_storage:
          backend: s3
          s3:
            endpoint: ${monitoring_s3_endpoint}
            region: ${monitoring_s3_region}
            bucket_name: ${monitoring_mimir_ruler_bucket}
            insecure: ${monitoring_s3_insecure}
        ingest_storage:
          enabled: false
        ingester:
          push_grpc_method_enabled: true
          ring:
            replication_factor: ${mimir_replication_factor}
        limits:
          max_global_series_per_user: 1000000
          ingestion_rate: 1000000
          ingestion_burst_size: 1000000
    kafka:
      enabled: false
    minio:
      enabled: false
    ingester:
      replicas: ${mimir_ingester_replicas}
      zoneAwareReplication:
        enabled: ${mimir_ingester_zone_aware_replication}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
    store_gateway:
      replicas: ${mimir_store_gateway_replicas}
      zoneAwareReplication:
        enabled: ${mimir_store_gateway_zone_aware_replication}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
    querier:
      replicas: ${mimir_querier_replicas}
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    query_scheduler:
      replicas: ${mimir_query_scheduler_replicas}
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi
    gateway:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    distributor:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    compactor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
    alertmanager:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    query_frontend:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    ruler:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    overrides_exporter:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    rollout_operator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
