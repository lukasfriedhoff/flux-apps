apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

configMapGenerator:
  - name: grafana-dashboard-kubernetes
    options:
      annotations:
        grafana_folder: Kubernetes
    files:
      - kubernetes-mixin/cluster-total.json
      - kubernetes-mixin/k8s-resources-cluster.json
      - kubernetes-mixin/k8s-resources-namespace.json
      - kubernetes-mixin/k8s-resources-node.json
      - kubernetes-mixin/k8s-resources-pod.json
      - kubernetes-mixin/k8s-resources-workload.json
      - kubernetes-mixin/k8s-resources-workloads-namespace.json
      - kubernetes-mixin/kubelet.json
      - kubernetes-mixin/namespace-by-pod.json
      - kubernetes-mixin/namespace-by-workload.json
      - kubernetes-mixin/persistentvolumesusage.json
      - kubernetes-mixin/pod-total.json
      - kubernetes-mixin/workload-total.json
  - name: grafana-dashboard-node-exporter
    options:
      annotations:
        grafana_folder: Kubernetes
    files:
      - node-exporter/node-cluster-rsrc-use.json
      - node-exporter/node-rsrc-use.json
      - node-exporter/nodes.json
  - name: grafana-dashboard-coredns
    options:
      annotations:
        grafana_folder: Kubernetes
    files:
      - coredns/coredns.json
  - name: grafana-dashboard-flux
    options:
      annotations:
        grafana_folder: GitOps
    files:
      - flux/cluster.json
      - flux/control-plane.json
      - flux/logs.json
  - name: grafana-dashboard-loki
    options:
      annotations:
        grafana_folder: Observability
    files:
      - loki/loki-operational.json
      - loki/loki-logs.json
      - loki/loki-reads.json
      - loki/loki-writes.json
  - name: grafana-dashboard-mimir
    options:
      annotations:
        grafana_folder: Observability
    files:
      - mimir/mimir-overview.json
      - mimir/mimir-queries.json
      - mimir/mimir-reads.json
      - mimir/mimir-writes.json
  - name: grafana-dashboard-tempo
    options:
      annotations:
        grafana_folder: Observability
    files:
      - tempo/tempo-operational.json
      - tempo/tempo-reads.json
      - tempo/tempo-writes.json
      - tempo/tempo-resources.json
  - name: grafana-dashboard-traefik
    options:
      annotations:
        grafana_folder: Networking
    files:
      - traefik/traefik.json
  - name: grafana-dashboard-authelia
    options:
      annotations:
        grafana_folder: Apps
    files:
      - authelia/authelia.json
  - name: grafana-dashboard-cert-manager
    options:
      annotations:
        grafana_folder: Apps
    files:
      - cert-manager/cert-manager.json
  - name: grafana-dashboard-nextcloud
    options:
      annotations:
        grafana_folder: Apps
    files:
      - nextcloud/nextcloud.json
  - name: grafana-dashboard-cloudnative-pg
    options:
      annotations:
        grafana_folder: Databases
    files:
      - cloudnative-pg/cloudnative-pg.json
      - cnpg/cnpg-backup.json
  - name: grafana-dashboard-valkey
    options:
      annotations:
        grafana_folder: Databases
    files:
      - valkey/redis.json
  - name: grafana-dashboard-longhorn
    options:
      annotations:
        grafana_folder: Storage
    files:
      - longhorn/longhorn.json
