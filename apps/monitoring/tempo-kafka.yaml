# Single-node Kafka (KRaft) as the Tempo 3.x ingest buffer.
#
# Tempo 3.0 replaced the ingester write path with Kafka-backed ingest
# (block-builder + live-store consume from this broker). Traces are
# disposable telemetry here, so one broker with a small PVC is deliberate —
# durability comes from S3 blocks, not the queue. Shaped after the
# tempo-distributed chart's own CI reference (apache/kafka, KRaft,
# single node), with guaranteed resources because the broker must stay
# responsive while 10+ Tempo pods restart during chart upgrades
# (block-builder/live-store give up after 10 Kafka connection retries).
apiVersion: v1
kind: Service
metadata:
  name: tempo-kafka
  namespace: ${namespace_monitoring:=monitoring}
  labels:
    app.kubernetes.io/name: tempo-kafka
spec:
  selector:
    app.kubernetes.io/name: tempo-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo-kafka
  namespace: ${namespace_monitoring:=monitoring}
  labels:
    app.kubernetes.io/name: tempo-kafka
spec:
  serviceName: tempo-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo-kafka
    spec:
      containers:
        - name: kafka
          # renovate: docker=docker.io/apache/kafka
          image: apache/kafka:4.0.0
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://tempo-kafka.${namespace_monitoring:=monitoring}.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # Retention bounds the queue, not the trace store (blocks live in
            # S3): keep at most 6h / 4GiB so the 10Gi PVC can never fill.
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "6"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "4294967296"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx384m -Xms384m"
          resources:
            requests:
              cpu: ${tempo_kafka_requests_cpu:=250m}
              memory: ${tempo_kafka_requests_memory:=768Mi}
            limits:
              cpu: ${tempo_kafka_limits_cpu:=1}
              memory: ${tempo_kafka_limits_memory:=1Gi}
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${tempo_kafka_storage_class_name:=longhorn-ssd-rwo-1r}
        resources:
          requests:
            storage: ${tempo_kafka_size:=10Gi}
