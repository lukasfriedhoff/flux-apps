apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 15m0s
  timeout: 30m0s
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: tempo-distributed
      # v3 = Tempo 3.0: the ingester/compactor write path is replaced by
      # Kafka-backed ingest (distributor -> tempo-kafka -> block-builder +
      # live-store; compactor -> backend-scheduler + backend-worker).
      # Migrated 2026-09-12; the broker lives in tempo-kafka.yaml. Traces
      # remain disposable (blocks in S3), so ingest-queue loss is accepted.
      # blockBuilder/liveStore replicas must equal the Kafka partition
      # count (ingest.kafka.auto_create_topic_default_partitions).
      version: "3.5.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: tempo-values
      valuesKey: values.yaml
    - kind: Secret
      name: ${monitoring_s3_values_secret_name}
      valuesKey: tempo.yaml
      optional: true
  values:
    fullnameOverride: tempo
    traces:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
    storage:
      trace:
        backend: s3
        s3:
          bucket: ${monitoring_tempo_bucket}
          endpoint: ${object_storage_endpoint}
          region: ${object_storage_region}
          insecure: ${object_storage_insecure}
          forcepathstyle: ${object_storage_force_path_style}
    # Tempo 3.0 write path: OTLP -> distributor -> Kafka -> block-builder
    # (S3 blocks) + live-store (recent-data queries).
    ingester:
      enabled: false
    ingest:
      kafka:
        address: "tempo-kafka.${namespace_monitoring:=monitoring}.svc.cluster.local:9092"
        auto_create_topic_default_partitions: 1
    blockBuilder:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    liveStore:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi
    backendScheduler:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    backendWorker:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    distributor:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    querier:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    queryFrontend:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    memcached:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
