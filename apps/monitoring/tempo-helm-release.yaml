apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 30m0s
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: tempo-distributed
      # 2.26.x restructures the memcached Service+StatefulSet in ways helm
      # cannot upgrade in place (immutable fields; remediation rollbacks
      # resurrect the old objects before every retry). Held at 2.1.1 until
      # a maintenance window: delete the tempo-memcached Service AND
      # StatefulSet, then bump this in one motion (traces live in S3, the
      # cache is disposable). 2026-08-30.
      version: "2.26.2"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: tempo-values
      valuesKey: values.yaml
    - kind: Secret
      name: ${monitoring_s3_values_secret_name}
      valuesKey: tempo.yaml
      optional: true
  values:
    fullnameOverride: tempo
    traces:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
    storage:
      trace:
        backend: s3
        s3:
          bucket: ${monitoring_tempo_bucket}
          endpoint: ${object_storage_endpoint}
          region: ${object_storage_region}
          insecure: ${object_storage_insecure}
          forcepathstyle: ${object_storage_force_path_style}
    minio:
      enabled: false
    tempo:
      structuredConfig:
        ingester:
          lifecycler:
            ring:
              replication_factor: ${tempo_replication_factor}
    ingester:
      replicas: ${tempo_ingester_replicas}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    distributor:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    querier:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    queryFrontend:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    memcached:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
