apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 10m0s
  timeout: 15m0s
  chart:
    spec:
      chart: tempo-distributed
      version: 2.1.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: tempo-values
      valuesKey: values.yaml
  values:
    fullnameOverride: tempo
    traces:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
    storage:
      trace:
        backend: s3
        s3:
          bucket: ${monitoring_tempo_bucket}
          endpoint: ${monitoring_s3_endpoint}
          region: ${monitoring_s3_region}
          insecure: ${monitoring_s3_insecure}
          forcepathstyle: ${monitoring_s3_force_path_style}
    minio:
      enabled: false
    tempo:
      structuredConfig:
        ingester:
          lifecycler:
            ring:
              replication_factor: ${tempo_replication_factor}
    ingester:
      replicas: ${tempo_ingester_replicas}
