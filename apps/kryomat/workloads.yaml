---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/name: kryomat-collector
    app.kubernetes.io/part-of: kryomat
  name: kryomat-collector
  namespace: cryo
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          annotations:
            prometheus.io/path: /metrics
            prometheus.io/port: '9090'
            prometheus.io/scrape: 'true'
          labels:
            app.kubernetes.io/component: collector
            app.kubernetes.io/name: kryomat-collector
            app.kubernetes.io/part-of: kryomat
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - /usr/local/bin/kryomat-collector
              env:
                - name: GOMEMLIMIT
                  value: 160MiB
              envFrom:
                - configMapRef:
                    name: kryomat-common
                - configMapRef:
                    name: kryomat-tuning
                - secretRef:
                    name: kryomat-tracker-read
              image: harbor.h4xx.io/library/kryomat:sha-404fb20
              imagePullPolicy: IfNotPresent
              name: collector
              ports:
                - containerPort: 8080
                  name: health
                - containerPort: 9090
                  name: metrics
              resources:
                limits:
                  cpu: 500m
                  memory: 192Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 45
          volumes:
            - emptyDir:
                medium: Memory
                sizeLimit: 32Mi
              name: tmp
      ttlSecondsAfterFinished: 3600
  schedule: '*/5 * * * *'
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  suspend: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: router
    app.kubernetes.io/name: kryomat-router
    app.kubernetes.io/part-of: kryomat
  name: kryomat-router
  namespace: cryo
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kryomat-router
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
      labels:
        app.kubernetes.io/component: router
        app.kubernetes.io/name: kryomat-router
        app.kubernetes.io/part-of: kryomat
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - /usr/local/bin/kryomat-router
          env:
            - name: GOMEMLIMIT
              value: 160MiB
          envFrom:
            - configMapRef:
                name: kryomat-common
            - configMapRef:
                name: kryomat-tuning
          image: harbor.h4xx.io/library/kryomat:sha-404fb20
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 5
          name: router
          ports:
