---
apiVersion: v1
data:
  KRYOMAT_ENVIRONMENT: prod
  KRYOMAT_HEALTH_ADDR: :8080
  KRYOMAT_KAFKA_BROKERS: kryomat-redpanda.cryo.svc.cluster.local:9092
  KRYOMAT_KAFKA_MAX_POLL_RECORDS: '200'
  KRYOMAT_KAFKA_PRODUCE_TIMEOUT: 30s
  KRYOMAT_KAFKA_SCHEMA_REGISTRY_URL: http://kryomat-redpanda.cryo.svc.cluster.local:8081
  KRYOMAT_KAFKA_SESSION_TIMEOUT: 45s
  KRYOMAT_LEDGER_ALLOW_MEMORY: 'false'
  KRYOMAT_LEDGER_EVENT_TTL: 2160h
  KRYOMAT_LEDGER_MIGRATE: 'true'
  KRYOMAT_LEDGER_REPLICATION_FACTOR: '1'
  KRYOMAT_LOG_FORMAT: json
  KRYOMAT_LOG_LEVEL: info
  KRYOMAT_METRICS_ADDR: :9090
  KRYOMAT_METRICS_PATH: /metrics
  KRYOMAT_QBIT_CATEGORY: kryomat-cryo
  KRYOMAT_QBIT_SAVE_PATH: /media/h4xx/downloads/kryomat-cryo
  KRYOMAT_QBIT_TIMEOUT: 30s
  KRYOMAT_QBIT_URL: http://qbittorrent.media.svc.cluster.local:8080
  KRYOMAT_SCYLLA_CONNECT_TIMEOUT: 10s
  KRYOMAT_SCYLLA_CONSISTENCY: quorum
  KRYOMAT_SCYLLA_HOSTS: kryomat-scylla-0.kryomat-scylla.cryo.svc.cluster.local
  KRYOMAT_SCYLLA_KEYSPACE: kryomat
  KRYOMAT_SCYLLA_NUM_CONNS: '2'
  KRYOMAT_SCYLLA_TIMEOUT: 5s
  KRYOMAT_SHUTDOWN_TIMEOUT: 30s
  KRYOMAT_TRACKER_ASSIGNMENTS_PATH: /cryo
  KRYOMAT_TRACKER_BASE_URL: https://rocket-hd.cc
  KRYOMAT_TRACKER_MAX_RETRIES: '3'
  KRYOMAT_TRACKER_RATE_LIMIT_PER_MINUTE: '30'
  KRYOMAT_TRACKER_REQUEST_TIMEOUT: 30s
  KRYOMAT_TRACKER_TIMEZONE: Europe/Berlin
  KRYOMAT_TRACKER_USER_AGENT: kryomat/0.1 (+https://git.h4xx.io/lukasf/kryomat)
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: kryomat
  name: kryomat-common
  namespace: cryo
---
apiVersion: v1
data:
  KRYOMAT_DOWNLOADER_ADD_PAUSED: 'false'
  KRYOMAT_DOWNLOADER_MAX_CONCURRENT_ADDS: '2'
  KRYOMAT_DOWNLOADER_MAX_RETRIES: '5'
  KRYOMAT_DOWNLOADER_RETRY_BACKOFF: 30s
  KRYOMAT_INTAKE_DEFAULT_CATEGORY: kryomat-cryo
  KRYOMAT_INTAKE_DOWNLOAD_FILESYSTEM: /media/h4xx/downloads
  KRYOMAT_INTAKE_MAX_ACTIVE_ITEMS: '40'
  KRYOMAT_INTAKE_MAX_ITEM_SIZE: 80GiB
  KRYOMAT_INTAKE_MAX_TOTAL_SIZE: 2TiB
  KRYOMAT_INTAKE_MIN_FREE_SPACE: 500GiB
  KRYOMAT_NOTIFIER_DEDUPE_WINDOW: 1h
  KRYOMAT_NOTIFIER_MIN_SEVERITY: warning
  KRYOMAT_NOTIFIER_REQUEST_TIMEOUT: 15s
  KRYOMAT_REAPER_DELETE_FILES: 'true'
  KRYOMAT_REAPER_INTERVAL: 15m
  KRYOMAT_REAPER_MAX_REMOVALS_PER_CYCLE: '10'
  KRYOMAT_REAPER_MIN_SEED_TIME: 72h
  KRYOMAT_REAPER_REQUIRE_CATEGORY_MATCH: 'true'
  KRYOMAT_REAPER_SEED_GOAL_PERCENT: '100'
  KRYOMAT_REAPER_VANISH_GRACE_PERIOD: 48h
  KRYOMAT_SCRAPER_FULL_RESYNC_INTERVAL: 24h
  KRYOMAT_SCRAPER_MAX_VANISH_RATIO: '0.25'
  KRYOMAT_SCRAPER_VANISH_CONFIRMATIONS: '3'
  KRYOMAT_TRACKER_POLL_INTERVAL: 5m
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: kryomat
  name: kryomat-tuning
  namespace: cryo
