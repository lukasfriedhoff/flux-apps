---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: kryomat
  name: media-allow-ingress-from-cryo
  namespace: media
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cryo
      ports:
        - port: 8080
          protocol: TCP
        - port: 7878
          protocol: TCP
        - port: 8989
          protocol: TCP
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - qbittorrent
          - radarr
          - sonarr
  policyTypes:
    - Ingress
