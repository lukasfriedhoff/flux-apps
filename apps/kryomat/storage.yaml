---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app.kubernetes.io/name: arr-media-nfs
    app.kubernetes.io/part-of: kryomat
  name: cryo-arr-media-nfs
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 8Ti
  claimRef:
    name: arr-media-nfs
    namespace: cryo
  mountOptions:
    - nfsvers=4.1
    - noatime
    - nconnect=8 # one shared transport per NAS otherwise; see flux-app-media media-nfs-pv.yaml
  nfs:
    path: /data/cmc/pub
    server: 10.1.120.10
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-media-nfs
  namespace: cryo
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
  storageClassName: ''
  volumeName: cryo-arr-media-nfs
