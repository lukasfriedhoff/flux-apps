---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: kryomat-router
    app.kubernetes.io/part-of: kryomat
  name: kryomat-router
  namespace: cryo
spec:
  ports:
    - name: health
      port: 8080
      targetPort: health
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    app.kubernetes.io/name: kryomat-router
