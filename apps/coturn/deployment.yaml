# TURN relay for Matrix voice/video. hostNetwork on a fixed node: TURN needs
# real UDP reachability (the Cloudflare tunnel cannot carry it), so the
# router must DNAT 3478/tcp+udp and the relay range to this node. The
# static-auth-secret pairs with synapse's turn_shared_secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: coturn
  labels:
    app.kubernetes.io/name: coturn
spec:
  replicas: ${coturn_replicas:=1}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: ${coturn_node:=srv9}
      containers:
        - name: coturn
          image: ${coturn_image:=docker.io/coturn/coturn:4.17.2}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              EXTIP=$(getent hosts "${coturn_public_hostname}" | awk '{print $1; exit}')
              echo "external-ip: $EXTIP"
              exec turnserver -n \
                --listening-port=3478 \
                --min-port=${coturn_min_port:=49500} \
                --max-port=${coturn_max_port:=49999} \
                --realm="${coturn_realm}" \
                --use-auth-secret \
                --static-auth-secret="$TURN_SECRET" \
                --external-ip="$EXTIP" \
                --no-cli \
                --no-tls --no-dtls \
                --denied-peer-ip=10.0.0.0-10.255.255.255 \
                --denied-peer-ip=192.168.0.0-192.168.255.255 \
                --denied-peer-ip=172.16.0.0-172.31.255.255 \
                --allowed-peer-ip=${coturn_node_ip:=10.1.30.31}
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${coturn_secret_name:=coturn-shared-secret}
                  key: secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
