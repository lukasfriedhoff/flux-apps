apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-valkey
  namespace: authelia
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: valkey
      version: 0.9.3
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: authelia
      interval: 10m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"
      prometheus.io/path: "/metrics"
    auth:
      enabled: false
    valkeyConfig: |
      save 60 1
      appendonly yes
      protected-mode no
    dataStorage:
      enabled: true
      requestedSize: 1Gi
      className: ${default_sts_storage_class_name}
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
