apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yaml: |
    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: info

    theme: dark
    default_redirection_url: https://nextcloud.${delegating_domain}

    authentication_backend:
      file:
        path: /config/users_database.yml

    access_control:
      default_policy: deny
      rules:
        - domain: 'auth.${delegating_domain}'
          policy: bypass
        - domain: 'collabora.${delegating_domain}'
          resources:
            - '^/cool/adminws/'
            - '^/cool/getMetrics'
            - '^/browser/dist/admin/'
          subject:
            - 'group:admins'
          policy: two_factor
        - domain: 'collabora.${delegating_domain}'
          resources:
            - '^/cool/adminws/'
            - '^/cool/getMetrics'
            - '^/browser/dist/admin/'
          policy: deny
        - domain: '*.${delegating_domain}'
          policy: two_factor

    session:
      name: authelia_session
      same_site: lax
      expiration: 1h
      inactivity: 15m
      domain: ${delegating_domain}

    storage:
      local:
        path: /config/db.sqlite3

    identity_providers:
      oidc:
        jwks:
          - key: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.jwks.rsa.2048.key" | mindent 14 "|" | msquote }}
            algorithm: 'RS256'
            use: 'sig'
        clients:
          - client_id: nextcloud
            client_name: Nextcloud
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.nextcloud.secret" | msquote }}
            authorization_policy: two_factor
            redirect_uris:
              - https://nextcloud.${delegating_domain}/apps/oidc_login/oidc
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code

    notifier:
      smtp:
        address: '${authelia_smtp_address}'
        startup_check_address: '${authelia_smtp_startup_check_address}'
