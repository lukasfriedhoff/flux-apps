apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yaml: |
    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: info

    theme: dark
    default_redirection_url: https://nextcloud.h4xx.io

    authentication_backend:
      file:
        path: /config/users_database.yml

    access_control:
      default_policy: deny
      rules:
        - domain: 'auth.h4xx.io'
          policy: bypass
        - domain: '*.h4xx.io'
          policy: two_factor

    session:
      name: authelia_session
      same_site: lax
      expiration: 1h
      inactivity: 15m
      domain: h4xx.io

    storage:
      local:
        path: /config/db.sqlite3

    identity_providers:
      oidc:
        jwks:
          - key: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.jwks.rsa.2048.key" | mindent 14 "|" | msquote }}
            algorithm: 'RS256'
            use: 'sig'
        clients:
          - client_id: nextcloud
            client_name: Nextcloud
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.nextcloud.secret" | msquote }}
            authorization_policy: two_factor
            redirect_uris:
              - https://nextcloud.h4xx.io/apps/oidc_login/oidc
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code

    notifier:
      smtp:
        address: 'submission://posteo.de:587'
        startup_check_address: 'h4xx@posteo.de'

  users_database.yml: |
    users:
      admin:
        password: "$argon2id$v=19$m=65536,t=1,p=4$c2FsdHNhbHQ$w7omX3vBXL9esSwSxEt3G5UpiRaY1oWXcnZ6+QcmGeM"
        displayname: "Admin"
        email: admin@lab.h4xx.io
        groups:
          - admins
