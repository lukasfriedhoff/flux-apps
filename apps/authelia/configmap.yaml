apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yaml: |
    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: info

    telemetry:
      metrics:
        enabled: true
        address: 'tcp://:9959/metrics'

    theme: dark
    default_redirection_url: https://nextcloud${public_host_suffix}.${delegating_domain}

    authentication_backend:
      file:
        path: /config/users_database.yml

    definitions:
      user_attributes:
        nextcloud_is_admin:
          expression: '"nextcloud-admins" in groups'
        immich_role:
          expression: '"immich-admins" in groups ? "admin" : ""'

    access_control:
      default_policy: deny
      rules:
        - domain: 'auth${public_host_suffix}.${delegating_domain}'
          policy: bypass
        - domain: 'meme${public_host_suffix}.${delegating_domain}'
          subject:
            - 'user:wooden'
          policy: one_factor
        - domain: 'grafana${public_host_suffix}.${delegating_domain}'
          subject:
            - 'user:testuser'
          policy: one_factor
        - domain: 'dashboard${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:traefik-admins'
            - 'group:traefik-users'
          policy: ${authelia_access_policy}
        - domain: 'grafana${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:grafana-admins'
            - 'group:grafana-users'
          policy: ${authelia_access_policy}
        - domain: 'metrics${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:mimir-admins'
            - 'group:mimir-users'
          policy: ${authelia_access_policy}
        - domain: 'logs${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:loki-admins'
            - 'group:loki-users'
          policy: ${authelia_access_policy}
        - domain: 'traces${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:tempo-admins'
            - 'group:tempo-users'
          policy: ${authelia_access_policy}
        - domain: 'nextcloud${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:nextcloud-admins'
            - 'group:nextcloud-users'
          policy: ${authelia_access_policy}
        - domain: 'collabora${public_host_suffix}.${delegating_domain}'
          resources:
            - '^/cool/adminws/'
            - '^/cool/getMetrics'
            - '^/browser/dist/admin/'
          subject:
            - 'group:collabora-admins'
          policy: ${authelia_access_policy}
        - domain: 'collabora${public_host_suffix}.${delegating_domain}'
          resources:
            - '^/cool/adminws/'
            - '^/cool/getMetrics'
            - '^/browser/dist/admin/'
          policy: deny
        - domain: 'qbittorrent${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:qbittorrent-admins'
            - 'group:qbittorrent-users'
          policy: ${authelia_access_policy}
        - domain: 'prowlarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:prowlarr-admins'
            - 'group:prowlarr-users'
          policy: ${authelia_access_policy}
        - domain: 'sonarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:sonarr-admins'
            - 'group:sonarr-users'
          policy: ${authelia_access_policy}
        - domain: 'radarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:radarr-admins'
            - 'group:radarr-users'
          policy: ${authelia_access_policy}
        - domain: 'lidarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:lidarr-admins'
            - 'group:lidarr-users'
          policy: ${authelia_access_policy}
        - domain: 'readarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:readarr-admins'
            - 'group:readarr-users'
          policy: ${authelia_access_policy}
        - domain: 'bazarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:bazarr-admins'
            - 'group:bazarr-users'
          policy: ${authelia_access_policy}
        - domain: 'profilarr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:traefik-admins'
            - 'group:traefik-users'
            - 'group:profilarr-admins'
            - 'group:profilarr-users'
          policy: ${authelia_access_policy}
        - domain: 'jellyseerr${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:jellyseerr-admins'
            - 'group:jellyseerr-users'
          policy: ${authelia_access_policy}
        - domain: 'jellyfin${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:jellyfin-admins'
            - 'group:jellyfin-users'
          policy: ${authelia_access_policy}
        - domain: 'moonlight${public_host_suffix}.${delegating_domain}'
          subject:
            - 'group:traefik-admins'
            - 'group:traefik-users'
          policy: ${authelia_access_policy}
        - domain_regex: '^.*${public_host_suffix}\.${delegating_domain}$'
          subject:
            - 'user:wooden'
          policy: deny
        - domain_regex: '^.*${public_host_suffix}\.${delegating_domain}$'
          policy: ${authelia_access_policy}

    session:
      name: ${authelia_session_cookie_name:=authelia_session}
      same_site: lax
      expiration: 1h
      inactivity: 15m
      domain: ${delegating_domain}

    storage:
      local:
        path: /config/db.sqlite3

    identity_providers:
      oidc:
        claims_policies:
          nextcloud:
            custom_claims:
              nextcloud_is_admin:
                name: is_admin
                attribute: nextcloud_is_admin
          grafana:
            id_token:
              - email
              - name
              - groups
              - preferred_username
          immich:
            custom_claims:
              immich_role_claim:
                name: role
                attribute: immich_role
            id_token:
              - email
              - name
              - groups
              - preferred_username
              - role
        scopes:
          nextcloud_admin:
            claims:
              - is_admin
        jwks:
          - key: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.jwks.rsa.2048.key" | mindent 14 "|" | msquote }}
            algorithm: 'RS256'
            use: 'sig'
        clients:
          - client_id: nextcloud
            client_name: Nextcloud
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.nextcloud.secret" | msquote }}
            authorization_policy: ${authelia_oidc_policy}
            consent_mode: implicit
            claims_policy: nextcloud
            redirect_uris:
              - https://nextcloud${public_host_suffix}.${delegating_domain}/apps/oidc_login/oidc
              - https://nextcloud${public_host_suffix}.${delegating_domain}/index.php/apps/oidc_login/oidc
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
              - nextcloud_admin
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
          - client_id: grafana
            client_name: Grafana
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.grafana.secret" | msquote }}
            authorization_policy: one_factor
            consent_mode: implicit
            claims_policy: grafana
            redirect_uris:
              - https://grafana${public_host_suffix}.${delegating_domain}/login/generic_oauth
              - https://grafana${public_host_suffix}.${delegating_domain}/login/generic_oauth/
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
          - client_id: jellyfin
            client_name: Jellyfin
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.jellyfin.secret" | msquote }}
            public: false
            authorization_policy: ${authelia_oidc_policy}
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - https://jellyfin${public_host_suffix}.${delegating_domain}/sso/OID/redirect/authelia
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_post
          - client_id: jellyseerr
            client_name: Jellyseerr
            public: true
            authorization_policy: ${authelia_oidc_policy}
            consent_mode: implicit
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - https://jellyseerr${public_host_suffix}.${delegating_domain}/login
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            token_endpoint_auth_method: none
          - client_id: ${immich_oidc_client_id:=immich}
            client_name: Immich
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.immich.secret" | msquote }}
            public: false
            authorization_policy: ${authelia_oidc_policy}
            consent_mode: implicit
            claims_policy: immich
            redirect_uris:
              - https://meme${public_host_suffix}.${delegating_domain}/auth/login
              - https://meme${public_host_suffix}.${delegating_domain}/user-settings
              - app.immich:///oauth-callback
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: RS256
            token_endpoint_auth_method: client_secret_post
          - client_id: ${immich_photos_oidc_client_id:=immich-photos}
            client_name: Immich Photos
            client_secret: {{ secret "/secrets/authelia-oidc/identity_providers.oidc.client.immich_photos.secret" | msquote }}
            public: false
            authorization_policy: ${authelia_oidc_policy}
            consent_mode: implicit
            claims_policy: immich
            redirect_uris:
              - https://photos${public_host_suffix}.${delegating_domain}/auth/login
              - https://photos${public_host_suffix}.${delegating_domain}/user-settings
              - app.immich:///oauth-callback
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: RS256
            token_endpoint_auth_method: client_secret_post
          - client_id: ${matrix_oidc_client_id:=matrix-synapse}
            client_name: Matrix Synapse
            client_secret: {{ secret "/secrets/authelia-oidc-matrix/client_secret_digest" | msquote }}
            public: false
            authorization_policy: ${authelia_oidc_policy}
            consent_mode: implicit
            redirect_uris:
              - https://matrix${public_host_suffix}.${delegating_domain}/_synapse/client/oidc/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            token_endpoint_auth_method: client_secret_post

    notifier:
      smtp:
        address: '${authelia_smtp_address}'
        startup_check_address: '${authelia_smtp_startup_check_address}'
