apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 10m0s
  timeout: 10m0s
  dependsOn:
    - name: authelia-valkey
      namespace: authelia
  chart:
    spec:
      chart: authelia
      version: 0.10.49
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: authelia
      interval: 10m0s
  install:
    disableOpenAPIValidation: true
    disableSchemaValidation: true
  upgrade:
    disableOpenAPIValidation: true
    disableSchemaValidation: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: authelia
            patch: |
              - op: replace
                path: /spec/replicas
                value: 2
              - op: add
                path: /spec/template/spec/affinity
                value:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/name: authelia
                              app.kubernetes.io/instance: authelia
                          topologyKey: kubernetes.io/hostname
  values:
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      rulesOverride:
        - host: auth${public_host_suffix}.${delegating_domain}
          path: /
      tls:
        enabled: true
        secret: authelia-tls
    configMap:
      disabled: false
      existingConfigMap: authelia-config
      session:
        cookies:
          - domain: ${delegating_domain}
            same_site: lax
        redis:
          enabled: true
          deploy: false
          host: authelia-valkey.authelia.svc.cluster.local
          port: 6379
          password:
            disabled: true
      notifier:
        smtp:
          enabled: true
          password:
            secret_name: authelia-mail-credentials
            path: password
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            secret_name: authelia-oidc
            path: identity_providers.oidc.hmac.key
      telemetry:
        metrics:
          enabled: true
          port: 9959
      storage:
        local:
          enabled: false
        postgres:
          enabled: true
          address: tcp://authelia-postgres-rw.authelia.svc.cluster.local:5432
          database: authelia
          username: authelia
          password:
            secret_name: authelia-postgres-app
            path: password
    secret:
      existingSecret: authelia-secrets
      additionalSecrets:
        authelia-mail-credentials: {}
        authelia-oidc: {}
        authelia-oidc-matrix: {}
        authelia-postgres-app: {}
    pod:
      kind: Deployment
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 1
      annotations:
        reloader.stakater.com/auto: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9959"
        prometheus.io/path: "/metrics"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: AUTHELIA_NOTIFIER_SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: authelia-mail-credentials
              key: username
        - name: AUTHELIA_NOTIFIER_SMTP_SENDER
          valueFrom:
            secretKeyRef:
              name: authelia-mail-credentials
              key: sender
      extraVolumeMounts:
        - name: authelia-users
          mountPath: /config/users_database.yml
          subPath: users_database.yml
      extraVolumes:
        - name: authelia-users
          secret:
            secretName: authelia-users
    persistence:
      enabled: false
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
