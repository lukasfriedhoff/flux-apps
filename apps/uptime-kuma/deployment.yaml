# Uptime Kuma - persistent alternative to the Gatus status page.
#
# SQLite tolerates exactly one writer, so this must stay at one replica with
# the Recreate strategy: two pods against the same volume would corrupt the
# database. Uptime Kuma has no clustering or leader election, so a second
# replica would not buy availability anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: ${uptime_kuma_namespace:=uptime-kuma}
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: ${uptime_kuma_image:=docker.io/louislam/uptime-kuma:2.5.5}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: UPTIME_KUMA_PORT
              value: "3001"
            # Pin the backend so the first-run wizard never asks. Without this
            # the pod serves an unauthenticated /setup-database page, and this
            # ingress is public - whoever reaches it first picks the database
            # and claims the admin account.
            #
            # sqlite is the choice the rest of this manifest already assumes:
            # one replica, Recreate, a single-writer RWO volume. The embedded
            # MariaDB option runs a second process in this container against
            # that same volume, so it adds memory pressure against the 1Gi
            # limit and a heavier backup story without buying any availability.
            # External MariaDB/MySQL would mean a second database engine - the
            # cluster runs CNPG (PostgreSQL), which Uptime Kuma cannot use.
            - name: UPTIME_KUMA_DB_TYPE
              value: "sqlite"
            - name: TZ
              value: ${quote}${uptime_kuma_timezone:=Europe/Berlin}${quote}
          startupProbe:
            httpGet:
              path: /
              port: 3001
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              cpu: ${uptime_kuma_requests_cpu:=50m}
              memory: ${uptime_kuma_requests_memory:=256Mi}
            limits:
              memory: ${uptime_kuma_limits_memory:=1Gi}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: ${uptime_kuma_namespace:=uptime-kuma}
spec:
  selector:
    app.kubernetes.io/name: uptime-kuma
  ports:
    - name: http
      port: 80
      targetPort: 3001
