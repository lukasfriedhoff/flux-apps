# Behind Authelia. Uptime Kuma has no OIDC, OAuth or SAML login of its own -
# the openid-client code in its image is outbound only, used to fetch tokens
# when probing OAuth-protected monitors. Its sole login is a local account in
# its own database, and until one exists the setup page is public and claimable
# by anyone who reaches this host. The forwardauth middleware below is
# therefore the OIDC integration, and it needs the matching access_control
# rule in apps/authelia/configmap.yaml to stay above the subject-less
# catch-all there.
#
# The tradeoff: status pages here are no longer anonymous, and this page now
# depends on Authelia and LLDAP being up - which is exactly what a status page
# should not depend on. Gatus at status${public_host_suffix} stays public and
# unauthenticated for that reason; this instance is the authenticated,
# richer-detail view, not the one to check during an outage.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: ${uptime_kuma_namespace:=uptime-kuma}
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${uptime_kuma_host}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 80
  tls:
    - secretName: uptime-kuma-tls
      hosts:
        - ${uptime_kuma_host}
