# OliveTin drives operational actions (backup now, restore, restart) via
# kubectl, so it needs narrowly-scoped rights inside the namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: icarus-olivetin
  namespace: ${icarus_namespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: icarus-olivetin
  namespace: ${icarus_namespace}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: icarus-olivetin
  namespace: ${icarus_namespace}
subjects:
  - kind: ServiceAccount
    name: icarus-olivetin
    namespace: ${icarus_namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: icarus-olivetin
