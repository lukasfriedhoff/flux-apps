# Nightly restic backup of the data volume (saves/prospects/config) to S3.
# restic gives encrypted, deduplicated snapshots with retention and a
# first-class restore path — the web UI drives both.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: icarus-backup
  namespace: ${icarus_namespace}
spec:
  schedule: "${icarus_backup_cron:=45 3 * * *}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: icarus-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: ${icarus_node}
          containers:
            - name: restic
              image: restic/restic:0.19.1
              command:
                - /bin/sh
                - -ec
                - |
                  # Init ONLY for a genuinely absent repository: restic exit
                  # code 10, or a bucket that does not exist yet (first run of
                  # a new app - that returns a generic rc, not 10). Anything
                  # else aborts WITH the real error: a transient S3 outage must
                  # never fall through to `restic init`, which fatals on an
                  # existing repo and masks the cause (bit us 2026-09-22).
                  set +e; err=$(restic cat config 2>&1 >/dev/null); rc=$?; set -e
                  if [ "$rc" -eq 10 ] || echo "$err" | grep -qi "bucket does not exist"; then
                    restic init
                  elif [ "$rc" -ne 0 ]; then
                    echo "repository check failed (rc=$rc): $err" >&2
                    exit "$rc"
                  fi
                  restic backup /data --tag scheduled
                  restic forget --keep-daily ${icarus_backup_keep_daily:=14} --keep-weekly ${icarus_backup_keep_weekly:=8} --prune
              envFrom:
                - secretRef:
                    name: ${icarus_backup_secret_name:=icarus-backup-credentials}
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: icarus-data
