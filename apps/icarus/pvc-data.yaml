# Saves, prospects and server config — the precious data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: icarus-data
  namespace: ${icarus_namespace}
  annotations:
    # longhorn-replica-policy resets replica counts from the StorageClass;
    # a bump only sticks when declared here (see the nextcloud PVCs).
    longhorn.h4xx.io/replica-count: "2"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${icarus_data_size:=5Gi}
  storageClassName: ${icarus_data_storage_class_name:=longhorn-ssd-rwo-1r}
