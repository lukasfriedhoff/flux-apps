apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgres
  namespace: nextcloud
spec:
  instances: ${nextcloud_postgres_instances:=1}
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  storage:
    storageClass: ${nextcloud_postgres_storage_class_name:=${default_sts_storage_class_name}}
    size: ${nextcloud_postgres_size}
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
