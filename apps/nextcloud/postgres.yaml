apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgres
  namespace: nextcloud
spec:
  instances: ${nextcloud_postgres_instances:=1}
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  storage:
    storageClass: ${nextcloud_postgres_storage_class_name:=${default_sts_storage_class_name}}
    size: ${nextcloud_postgres_size}
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
  # BACKUPS DISABLED 2026-09-22 (revert this commit to restore).
  # storage01 MinIO hit 100% (5.5T) so every WAL archive failed with
  # XMinioStorageFull. CNPG blocks a demoted primary from rejoining until its
  # pending WAL is archived, which wedged nextcloud-postgres-1 in a restart
  # loop. Re-enable once storage01 has free space AND retention actually prunes.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
