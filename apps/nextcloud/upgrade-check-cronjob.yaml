apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-upgrade-check
  namespace: nextcloud
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: nextcloud-upgrade-check
          containers:
            - name: check
              image: alpine:3.20
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache kubectl >/dev/null
                  kubectl -n nextcloud get pods -l app.kubernetes.io/name=nextcloud -o jsonpath='{.items[0].metadata.name}' \
                    | xargs -r -I{} kubectl -n nextcloud exec {} -- /bin/sh -c "php /var/www/html/occ status --output=json" \
                    | tee /tmp/occ-status.json
                  if grep -q '"needsDbUpgrade":true' /tmp/occ-status.json; then
                    echo "Nextcloud requires a database upgrade." >&2
                    exit 1
                  fi
                  if grep -q '"maintenance":true' /tmp/occ-status.json; then
                    echo "Nextcloud is in maintenance mode." >&2
                    exit 1
                  fi
