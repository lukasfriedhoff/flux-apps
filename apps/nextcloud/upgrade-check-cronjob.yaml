apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-upgrade-check
  namespace: nextcloud
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
      serviceAccountName: nextcloud-upgrade-check
      containers:
        - name: check
          image: registry.k8s.io/kubectl:v1.30.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              kubectl -n nextcloud get pods -l app.kubernetes.io/name=nextcloud -o jsonpath='{.items[0].metadata.name}' \
                | xargs -r -I{} kubectl -n nextcloud exec {} -- php /var/www/html/occ status --output=json \
                | tee /tmp/occ-status.json
              if grep -q '"needsDbUpgrade":true' /tmp/occ-status.json; then
                echo "Nextcloud requires a database upgrade." >&2
                exit 1
              fi
              if grep -q '"maintenance":true' /tmp/occ-status.json; then
                echo "Nextcloud is in maintenance mode." >&2
                exit 1
              fi
