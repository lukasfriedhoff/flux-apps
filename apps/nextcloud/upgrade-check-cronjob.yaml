apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-upgrade-check
  namespace: nextcloud
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: nextcloud-upgrade-check
          containers:
            - name: check
              image: alpine/k8s:1.37.0
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  pod="$(
                    kubectl -n nextcloud get pods \
                      -l app.kubernetes.io/instance=nextcloud,app.kubernetes.io/component=app \
                      --no-headers \
                      | awk '$3 == "Running" { print $1; exit }'
                  )"
                  if [ -z "$pod" ]; then
                    echo "No running Nextcloud app pod found." >&2
                    exit 1
                  fi
                  kubectl -n nextcloud exec "$pod" -- /bin/sh -c "php /var/www/html/occ status --output=json" \
                    | tee /tmp/occ-status.json
                  if grep -q '"needsDbUpgrade":true' /tmp/occ-status.json; then
                    echo "Nextcloud requires a database upgrade." >&2
                    exit 1
                  fi
                  if grep -q '"maintenance":true' /tmp/occ-status.json; then
                    echo "Nextcloud is in maintenance mode." >&2
                    exit 1
                  fi
                  if ! kubectl -n nextcloud exec "$pod" -- /bin/sh -c "php /var/www/html/occ app:list | grep -q ' - oidc_login:'"; then
                    echo "OIDC app oidc_login is not enabled." >&2
                    exit 1
                  fi
                  if ! kubectl -n nextcloud exec "$pod" -- /bin/sh -c "php /var/www/html/occ route:list | grep -q '/apps/oidc_login/oidc'"; then
                    echo "OIDC route /apps/oidc_login/oidc is missing." >&2
                    exit 1
                  fi
                  if ! kubectl -n nextcloud exec "$pod" -- /bin/sh -c "command -v curl >/dev/null 2>&1"; then
                    echo "curl is required in the Nextcloud container for OIDC smoke checks." >&2
                    exit 1
                  fi
                  oidc_code="$(
                    kubectl -n nextcloud exec "$pod" -- /bin/sh -c \
                      "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/index.php/apps/oidc_login/oidc" \
                  )"
                  case "$oidc_code" in
                    302|303|307|308)
                      ;;
                    *)
                      echo "Unexpected OIDC route status from Nextcloud pod: $oidc_code" >&2
                      exit 1
                      ;;
                  esac
