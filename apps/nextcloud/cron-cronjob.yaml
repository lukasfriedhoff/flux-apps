# Nextcloud's background job runner.
#
# `backgroundjobs_mode` has been `cron` since forever, but nothing was ever
# scheduled to CALL cron.php - so from 2026-08-08 to 2026-09-24 no background
# job ran at all (47 days). Nothing alerted, because nothing was failing;
# the work simply was not happening. Consequences while it was dead:
# no trashbin or file-version expiry (disk grows unbounded), no preview
# generation, no LDAP/federated user sync, no notification delivery.
#
# Why a CronJob and not the alternatives:
#   - not a sidecar: the Deployment runs replicaCount 3 behind an HPA, so a
#     sidecar means 3+ concurrent cron.php loops racing the same job table.
#   - not `ajax` mode: that runs jobs on page loads, which never drains a
#     backlog and stops entirely when nobody is browsing.
#   - not the chart's built-in cronjob: the app Deployment carries 25 mounts
#     including 20 nextcloud-config subPath files and 4 initContainers, so a
#     standalone cron pod would run against a different config surface.
# Hence: exec into a real, READY app pod, which is by definition correctly
# configured.
#
# `runuser -u www-data` is mandatory - kubectl exec lands as uid 0, and root
# writing previews/versions into the RWX data dir reproduces the uid 33/82
# ownership trap that has bitten this deployment before.
#
# concurrencyPolicy Forbid (not Replace): a cron.php pass can run for many
# minutes, and killing it mid-job leaves `reserved_at` set on the rows it
# claimed, which wedges those jobs for ~6h. For the same reason there is
# deliberately no activeDeadlineSeconds.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  # Enabled 2026-09-24 after 47 days of nothing calling cron.php.
  #
  # Expect the first days to be heavier than steady state: 65,233 rows in
  # oc_jobs and 18,241 pending previews have to drain. The app HPA scales on
  # 60% of a 200m CPU request (min 3, max 9), so a ~1-core cron.php inside one
  # pod drags the 3-pod average up and will scale the Deployment out while the
  # backlog burns down. That is expected and self-correcting.
  #
  # Forbid (above) is what keeps this safe - runs cannot stack, so a long pass
  # simply delays the next one rather than piling on. If a run is killed
  # mid-job (e.g. HPA scale-down evicting its pod) the rows it claimed keep
  # `reserved_at` set and are retried after ~6h; that is slow, not harmful.
  suspend: false
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: nextcloud-upgrade-check
          containers:
            - name: cron
              image: alpine/k8s:1.37.0
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Require READY (1/1), not merely Running: exec'ing into a
                  # still-warming replica is what makes the sibling
                  # upgrade-check and office-check jobs fail intermittently
                  # with "curl: (7) Failed to connect to 127.0.0.1 port 80".
                  pod="$(
                    kubectl -n nextcloud get pods \
                      -l app.kubernetes.io/instance=nextcloud,app.kubernetes.io/component=app \
                      --no-headers \
                      | awk '$2 == "1/1" && $3 == "Running" { print $1; exit }'
                  )"
                  if [ -z "$pod" ]; then
                    echo "No ready Nextcloud app pod found." >&2
                    exit 1
                  fi
                  echo "running cron.php in $pod"
                  # -d memory_limit here, NOT in the global php config: the
                  # Maps app's ExifGeoData::get_exif_data_array does a plain
                  # file_get_contents() on each media file to read EXIF, which
                  # blows the 512M default on large photos and kills the whole
                  # cron.php pass with
                  #   PHP Fatal error: Allowed memory size of 536870912 bytes
                  #   exhausted ... ExifGeoData.php on line 91
                  # Raising it globally would apply to every php-fpm worker
                  # too (max_children x limit against an 8Gi pod), so scope it
                  # to this one process instead.
                  kubectl -n nextcloud exec "$pod" -c nextcloud -- \
                    runuser -u www-data -- \
                    php -d memory_limit=2G -f /var/www/html/cron.php
