apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-verify-custom-apps-v2
  namespace: nextcloud
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: python:3.15.2-slim
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              tmp_dir=/tmp/app-downloads
              mkdir -p /custom_apps "$tmp_dir"
              verify_app() {
                python3 -c 'import hashlib,os,sys,tarfile,urllib.request;name,url,expected,tmp,target,required=sys.argv[1:7];archive=os.path.join(tmp,f"{name}.tar.gz");data=urllib.request.urlopen(url,timeout=60).read();digest=hashlib.sha256(data).hexdigest();assert digest==expected,f"checksum mismatch for {name}: {digest} != {expected}";open(archive,"wb").write(data);tarfile.open(archive,"r:gz").extractall(target);appdir=os.path.join(target,name);assert os.path.isdir(appdir),f"Missing app directory: {name}";required_path=os.path.join(target,required);assert os.path.isfile(required_path),f"Missing required file for {name}: {required}"' "$1" "$2" "$3" "$tmp_dir" "/custom_apps" "$4"
              }
              verify_app \
                mail \
                https://github.com/nextcloud-releases/mail/releases/download/v5.12.6/mail-v5.12.6.tar.gz \
                76ef8687b60852927e64f0661036ea045f5b27cd5fc6ecb3eb652c71b681bc9c \
                mail/vendor/autoload.php
              verify_app \
                richdocuments \
                https://github.com/nextcloud-releases/richdocuments/releases/download/v12.0.1/richdocuments-v12.0.1.tar.gz \
                0639ab0e3413142a76334af20ca88cba0a351a11c9c07effa0f1eb7f05941f2c \
                richdocuments/appinfo/info.xml
              verify_app \
                oidc_login \
                https://github.com/pulsejet/nextcloud-oidc-login/releases/download/v3.4.0/oidc_login.tar.gz \
                d84e3616e865259c142af6cf40b6f0092228ad78bed843f85c6575f45942884b \
                oidc_login/appinfo/info.xml
              verify_app \
                external \
                https://github.com/nextcloud-releases/external/releases/download/v10.0.0/external-v10.0.0.tar.gz \
                908f5eb6db55d4f336674f5b5a64ee6d470cb29d39232dde1b488dbdeb997627 \
                external/appinfo/info.xml
              verify_app \
                contacts \
                https://github.com/nextcloud-releases/contacts/releases/download/v8.9.3/contacts-v8.9.3.tar.gz \
                2844792ca52f25057ea0ee30b326cc3a63771ab7d82b1e52c39b2e344906ac8c \
                contacts/appinfo/info.xml
              verify_app \
                calendar \
                https://github.com/nextcloud-releases/calendar/releases/download/v6.6.4/calendar-v6.6.4.tar.gz \
                0557b6b5852a467cf3f746e59d56478d227f78bf7a66357b30dfc10cae4c7e3c \
                calendar/appinfo/info.xml
              verify_app \
                cookbook \
                https://github.com/christianlupus-nextcloud/cookbook-releases/releases/download/v0.11.10/cookbook-0.11.10.tar.gz \
                c8fdf5f3f0c84e161ba5acfe7573931e0a355026c46cd1ad8b887539fc84a9ae \
                cookbook/appinfo/info.xml
              verify_app \
                maps \
                https://github.com/nextcloud-releases/maps/releases/download/v1.8.0/maps-v1.8.0.tar.gz \
                4e44ea40268d2f942967b847840e18c37318a0d1ca1c1572e7f635ce3ac32c04 \
                maps/appinfo/info.xml
              verify_app \
                passwords \
                https://git.mdns.eu/api/v4/projects/45/packages/generic/passwords/2026.9.0/passwords.tar.gz \
                8c3dbba93a741283e44e2c1a80a31718bbd383020715a7fca4c316df6fccb231 \
                passwords/appinfo/info.xml
          volumeMounts:
            - name: nextcloud-custom-apps
              mountPath: /custom_apps
      volumes:
        - name: nextcloud-custom-apps
          emptyDir: {}
