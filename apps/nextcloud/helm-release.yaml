apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m0s
  timeout: 15m0s
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
      interval: 10m0s
  values:
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - secretName: nextcloud-tls
          hosts:
            - nextcloud.${delegating_domain}
    nextcloud:
      host: nextcloud.${delegating_domain}
      extraEnv:
        - name: OVERWRITEHOST
          value: nextcloud.${delegating_domain}
        - name: OVERWRITEPROTOCOL
          value: https
        - name: TRUSTED_PROXIES
          value: ${trusted_proxies_cidr}
        - name: OIDC_LOGIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client_secret
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: username
        passwordKey: password
      configs:
        oidc-login.config.php: |-
          <?php
          $CONFIG = array (
            'oidc_login_provider_url' => 'https://auth.${delegating_domain}',
            'oidc_login_client_id' => 'nextcloud',
            'oidc_login_client_secret' => getenv('OIDC_LOGIN_CLIENT_SECRET'),
            'oidc_login_button_text' => 'Log in with Authelia',
            'oidc_login_scope' => 'openid profile email groups offline_access',
            'oidc_login_code_challenge_method' => 'S256',
            'oidc_login_auto_redirect' => false,
            'oidc_login_end_session_redirect' => false,
            'oidc_login_logout_url' => 'https://nextcloud.${delegating_domain}/apps/oidc_login/oidc',
            'oidc_login_disable_registration' => false,
          );
      hooks:
        before-starting: |-
          #!/bin/sh
          set -e
          php /var/www/html/occ app:install -n oidc_login || true
          php /var/www/html/occ app:enable -n oidc_login
          php /var/www/html/occ app:install -n richdocuments || true
          php /var/www/html/occ app:enable -n richdocuments
          php /var/www/html/occ app:disable -n richdocumentscode || true
          for i in 1 2 3 4 5; do
            if php /var/www/html/occ richdocuments:activate-config \
              --wopi-url="https://collabora.${delegating_domain}" \
              --callback-url="https://nextcloud.${delegating_domain}"; then
              break
            fi
            sleep 5
          done
      extraInitContainers:
        - name: migrate-nextcloud-data
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /dest/.ocdata ]; then
                echo "Nextcloud data already migrated."
                exit 0
              fi
              if [ ! -f /src/.ocdata ]; then
                echo "No legacy data found, skipping migration."
                exit 0
              fi
              echo "Migrating Nextcloud data to CephFS..."
              cp -a /src/. /dest/
          volumeMounts:
            - name: nextcloud-main
              mountPath: /src
              subPath: data
            - name: nextcloud-data
              mountPath: /dest
              subPath: data
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-postgres-rw.nextcloud.svc.cluster.local
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres-app
        usernameKey: username
        passwordKey: password
    externalRedis:
      enabled: true
      host: valkey
      port: "6379"
      existingSecret:
        enabled: true
        secretName: ${valkey_auth_secret_name}
        passwordKey: redis-password
    redis:
      enabled: false
    persistence:
      enabled: true
      storageClass: ${default_sts_storage_class_name}
      size: 500Gi
      nextcloudData:
        enabled: true
        storageClass: ${nextcloud_data_storage_class_name}
        size: ${nextcloud_data_size}
        accessMode: ReadWriteMany
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
