apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m0s
  timeout: 15m0s
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
      interval: 10m0s
  values:
    replicaCount: ${nextcloud_hpa_min_pods}
    hpa:
      enabled: true
      cputhreshold: ${nextcloud_hpa_cpu_threshold}
      minPods: ${nextcloud_hpa_min_pods}
      maxPods: ${nextcloud_hpa_max_pods}
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - secretName: nextcloud-tls
          hosts:
            - nextcloud.${delegating_domain}
    nextcloud:
      host: nextcloud.${delegating_domain}
      podSecurityContext:
        fsGroupChangePolicy: OnRootMismatch
      extraEnv:
        - name: OVERWRITEHOST
          value: nextcloud.${delegating_domain}
        - name: OVERWRITEPROTOCOL
          value: https
        - name: TRUSTED_PROXIES
          value: ${trusted_proxies_cidr}
        - name: OIDC_LOGIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client_secret
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: username
        passwordKey: password
      configs:
        oidc-login.config.php: |-
          <?php
          $CONFIG = array (
            'oidc_login_provider_url' => 'https://auth.${delegating_domain}',
            'oidc_login_client_id' => 'nextcloud',
            'oidc_login_client_secret' => getenv('OIDC_LOGIN_CLIENT_SECRET'),
            'oidc_login_button_text' => 'Log in with Authelia',
            'oidc_login_scope' => 'openid profile email groups offline_access nextcloud_admin',
            'oidc_login_code_challenge_method' => 'S256',
            'oidc_login_auto_redirect' => false,
            'oidc_login_end_session_redirect' => false,
            'oidc_login_logout_url' => 'https://nextcloud.${delegating_domain}/apps/oidc_login/oidc',
            'oidc_login_disable_registration' => false,
            'oidc_login_attributes' => array (
              'id' => 'sub',
              'name' => 'name',
              'mail' => 'email',
              'groups' => 'groups',
              'is_admin' => 'is_admin',
            ),
            'oidc_login_default_group' => 'nextcloud-users',
            'oidc_create_groups' => true,
          );
        appstore.config.php: |-
          <?php
          $CONFIG = array (
            'appstoreenabled' => false,
            'appstore.experimental.enabled' => false,
          );
        apps-paths.config.php: |-
          <?php
          $CONFIG = array (
            'apps_paths' => array (
              array (
                'path' => '/var/www/html/apps',
                'url' => '/apps',
                'writable' => false,
              ),
              array (
                'path' => '/custom_apps',
                'url' => '/custom_apps',
                'writable' => false,
              ),
            ),
          );
      hooks:
        before-starting: |-
          #!/bin/sh
          set -e
          if php /var/www/html/occ status --output=json | grep -q '"needsDbUpgrade":true'; then
            echo "Running Nextcloud upgrade."
            php /var/www/html/occ upgrade --no-interaction
          fi
          php /var/www/html/occ app:install -n oidc_login || true
          php /var/www/html/occ app:enable -n oidc_login
          php /var/www/html/occ app:install -n mail || true
          php /var/www/html/occ app:enable -n mail || true
          php /var/www/html/occ app:install -n serverinfo || true
          php /var/www/html/occ app:enable -n serverinfo
          php /var/www/html/occ app:install -n richdocuments || true
          php /var/www/html/occ app:enable -n richdocuments
          php /var/www/html/occ app:disable -n richdocumentscode || true
          php /var/www/html/occ app:remove -n richdocumentscode || true
          php /var/www/html/occ config:app:set richdocuments disable_certificate_verification --value=no || true
          for i in 1 2 3 4 5; do
            if php /var/www/html/occ richdocuments:activate-config \
              --wopi-url="https://collabora.${delegating_domain}" \
              --callback-url="https://nextcloud.${delegating_domain}"; then
              break
            fi
            sleep 5
          done
      extraInitContainers:
        - name: seed-custom-apps
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache curl tar >/dev/null
              mkdir -p /custom_apps /tmp/app-downloads
              find /custom_apps -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fetch_app() {
                curl -fsSL "$2" -o "/tmp/app-downloads/$1.tar.gz"
                echo "$3  /tmp/app-downloads/$1.tar.gz" | sha256sum -c - >/dev/null
                tar -xzf "/tmp/app-downloads/$1.tar.gz" -C /custom_apps
              }
              fetch_app \
                mail \
                https://github.com/nextcloud-releases/mail/releases/download/v5.6.12/mail-v5.6.12.tar.gz \
                eddf79115bc5b1fbfae9c96f0630614b4fced1bfe75b2468a71fc22fd5e4a838
              fetch_app \
                richdocuments \
                https://github.com/nextcloud-releases/richdocuments/releases/download/v9.0.2/richdocuments-v9.0.2.tar.gz \
                ceeed1c207f373569729b9cdfa2a4c4ecade4dd83d8fddc13f01840316bc0366
              fetch_app \
                oidc_login \
                https://github.com/pulsejet/nextcloud-oidc-login/releases/download/v3.3.0/oidc_login.tar.gz \
                014f77f1db97688eb6e5c86a8279ea9ef381d1b32044cdd94158a5b2d6f8c912
              chown -R 33:33 /custom_apps
          volumeMounts:
            - name: nextcloud-custom-apps
              mountPath: /custom_apps
        - name: wait-nextcloud-app
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 60); do
                if [ -f /var/www/html/.nextcloud-app-migrated ] || [ -f /var/www/html/config/config.php ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "Timed out waiting for Nextcloud app data migration." >&2
              exit 1
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www/html
        - name: migrate-nextcloud-data
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /dest/.ncdata ] || [ -f /dest/.ocdata ]; then
                echo "Nextcloud data already migrated."
              elif [ -f /src/.ocdata ] || [ -f /src/.ncdata ]; then
                echo "Migrating Nextcloud data to CephFS..."
                cp -a /src/. /dest/
              else
                echo "No legacy data found, initializing empty data directory."
              fi
              if [ ! -f /dest/.ncdata ]; then
                echo "# Nextcloud data directory" > /dest/.ncdata
              fi
              chmod 0770 /dest
          volumeMounts:
            - name: nextcloud-main
              mountPath: /src
              subPath: data
            - name: nextcloud-data
              mountPath: /dest
              subPath: data
      extraVolumes:
        - name: nextcloud-custom-apps
          emptyDir: {}
      extraVolumeMounts:
        - name: nextcloud-custom-apps
          mountPath: /custom_apps
          readOnly: true
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-postgres-rw.nextcloud.svc.cluster.local
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres-app
        usernameKey: username
        passwordKey: password
    externalRedis:
      enabled: true
      host: valkey
      port: "6379"
      existingSecret:
        enabled: true
        secretName: ${valkey_auth_secret_name}
        passwordKey: redis-password
    redis:
      enabled: false
    persistence:
      enabled: true
      existingClaim: nextcloud-app
      storageClass: ${nextcloud_app_storage_class_name}
      accessMode: ReadWriteMany
      size: ${nextcloud_app_size}
      nextcloudData:
        enabled: true
        storageClass: ${nextcloud_data_storage_class_name}
        size: ${nextcloud_data_size}
        accessMode: ReadWriteMany
    resources:
      requests:
        cpu: ${nextcloud_resources_requests_cpu}
        memory: ${nextcloud_resources_requests_memory}
      limits:
        memory: ${nextcloud_resources_limits_memory}
    startupProbe:
      enabled: true
