              subPath: config
            - name: nextcloud-data
              mountPath: /var/www-data
              subPath: data
        - name: seed-custom-apps
          image: python:3.12.11-slim
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              target=/var/www/html/custom_apps
              tmp_root=/tmp/app-downloads
              mkdir -p "$target" "$tmp_root"
              chown 33:33 "$target"
              chmod 0770 "$target"
              lockdir="$target/.seed-lock"
              lock_max_age=900
              acquired=0
              for _ in $(seq 1 60); do
                if mkdir "$lockdir" 2>/dev/null; then
                  date +%s > "$lockdir/created_at"
                  acquired=1
                  break
                fi
                if [ -d "$lockdir" ] && [ ! -f "$lockdir/created_at" ]; then
                  echo "Removing stale custom app seed lock without metadata: $lockdir" >&2
                  rm -rf "$lockdir"
                  continue
                fi
                if [ -f "$lockdir/created_at" ]; then
                  now="$(date +%s)"
                  created="$(cat "$lockdir/created_at" 2>/dev/null || echo 0)"
                  age="$((now - created))"
                  if [ "$age" -gt "$lock_max_age" ]; then
                    echo "Removing stale custom app seed lock older than $lock_max_age seconds: $lockdir" >&2
                    rm -rf "$lockdir"
                    continue
                  fi
                fi
                sleep 2
              done
              if [ "$acquired" -ne 1 ]; then
                echo "Unable to acquire custom app seed lock: $lockdir" >&2
                exit 1
              fi
              cleanup() {
                rm -rf "$lockdir" 2>/dev/null || true
              }
              trap cleanup EXIT
              fetch_app() {
                name="$1"
                url="$2"
                expected="$3"
                required="$4"
                desired_version="$5"
                if [ -f "$target/$required" ]; then
                  current_version="$(python3 -c 'import re,sys,pathlib; data=pathlib.Path(sys.argv[1]).read_text(errors="ignore"); match=re.search(r"<version>([^<]+)</version>", data); print(match.group(1) if match else "")' "$target/$name/appinfo/info.xml")"
                  if [ "$current_version" = "$desired_version" ]; then
                    echo "Custom app '$name' already present at $current_version; skipping download."
                    return 0
                  fi
                  echo "Custom app '$name' is $current_version, expected $desired_version; replacing."
                fi
                stage="$tmp_root/$name"
                rm -rf "$stage"
                mkdir -p "$stage"
                python3 -c 'import hashlib,os,sys,tarfile,urllib.request;name,url,expected,stage=sys.argv[1:5];archive=os.path.join(stage,f"{name}.tar.gz");data=urllib.request.urlopen(url,timeout=60).read();digest=hashlib.sha256(data).hexdigest();assert digest==expected,f"checksum mismatch for {name}: {digest} != {expected}";open(archive,"wb").write(data);tarfile.open(archive,"r:gz").extractall(stage);assert os.path.isdir(os.path.join(stage,name)),f"Missing app directory: {name}"' "$name" "$url" "$expected" "$stage"
                if [ ! -f "$stage/$required" ]; then
                  echo "Missing required file '$required' in app '$name' payload" >&2
                  exit 1
                fi
                rm -rf "$target/$name"
                mv "$stage/$name" "$target/$name"
                chown -R 33:33 "$target/$name"
              }
              fetch_app \
                mail \
                https://github.com/nextcloud-releases/mail/releases/download/v5.9.3/mail-v5.9.3.tar.gz \
                0f653c4611213315a96fc4096f2b67b6443f1a62678ac6cceccd00e460373852 \
                mail/vendor/autoload.php \
                5.9.3
              fetch_app \
                richdocuments \
                https://github.com/nextcloud-releases/richdocuments/releases/download/v11.1.0/richdocuments-v11.1.0.tar.gz \
                113507ed80870aa1d7cf7a4ab3c6d11aa9d4d1788eab0fb0e12f60cfca12da4f \
                richdocuments/appinfo/info.xml \
                11.1.0
              fetch_app \
                oidc_login \
                https://github.com/pulsejet/nextcloud-oidc-login/releases/download/v3.3.4/oidc_login.tar.gz \
                10d5610fd5b12fab763bb3c59fc1195011a5d6fcbf310991bc0c9fb504541fc7 \
                oidc_login/appinfo/info.xml \
                3.3.4
              fetch_app \
                external \
                https://github.com/nextcloud-releases/external/releases/download/v9.0.1/external-v9.0.1.tar.gz \
                b18a55b6a0e12d4a1ced0d74b6e5ef6927f322c8b9b3409dae4ea68717e422d9 \
                external/appinfo/info.xml \
                9.0.1
              # Contacts and Calendar are only the web UIs; CalDAV/CardDAV data
              # lives in the bundled dav app either way. They were installed
              # from the appstore before 'appstoreenabled' was turned off, so
              # nothing recreated them after the 33 -> 34 upgrade and they
              # simply vanished from the UI. Pinned here like every other
              # custom app so they survive the next major upgrade.
              fetch_app \
                contacts \
                https://github.com/nextcloud-releases/contacts/releases/download/v8.7.5/contacts-v8.7.5.tar.gz \
                9935218201ce3f8d06b3be31a0b6df9fbba23f6993724ff3799686dd873c3ea9 \
                contacts/appinfo/info.xml \
                8.7.5
              fetch_app \
                calendar \
                https://github.com/nextcloud-releases/calendar/releases/download/v6.5.4/calendar-v6.5.4.tar.gz \
                67c777a6ea974409e9d228c23fc60f2be8e675d376531b6b1b125f2f0365738d \
                calendar/appinfo/info.xml \
                6.5.4
              # cookbook and maps ship a vendored autoloader, so that file is
              # the marker: a truncated extraction would leave info.xml in
              # place but break the app at runtime. passwords has no vendor
              # tree, hence info.xml there.
              fetch_app \
                cookbook \
                https://github.com/christianlupus-nextcloud/cookbook-releases/releases/download/v0.11.9/cookbook-0.11.9.tar.gz \
                017e3c44d0d1888925e0e654e7c4bf8ed31604f919b8e3d32da8ecd0f5639b80 \
                cookbook/vendor/autoload.php \
                0.11.9
              fetch_app \
                maps \
                https://github.com/nextcloud-releases/maps/releases/download/v1.8.0/maps-v1.8.0.tar.gz \
                4e44ea40268d2f942967b847840e18c37318a0d1ca1c1572e7f635ce3ac32c04 \
                maps/vendor/autoload.php \
                1.8.0
              fetch_app \
                passwords \
                https://git.mdns.eu/api/v4/projects/45/packages/generic/passwords/2026.7.0/passwords.tar.gz \
                f0447632ac9e3e91110fb4517f0f07ab9c4dc7eb3cbd484f6c3c89d89bd4fe1a \
                passwords/appinfo/info.xml \
                2026.7.20
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
        - name: wait-nextcloud-app
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 60); do
                if [ -f /var/www/html/.nextcloud-app-migrated ] || [ -f /var/www/html/config/config.php ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "Timed out waiting for Nextcloud app data migration." >&2
              exit 1
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www/html
        - name: migrate-nextcloud-data
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /dest/.ncdata ] || [ -f /dest/.ocdata ]; then
                echo "Nextcloud data already migrated."
              elif [ -f /src/.ocdata ] || [ -f /src/.ncdata ]; then
                echo "Migrating Nextcloud data to CephFS..."
                cp -a /src/. /dest/
              else
                echo "No legacy data found, initializing empty data directory."
              fi
              if [ ! -f /dest/.ncdata ]; then
                echo "# Nextcloud data directory" > /dest/.ncdata
              fi
              chown 33:33 /dest
              chmod 0770 /dest
          volumeMounts:
            - name: nextcloud-main
              mountPath: /src
              subPath: data
            - name: nextcloud-data
              mountPath: /dest
              subPath: data
