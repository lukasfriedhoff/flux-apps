            fi
            desired_datadir='/shared-memes/$user'
            ensure_shared_memes_user_dirs
            existing_mount="$(timeout 30 php /var/www/html/occ files_external:list \
              --output=json 2>/dev/null \
              | php -r '
                $mounts = json_decode(file_get_contents("php://stdin"), true);
                if (!is_array($mounts)) {
                  exit;
                }
                foreach ($mounts as $m) {
                  if (($m["mount_point"] ?? "") === "/Memes") {
                    echo ($m["mount_id"] ?? "") . "|" . (($m["configuration"]["datadir"] ?? ""));
                    break;
                  }
                }
              ')"
            if [ -n "$existing_mount" ]; then
              mount_id="$${existing_mount%%|*}"
              current_datadir="$${existing_mount#*|}"
              if [ "$current_datadir" != "$desired_datadir" ]; then
                echo "Updating Shared Memes external storage to per-user path $desired_datadir..."
                occ_safe files_external:config "$mount_id" datadir "$desired_datadir"
              else
                echo "Shared Memes external storage already configured."
              fi
              scan_shared_memes_user_dirs
              rmdir "$lock_dir"
              return 0
            fi
            echo "Creating Shared Memes external storage at $desired_datadir..."
            if occ_safe files_external:create \
              "Memes" local null::null \
              -c datadir="$desired_datadir"; then
              scan_shared_memes_user_dirs
              rmdir "$lock_dir"
              return 0
            fi
            status="$?"
            rmdir "$lock_dir"
            return "$status"
          }
          configure_oidc_login
          configure_shared_photos_storage
          configure_shared_memes_storage
          configure_external_photos_link
          configure_external_memes_link
          enable_custom_app_if_present mail /var/www/html/custom_apps/mail/vendor/autoload.php || true
          enable_custom_app_if_present contacts /var/www/html/custom_apps/contacts/appinfo/info.xml || true
          enable_custom_app_if_present calendar /var/www/html/custom_apps/calendar/appinfo/info.xml || true
