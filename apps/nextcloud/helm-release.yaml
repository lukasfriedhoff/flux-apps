          enable_custom_app_if_present maps /var/www/html/custom_apps/maps/vendor/autoload.php || true
          enable_custom_app_if_present passwords /var/www/html/custom_apps/passwords/appinfo/info.xml || true
          ensure_app_enabled serverinfo
          if enable_custom_app_if_present richdocuments /var/www/html/custom_apps/richdocuments/appinfo/info.xml; then
            occ_safe app:disable -n richdocumentscode
