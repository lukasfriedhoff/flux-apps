apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m0s
  # First bootstrap/upgrade on RWX CephFS can take a long time due rsync.
  # Keep Helm waiting long enough to avoid interrupting and restarting sync.
  timeout: 4h0m0s
  # Force replacement on upgrade to recover from historical duplicate
  # volumeMount path entries that break patch-based upgrades.
  upgrade:
    force: true
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
      interval: 10m0s
  values:
    replicaCount: ${nextcloud_hpa_min_pods}
    hpa:
      enabled: ${nextcloud_hpa_enabled}
      cputhreshold: ${nextcloud_hpa_cpu_threshold}
      minPods: ${nextcloud_hpa_min_pods}
      maxPods: ${nextcloud_hpa_max_pods}
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 20
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 20
      failureThreshold: 6
      successThreshold: 1
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - secretName: nextcloud-tls
          hosts:
            - nextcloud${public_host_suffix}.${delegating_domain}
    nextcloud:
      host: nextcloud${public_host_suffix}.${delegating_domain}
      podSecurityContext:
        fsGroupChangePolicy: OnRootMismatch
      extraEnv:
        - name: OVERWRITEHOST
          value: nextcloud${public_host_suffix}.${delegating_domain}
        - name: OVERWRITEPROTOCOL
          value: https
        - name: TRUSTED_PROXIES
          value: ${trusted_proxies_cidr}
        - name: NEXTCLOUD_OIDC_PROVIDER
          value: ${nextcloud_oidc}
        - name: OIDC_LOGIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client_secret
              optional: true
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: username
        passwordKey: password
      defaultConfigs:
        upgrade-disable-web.config.php: false
      configs:
        oidc-login.config.php: |-
          <?php
          $CONFIG = array (
            'oidc_login_provider_url' => 'https://auth${public_host_suffix}.${delegating_domain}',
            'oidc_login_client_id' => 'nextcloud',
            'oidc_login_client_secret' => getenv('OIDC_LOGIN_CLIENT_SECRET'),
            'oidc_login_button_text' => 'Log in with Authelia',
            'oidc_login_scope' => 'openid profile email groups offline_access nextcloud_admin',
            'oidc_login_code_challenge_method' => 'S256',
            'oidc_login_auto_redirect' => false,
            'oidc_login_end_session_redirect' => false,
            'oidc_login_logout_url' => 'https://nextcloud${public_host_suffix}.${delegating_domain}/apps/oidc_login/oidc',
            'oidc_login_disable_registration' => false,
            'oidc_login_attributes' => array (
              'id' => 'sub',
              'name' => 'name',
              'mail' => 'email',
              'groups' => 'groups',
              'is_admin' => 'is_admin',
            ),
            'oidc_login_default_group' => 'nextcloud-users',
            'oidc_create_groups' => true,
          );
        appstore.config.php: |-
          <?php
          $CONFIG = array (
            'appstoreenabled' => false,
            'appstore.experimental.enabled' => false,
          );
        logging.config.php: |-
          <?php
          $CONFIG = array (
            // 0=Debug, 1=Info, 2=Warning, 3=Error, 4=Fatal
            'loglevel' => 2,
          );
        apps-paths.config.php: |-
          <?php
          $CONFIG = array (
            'apps_paths' => array (
              array (
                'path' => '/var/www/html/apps',
                'url' => '/apps',
                'writable' => false,
              ),
              array (
                'path' => '/var/www/html/custom_apps',
                'url' => '/custom_apps',
                'writable' => false,
              ),
            ),
          );
      hooks:
        before-starting: |-
          #!/bin/sh
          set -e
          # Avoid getcwd failures if the previous working directory vanished.
          cd /
          # On slow or interrupted bootstrap runs, /var/www/html may exist while occ
          # is not yet available; do not crash-loop the pod in that case.
          if [ ! -x /var/www/html/occ ]; then
            echo "Nextcloud occ is not available yet, skipping before-starting hook."
            exit 0
          fi
          # --- DB PASSWORD SYNC ---
          # Sync the database password from the injected CNPG secret into
          # config.php on every pod start. This prevents CNPG password rotations
          # (e.g. after cluster recreation) from silently breaking Nextcloud.
          if [ -f /var/www/html/config/config.php ] && [ -n "$POSTGRES_PASSWORD" ]; then
            php -r "
              \$cfg = file_get_contents('/var/www/html/config/config.php');
              \$pw  = getenv('POSTGRES_PASSWORD');
              \$cfg = preg_replace(
                \"/'dbpassword' => '.*?'/s\",
                \"'dbpassword' => '\" . str_replace(\"'\", \"\\\\'\", \$pw) . \"'\",
                \$cfg
              );
              file_put_contents('/var/www/html/config/config.php', \$cfg);
            " 2>/dev/null && echo "DB password synced from secret into config.php."
          fi
          # --- EMPTY DB RECOVERY ---
          # If config.php says installed=true but the DB schema is gone (e.g.
          # CNPG cluster was recreated and the PVC was wiped), reset the
          # installed flag and remove the admin data dir so the install block
          # below can run maintenance:install cleanly.
          if [ -f /var/www/html/config/config.php ] && grep -q "'installed' => true" /var/www/html/config/config.php; then
            schema_check=$(php -r "
              try {
                \$pdo = new PDO(
                  'pgsql:host=' . getenv('POSTGRES_HOST') . ';dbname=' . getenv('POSTGRES_DB'),
                  getenv('POSTGRES_USER'),
                  getenv('POSTGRES_PASSWORD')
                );
                \$s = \$pdo->query(\"SELECT 1 FROM information_schema.tables WHERE table_name='oc_appconfig' LIMIT 1\");
                echo (\$s && \$s->rowCount() > 0) ? 'ok' : 'empty';
              } catch (Exception \$e) { echo 'err'; }
            " 2>/dev/null)
            echo "DB schema check: $schema_check"
            if [ "$schema_check" = "empty" ]; then
              echo "DB schema missing; resetting installed flag for fresh install."
              sed -i "s/'installed' => true/'installed' => false/" /var/www/html/config/config.php
              admin_dir="$NEXTCLOUD_DATA_DIR/$NEXTCLOUD_ADMIN_USER"
              if [ -n "$NEXTCLOUD_ADMIN_USER" ] && [ -d "$admin_dir" ]; then
                echo "Removing admin data dir to allow re-install: $admin_dir"
                rm -rf "${NEXTCLOUD_DATA_DIR:?}/${NEXTCLOUD_ADMIN_USER:?}"
              fi
            fi
          fi
          status_json="$(php /var/www/html/occ status --output=json 2>/dev/null || true)"
          is_installed() {
            echo "$status_json" | grep -q '"installed":true'
          }
          refresh_status() {
            status_json="$(php /var/www/html/occ status --output=json 2>/dev/null || true)"
          }
          if ! is_installed; then
            lockdir="/var/www/html/config/.install-lock"
            acquired=0
            i=1
            while [ "$i" -le 120 ]; do
              if mkdir "$lockdir" 2>/dev/null; then
                acquired=1
                date +%s > "$lockdir/created_at"
                trap 'rm -rf "$lockdir"' EXIT
                break
              fi
              if [ -f "$lockdir/created_at" ]; then
                now="$(date +%s)"
                created="$(cat "$lockdir/created_at" 2>/dev/null || echo 0)"
                age="$((now - created))"
                if [ "$age" -gt 900 ]; then
                  echo "Removing stale install lock older than 900s: $lockdir"
                  rm -rf "$lockdir"
                  continue
                fi
              fi
              refresh_status
              if is_installed; then
                break
              fi
              sleep 2
              i=$((i + 1))
            done
            if [ "$acquired" -eq 1 ] && ! is_installed; then
              echo "Nextcloud is not installed yet, attempting maintenance:install."
              php /var/www/html/occ maintenance:install \
                --database pgsql \
                --database-name "$POSTGRES_DB" \
                --database-user "$POSTGRES_USER" \
                --database-pass "$POSTGRES_PASSWORD" \
                --database-host "$POSTGRES_HOST" \
                --admin-user "$NEXTCLOUD_ADMIN_USER" \
                --admin-pass "$NEXTCLOUD_ADMIN_PASSWORD" \
                --data-dir "$NEXTCLOUD_DATA_DIR" || true
              refresh_status
            fi
          fi
          if ! is_installed; then
            echo "Nextcloud install not complete yet; waiting for another pod to finish."
            i=1
            while [ "$i" -le 120 ]; do
              refresh_status
              if is_installed; then
                break
              fi
              sleep 2
              i=$((i + 1))
            done
          fi
          if ! is_installed; then
            echo "Nextcloud install still not complete; skipping app configuration hook."
            exit 0
          fi
          occ_safe() {
            timeout 60 php /var/www/html/occ "$@" || true
          }
          quarantine_orphan_uuid_homes() {
            data_dir="$(php /var/www/html/occ config:system:get datadirectory 2>/dev/null || true)"
            if [ -z "$data_dir" ]; then
              data_dir="/var/www/html/data"
            fi
            if [ ! -d "$data_dir" ]; then
              return 0
            fi
            quarantine_dir="$data_dir/_orphaned_oidc"
            mkdir -p "$quarantine_dir"
            find "$data_dir" -mindepth 1 -maxdepth 1 -type d | while read -r user_dir; do
              user_id="$(basename "$user_dir")"
              case "$user_id" in
                _orphaned_oidc|appdata_*|updater-*|files_external|avatars|audit|cache|preview|tmp|uploads)
                  continue
                  ;;
              esac
              if echo "$user_id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
                if ! php /var/www/html/occ user:info "$user_id" >/dev/null 2>&1; then
                  ts="$(date +%s)"
                  target="$quarantine_dir/${user_id}-${ts}"
                  echo "Quarantining orphan OIDC home directory '$user_id' to '$target'."
                  mv "$user_dir" "$target" || true
                fi
              fi
            done
          }
          disable_problematic_apps() {
            # Circles can throw hard failures on group-assignment events and break OIDC callbacks.
            occ_safe app:disable -n circles
          }
          if [ ! -e /var/www/html/public ] && [ -d /var/www/html/lib/public ]; then
            ln -s lib/public /var/www/html/public
          fi
          if php /var/www/html/occ status --output=json | grep -q '"needsDbUpgrade":true'; then
            echo "Running Nextcloud upgrade."
            occ_safe upgrade --no-interaction
          fi
          if php /var/www/html/occ status --output=json | grep -q '"maintenance":true' && ! php /var/www/html/occ status --output=json | grep -q '"needsDbUpgrade":true'; then
            echo "Disabling maintenance mode."
            occ_safe maintenance:mode --off
          fi
          quarantine_orphan_uuid_homes
          disable_problematic_apps
          ensure_app_enabled() {
            app="$1"
            occ_safe app:enable -n "$app"
          }
          wait_for_file() {
            file="$1"
            attempts="${2:-30}"
            delay="${3:-2}"
            i=1
            while [ "$i" -le "$attempts" ]; do
              if [ -f "$file" ]; then
                return 0
              fi
              sleep "$delay"
              i=$((i + 1))
            done
            return 1
          }
          enable_custom_app_if_present() {
            app="$1"
            marker="$2"
            if [ -f "$marker" ]; then
              ensure_app_enabled "$app"
              return 0
            fi
            echo "Custom app '$app' missing required file '$marker'; disabling it."
            occ_safe app:disable -n "$app"
            return 1
          }
          configure_oidc_login() {
            provider="$NEXTCLOUD_OIDC_PROVIDER"
            if [ -z "$provider" ]; then
              provider="none"
            fi
            case "$provider" in
              authelia)
                if [ -z "$OIDC_LOGIN_CLIENT_SECRET" ]; then
                  echo "NEXTCLOUD_OIDC_PROVIDER=authelia but OIDC secret is missing; disabling oidc_login."
                  occ_safe app:disable -n oidc_login
                else
                  oidc_marker="/var/www/html/custom_apps/oidc_login/appinfo/info.xml"
                  if wait_for_file "$oidc_marker" 30 2; then
                    ensure_app_enabled oidc_login
                  else
                    echo "OIDC app payload missing after startup wait; keeping current oidc_login state."
                  fi
                fi
                ;;
              none|disabled|false|"")
                echo "OIDC provider disabled; disabling oidc_login."
                occ_safe app:disable -n oidc_login
                ;;
              *)
                echo "Unknown NEXTCLOUD_OIDC_PROVIDER='$provider'; disabling oidc_login."
                occ_safe app:disable -n oidc_login
                ;;
            esac
          }
          configure_oidc_login
          enable_custom_app_if_present mail /var/www/html/custom_apps/mail/vendor/autoload.php || true
          ensure_app_enabled serverinfo
          if enable_custom_app_if_present richdocuments /var/www/html/custom_apps/richdocuments/appinfo/info.xml; then
            occ_safe app:disable -n richdocumentscode
            occ_safe app:remove -n richdocumentscode
            occ_safe config:app:set richdocuments disable_certificate_verification --value=no
            for i in 1 2 3 4 5; do
              if timeout 30 php /var/www/html/occ richdocuments:activate-config \
                --wopi-url="https://collabora${public_host_suffix}.${delegating_domain}" \
                --callback-url="https://nextcloud${public_host_suffix}.${delegating_domain}"; then
                break
              fi
              sleep 5
            done
          fi
      extraInitContainers:
        - name: fix-var-www-permissions
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /var/www
              chmod 0755 /var/www
              mkdir -p /var/www-config
              chown 33:33 /var/www-config
              chmod 0770 /var/www-config
              if [ ! -f /var/www-config/config.php ]; then
                touch /var/www-config/config.php
                chown 33:33 /var/www-config/config.php
                chmod 0640 /var/www-config/config.php
              fi
              mkdir -p /var/www-data
              chown 33:33 /var/www-data
              chmod 0770 /var/www-data
              mkdir -p /var/www/html/custom_apps /var/www/html/themes /var/www/tmp
              chown 33:33 /var/www/html/custom_apps /var/www/html/themes /var/www/tmp
              chmod 0770 /var/www/html/custom_apps /var/www/html/themes /var/www/tmp
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www
              subPath: root
            - name: nextcloud-main
              mountPath: /var/www-config
              subPath: config
            - name: nextcloud-data
              mountPath: /var/www-data
              subPath: data
        - name: seed-custom-apps
          image: python:3.12.11-slim
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              target=/var/www/html/custom_apps
              tmp_root=/tmp/app-downloads
              mkdir -p "$target" "$tmp_root"
              chown 33:33 "$target"
              chmod 0770 "$target"
              lockdir="$target/.seed-lock"
              lock_max_age=900
              acquired=0
              for _ in $(seq 1 60); do
                if mkdir "$lockdir" 2>/dev/null; then
                  date +%s > "$lockdir/created_at"
                  acquired=1
                  break
                fi
                if [ -d "$lockdir" ] && [ ! -f "$lockdir/created_at" ]; then
                  echo "Removing stale custom app seed lock without metadata: $lockdir" >&2
                  rm -rf "$lockdir"
                  continue
                fi
                if [ -f "$lockdir/created_at" ]; then
                  now="$(date +%s)"
                  created="$(cat "$lockdir/created_at" 2>/dev/null || echo 0)"
                  age="$((now - created))"
                  if [ "$age" -gt "$lock_max_age" ]; then
                    echo "Removing stale custom app seed lock older than $lock_max_age seconds: $lockdir" >&2
                    rm -rf "$lockdir"
                    continue
                  fi
                fi
                sleep 2
              done
              if [ "$acquired" -ne 1 ]; then
                echo "Unable to acquire custom app seed lock: $lockdir" >&2
                exit 1
              fi
              cleanup() {
                rm -rf "$lockdir" 2>/dev/null || true
              }
              trap cleanup EXIT
              fetch_app() {
                name="$1"
                url="$2"
                expected="$3"
                required="$4"
                if [ -f "$target/$required" ]; then
                  echo "Custom app '$name' already present; skipping download."
                  return 0
                fi
                stage="$tmp_root/$name"
                rm -rf "$stage"
                mkdir -p "$stage"
                python3 -c 'import hashlib,os,sys,tarfile,urllib.request;name,url,expected,stage=sys.argv[1:5];archive=os.path.join(stage,f"{name}.tar.gz");data=urllib.request.urlopen(url,timeout=60).read();digest=hashlib.sha256(data).hexdigest();assert digest==expected,f"checksum mismatch for {name}: {digest} != {expected}";open(archive,"wb").write(data);tarfile.open(archive,"r:gz").extractall(stage);assert os.path.isdir(os.path.join(stage,name)),f"Missing app directory: {name}"' "$name" "$url" "$expected" "$stage"
                if [ ! -f "$stage/$required" ]; then
                  echo "Missing required file '$required' in app '$name' payload" >&2
                  exit 1
                fi
                rm -rf "$target/$name"
                mv "$stage/$name" "$target/$name"
                chown -R 33:33 "$target/$name"
              }
              fetch_app \
                mail \
                https://github.com/nextcloud-releases/mail/releases/download/v5.7.4/mail-v5.7.4.tar.gz \
                4975770bd441349169dceb9d0dc6dd9d6c2e85e0d095ed5a536c117ce52d2eaa \
                mail/vendor/autoload.php
              fetch_app \
                richdocuments \
                https://github.com/nextcloud-releases/richdocuments/releases/download/v10.1.2/richdocuments-v10.1.2.tar.gz \
                5bb91dd34ff98e666531143fc43077f961e52a30aafe18115d1c9e5b2bb62ca2 \
                richdocuments/appinfo/info.xml
              fetch_app \
                oidc_login \
                https://github.com/pulsejet/nextcloud-oidc-login/releases/download/v3.3.0/oidc_login.tar.gz \
                014f77f1db97688eb6e5c86a8279ea9ef381d1b32044cdd94158a5b2d6f8c912 \
                oidc_login/appinfo/info.xml
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
        - name: wait-nextcloud-app
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 60); do
                if [ -f /var/www/html/.nextcloud-app-migrated ] || [ -f /var/www/html/config/config.php ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "Timed out waiting for Nextcloud app data migration." >&2
              exit 1
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www/html
        - name: migrate-nextcloud-data
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /dest/.ncdata ] || [ -f /dest/.ocdata ]; then
                echo "Nextcloud data already migrated."
              elif [ -f /src/.ocdata ] || [ -f /src/.ncdata ]; then
                echo "Migrating Nextcloud data to CephFS..."
                cp -a /src/. /dest/
              else
                echo "No legacy data found, initializing empty data directory."
              fi
              if [ ! -f /dest/.ncdata ]; then
                echo "# Nextcloud data directory" > /dest/.ncdata
              fi
              chown 33:33 /dest
              chmod 0770 /dest
          volumeMounts:
            - name: nextcloud-main
              mountPath: /src
              subPath: data
            - name: nextcloud-data
              mountPath: /dest
              subPath: data
      # Explicitly clear chart defaults to avoid rendering an invalid mount
      # entry with an empty `name` when no extra mounts are required.
      extraVolumeMounts: []
      extraVolumes: []
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-postgres-rw.nextcloud.svc.cluster.local
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres-app
        usernameKey: username
        passwordKey: password
    externalRedis:
      enabled: true
      host: valkey
      port: "6379"
      existingSecret:
        enabled: true
        secretName: ${valkey_auth_secret_name}
        passwordKey: redis-password
    redis:
      enabled: false
    persistence:
      enabled: true
      existingClaim: ${nextcloud_app_claim_name}
      storageClass: ${nextcloud_app_storage_class_name}
      accessMode: ReadWriteMany
      size: ${nextcloud_app_size}
      nextcloudData:
        enabled: true
        existingClaim: ${nextcloud_data_claim_name}
        storageClass: ${nextcloud_data_storage_class_name}
        size: ${nextcloud_data_size}
        accessMode: ReadWriteMany
    resources:
      requests:
        cpu: ${nextcloud_resources_requests_cpu}
        memory: ${nextcloud_resources_requests_memory}
      limits:
        memory: ${nextcloud_resources_limits_memory}
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 20
      failureThreshold: 2160
