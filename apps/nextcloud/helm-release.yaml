apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m0s
  # First bootstrap/upgrade on RWX CephFS can take a long time due rsync.
  # Keep Helm waiting long enough to avoid interrupting and restarting sync.
  timeout: 4h0m0s
  # Force replacement on upgrade to recover from historical duplicate
  # volumeMount path entries that break patch-based upgrades.
  upgrade:
    force: true
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
      interval: 10m0s
  values:
    replicaCount: ${nextcloud_hpa_min_pods}
    hpa:
      enabled: ${nextcloud_hpa_enabled}
      cputhreshold: ${nextcloud_hpa_cpu_threshold}
      minPods: ${nextcloud_hpa_min_pods}
      maxPods: ${nextcloud_hpa_max_pods}
    # Soft anti-affinity: spread app replicas across nodes when possible,
    # without blocking scheduling on single-node clusters.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nextcloud
                  app.kubernetes.io/component: app
              topologyKey: kubernetes.io/hostname
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 20
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 20
      failureThreshold: 6
      successThreshold: 1
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - secretName: nextcloud-tls
          hosts:
            - nextcloud${public_host_suffix}.${delegating_domain}
    nextcloud:
      host: nextcloud${public_host_suffix}.${delegating_domain}
      podSecurityContext:
        fsGroupChangePolicy: OnRootMismatch
      extraEnv:
        - name: OVERWRITEHOST
          value: nextcloud${public_host_suffix}.${delegating_domain}
        - name: OVERWRITEPROTOCOL
          value: https
        - name: TRUSTED_PROXIES
          value: ${trusted_proxies_cidr}
        - name: NEXTCLOUD_OIDC_PROVIDER
          value: ${nextcloud_oidc}
        - name: NEXTCLOUD_EXTERNAL_PHOTOS_ENABLED
          value: ${nextcloud_external_photos_enabled:=disabled}
        - name: NEXTCLOUD_EXTERNAL_PHOTOS_URL
          value: ${nextcloud_external_photos_url:=}
        - name: NEXTCLOUD_EXTERNAL_PHOTOS_LABEL
          value: ${nextcloud_external_photos_label:=Photos}
        - name: NEXTCLOUD_EXTERNAL_MEMES_ENABLED
          value: ${nextcloud_external_memes_enabled:=disabled}
        - name: NEXTCLOUD_EXTERNAL_MEMES_URL
          value: ${nextcloud_external_memes_url:=}
        - name: NEXTCLOUD_EXTERNAL_MEMES_LABEL
          value: ${nextcloud_external_memes_label:=Memes}
        - name: OIDC_LOGIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client_secret
              optional: true
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: username
        passwordKey: password
      defaultConfigs:
        upgrade-disable-web.config.php: false
      configs:
        oidc-login.config.php: |-
          <?php
          $CONFIG = array (
            'oidc_login_provider_url' => 'https://auth${public_host_suffix}.${delegating_domain}',
            'oidc_login_client_id' => 'nextcloud',
            'oidc_login_client_secret' => getenv('OIDC_LOGIN_CLIENT_SECRET'),
            'oidc_login_button_text' => 'Log in with Authelia',
            'oidc_login_scope' => 'openid profile email groups offline_access nextcloud_admin',
            'oidc_login_code_challenge_method' => 'S256',
            'oidc_login_auto_redirect' => false,
            'oidc_login_end_session_redirect' => false,
            'oidc_login_logout_url' => 'https://nextcloud${public_host_suffix}.${delegating_domain}/apps/oidc_login/oidc',
            'oidc_login_disable_registration' => false,
            'oidc_login_attributes' => array (
              'id' => 'sub',
              'name' => 'name',
              'mail' => 'email',
              'groups' => 'groups',
              'is_admin' => 'is_admin',
            ),
            'oidc_login_default_group' => 'nextcloud-users',
            'oidc_create_groups' => true,
          );
        appstore.config.php: |-
          <?php
          $CONFIG = array (
            'appstoreenabled' => false,
            'appstore.experimental.enabled' => false,
          );
        logging.config.php: |-
          <?php
          $CONFIG = array (
            // 0=Debug, 1=Info, 2=Warning, 3=Error, 4=Fatal
            'loglevel' => 2,
            // Temporary: debug-level logging for a single user, to catch the
            // half-completed writes that leave filecache rows without any
            // file on disk (seen from the Android app on 2026-08-04 and
            // 2026-08-05). Scoped via log.condition so the rest of the
            // instance stays at warning level and the log volume stays sane.
            // Remove this block once the root cause is identified.
            'log.condition' => array (
              'users' => array (
                '${nextcloud_debug_user:=__none__}',
              ),
            ),
          );
        uploads.config.php: |-
          <?php
          $CONFIG = array (
            // Cloudflare terminates proxied requests at ~100s (HTTP 524).
            // Measured throughput through the tunnel is ~690 KB/s, so any
            // single request carrying more than ~65 MB is cut mid-body and
            // Nextcloud reports "Expected filesize of X but read/wrote Y".
            // Cap the chunk size clients use so no one request gets near that
            // window: 10 MiB is ~15s on the same path.
            'max_chunk_size' => ${nextcloud_max_chunk_size:=10485760},
          );
        apps-paths.config.php: |-
          <?php
          $CONFIG = array (
            'apps_paths' => array (
              array (
                'path' => '/var/www/html/apps',
                'url' => '/apps',
                'writable' => false,
              ),
              array (
                'path' => '/var/www/html/custom_apps',
                'url' => '/custom_apps',
                'writable' => false,
              ),
            ),
          );
      hooks:
        before-starting: |-
          #!/bin/sh
          set -e
          # Avoid getcwd failures if the previous working directory vanished.
          cd /
          # On slow or interrupted bootstrap runs, /var/www/html may exist while occ
          # is not yet available; do not crash-loop the pod in that case.
          if [ ! -x /var/www/html/occ ]; then
            echo "Nextcloud occ is not available yet, skipping before-starting hook."
            exit 0
          fi
          # --- DB PASSWORD SYNC ---
          # Sync the database password from the injected CNPG secret into
          # config.php on every pod start. This prevents CNPG password rotations
          # (e.g. after cluster recreation) from silently breaking Nextcloud.
          if [ -f /var/www/html/config/config.php ] && [ -n "$POSTGRES_PASSWORD" ]; then
            php -r "
              \$cfg = file_get_contents('/var/www/html/config/config.php');
              \$pw  = getenv('POSTGRES_PASSWORD');
              \$cfg = preg_replace(
                \"/'dbpassword' => '.*?'/s\",
                \"'dbpassword' => '\" . str_replace(\"'\", \"\\\\'\", \$pw) . \"'\",
                \$cfg
              );
              file_put_contents('/var/www/html/config/config.php', \$cfg);
            " 2>/dev/null && echo "DB password synced from secret into config.php."
          fi
          # --- DB INSTALL STATE RECOVERY ---
          # Treat the database schema as authoritative. If config.php lost the
          # installed flag but the schema exists, restore the flag instead of
          # trying a destructive/conflicting fresh install. If config.php says
          # installed=true but the schema is gone, reset it so installation can
          # run against an actually empty DB.
          check_db_schema() {
            php -r "
              try {
                \$pdo = new PDO(
                  'pgsql:host=' . getenv('POSTGRES_HOST') . ';dbname=' . getenv('POSTGRES_DB'),
                  getenv('POSTGRES_USER'),
                  getenv('POSTGRES_PASSWORD')
                );
                \$exists = \$pdo->query(\"SELECT to_regclass('public.oc_appconfig')\")->fetchColumn();
                if (!\$exists) {
                  echo 'empty';
                  exit;
                }
                \$pdo->query('SELECT 1 FROM oc_appconfig LIMIT 1');
                echo 'ok';
              } catch (Exception \$e) {
                echo \$e->getCode() === '42501' ? 'denied' : 'err';
              }
            " 2>/dev/null
          }
          schema_check="unknown"
          if [ -f /var/www/html/config/config.php ]; then
            schema_check="$(check_db_schema)"
            if [ "$schema_check" = "denied" ]; then
              echo "DB schema exists but grants are missing; waiting for ACL repair job."
              for _ in $(seq 1 60); do
                sleep 5
                schema_check="$(check_db_schema)"
                if [ "$schema_check" != "denied" ]; then
                  break
                fi
              done
            fi
            echo "DB schema check: $schema_check"
            if [ "$schema_check" = "ok" ]; then
              php -r '
                $file = "/var/www/html/config/config.php";
                $cfg = file_get_contents($file);
                if (preg_match("/'\''installed'\''\s*=>/", $cfg)) {
                  $cfg = preg_replace("/'\''installed'\''\s*=>\s*false/", "'\''installed'\'' => true", $cfg, 1);
                } else {
                  $cfg = preg_replace("/\n\);\s*$/", "\n  '\''installed'\'' => true,\n);\n", $cfg, 1);
                }
                file_put_contents($file, $cfg);
              ' 2>/dev/null && echo "Nextcloud installed flag synced from existing DB schema."
            elif grep -q "'installed' => true" /var/www/html/config/config.php && [ "$schema_check" = "empty" ]; then
              echo "DB schema missing; resetting installed flag for fresh install."
              sed -i "s/'installed' => true/'installed' => false/" /var/www/html/config/config.php
              admin_dir="$NEXTCLOUD_DATA_DIR/$NEXTCLOUD_ADMIN_USER"
              if [ -n "$NEXTCLOUD_ADMIN_USER" ] && [ -d "$admin_dir" ]; then
                echo "Removing admin data dir to allow re-install: $admin_dir"
                rm -rf "${NEXTCLOUD_DATA_DIR:?}/${NEXTCLOUD_ADMIN_USER:?}"
              fi
            elif [ "$schema_check" = "denied" ]; then
              echo "DB schema grants are still missing after waiting; restarting pod."
              exit 1
            fi
          fi
          status_json="$(php /var/www/html/occ status --output=json 2>/dev/null || true)"
          is_installed() {
            echo "$status_json" | grep -q '"installed":true'
          }
          refresh_status() {
            status_json="$(php /var/www/html/occ status --output=json 2>/dev/null || true)"
          }
          if ! is_installed; then
            lockdir="/var/www/html/config/.install-lock"
            acquired=0
            i=1
            while [ "$i" -le 120 ]; do
              if mkdir "$lockdir" 2>/dev/null; then
                acquired=1
                date +%s > "$lockdir/created_at"
                trap 'rm -rf "$lockdir"' EXIT
                break
              fi
              if [ -f "$lockdir/created_at" ]; then
                now="$(date +%s)"
                created="$(cat "$lockdir/created_at" 2>/dev/null || echo 0)"
                age="$((now - created))"
                if [ "$age" -gt 900 ]; then
                  echo "Removing stale install lock older than 900s: $lockdir"
                  rm -rf "$lockdir"
                  continue
                fi
              fi
              refresh_status
              if is_installed; then
                break
              fi
              sleep 2
              i=$((i + 1))
            done
            if [ "$acquired" -eq 1 ] && ! is_installed; then
              echo "Nextcloud is not installed yet, attempting maintenance:install."
              php /var/www/html/occ maintenance:install \
                --database pgsql \
                --database-name "$POSTGRES_DB" \
                --database-user "$POSTGRES_USER" \
                --database-pass "$POSTGRES_PASSWORD" \
                --database-host "$POSTGRES_HOST" \
                --admin-user "$NEXTCLOUD_ADMIN_USER" \
                --admin-pass "$NEXTCLOUD_ADMIN_PASSWORD" \
                --data-dir "$NEXTCLOUD_DATA_DIR" || true
              refresh_status
            fi
          fi
          if ! is_installed; then
            echo "Nextcloud install not complete yet; waiting for another pod to finish."
            i=1
            while [ "$i" -le 120 ]; do
              refresh_status
              if is_installed; then
                break
              fi
              sleep 2
              i=$((i + 1))
            done
          fi
          if ! is_installed; then
            echo "Nextcloud install still not complete; skipping app configuration hook."
            exit 0
          fi
          occ_safe() {
            timeout 60 php /var/www/html/occ "$@" || true
          }
          quarantine_orphan_uuid_homes() {
            data_dir="$(php /var/www/html/occ config:system:get datadirectory 2>/dev/null || true)"
            if [ -z "$data_dir" ]; then
              data_dir="/var/www/html/data"
            fi
            if [ ! -d "$data_dir" ]; then
              return 0
            fi
            quarantine_dir="$data_dir/_orphaned_oidc"
            mkdir -p "$quarantine_dir"
            find "$data_dir" -mindepth 1 -maxdepth 1 -type d | while read -r user_dir; do
              user_id="$(basename "$user_dir")"
              case "$user_id" in
                _orphaned_oidc|appdata_*|updater-*|files_external|avatars|audit|cache|preview|tmp|uploads)
                  continue
                  ;;
              esac
              if echo "$user_id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
                if ! php /var/www/html/occ user:info "$user_id" >/dev/null 2>&1; then
                  ts="$(date +%s)"
                  target="$quarantine_dir/$user_id-$ts"
                  echo "Quarantining orphan OIDC home directory '$user_id' to '$target'."
                  if [ -d "$user_dir" ]; then
                    mv "$user_dir" "$target" || true
                  fi
                fi
              fi
            done
          }
          disable_problematic_apps() {
            # Circles can throw hard failures on group-assignment events and break OIDC callbacks.
            occ_safe app:disable -n circles
          }
          if [ ! -e /var/www/html/public ] && [ -d /var/www/html/lib/public ]; then
            ln -s lib/public /var/www/html/public
          fi
          if php /var/www/html/occ status --output=json | grep -q '"needsDbUpgrade":true'; then
            echo "Running Nextcloud upgrade."
            occ_safe upgrade --no-interaction
          fi
          if php /var/www/html/occ status --output=json | grep -q '"maintenance":true' && ! php /var/www/html/occ status --output=json | grep -q '"needsDbUpgrade":true'; then
            echo "Disabling maintenance mode."
            occ_safe maintenance:mode --off
          fi
          quarantine_orphan_uuid_homes
          disable_problematic_apps
          ensure_app_enabled() {
            app="$1"
            occ_safe app:enable -n "$app"
          }
          wait_for_file() {
            file="$1"
            attempts="${2:-30}"
            delay="${3:-2}"
            i=1
            while [ "$i" -le "$attempts" ]; do
              if [ -f "$file" ]; then
                return 0
              fi
              sleep "$delay"
              i=$((i + 1))
            done
            return 1
          }
          enable_custom_app_if_present() {
            app="$1"
            marker="$2"
            if [ -f "$marker" ]; then
              ensure_app_enabled "$app"
              return 0
            fi
            echo "Custom app '$app' missing required file '$marker'; disabling it."
            occ_safe app:disable -n "$app"
            return 1
          }
          configure_oidc_login() {
            provider="$NEXTCLOUD_OIDC_PROVIDER"
            if [ -z "$provider" ]; then
              provider="none"
            fi
            case "$provider" in
              authelia)
                if [ -z "$OIDC_LOGIN_CLIENT_SECRET" ]; then
                  echo "NEXTCLOUD_OIDC_PROVIDER=authelia but OIDC secret is missing; disabling oidc_login."
                  occ_safe app:disable -n oidc_login
                else
                  oidc_marker="/var/www/html/custom_apps/oidc_login/appinfo/info.xml"
                  if wait_for_file "$oidc_marker" 30 2; then
                    ensure_app_enabled oidc_login
                  else
                    echo "OIDC app payload missing after startup wait; keeping current oidc_login state."
                  fi
                fi
                ;;
              none|disabled|false|"")
                echo "OIDC provider disabled; disabling oidc_login."
                occ_safe app:disable -n oidc_login
                ;;
              *)
                echo "Unknown NEXTCLOUD_OIDC_PROVIDER='$provider'; disabling oidc_login."
                occ_safe app:disable -n oidc_login
                ;;
            esac
          }
          repair_external_jwt_keys() {
            marker="$(timeout 30 php /var/www/html/occ config:app:get external gitops_jwt_key_repair --default-value= 2>/dev/null || true)"
            if [ "$marker" = "v2" ]; then
              return 0
            fi

            echo "Rotating stale Nextcloud external-app JWT keys once."
            occ_safe config:app:delete external jwt_secret || true
            occ_safe config:app:delete external jwt_private_key || true
            occ_safe config:app:delete external jwt_public_key || true
            occ_safe config:app:delete external jwt_token_privkey_es256 || true
            occ_safe config:app:delete external jwt_token_pubkey_es256 || true
            occ_safe config:app:set external gitops_jwt_key_repair --value=v2
          }
          configure_external_photos_link() {
            enabled="$(printf '%s' "$${NEXTCLOUD_EXTERNAL_PHOTOS_ENABLED:-disabled}" | tr '[:upper:]' '[:lower:]')"
            case "$enabled" in
              true|1|yes|on|enabled)
                ;;
              *)
                echo "External photos link disabled."
                return 0
                ;;
            esac

            url="$${NEXTCLOUD_EXTERNAL_PHOTOS_URL:-}"
            label="$${NEXTCLOUD_EXTERNAL_PHOTOS_LABEL:-Photos}"
            if [ -z "$url" ]; then
              echo "External photos link enabled but NEXTCLOUD_EXTERNAL_PHOTOS_URL is empty; skipping."
              return 0
            fi

            repair_external_jwt_keys

            if ! enable_custom_app_if_present external /var/www/html/custom_apps/external/appinfo/info.xml; then
              return 0
            fi

            existing_sites="$(timeout 30 php /var/www/html/occ config:app:get external sites 2>/dev/null || true)"
            if [ -z "$existing_sites" ]; then
              existing_sites='{}'
            fi

            merged_sites="$(
              EXTERNAL_SITES_JSON="$existing_sites" \
              EXTERNAL_SITE_NAME="$label" \
              EXTERNAL_SITE_URL="$url" \
              php -r '
                $raw = getenv("EXTERNAL_SITES_JSON");
                $name = getenv("EXTERNAL_SITE_NAME");
                $url = getenv("EXTERNAL_SITE_URL");
                $sites = json_decode($raw ?: "{}", true);
                if (!is_array($sites)) {
                  $sites = [];
                }
                $maxId = 0;
                $targetId = null;
                foreach ($sites as $id => $site) {
                  if (is_numeric((string) $id)) {
                    $maxId = max($maxId, (int) $id);
                  }
                  if (is_array($site) && (
                    (isset($site["name"]) && $site["name"] === $name) ||
                    (isset($site["url"]) && $site["url"] === $url)
                  )) {
                    $targetId = (string) $id;
                  }
                }
                if ($targetId === null || $targetId === "") {
                  $targetId = (string) ($maxId + 1);
                }
                $sites[$targetId] = [
                  "id" => $targetId,
                  "name" => $name,
                  "url" => $url,
                  "lang" => "",
                  "type" => "link",
                  "device" => "0",
                  "icon" => "",
                  "groups" => [],
                  "redirect" => false,
                ];
                echo json_encode($sites, JSON_UNESCAPED_SLASHES);
              '
            )"

            max_site="$(
              MERGED_SITES_JSON="$merged_sites" \
              php -r '
                $raw = getenv("MERGED_SITES_JSON");
                $sites = json_decode($raw ?: "{}", true);
                if (!is_array($sites)) {
                  echo "1";
                  exit;
                }
                $max = 1;
                foreach ($sites as $id => $_) {
                  if (is_numeric((string) $id)) {
                    $max = max($max, (int) $id);
                  }
                }
                echo (string) $max;
              '
            )"

            occ_safe config:app:set external sites --value="$merged_sites"
            occ_safe config:app:set external max_site --value="$max_site"
          }
          configure_external_memes_link() {
            enabled="$(printf '%s' "$${NEXTCLOUD_EXTERNAL_MEMES_ENABLED:-disabled}" | tr '[:upper:]' '[:lower:]')"
            case "$enabled" in
              true|1|yes|on|enabled)
                ;;
              *)
                echo "External memes link disabled."
                return 0
                ;;
            esac

            url="$${NEXTCLOUD_EXTERNAL_MEMES_URL:-}"
            label="$${NEXTCLOUD_EXTERNAL_MEMES_LABEL:-Memes}"
            if [ -z "$url" ]; then
              echo "External memes link enabled but NEXTCLOUD_EXTERNAL_MEMES_URL is empty; skipping."
              return 0
            fi

            repair_external_jwt_keys

            if ! enable_custom_app_if_present external /var/www/html/custom_apps/external/appinfo/info.xml; then
              return 0
            fi

            existing_sites="$(timeout 30 php /var/www/html/occ config:app:get external sites 2>/dev/null || true)"
            if [ -z "$existing_sites" ]; then
              existing_sites='{}'
            fi

            merged_sites="$(
              EXTERNAL_SITES_JSON="$existing_sites" \
              EXTERNAL_SITE_NAME="$label" \
              EXTERNAL_SITE_URL="$url" \
              php -r '
                $raw = getenv("EXTERNAL_SITES_JSON");
                $name = getenv("EXTERNAL_SITE_NAME");
                $url = getenv("EXTERNAL_SITE_URL");
                $sites = json_decode($raw ?: "{}", true);
                if (!is_array($sites)) {
                  $sites = [];
                }
                $maxId = 0;
                $targetId = null;
                foreach ($sites as $id => $site) {
                  if (is_numeric((string) $id)) {
                    $maxId = max($maxId, (int) $id);
                  }
                  if (is_array($site) && (
                    (isset($site["name"]) && $site["name"] === $name) ||
                    (isset($site["url"]) && $site["url"] === $url)
                  )) {
                    $targetId = (string) $id;
                  }
                }
                if ($targetId === null || $targetId === "") {
                  $targetId = (string) ($maxId + 1);
                }
                $sites[$targetId] = [
                  "id" => $targetId,
                  "name" => $name,
                  "url" => $url,
                  "lang" => "",
                  "type" => "link",
                  "device" => "0",
                  "icon" => "",
                  "groups" => [],
                  "redirect" => false,
                ];
                echo json_encode($sites, JSON_UNESCAPED_SLASHES);
              '
            )"

            max_site="$(
              MERGED_SITES_JSON="$merged_sites" \
              php -r '
                $raw = getenv("MERGED_SITES_JSON");
                $sites = json_decode($raw ?: "{}", true);
                if (!is_array($sites)) {
                  echo "1";
                  exit;
                }
                $max = 1;
                foreach ($sites as $id => $_) {
                  if (is_numeric((string) $id)) {
                    $max = max($max, (int) $id);
                  }
                }
                echo (string) $max;
              '
            )"

            occ_safe config:app:set external sites --value="$merged_sites"
            occ_safe config:app:set external max_site --value="$max_site"
          }
          configure_shared_photos_storage() {
            if ! enable_custom_app_if_present files_external \
              /var/www/html/apps/files_external/appinfo/info.xml; then
              return 0
            fi
            ensure_shared_photos_user_dirs() {
              if [ ! -d /shared-photos ]; then
                echo "Shared Photos mount /shared-photos is not present; skipping user directory sync."
                return 0
              fi
              users_file="$(mktemp)"
              trap 'rm -f "$users_file"' EXIT
              timeout 30 php /var/www/html/occ user:list --output=json 2>/dev/null \
                | php -r '
                  $users = json_decode(file_get_contents("php://stdin"), true);
                  if (!is_array($users)) {
                    exit(1);
                  }
                  foreach (array_keys($users) as $user) {
                    echo $user . "\n";
                  }
                ' > "$users_file" || {
                  echo "Unable to read Nextcloud users for Shared Photos directory sync."
                  return 0
                }
              checked_users=0
              created_dirs=0
              while IFS= read -r user_id; do
                  case "$user_id" in
                    ""|*/*|*..*)
                      continue
                      ;;
                  esac
                  checked_users=$((checked_users + 1))
                  user_dir="/shared-photos/$user_id"
                  if [ ! -d "$user_dir" ]; then
                    echo "Creating Shared Photos user directory: $user_dir"
                    mkdir -p "$user_dir"
                    created_dirs=$((created_dirs + 1))
                  fi
                  chown 33:33 "$user_dir" || true
                  chmod 0770 "$user_dir" || true
                done < "$users_file"
              echo "Checked $checked_users Shared Photos user directories; created $created_dirs."
            }
            scan_shared_photos_user_dirs() {
              users_file="$(mktemp)"
              trap 'rm -f "$users_file"' EXIT
              timeout 30 php /var/www/html/occ user:list --output=json 2>/dev/null \
                | php -r '
                  $users = json_decode(file_get_contents("php://stdin"), true);
                  if (!is_array($users)) {
                    exit(1);
                  }
                  foreach (array_keys($users) as $user) {
                    echo $user . "\n";
                  }
                ' > "$users_file" || {
                  echo "Unable to read Nextcloud users for Shared Photos scan."
                  return 0
                }
              while IFS= read -r user_id; do
                  case "$user_id" in
                    ""|*/*|*..*)
                      continue
                      ;;
                  esac
                  timeout 60 php /var/www/html/occ files:scan \
                    --path="/$user_id/files/Photos" \
                    --shallow \
                    --quiet \
                    || echo "Warning: failed to shallow-scan /$user_id/files/Photos" >&2
                done < "$users_file"
            }
            lock_dir=/var/www/html/config/.shared-photos-storage.lock
            lock_acquired=false
            for _ in $(seq 1 60); do
              if mkdir "$lock_dir" 2>/dev/null; then
                lock_acquired=true
                break
              fi
              sleep 2
            done
            if [ "$lock_acquired" != "true" ]; then
              echo "Timed out waiting for Shared Photos external storage lock; skipping."
              return 0
            fi
            desired_datadir='/shared-photos/$user'
            ensure_shared_photos_user_dirs
            existing_mount="$(timeout 30 php /var/www/html/occ files_external:list \
              --output=json 2>/dev/null \
              | php -r '
                $mounts = json_decode(file_get_contents("php://stdin"), true);
                if (!is_array($mounts)) {
                  exit;
                }
                foreach ($mounts as $m) {
                  if (($m["mount_point"] ?? "") === "/Photos") {
                    echo ($m["mount_id"] ?? "") . "|" . (($m["configuration"]["datadir"] ?? ""));
                    break;
                  }
                }
              ')"
            if [ -n "$existing_mount" ]; then
              mount_id="$${existing_mount%%|*}"
              current_datadir="$${existing_mount#*|}"
              if [ "$current_datadir" != "$desired_datadir" ]; then
                echo "Updating Shared Photos external storage to per-user path $desired_datadir..."
                occ_safe files_external:config "$mount_id" datadir "$desired_datadir"
              else
                echo "Shared Photos external storage already configured."
              fi
              scan_shared_photos_user_dirs
              rmdir "$lock_dir"
              return 0
            fi
            echo "Creating Shared Photos external storage at $desired_datadir..."
            if occ_safe files_external:create \
              "Photos" local null::null \
              -c datadir="$desired_datadir"; then
              scan_shared_photos_user_dirs
              rmdir "$lock_dir"
              return 0
            fi
            status="$?"
            rmdir "$lock_dir"
            return "$status"
          }
