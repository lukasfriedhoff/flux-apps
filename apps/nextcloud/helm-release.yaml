apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m0s
  timeout: 15m0s
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
      interval: 10m0s
  values:
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: 03ed4283-aa2e-4781-8236-fd69a38e130a.cfargotunnel.com
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - secretName: nextcloud-tls
          hosts:
            - nextcloud.h4xx.io
    nextcloud:
      host: nextcloud.h4xx.io
      extraEnv:
        - name: OVERWRITEHOST
          value: nextcloud.h4xx.io
        - name: OVERWRITEPROTOCOL
          value: https
        - name: TRUSTED_PROXIES
          value: 10.42.0.0/16
        - name: OIDC_LOGIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client_secret
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: username
        passwordKey: password
      configs:
        oidc-login.config.php: |-
          <?php
          $CONFIG = array (
            'oidc_login_provider_url' => 'https://auth.h4xx.io',
            'oidc_login_client_id' => 'nextcloud',
            'oidc_login_client_secret' => getenv('OIDC_LOGIN_CLIENT_SECRET'),
            'oidc_login_button_text' => 'Log in with Authelia',
            'oidc_login_scope' => 'openid profile email groups offline_access',
            'oidc_login_code_challenge_method' => 'S256',
            'oidc_login_auto_redirect' => false,
            'oidc_login_end_session_redirect' => false,
            'oidc_login_logout_url' => 'https://nextcloud.h4xx.io/apps/oidc_login/oidc',
            'oidc_login_disable_registration' => false,
          );
      hooks:
        before-starting: |-
          #!/bin/sh
          set -e
          php /var/www/html/occ app:install -n oidc_login || true
          php /var/www/html/occ app:enable -n oidc_login
          php /var/www/html/occ app:install -n richdocuments || true
          php /var/www/html/occ app:enable -n richdocuments
          php /var/www/html/occ app:disable -n richdocumentscode || true
          for i in 1 2 3 4 5; do
            if php /var/www/html/occ richdocuments:activate-config \
              --wopi-url="https://collabora.h4xx.io" \
              --callback-url="https://nextcloud.h4xx.io"; then
              break
            fi
            sleep 5
          done
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-postgres-rw.nextcloud.svc.cluster.local
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres-app
        usernameKey: username
        passwordKey: password
    persistence:
      enabled: true
      storageClass: ssd-rbd-2r
      size: 500Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
