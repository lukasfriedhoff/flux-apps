apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-upgrade-check
  namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-upgrade-check
  namespace: nextcloud
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-upgrade-check
  namespace: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-upgrade-check
subjects:
  - kind: ServiceAccount
    name: nextcloud-upgrade-check
    namespace: nextcloud
