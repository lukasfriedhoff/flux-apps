apiVersion: batch/v1
kind: Job
metadata:
  # Fixed-name Jobs are immutable, so a content change needs a new name (prune
  # removes the old one). v4 hardcoded database "nextcloud", but the real DB is
  # the nextcloud_db_name value (nextcloud_merged since the docker->k8s merge),
  # so v4 failed on connect forever and held this kustomization unhealthy.
  name: nextcloud-postgres-repair-acl-v5
  namespace: nextcloud
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: nextcloud-postgres-repair-acl
      containers:
        - name: repair
          image: alpine/k8s:1.37.1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for _ in $(seq 1 120); do
                pod="$(
                  kubectl -n nextcloud get pods \
                    -l cnpg.io/cluster=nextcloud-postgres,cnpg.io/instanceRole=primary \
                    --no-headers 2>/dev/null \
                    | awk '$3 == "Running" { print $1; exit }'
                )"
                if [ -n "$pod" ]; then
                  break
                fi
                sleep 5
              done
              if [ -z "$pod" ]; then
                echo "No running primary PostgreSQL pod found." >&2
                exit 1
              fi
              kubectl -n nextcloud exec -i "$pod" -c postgres -- psql -U postgres -d ${nextcloud_db_name:=nextcloud} -v ON_ERROR_STOP=1 <<'SQL'
              ALTER DATABASE ${nextcloud_db_name:=nextcloud} OWNER TO nextcloud;
              ALTER SCHEMA public OWNER TO nextcloud;
              GRANT ALL ON SCHEMA public TO nextcloud;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO nextcloud;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO nextcloud;
              GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO nextcloud;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO nextcloud;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO nextcloud;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON FUNCTIONS TO nextcloud;
              SELECT format('ALTER TABLE %I.%I OWNER TO nextcloud;', schemaname, tablename)
              FROM pg_tables
              WHERE schemaname = 'public'
              \gexec
              SELECT format('ALTER SEQUENCE %I.%I OWNER TO nextcloud;', sequence_schema, sequence_name)
              FROM information_schema.sequences
              WHERE sequence_schema = 'public'
              \gexec
              SQL
