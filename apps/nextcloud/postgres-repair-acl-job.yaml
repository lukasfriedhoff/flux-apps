apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-postgres-repair-acl-v2
  namespace: nextcloud
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: nextcloud-postgres-repair-acl
      containers:
        - name: repair
          image: alpine/k8s:1.34.1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for _ in $(seq 1 120); do
                pod="$(
                  kubectl -n nextcloud get pods \
                    -l cnpg.io/cluster=nextcloud-postgres,cnpg.io/instanceRole=primary \
                    --no-headers 2>/dev/null \
                    | awk '$3 == "Running" { print $1; exit }'
                )"
                if [ -n "$pod" ]; then
                  break
                fi
                sleep 5
              done
              if [ -z "${pod:-}" ]; then
                echo "No running primary PostgreSQL pod found." >&2
                exit 1
              fi
              kubectl -n nextcloud exec "$pod" -c postgres -- psql -U postgres -d nextcloud -v ON_ERROR_STOP=1 <<'SQL'
              ALTER DATABASE nextcloud OWNER TO nextcloud;
              ALTER SCHEMA public OWNER TO nextcloud;
              GRANT ALL ON SCHEMA public TO nextcloud;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO nextcloud;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO nextcloud;
              GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO nextcloud;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO nextcloud;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO nextcloud;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON FUNCTIONS TO nextcloud;
              DO $$
              DECLARE
                obj record;
              BEGIN
                FOR obj IN
                  SELECT schemaname, tablename
                  FROM pg_tables
                  WHERE schemaname = 'public'
                LOOP
                  EXECUTE format('ALTER TABLE %I.%I OWNER TO nextcloud', obj.schemaname, obj.tablename);
                END LOOP;
                FOR obj IN
                  SELECT sequence_schema, sequence_name
                  FROM information_schema.sequences
                  WHERE sequence_schema = 'public'
                LOOP
                  EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO nextcloud', obj.sequence_schema, obj.sequence_name);
                END LOOP;
              END $$;
              SQL
