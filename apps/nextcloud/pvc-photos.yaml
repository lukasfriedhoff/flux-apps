apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${nextcloud_photos_claim_name:=nextcloud-photos-shared}
  namespace: nextcloud
  annotations:
    # longhorn-replica-policy resets every volume's replica count from its
    # StorageClass on a 5 minute timer, so a replica bump only sticks if it is
    # declared here. storageClassName cannot be used for this: it is immutable
    # on a bound PVC, and changing it on a StatefulSet's volumeClaimTemplates
    # is rejected outright.
    # Keep this a literal quoted string: a ${var} here loses its quotes during
    # kustomize build and substitutes back as an int, which the API server
    # rejects with "expected string, got 2".
    longhorn.h4xx.io/replica-count: "2"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: ${nextcloud_photos_size:=50Gi}
  storageClassName: ${nextcloud_photos_storage_class_name:=${longhorn_rwx_storage_class_1r_name}}
