apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logday
  namespace: logday
spec:
  interval: 10m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./charts/logday
      sourceRef:
        kind: GitRepository
        name: logday
        namespace: flux-system
      interval: 10m0s
  values:
    replicaCount: ${logday_replicas:=1}
    image:
      repository: ${logday_image_repository:=ghcr.io/lukasfriedhoff/logday}
      tag: ${logday_image_tag:=latest}
      pullPolicy: IfNotPresent
      pullSecrets:
        - name: ${logday_image_pull_secret_name:=logday-ghcr-pull}
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: ${logday_requests_cpu:=100m}
        memory: ${logday_requests_memory:=256Mi}
      limits:
        cpu: ${logday_limits_cpu:=1000m}
        memory: ${logday_limits_memory:=1Gi}
    reportOutputDir: /app/reports
    database:
      clusterName: ${logday_postgres_cluster_name:=logday-postgres}
      dbName: ${logday_postgres_db_name:=logday_db}
      appUser: ${logday_postgres_user:=logday_user}
      sslMode: ${logday_db_sslmode:=require}
      autoMigrate: ${logday_db_auto_migrate:=true}
      connectRetries: ${logday_db_connect_retries:=15}
    cnpg:
      enabled: true
      instances: ${logday_postgres_instances:=1}
      imageName: ${logday_postgres_image:=ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie}
      storage:
        size: ${logday_postgres_size:=10Gi}
      resources:
        requests:
          cpu: ${logday_postgres_requests_cpu:=100m}
          memory: ${logday_postgres_requests_memory:=256Mi}
        limits:
          cpu: ${logday_postgres_limits_cpu:=1000m}
          memory: ${logday_postgres_limits_memory:=1Gi}
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia-forwardauth-redirect@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls: "true"
      host: logday${public_host_suffix}.${delegating_domain}
      path: /
      pathType: Prefix
