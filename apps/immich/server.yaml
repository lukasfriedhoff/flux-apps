apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283
    - name: metrics
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: ${immich_server_replicas}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:${immich_image_tag}
          ports:
            - name: http
              containerPort: 2283
          env:
            # Immich exports nothing unless telemetry is opted into. The
            # metrics listener is a separate port (8081) and is never routed by
            # the ingress, so it stays cluster-internal.
            - name: IMMICH_TELEMETRY_INCLUDE
              value: "${immich_telemetry_include:=all}"
            - name: TZ
              value: ${immich_timezone}
            - name: DB_HOSTNAME
              value: immich-postgres-rw
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${immich_secret_name}
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${immich_secret_name}
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: ${immich_secret_name}
                  key: DB_DATABASE_NAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${immich_secret_name}
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${immich_secret_name}
                  key: JWT_SECRET
          resources:
            requests:
              cpu: ${immich_server_requests_cpu}
              memory: ${immich_server_requests_memory}
            limits:
              cpu: ${immich_server_limits_cpu}
              memory: ${immich_server_limits_memory}
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /usr/src/app/upload
            - name: memes-shared
              mountPath: /usr/src/app/external
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: immich-uploads
        - name: memes-shared
          persistentVolumeClaim:
            claimName: ${immich_memes_shared_claim_name:=immich-memes-shared}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-uploads
  namespace: immich
  annotations:
    # longhorn-replica-policy resets every volume's replica count from its
    # StorageClass on a 5 minute timer, so a replica bump only sticks if it is
    # declared here. storageClassName cannot be used for this: it is immutable
    # on a bound PVC, and changing it on a StatefulSet's volumeClaimTemplates
    # is rejected outright.
    longhorn.h4xx.io/replica-count: "${longhorn_pvc_replica_count:=2}"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${immich_uploads_storage_class_name}
  resources:
    requests:
      storage: ${immich_uploads_size}
