apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  # The model cache is a ReadWriteOnce Longhorn volume: a rolling update
  # leaves the new pod ContainerCreating until the old one releases it.
  # Equivalent of Recreate for one replica: kill the old pod first, then start
  # the new one (a Recreate switch is rejected by server-side apply while the live
  # object still carries a rollingUpdate block, and kustomize drops nulls).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  replicas: ${immich_ml_replicas}
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:${immich_image_tag}
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: TZ
              value: ${immich_timezone}
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: /cache
          resources:
            requests:
              cpu: ${immich_ml_requests_cpu}
              memory: ${immich_ml_requests_memory}
            limits:
              cpu: ${immich_ml_limits_cpu}
              memory: ${immich_ml_limits_memory}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${immich_ml_cache_storage_class_name}
  resources:
    requests:
      storage: ${immich_ml_cache_size}
