apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-postgres-backup
  namespace: immich
spec:
  schedule: "${immich_postgres_backup_cron:=0 2 * * *}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: quay.io/minio/mc:latest
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: ${immich_secret_name}
                      key: DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${immich_secret_name}
                      key: DB_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${immich_secret_name}
                      key: DB_DATABASE_NAME
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${immich_postgres_backup_credential_secret_name}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${immich_postgres_backup_credential_secret_name}
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_ENDPOINTS
                  valueFrom:
                    secretKeyRef:
                      name: ${immich_postgres_backup_credential_secret_name}
                      key: AWS_ENDPOINTS
                - name: BUCKET
                  value: ${immich_postgres_backup_bucket}
                - name: RETAIN_DAYS
                  value: "30"
              command:
                - /bin/sh
                - -ceu
                - |
                  apk add --no-cache postgresql-client >/dev/null 2>&1

                  mc alias set backup "$${AWS_ENDPOINTS}" "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" >/dev/null
                  mc mb --ignore-existing "backup/$${BUCKET}" >/dev/null 2>&1 || true

                  TIMESTAMP="$(date +%Y%m%dT%H%M%SZ)"
                  OBJECT="$${PGHOST}-$${TIMESTAMP}.dump"

                  echo "[pg-backup] dumping $${PGDATABASE} on $${PGHOST} -> $${BUCKET}/$${OBJECT}"
                  pg_dump -Fc -h "$${PGHOST}" -p "$${PGPORT}" -U "$${PGUSER}" -d "$${PGDATABASE}" \
                    | mc pipe "backup/$${BUCKET}/$${OBJECT}"
                  echo "[pg-backup] upload complete"

                  echo "[pg-backup] pruning dumps older than $${RETAIN_DAYS} days"
                  mc find "backup/$${BUCKET}" --name "*.dump" --older-than "$${RETAIN_DAYS}d" \
                    | xargs -r -I{} mc rm {}
                  echo "[pg-backup] done"
