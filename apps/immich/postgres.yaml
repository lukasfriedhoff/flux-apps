apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
spec:
  # Pinned by digest: the floating tag moved while the instances sat on
  # different nodes' image caches (srv9 pulled a build with pgvector 0.8.6,
  # srv1/srv8 still had 0.8.5). The 2026-11-11 srv9 drain failed the primary
  # over to an older build and immich refused to start ("database has
  # pgvector 0.8.6 activated, instance only has 0.8.5"). Renovate bumps the
  # digest; CNPG then rolls every instance to the same build.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:4b384608950050622a7ee9cd5057b45c67a96ada3859fc9b7d839f54c11b9425
  instances: ${immich_postgres_instances:=1}
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: ${immich_postgres_source_dbname:=immich}
      owner: ${immich_postgres_source_user:=immich}
      secret:
        name: immich-postgres-app
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  managed:
    roles:
      - name: ${immich_postgres_source_user:=immich}
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: immich-postgres-app
  storage:
    storageClass: ${immich_postgres_storage_class_name}
    size: ${immich_postgres_size}
  backup:
    barmanObjectStore:
      destinationPath: "s3://${immich_postgres_backup_bucket}/${cluster_environment}/${immich_postgres_backup_generation:=}immich-postgres/"
      endpointURL: "${immich_postgres_backup_endpoint_url:=}"
      serverName: ${immich_postgres_backup_server_name:=immich-postgres}
      s3Credentials:
        accessKeyId:
          name: ${immich_postgres_backup_credential_secret_name}
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: ${immich_postgres_backup_credential_secret_name}
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  resources:
    requests:
      cpu: ${immich_postgres_requests_cpu}
      memory: ${immich_postgres_requests_memory}
    limits:
      cpu: ${immich_postgres_limits_cpu}
      memory: ${immich_postgres_limits_memory}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgres
  namespace: immich
spec:
  schedule: "${immich_postgres_backup_cron:=0 0 2 * * *}"
  backupOwnerReference: self
  immediate: false
  cluster:
    name: immich-postgres
