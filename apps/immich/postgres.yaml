apiVersion: v1
kind: Service
metadata:
  name: immich-postgres-source
  namespace: immich
  annotations:
    lukasf.io/migration-temporary: "true"
spec:
  selector:
    app.kubernetes.io/name: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  # Keep the historical service name stable for app-side config.
  selector:
    cnpg.io/cluster: immich-postgres
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-trixie
  instances: 1
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: ${immich_postgres_source_dbname:=immich}
      owner: ${immich_postgres_source_user:=immich}
      secret:
        name: immich-postgres-app
      import:
        type: microservice
        databases:
          - ${immich_postgres_source_dbname:=immich}
        source:
          externalCluster: immich-postgres-source
  managed:
    roles:
      - name: ${immich_postgres_source_user:=immich}
        ensure: present
        login: true
        passwordSecret:
          name: immich-postgres-app
  externalClusters:
    - name: immich-postgres-source
      connectionParameters:
        host: immich-postgres-source
        user: ${immich_postgres_source_user:=immich}
        dbname: ${immich_postgres_source_dbname:=immich}
      password:
        name: ${immich_secret_name}
        key: DB_PASSWORD
  storage:
    storageClass: ${immich_postgres_storage_class_name}
    size: ${immich_postgres_size}
  resources:
    requests:
      cpu: ${immich_postgres_requests_cpu}
      memory: ${immich_postgres_requests_memory}
    limits:
      cpu: ${immich_postgres_limits_cpu}
      memory: ${immich_postgres_limits_memory}
