apiVersion: batch/v1
kind: Job
metadata:
  name: ${attic_service_name}-bootstrap
  namespace: ${attic_namespace}
  labels:
    app.kubernetes.io/name: attic-bootstrap
    app.kubernetes.io/part-of: attic
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic-bootstrap
        app.kubernetes.io/part-of: attic
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: ${attic_image}
          imagePullPolicy: ${attic_image_pull_policy}
          envFrom:
            - secretRef:
                name: ${attic_server_secret_name}
          env:
            - name: ATTIC_PUBLIC_URL
              value: ${attic_public_url}
            - name: ATTIC_INTERNAL_URL
              value: http://${attic_service_name}.${attic_namespace}.svc.cluster.local:${attic_service_port}
            - name: ATTIC_CACHE_NAME
              value: ${attic_cache_name}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: dbname
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              ATTIC_CACHE_PRIORITY="${attic_cache_priority}"
              export HOME=/tmp/attic-home
              export XDG_CONFIG_HOME=/tmp/attic-config
              mkdir -p /tmp "$${HOME}" "$${XDG_CONFIG_HOME}"

              cat > /tmp/attic-server.toml <<EOF_CONFIG
              listen = "0.0.0.0:8080"
              api-endpoint = "$${ATTIC_PUBLIC_URL}"

              [chunking]
              nar-size-threshold = 65536
              min-size = 16384
              avg-size = 65536
              max-size = 262144

              [database]
              url = "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}"

              [storage]
              type = "local"
              path = "/var/lib/atticd/storage"
              EOF_CONFIG

              # Wait for the attic server to accept connections (up to 90s per attempt)
              for i in $(seq 1 18); do
                wget -q -O/dev/null "$${ATTIC_INTERNAL_URL}/" 2>/dev/null && break
                echo "Waiting for attic server ($${i}/18)..."
                [ "$${i}" -eq 18 ] && { echo "Attic server not available, will retry"; exit 1; }
                sleep 5
              done

              # Generate a short-lived bootstrap admin token with cache-creation permission
              BOOTSTRAP_TOKEN=$(atticadm -f /tmp/attic-server.toml make-token \
                --sub bootstrap \
                --validity 1h \
                --pull "$${ATTIC_CACHE_NAME}" \
                --push "$${ATTIC_CACHE_NAME}" \
                --create-cache "$${ATTIC_CACHE_NAME}" \
                --configure-cache "$${ATTIC_CACHE_NAME}")

              # Login and create the cache (idempotent — safe to re-run)
              attic login bootstrap "$${ATTIC_INTERNAL_URL}" "$${BOOTSTRAP_TOKEN}"
              attic cache create "bootstrap:$${ATTIC_CACHE_NAME}" \
                || echo "Cache already exists, continuing"
