apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${attic_service_name}
  namespace: ${attic_namespace}
  labels:
    app.kubernetes.io/name: attic
spec:
  replicas: ${attic_replicas}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: atticd
          image: ${attic_image}
          imagePullPolicy: ${attic_image_pull_policy}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: ${attic_server_secret_name}
          env:
            - name: ATTIC_API_ENDPOINT
              value: ${attic_api_endpoint}
            - name: ATTIC_LISTEN
              value: 0.0.0.0:8080
            - name: ATTIC_STORAGE_PATH
              value: /var/lib/atticd/storage
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ${attic_postgres_cluster_name}-app
                  key: dbname
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              mkdir -p /tmp
              cat > /tmp/attic-server.toml <<EOF_CONFIG
              listen = "$${ATTIC_LISTEN}"
              api-endpoint = "$${ATTIC_API_ENDPOINT}"

              [chunking]
              nar-size-threshold = 65536
              min-size = 16384
              avg-size = 65536
              max-size = 262144

              [database]
              url = "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}"

              [storage]
              type = "local"
              path = "$${ATTIC_STORAGE_PATH}"
              EOF_CONFIG

              atticd -f /tmp/attic-server.toml --mode db-migrations
              exec atticd -f /tmp/attic-server.toml --mode monolithic
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: ${attic_requests_cpu}
              memory: ${attic_requests_memory}
            limits:
              cpu: ${attic_limits_cpu}
              memory: ${attic_limits_memory}
          volumeMounts:
            - name: storage
              mountPath: /var/lib/atticd/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ${attic_service_name}-storage
