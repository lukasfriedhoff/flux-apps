apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: collabora-online
      version: 1.1.56
      sourceRef:
        kind: HelmRepository
        name: collabora-online
        namespace: collabora
      interval: 10m0s
  values:
    replicaCount: 1
    autoscaling:
      enabled: false
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9980"
      prometheus.io/path: "/cool/getMetrics"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2048Mi
    collabora:
      # enable_metrics_unauthenticated lets Alloy read /cool/getMetrics, which
      # otherwise requires the admin credentials and answered 401 to every
      # scrape. Externally the path stays protected: ingress-admin routes it
      # through traefik-authelia-forwardauth, and Alloy reaches the pod
      # directly without passing through Traefik.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:security.enable_metrics_unauthenticated=true
      server_name: collabora${public_host_suffix}.${delegating_domain}
      aliasgroups:
        - host: "https://nextcloud${public_host_suffix}.${delegating_domain}:443"
          aliases:
            - "https://nextcloud${public_host_suffix}.${delegating_domain}"
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: ${default_cluster_issuer}
        external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.priority: "1"
      hosts:
        - host: collabora${public_host_suffix}.${delegating_domain}
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: collabora-tls
          hosts:
            - collabora${public_host_suffix}.${delegating_domain}
