apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora
spec:
  interval: 10m0s
  timeout: 10m0s
  chart:
    spec:
      chart: collabora-online
      version: 1.1.56
      sourceRef:
        kind: HelmRepository
        name: collabora-online
        namespace: collabora
      interval: 10m0s
  values:
    replicaCount: 1
    autoscaling:
      enabled: false
    collabora:
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
      server_name: collabora.h4xx.io
      aliasgroups:
        - host: "https://nextcloud.h4xx.io:443"
          aliases:
            - "https://nextcloud.h4xx.io"
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: 03ed4283-aa2e-4781-8236-fd69a38e130a.cfargotunnel.com
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.priority: "1"
      hosts:
        - host: collabora.h4xx.io
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: collabora-tls
          hosts:
            - collabora.h4xx.io
