apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: nextcloud
spec:
  interval: 10m0s
  timeout: 20m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: valkey
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: nextcloud
      interval: 10m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"
      prometheus.io/path: "/metrics"
    auth:
      enabled: true
      usersExistingSecret: ${valkey_auth_secret_name}
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: redis-password
    valkeyConfig: |
      # Nextcloud should keep serving even when background snapshotting is temporarily unhealthy.
      stop-writes-on-bgsave-error no
    replica:
      enabled: ${valkey_replica_enabled:=true}
      replicas: ${valkey_replica_count}
      minReplicasToWrite: ${valkey_min_replicas_to_write}
      persistence:
        size: ${valkey_persistence_size}
        storageClass: ${valkey_storage_class_name}
    metrics:
      enabled: true
      exporter:
        args:
          - --redis.password-file=/etc/valkey-auth/redis-exporter-passwords.json
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        extraExporterSecrets:
          - name: ${valkey_auth_secret_name}
        extraVolumeMounts:
          - name: ${valkey_auth_secret_name}-exporter
            mountPath: /etc/valkey-auth
            readOnly: true
      service:
        enabled: true
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9121"
          prometheus.io/path: "/metrics"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
