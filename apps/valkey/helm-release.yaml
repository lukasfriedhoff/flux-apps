apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: nextcloud
spec:
  interval: 10m0s
  timeout: 20m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: valkey
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: nextcloud
      interval: 10m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"
      prometheus.io/path: "/metrics"
    auth:
      enabled: true
      usersExistingSecret: ${valkey_auth_secret_name}
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: redis-password
    extraConfig: |
      # Nextcloud should keep serving even when background snapshotting is temporarily unhealthy.
      stop-writes-on-bgsave-error no
    persistence:
      enabled: true
      size: ${valkey_persistence_size}
      storageClass: ${valkey_storage_class_name}
    replica:
      enabled: ${valkey_replica_enabled:=true}
      # Chart 1.0 counts the primary in replica.replicas (0.x counted only
      # the read replicas, via valkey_replica_count=2). Keep 3 pods total.
      replicas: ${valkey_pod_count:=3}
      minReplicasToWrite: ${valkey_min_replicas_to_write}
    extraVolumes:
      - name: ${valkey_auth_secret_name}-exporter
        secret:
          secretName: ${valkey_auth_secret_name}
          defaultMode: 288
    metrics:
      enabled: true
      exporter:
        args:
          - --redis.password-file=/etc/valkey-auth/redis-exporter-passwords.json
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          # No CPU limit: the exporter averages 3-4m yet throttled 25-30 % of
          # periods per scrape burst.
          limits:
            memory: 192Mi
        extraVolumeMounts:
          - name: ${valkey_auth_secret_name}-exporter
            mountPath: /etc/valkey-auth
            readOnly: true
      service:
        enabled: true
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9121"
          prometheus.io/path: "/metrics"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
