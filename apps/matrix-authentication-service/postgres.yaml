apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-mas-postgres
  namespace: matrix
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  instances: ${matrix_mas_postgres_instances:=1}
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  bootstrap:
    initdb:
      database: ${matrix_mas_postgres_database:=mas}
      owner: ${matrix_mas_postgres_user:=mas}
      secret:
        name: matrix-mas-postgres-app
  managed:
    roles:
      - name: ${matrix_mas_postgres_user:=mas}
        ensure: present
        login: true
        passwordSecret:
          name: matrix-mas-postgres-app
  storage:
    storageClass: ${matrix_mas_postgres_storage_class_name}
    size: ${matrix_mas_postgres_size}
  # BACKUPS DISABLED 2026-09-22 (storage01 MinIO at 100%) - see the
  # nextcloud postgres.yaml for the full incident note. Revert to re-enable.
  resources:
    requests:
      cpu: ${matrix_mas_postgres_requests_cpu}
      memory: ${matrix_mas_postgres_requests_memory}
    limits:
      cpu: ${matrix_mas_postgres_limits_cpu}
      memory: ${matrix_mas_postgres_limits_memory}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: matrix-mas-postgres
  namespace: matrix
spec:
  suspend: true
  schedule: "${matrix_postgres_backup_cron:=0 0 2 * * *}"
  backupOwnerReference: self
  immediate: false
  cluster:
    name: matrix-mas-postgres
