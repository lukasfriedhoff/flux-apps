apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-authentication-service-config
  namespace: matrix
data:
  config.yaml: |
    http:
      public_base: "https://matrix-auth${public_host_suffix}.${delegating_domain}/"
      listeners:
        - name: web
          binds:
            - address: "0.0.0.0:8080"
          resources:
            - name: human
            - name: discovery
            - name: oauth
            - name: compat
            - name: assets
            - name: graphql
              playground: false
        - name: internal
          binds:
            - address: "0.0.0.0:8081"
          resources:
            - name: health
            - name: prometheus
            - name: connection-info

    database:
      host: matrix-mas-postgres-rw.matrix.svc.cluster.local
      port: 5432
      username: ${matrix_mas_postgres_user:=mas}
      password: "__MAS_DATABASE_PASSWORD__"
      database: ${matrix_mas_postgres_database:=mas}
      ssl_mode: prefer

    telemetry:
      metrics:
        exporter: prometheus

    matrix:
      homeserver: "${matrix_server_name}"
      secret_file: /secrets/SYNAPSE_SHARED_SECRET
      endpoint: "http://synapse.matrix.svc.cluster.local:8008"
      kind: ${matrix_mas_synapse_kind:=synapse_read_only}

    secrets:
      encryption_file: /secrets/ENCRYPTION_SECRET
      keys:
        - key_file: /secrets/RSA_PRIVATE_KEY

    passwords:
      enabled: true
      schemes:
        - version: 1
          algorithm: bcrypt
          unicode_normalization: true
        - version: 2
          algorithm: argon2id

    upstream_oauth2:
      providers:
        - id: ${matrix_mas_upstream_provider_id:=01K1ZQ2A9S7F4P8K6W3C5D0R1T}
          human_name: Authelia
          issuer: "https://auth${public_host_suffix}.${delegating_domain}"
          client_id: ${matrix_oidc_client_id:=matrix-synapse}
          client_secret_file: /oidc/client_secret
          token_endpoint_auth_method: client_secret_post
          scope: "openid profile email groups"
          discovery_mode: insecure
          synapse_idp_id: oidc-authelia
          claims_imports:
            localpart:
              action: require
              template: "{{ user.preferred_username }}"
            displayname:
              action: suggest
              template: "{{ user.name }}"
            email:
              action: suggest
              template: "{{ user.email }}"
