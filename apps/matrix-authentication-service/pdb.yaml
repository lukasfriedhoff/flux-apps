apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matrix-authentication-service
  namespace: matrix
spec:
  # At most one MAS replica down during voluntary disruptions (node drains,
  # rollouts). Harmless when replicas is 0/1.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-authentication-service
