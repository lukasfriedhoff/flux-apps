apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-authentication-service
  namespace: matrix
  annotations:
    cert-manager.io/cluster-issuer: ${default_cluster_issuer}
    external-dns.alpha.kubernetes.io/target: ${cloudflare_tunnel_hostname}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: matrix-auth${public_host_suffix}.${delegating_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: matrix-authentication-service
                port:
                  number: 8080
  tls:
    - secretName: matrix-authentication-service-tls
      hosts:
        - matrix-auth${public_host_suffix}.${delegating_domain}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-authentication-service-compat
  namespace: matrix
spec:
  entryPoints:
    - websecure
  routes:
    # Host is deliberately indirected through matrix_mas_compat_host so the
    # compat layer stays inert until cutover. Until MAS owns the user database,
    # routing login/logout/refresh here would break clients that still
    # authenticate against Synapse. The default resolves to an unroutable
    # sentinel; set matrix_mas_compat_host to the real client-facing host
    # (the one advertised in /.well-known/matrix/client) during cutover.
    - kind: Rule
      match: Host(`${matrix_mas_compat_host:=mas-compat-disabled.invalid}`) && PathRegexp(`^/_matrix/client/[^/]+/(login|logout|refresh)(/.*)?$`)
      priority: 200
      services:
        - name: matrix-authentication-service
          port: 8080
  tls:
    secretName: matrix-tls
