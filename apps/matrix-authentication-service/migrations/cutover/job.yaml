apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-mas-cutover-${matrix_mas_cutover_generation:=disabled}
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-authentication-service
    app.kubernetes.io/component: migration-cutover
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-authentication-service
        app.kubernetes.io/component: migration-cutover
    spec:
      serviceAccountName: matrix-mas-cutover
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: assert-services-stopped
          image: matrixdotorg/synapse:${matrix_synapse_image_tag}
          command:
            - python3
            - -c
            - |
              import json
              import os
              import ssl
              import urllib.request

              service_account_path = "/var/run/secrets/kubernetes.io/serviceaccount"
              with open(f"{service_account_path}/token", encoding="utf-8") as token_file:
                  token = token_file.read().strip()

              context = ssl.create_default_context(
                  cafile=f"{service_account_path}/ca.crt"
              )
              api_url = (
                  f"https://{os.environ['KUBERNETES_SERVICE_HOST']}:"
                  f"{os.environ['KUBERNETES_SERVICE_PORT_HTTPS']}"
                  "/apis/apps/v1/namespaces/matrix/deployments"
              )

              for deployment_name in ("synapse", "matrix-authentication-service"):
                  request = urllib.request.Request(
                      f"{api_url}/{deployment_name}",
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  with urllib.request.urlopen(request, context=context) as response:
                      deployment = json.load(response)

                  desired = deployment.get("spec", {}).get("replicas") or 0
                  ready = deployment.get("status", {}).get("readyReplicas") or 0
                  print(
                      f"{deployment_name}: desired={desired}, ready={ready}",
                      flush=True,
                  )
                  if desired != 0 or ready != 0:
                      raise SystemExit(
                          f"{deployment_name} must be fully stopped before migration"
                      )
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: render-config
          image: busybox:1.38.0
          command:
            - /bin/sh
            - -ce
            - |
              password="$(tr -d '\r\n' < /database/password)"
              test -n "$password"
              sed "s|__MAS_DATABASE_PASSWORD__|$password|g" \
                /config-template/config.yaml > /config/config.yaml
              chmod 0440 /config/config.yaml
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
            - name: database
              mountPath: /database
              readOnly: true
        - name: render-synapse-config
          image: matrixdotorg/synapse:${matrix_synapse_image_tag}
          command:
            - python3
            - /migration-tools/render-synapse-config.py
          env:
            - name: MATRIX_SERVER_NAME
              value: ${matrix_server_name}
            - name: MATRIX_PUBLIC_BASEURL
              value: ${matrix_public_baseurl}
            - name: MATRIX_OIDC_ISSUER_URL
              value: https://auth${public_host_suffix}.${delegating_domain}
            - name: MATRIX_OIDC_CLIENT_ID
              value: ${matrix_oidc_client_id:=matrix-synapse}
            - name: MATRIX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-oidc
                  key: MATRIX_OIDC_CLIENT_SECRET
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migration-tools
              mountPath: /migration-tools
              readOnly: true
            - name: synapse-seed
              mountPath: /synapse-seed
              readOnly: true
            - name: synapse-config
              mountPath: /synapse-config
      containers:
        - name: migrate
          image: ${matrix_mas_image}
          args:
            - -c
            - /config/config.yaml
            - syn2mas
            - migrate
            - --synapse-config
            - /synapse-config/server.yaml
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: oidc
              mountPath: /oidc/client_secret
              subPath: MATRIX_OIDC_CLIENT_SECRET
              readOnly: true
            - name: synapse-config
              mountPath: /synapse-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: matrix-authentication-service-config
        - name: config
          emptyDir: {}
        - name: database
          secret:
            secretName: matrix-mas-postgres-app
            defaultMode: 0440
        - name: secrets
          secret:
            secretName: matrix-mas-secrets
            defaultMode: 0440
        - name: oidc
          secret:
            secretName: matrix-oidc
            defaultMode: 0440
        - name: migration-tools
          configMap:
            name: matrix-mas-migration-tools
            defaultMode: 0440
        - name: synapse-seed
          secret:
            secretName: matrix-synapse-config
            defaultMode: 0440
        - name: synapse-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
