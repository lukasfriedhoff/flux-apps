apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-mas-cutover-${matrix_mas_cutover_generation:=disabled}
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-authentication-service
    app.kubernetes.io/component: migration-cutover
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-authentication-service
        app.kubernetes.io/component: migration-cutover
    spec:
      serviceAccountName: matrix-mas-cutover
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: assert-services-stopped
          image: registry.k8s.io/kubectl:v1.34.1
          command:
            - /bin/sh
            - -ce
            - |
              for deployment in synapse matrix-authentication-service; do
                desired="$(kubectl -n matrix get deployment "$deployment" -o jsonpath='{.spec.replicas}')"
                ready="$(kubectl -n matrix get deployment "$deployment" -o jsonpath='{.status.readyReplicas}')"
                test "$${desired:-0}" = "0"
                test "$${ready:-0}" = "0"
              done
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: render-config
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ce
            - |
              password="$(tr -d '\r\n' < /database/password)"
              test -n "$password"
              sed "s|__MAS_DATABASE_PASSWORD__|$password|g" \
                /config-template/config.yaml > /config/config.yaml
              chmod 0440 /config/config.yaml
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
            - name: database
              mountPath: /database
              readOnly: true
      containers:
        - name: migrate
          image: ${matrix_mas_image}
          args:
            - -c
            - /config/config.yaml
            - syn2mas
            - migrate
            - --synapse-config
            - /synapse-config/server.yaml
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: oidc
              mountPath: /oidc/client_secret
              subPath: MATRIX_OIDC_CLIENT_SECRET
              readOnly: true
            - name: synapse-config
              mountPath: /synapse-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: matrix-authentication-service-config
        - name: config
          emptyDir: {}
        - name: database
          secret:
            secretName: matrix-mas-postgres-app
            defaultMode: 0440
        - name: secrets
          secret:
            secretName: matrix-mas-secrets
            defaultMode: 0440
        - name: oidc
          secret:
            secretName: matrix-oidc
            defaultMode: 0440
        - name: synapse-config
          secret:
            secretName: matrix-synapse-config
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
