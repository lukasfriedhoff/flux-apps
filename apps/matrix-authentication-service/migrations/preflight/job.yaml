apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-mas-preflight-${matrix_mas_preflight_generation:=disabled}
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-authentication-service
    app.kubernetes.io/component: migration-preflight
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-authentication-service
        app.kubernetes.io/component: migration-preflight
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: render-config
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ce
            - |
              password="$(tr -d '\r\n' < /database/password)"
              test -n "$password"
              sed "s|__MAS_DATABASE_PASSWORD__|$password|g" \
                /config-template/config.yaml > /config/config.yaml
              chmod 0440 /config/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
            - name: database
              mountPath: /database
              readOnly: true
        - name: migrate-database
          image: ${matrix_mas_image}
          args: ["-c", "/config/config.yaml", "database", "migrate"]
          securityContext: &masSecurityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts: &masVolumeMounts
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: oidc
              mountPath: /oidc/client_secret
              subPath: MATRIX_OIDC_CLIENT_SECRET
              readOnly: true
            - name: synapse-config
              mountPath: /synapse-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: check
          image: ${matrix_mas_image}
          args:
            - -c
            - /config/config.yaml
            - syn2mas
            - check
            - --synapse-config
            - /synapse-config/server.yaml
          securityContext: *masSecurityContext
          volumeMounts: *masVolumeMounts
      containers:
        - name: dry-run
          image: ${matrix_mas_image}
          args:
            - -c
            - /config/config.yaml
            - syn2mas
            - migrate
            - --synapse-config
            - /synapse-config/server.yaml
            - --dry-run
          securityContext: *masSecurityContext
          volumeMounts: *masVolumeMounts
      volumes:
        - name: config-template
          configMap:
            name: matrix-authentication-service-config
        - name: config
          emptyDir: {}
        - name: database
          secret:
            secretName: matrix-mas-postgres-app
            defaultMode: 0440
        - name: secrets
          secret:
            secretName: matrix-mas-secrets
            defaultMode: 0440
        - name: oidc
          secret:
            secretName: matrix-oidc
            defaultMode: 0440
        - name: synapse-config
          secret:
            secretName: matrix-synapse-config
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
