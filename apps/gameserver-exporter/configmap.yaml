# Stdlib-only A2S (Source query) exporter. Both Icarus and Valheim answer the
# Steam A2S protocol on their query port, which is the only check that proves
# a server is actually joinable: a wedged server keeps its PID, its HTTP status
# page and its open UDP socket while refusing every player.
#
# Exposes Prometheus metrics on /metrics (scraped via the prometheus.io
# annotations) and a compact JSON summary on /status for the status dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gameserver-exporter-script
  namespace: ${gameserver_exporter_namespace:=monitoring}
data:
  exporter.py: |
    #!/usr/bin/env python3
    """A2S -> Prometheus. No third-party imports on purpose."""
    import json
    import os
    import socket
    import struct
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    HEADER = b"\xff\xff\xff\xff"
    A2S_INFO = b"TSource Engine Query\x00"
    PORT = int(os.environ.get("LISTEN_PORT", "9109"))
    INTERVAL = float(os.environ.get("SCRAPE_INTERVAL", "20"))
    TIMEOUT = float(os.environ.get("QUERY_TIMEOUT", "4"))

    # TARGETS: "name=host:port,name=host:port"
    TARGETS = []
    for chunk in os.environ.get("TARGETS", "").split(","):
        chunk = chunk.strip()
        if not chunk or "=" not in chunk:
            continue
        name, addr = chunk.split("=", 1)
        host, _, port = addr.rpartition(":")
        TARGETS.append({"name": name.strip(), "host": host.strip(), "port": int(port)})

    STATE = {t["name"]: {"up": 0, "players": 0, "max_players": 0,
                         "latency": 0.0, "server_name": ""} for t in TARGETS}
    LOCK = threading.Lock()


    def read_cstr(data, off):
        end = data.index(b"\x00", off)
        return data[off:end].decode("utf-8", "replace"), end + 1


    def query(host, port):
        """Return (players, max_players, server_name, latency) or raise."""
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(TIMEOUT)
        try:
            started = time.monotonic()
            sock.sendto(HEADER + A2S_INFO, (host, port))
            data, _ = sock.recvfrom(4096)
            # Some servers reply with a challenge (0x41) that must be echoed.
            if data[4:5] == b"A":
                sock.sendto(HEADER + A2S_INFO + data[5:9], (host, port))
                data, _ = sock.recvfrom(4096)
            latency = time.monotonic() - started
            if data[4:5] != b"I":
                raise ValueError("unexpected reply header %r" % data[4:5])
            off = 6  # header (4) + 'I' (1) + protocol (1)
            name, off = read_cstr(data, off)
            _map, off = read_cstr(data, off)
            _folder, off = read_cstr(data, off)
            _game, off = read_cstr(data, off)
            off += 2  # app id (short)
            players = data[off]
            max_players = data[off + 1]
            return players, max_players, name, latency
        finally:
            sock.close()


    def poll_forever():
        while True:
            for t in TARGETS:
                entry = {"up": 0, "players": 0, "max_players": 0,
                         "latency": 0.0, "server_name": ""}
                try:
                    players, maxp, name, latency = query(t["host"], t["port"])
                    entry.update(up=1, players=players, max_players=maxp,
                                 latency=latency, server_name=name)
                except Exception:
                    pass  # a down server is a data point, not a crash
                with LOCK:
                    STATE[t["name"]] = entry
            time.sleep(INTERVAL)


    def render_metrics():
        out = [
            "# HELP gameserver_up Whether the server answered an A2S query.",
            "# TYPE gameserver_up gauge",
            "# HELP gameserver_players Players currently connected.",
            "# TYPE gameserver_players gauge",
            "# HELP gameserver_max_players Player slots.",
            "# TYPE gameserver_max_players gauge",
            "# HELP gameserver_query_latency_seconds A2S round-trip time.",
            "# TYPE gameserver_query_latency_seconds gauge",
        ]
        with LOCK:
            snapshot = dict(STATE)
        for name, s in snapshot.items():
            lbl = 'game="%s"' % name
            out.append("gameserver_up{%s} %d" % (lbl, s["up"]))
            out.append("gameserver_players{%s} %d" % (lbl, s["players"]))
            out.append("gameserver_max_players{%s} %d" % (lbl, s["max_players"]))
            out.append("gameserver_query_latency_seconds{%s} %.6f" % (lbl, s["latency"]))
        return "\n".join(out) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/metrics"):
                body, ctype = render_metrics(), "text/plain; version=0.0.4"
            elif self.path.startswith("/status"):
                with LOCK:
                    body = json.dumps(dict(STATE), indent=2)
                ctype = "application/json"
            elif self.path.startswith("/healthz"):
                body, ctype = "ok\n", "text/plain"
            else:
                self.send_response(404); self.end_headers(); return
            raw = body.encode()
            self.send_response(200)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def log_message(self, *_args):
            pass  # keep scrape traffic out of the logs


    if __name__ == "__main__":
        threading.Thread(target=poll_forever, daemon=True).start()
        ThreadingHTTPServer(("", PORT), Handler).serve_forever()
